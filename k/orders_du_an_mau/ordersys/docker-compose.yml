services:
  kafka:
    image: apache/kafka:4.4.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      retries: 10

  order-api:
    build: { context: ., args: { SERVICE: order-api } }
    environment: { KAFKA_BROKERS: "kafka:29092", HTTP_ADDR: ":8080" }
    ports: ["8080:8080"]
    depends_on: { kafka: { condition: service_healthy } }

  payment-worker:
    build: { context: ., args: { SERVICE: payment-worker } }
    environment: { KAFKA_BROKERS: "kafka:29092" }
    depends_on: [order-api]   # order-api tạo topic khi khởi động
    deploy: { replicas: 2 }   # 2 instance cùng group chia nhau 6 partition

  notification-worker:
    build: { context: ., args: { SERVICE: notification-worker } }
    environment: { KAFKA_BROKERS: "kafka:29092" }
    depends_on: [order-api]
