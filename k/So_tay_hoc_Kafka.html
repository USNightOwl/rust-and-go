<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ tay học Kafka</title>
<style>body{margin:0}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sổ tay học — header dính với tiến độ tổng, mỗi Phần là mục lục chương bên trái + thẻ chương (kiến thức | checklist) bên phải */
:root {
  --bg: #F4F6F9; --surface: #FFFFFF; --sunk: #EAEEF3; --ink: #161B24; --muted: #5A6372;
  --line: #D9DFE6; --accent: #A84B0C; --gopher: #E07B1F; --done: #23845A; --done-soft: #DDF1E6;
  --code-bg: #EEF1F5; --code-ink: #8A3B08; --warn: #B42318;
  --f-display: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151B; --surface: #1A1F27; --sunk: #151920; --ink: #E7EAF0; --muted: #9AA3B2;
  --line: #2A313D; --accent: #F5A05A; --gopher: #F08A2E; --done: #5BC68D; --done-soft: #173A2A;
  --code-bg: #242B36; --code-ink: #FFC08A; --warn: #F97066; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151B; --surface: #1A1F27; --sunk: #151920; --ink: #E7EAF0; --muted: #9AA3B2;
  --line: #2A313D; --accent: #F5A05A; --gopher: #F08A2E; --done: #5BC68D; --done-soft: #173A2A;
  --code-bg: #242B36; --code-ink: #FFC08A; --warn: #F97066; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
code { font: 0.86em var(--f-mono); background: var(--code-bg); color: var(--code-ink); padding: 0.08em 0.35em; border-radius: 4px; overflow-wrap: anywhere }
button, input, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0 }
.brand b { font: 800 1.2rem/1 var(--f-display); letter-spacing: -0.01em }
.brand b span { color: var(--gopher) }
.brand small { font: 400 0.75rem var(--f-mono); color: var(--muted); white-space: nowrap }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap }
nav.tabs a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.9rem; padding: 6px 12px; border-radius: 999px; border: 1px solid transparent }
nav.tabs a:hover { color: var(--ink); border-color: var(--line) }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--surface) }
.overall { display: flex; align-items: center; gap: 10px; font: 600 0.8rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; flex: 1 }
.bar i { display: block; height: 100%; width: 0; background: var(--gopher); border-radius: 99px; transition: width .3s }
.bar.full i { background: var(--done) }
.overall .bar { width: 120px; flex: none }

main { padding-block: 28px 64px }
h1.view-title { font: 800 clamp(1.6rem, 3.6vw, 2.4rem)/1.15 var(--f-display); letter-spacing: -0.02em; margin: 0 0 6px; text-wrap: balance }
.eyebrow { font: 600 0.72rem var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent) }
.lede { color: var(--muted); max-width: 68ch; margin: 0 0 22px }

/* part view */
.part-head { display: grid; gap: 14px; margin-bottom: 22px }
.part-stats { display: flex; align-items: center; gap: 14px; font: 600 0.85rem var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted) }
.part-stats .bar { height: 8px; max-width: 420px }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.toolbar input[type=search] { flex: 1 1 220px; min-width: 0; max-width: 360px; padding: 8px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500 }
.btn:hover { border-color: var(--accent); color: var(--accent) }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface) }

.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; align-items: start }
aside.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 100px); overflow: auto; padding-right: 4px }
aside.toc a { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 6px; align-items: baseline; padding: 5px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 0.86rem; line-height: 1.35 }
aside.toc a:hover { background: var(--sunk) }
aside.toc .n { font: 600 0.75rem var(--f-mono); color: var(--muted) }
aside.toc .f { font: 0.72rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
aside.toc a.complete .f { color: var(--done); font-weight: 600 }
aside.toc a.complete .t { color: var(--muted) }

.chapters { display: grid; gap: 14px; min-width: 0 }
details.ch { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); scroll-margin-top: 90px }
details.ch.complete { border-color: color-mix(in srgb, var(--done) 45%, var(--line)) }
details.ch > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 14px 18px }
details.ch > summary::-webkit-details-marker { display: none }
.chnum { font: 700 0.78rem var(--f-mono); color: var(--accent); white-space: nowrap }
.chtitle { font: 700 1.05rem/1.3 var(--f-display); text-wrap: balance }
.chmeta { display: flex; align-items: center; gap: 10px; font: 600 0.78rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.chmeta .bar { width: 70px; flex: none }
.ch.complete .chmeta { color: var(--done) }
.chev { transition: transform .2s; color: var(--muted) }
details[open] .chev { transform: rotate(90deg) }
.chbody { border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.col { padding: 16px 18px; min-width: 0 }
.col + .col { border-left: 1px solid var(--line); background: var(--sunk); border-radius: 0 0 var(--r) 0 }
.col h3 { font: 600 0.72rem var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; gap: 8px }
.col h3 + * { margin-top: 0 }
.col h3.sp { margin-top: 18px }
ul.know { margin: 0; padding-left: 1.1em; display: grid; gap: 7px }
ul.know li::marker { color: var(--gopher) }
.checks { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none }
.checks label { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 0.92rem; line-height: 1.45 }
.checks label:hover { background: var(--surface) }
.checks input { width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--done) }
.checks input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent) }
.ex-tag { font: 600 0.68rem var(--f-mono); color: var(--warn); margin-right: 4px }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); font: 600 0.72rem var(--f-mono); letter-spacing: 0; text-transform: none }
.linkbtn:hover { text-decoration: underline }
mark { background: color-mix(in srgb, var(--gopher) 30%, transparent); color: inherit; border-radius: 2px }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r) }
.hide-done .checks li.is-done { display: none }

/* roadmap */
.parts-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 30px }
.psum { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; text-decoration: none; color: inherit }
.psum:hover { border-color: var(--accent) }
.psum .k { font: 600 0.72rem var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent) }
.psum .nm { font: 700 1.05rem/1.3 var(--f-display) }
.psum .num { font: 600 0.82rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
h2.sec { font: 700 1.25rem var(--f-display); margin: 0 0 12px }
ol.weeks { list-style: none; margin: 0 0 32px; padding: 0; display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden }
ol.weeks li { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) 160px; gap: 16px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line) }
ol.weeks li:first-child { border-top: 0 }
.wk { font: 700 0.82rem var(--f-mono); color: var(--accent) }
.wk-t { font-weight: 600 }
.wk-d { font-size: 0.86rem; color: var(--muted) }
.wk-p { display: flex; align-items: center; gap: 8px; font: 600 0.75rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
li.wdone .wk-p { color: var(--done) }
.backup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; align-content: start }
.card p { margin: 0; color: var(--muted); font-size: 0.9rem }
.card textarea { width: 100%; min-height: 70px; resize: vertical; padding: 8px; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; font: 0.75rem var(--f-mono) }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.status { font-size: 0.85rem; color: var(--done); min-height: 1.3em }
.status.err { color: var(--warn) }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr) }
  aside.toc { display: none }
  .chbody { grid-template-columns: minmax(0, 1fr) }
  .col + .col { border-left: 0; border-top: 1px solid var(--line); border-radius: 0 0 var(--r) var(--r) }
  .parts-sum, .backup { grid-template-columns: minmax(0, 1fr) }
  ol.weeks li { grid-template-columns: minmax(0, 1fr); gap: 6px }
  .overall .bar { width: 70px }
}
@media (max-width: 480px) {
  details.ch > summary { grid-template-columns: minmax(0, 1fr) auto; }
  .chnum { grid-column: 1 / -1 }
  .chmeta .bar { display: none }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

</head>

 <code>advertised.listeners</code> — phải là địa chỉ client truy cập được.", "Tách listener INTERNAL/EXTERNAL khi có client ở trong và ngoài mạng Docker.", "Cài binary: <code>kafka-storage.sh random-uuid</code> → <code>format</code> → <code>kafka-server-start.sh</code>; broker cần Java 17+."], "exercises": ["Chạy Kafka bằng Docker, tạo topic <code>hello</code> có 3 partition và xem mô tả bằng <code>kafka-topics.sh --describe</code>.", "Dựng cụm 3 node bằng file Compose trong chương, tắt <code>kafka2</code> và quan sát leader của các partition thay đổi.", "Cố ý sai <code>advertised.listeners</code> (chỉ dùng tên container) rồi kết nối từ máy host; ghi lại thông báo lỗi và giải thích.", "Cài Kafka từ binary trên máy (hoặc VM), đổi <code>log.dirs</code> sang thư mục bền vững và khởi động lại broker."]}, {"n": 3, "title": "Các khái niệm cốt lõi", "sections": ["3.1. Bức tranh tổng thể", "3.2. Record: cấu trúc một sự kiện", "3.3. Topic và partition", "3.4. Offset và vị trí của consumer", "3.5. Broker, cluster và controller", "3.6. Producer, consumer và consumer group"], "summary": ["Record gồm key, value, headers, timestamp; broker coi key/value là mảng byte.", "Topic chia thành partition; thứ tự chỉ được đảm bảo trong một partition; cùng key → cùng partition (murmur2 mod N).", "Offset là vị trí trong partition; consumer commit offset kế tiếp cần đọc; lag = high watermark − committed offset.", "Broker lưu và phục vụ partition; controller (KRaft) quản lý metadata; mỗi partition có một leader và các follower.", "Trong một consumer group mỗi partition thuộc một consumer; các group khác nhau đọc độc lập."], "exercises": ["Một topic có 6 partition và group có 4 consumer: vẽ một cách phân chia hợp lệ. Nếu thêm 3 consumer nữa thì sao?", "Với hệ thống ngân hàng, bạn chọn key gì cho topic <code>transactions</code> để đảm bảo thứ tự giao dịch của mỗi tài khoản?", "Partition có HW = 1200, committed offset của group A là 1150, của group B là 900. Tính lag từng group.", "Chạy chương trình Go trong chương với Kafka thật; đổi số partition thành 6 và quan sát key nào đổi partition."]}, {"n": 4, "title": "Thực hành với công cụ dòng lệnh", "sections": ["4.1. kafka-topics.sh — quản lý topic", "4.2. Console producer và consumer", "4.3. kafka-consumer-groups.sh — theo dõi lag và reset offset", "4.4. Các công cụ khác cần biết"], "summary": ["<code>kafka-topics.sh</code>: tạo/xem/sửa/xoá topic; <code>--under-replicated-partitions</code> để kiểm tra sức khoẻ.", "Console producer/consumer để thử nhanh; từ 4.2 dùng <code>--reader-property</code> / <code>--formatter-property</code>.", "<code>kafka-consumer-groups.sh --describe</code> cho lag từng partition; reset offset khi group đã dừng, luôn <code>--dry-run</code> trước.", "<code>kafka-configs.sh</code> sửa cấu hình động; <code>kafka-dump-log.sh</code>, <code>kafka-get-offsets.sh</code>, <code>kafka-metadata-quorum.sh</code> để chẩn đoán."], "exercises": ["Tạo topic <code>payments</code> 3 partition, gửi 10 message có key bằng console producer, đọc lại kèm partition và offset.", "Chạy hai console consumer cùng <code>--group g1</code> và một consumer <code>--group g2</code>; quan sát cách message được chia.", "Dừng group <code>g1</code>, reset offset về đầu bằng <code>--dry-run</code> rồi <code>--execute</code>; chạy lại consumer để thấy dữ liệu được xử lý lại.", "Đổi <code>retention.ms</code> của topic thành 60000 và quan sát (sau vài phút) offset đầu thay đổi bằng <code>kafka-get-offsets.sh --time -2</code>."]}, {"n": 5, "title": "Lưu trữ: commit log, segment, retention và compaction", "sections": ["5.1. Partition trên đĩa: thư mục và segment", "5.2. Retention: khi nào dữ liệu bị xoá?", "5.3. Log compaction — giữ giá trị mới nhất cho mỗi key", "5.4. Xem dữ liệu thật trên đĩa với kafka-dump-log.sh", "5.5. Tiered storage"], "summary": ["Mỗi partition là một thư mục gồm nhiều segment (<code>.log</code>, <code>.index</code>, <code>.timeindex</code>); chỉ segment active được ghi.", "Kafka nhanh nhờ ghi tuần tự, page cache, zero-copy, batching và nén theo batch.", "Retention (<code>retention.ms</code>, <code>retention.bytes</code>) xoá nguyên segment cũ; segment active không bị xoá.", "Compaction giữ bản ghi mới nhất mỗi key; tombstone (value null) để xoá key; offset không đổi.", "Tiered storage đẩy segment cũ sang object storage để giữ dữ liệu lâu với chi phí thấp."], "exercises": ["Tạo topic với <code>segment.bytes=1048576</code> (1 MiB), ghi 10 MB dữ liệu bằng <code>kafka-producer-perf-test.sh</code> và liệt kê các file segment.", "Tạo topic compacted, gửi nhiều giá trị cho cùng vài key và một tombstone; sau khi compaction chạy, đọc lại từ đầu và giải thích kết quả.", "Giải thích vì sao topic có <code>retention.ms=3600000</code> vẫn còn dữ liệu cũ 2 ngày; đề xuất cách sửa.", "Dùng <code>kafka-dump-log.sh</code> để tìm <code>producerId</code> và codec nén của một batch."]}, {"n": 6, "title": "Replication và độ bền dữ liệu", "sections": ["6.1. Leader, follower và replication factor", "6.2. ISR — tập bản sao đồng bộ", "6.3. acks, replication.factor và min.insync.replicas", "6.4. Bầu leader khi broker chết", "6.5. Rack awareness", "6.6. Topic nội bộ cũng cần replication"], "summary": ["Mỗi partition có RF bản sao: một leader nhận ghi, các follower fetch để sao chép.", "ISR là tập bản sao theo kịp leader; high watermark là ranh giới dữ liệu đã commit mà consumer đọc được.", "Độ bền = <code>acks=all</code> + <code>replication.factor=3</code> + <code>min.insync.replicas=2</code> (chịu được mất 1 broker).", "Unclean leader election mặc định tắt để không mất dữ liệu; preferred leader và rack awareness giúp cân bằng và chịu lỗi AZ.", "Topic nội bộ (<code>__consumer_offsets</code>, <code>__transaction_state</code>, <code>__share_group_state</code>) cần RF ≥ 3 trong production."], "exercises": ["Với cụm 3 broker, topic RF=3, <code>min.insync.replicas=2</code>: chuyện gì xảy ra với producer <code>acks=all</code> khi 1 broker chết? Khi 2 broker chết? Với producer <code>acks=1</code> thì sao?", "Dựng cụm 3 node bằng Docker Compose, tạo topic RF=3, dừng broker đang làm leader và quan sát <code>--describe</code> trước/sau.", "Giải thích vì sao consumer không đọc được record có offset ≥ high watermark dù leader đã ghi xong.", "Thiết kế cấu hình broker cho cụm trải trên 3 AZ, mỗi AZ 2 broker, đảm bảo mất một AZ vẫn ghi/đọc được."]}, {"n": 7, "title": "KRaft: bộ điều khiển metadata của Kafka", "sections": ["7.1. Từ ZooKeeper đến KRaft", "7.2. Kiến trúc KRaft", "7.3. Vai trò node: process.roles", "7.4. Quorum tĩnh và quorum động", "7.5. node.id, cluster ID và định dạng lưu trữ", "7.6. Feature version và nâng cấp", "7.7. Chuyển từ ZooKeeper (cho hệ thống cũ)"], "summary": ["Kafka 4.x chỉ dùng KRaft; metadata lưu trong log <code>__cluster_metadata</code> do quorum controller (Raft) quản lý.", "Active controller ghi metadata; controller khác dự phòng; broker đọc metadata log như observer.", "<code>process.roles</code>: <code>broker</code>, <code>controller</code> hoặc kết hợp; production tách controller, dùng 3 hoặc 5 node.", "Quorum động (<code>controller.quorum.bootstrap.servers</code>) cho phép thêm/bớt controller; quản lý bằng <code>kafka-metadata-quorum.sh</code>.", "Dùng <code>node.id</code> (không dùng <code>broker.id</code>); nâng cấp bằng rolling restart rồi <code>kafka-features.sh upgrade</code>."], "exercises": ["Vì sao quorum 4 controller không chịu lỗi tốt hơn quorum 3? Tính số node được phép chết với 3, 4, 5, 7 controller.", "Chạy <code>kafka-metadata-quorum.sh describe --status</code> trên cụm Docker 3 node, dừng node đang là <code>LeaderId</code> và chạy lại lệnh.", "Phác thảo cấu hình cụm production: 3 controller riêng, 6 broker, trải trên 3 AZ — liệt kê <code>process.roles</code>, <code>node.id</code>, <code>broker.rack</code> cho từng node.", "Viết các bước nâng cấp cụm từ Kafka 4.2 lên 4.4 không gián đoạn dịch vụ."]}, {"n": 8, "title": "Producer chuyên sâu", "sections": ["8.1. Hành trình của một record", "8.2. Partitioner", "8.3. Batching: batch.size và linger.ms", "8.4. Nén (compression)", "8.5. acks, retry và timeout", "8.6. Idempotent producer — không trùng lặp khi retry", "8.7. Thứ tự khi retry", "8.8. Kích thước message", "8.9. Cấu hình producer gợi ý"], "summary": ["Record đi qua serializer → partitioner → accumulator (batch) → sender → broker → callback.", "Có key: murmur2 mod N; không key: sticky + adaptive partitioning.", "<code>batch.size</code> + <code>linger.ms</code> (mặc định 5 ms từ 4.0) quyết định batching; nén theo batch, <code>lz4</code>/<code>zstd</code> là lựa chọn tốt.", "<code>acks=all</code>, retry tự động trong <code>delivery.timeout.ms</code>; idempotence (mặc định bật) chống trùng và giữ thứ tự khi retry.", "Giới hạn kích thước message ~1 MiB ở nhiều tầng; dữ liệu lớn dùng mẫu claim check."], "exercises": ["Vẽ lại hành trình của record khi leader partition đổi giữa chừng; producer nhận lỗi gì và xử lý ra sao?", "Chạy <code>kafka-producer-perf-test.sh</code> với <code>linger.ms=0</code> và <code>linger.ms=20</code>, <code>compression.type=none</code> và <code>zstd</code>; so sánh throughput và độ trễ.", "Giải thích tình huống producer khởi động lại gây trùng dữ liệu dù idempotence bật; đề xuất 2 cách khắc phục.", "Gửi một message 2 MiB vào topic mặc định; ghi lại lỗi và liệt kê mọi cấu hình cần sửa để chấp nhận nó."]}, {"n": 9, "title": "Consumer và consumer group chuyên sâu", "sections": ["9.1. Vòng lặp poll", "9.2. Phân chia partition trong consumer group", "9.3. Heartbeat, session và max.poll.interval", "9.4. Static membership", "9.5. Commit offset", "9.6. Lag và các nguyên nhân thường gặp"], "summary": ["Consumer pull dữ liệu qua vòng lặp poll; <code>auto.offset.reset</code> mặc định <code>latest</code>.", "Group coordinator quản lý thành viên và rebalance; giao thức cổ điển dùng assignor phía client (cooperative-sticky nên dùng).", "Giao thức mới KIP-848 (<code>group.protocol=consumer</code>, GA từ 4.0): broker tự tính phân công, rebalance tăng dần và nhanh.", "<code>session.timeout.ms</code> phát hiện consumer chết; <code>max.poll.interval.ms</code> phát hiện consumer kẹt; static membership tránh rebalance khi deploy.", "Commit tự động đơn giản nhưng kém kiểm soát; commit thủ công sau khi xử lý xong; lag là chỉ số sức khoẻ quan trọng nhất."], "exercises": ["Topic 4 partition, group 2 consumer dùng <code>CooperativeStickyAssignor</code>; thêm consumer thứ 3 — mô tả các vòng rebalance và partition nào bị di chuyển.", "Tính <code>max.poll.records</code> phù hợp nếu mỗi record mất trung bình 200 ms xử lý và <code>max.poll.interval.ms=300000</code>, để có biên an toàn 50%.", "Sửa chương trình Go trong chương để chỉ commit sau mỗi 2 record; nếu chương trình crash giữa chừng, những record nào sẽ bị xử lý lại?", "Giải thích vì sao commit offset <strong>trước</strong> khi xử lý dẫn tới mất dữ liệu, còn commit <strong>sau</strong> khi xử lý dẫn tới trùng lặp khi crash."]}, {"n": 10, "title": "Ngữ nghĩa phân phối: at-most-once, at-least-once, exactly-once", "sections": ["10.1. Ba mức đảm bảo", "10.2. Exactly-once trong Kafka (EOS)", "10.3. Chọn mức đảm bảo nào?"], "summary": ["At-most-once: commit trước khi xử lý (có thể mất); at-least-once: commit sau khi xử lý (có thể trùng).", "Exactly-once của Kafka = idempotent producer + transaction (gồm cả offset) + consumer <code>read_committed</code>, cho luồng Kafka → Kafka.", "<code>transactional.id</code> ổn định giúp fence producer \"zombie\"; LSO chặn consumer <code>read_committed</code> khi transaction mở lâu.", "Với đầu ra ngoài Kafka (DB, email), dùng at-least-once + xử lý idempotent hoặc outbox."], "exercises": ["Với mỗi mức đảm bảo, vẽ dòng thời gian một lần crash và chỉ ra record nào bị mất/trùng.", "Thiết kế bảng <code>processed_events</code> và câu SQL giúp consumer thanh toán xử lý idempotent.", "Sửa chương trình Go trong chương: transaction thứ hai cũng bị huỷ — consumer <code>read_committed</code> in ra gì?", "Giải thích vì sao một transaction mở 10 phút làm consumer <code>read_committed</code> của mọi partition liên quan bị đứng."]}, {"n": 11, "title": "Share group — Queues for Kafka", "sections": ["11.1. Share group khác consumer group thế nào?", "11.2. Vòng đời một record trong share group", "11.3. Cấu hình share group", "11.4. Thực hành với CLI", "11.5. Khi nào chọn share group?"], "summary": ["Share group (KIP-932, production-ready từ Kafka 4.2) cho phép nhiều consumer cùng đọc một partition; đơn vị phân chia là record.", "Mỗi record được khoá cho một consumer; xác nhận bằng accept, release, reject hoặc renew; hết hạn khoá thì giao lại.", "<code>share.delivery.count.limit</code> giới hạn số lần giao; Kafka 4.4 thêm dead-letter queue cho share group.", "Không đảm bảo thứ tự, ngữ nghĩa at-least-once; phù hợp hàng đợi công việc độc lập, tải không đều."], "exercises": ["Tạo topic <code>emails</code> 1 partition, chạy 3 <code>kafka-console-share-consumer.sh</code> cùng group và gửi 30 message; quan sát phân bố giữa các worker.", "Chạy consumer với <code>--release</code> và đặt <code>share.delivery.count.limit=3</code>; giải thích điều gì xảy ra với message sau lần giao thứ 3.", "So sánh chi phí: cần xử lý 200 tác vụ song song — dùng consumer group thì cần bao nhiêu partition? Share group thì sao?", "Liệt kê 3 bài toán trong công ty bạn phù hợp với share group và 3 bài toán bắt buộc phải dùng consumer group."]}, {"n": 12, "title": "Thiết kế topic, partition và message", "sections": ["12.1. Đặt tên topic", "12.2. Một topic hay nhiều topic?", "12.3. Chọn key", "12.4. Chọn số partition", "12.5. Thiết kế message", "12.6. Retention theo mục đích"], "summary": ["Đặt tên topic theo quy ước thống nhất; tắt auto-create trong production.", "Gom sự kiện cần thứ tự chung vào một topic và dùng ID thực thể làm key; tránh key lệch gây hot partition.", "Ước lượng partition theo thông lượng producer/consumer, dự phòng tăng trưởng, ưu tiên số có nhiều ước.", "Message có envelope (eventId, eventType, version, occurredAt) và định dạng có schema (Avro/Protobuf/JSON Schema).", "Giữ message nhỏ, không chứa dữ liệu nhạy cảm, retention phù hợp mục đích từng topic."], "exercises": ["Thiết kế danh sách topic (tên, key, số partition, retention, cleanup.policy) cho hệ thống giao đồ ăn: đơn hàng, vị trí tài xế, thanh toán, đánh giá.", "Mục tiêu 120 MB/s, mỗi partition ghi 15 MB/s, mỗi consumer xử lý 8 MB/s: tính số partition tối thiểu và đề xuất con số cuối cùng.", "Viết JSON envelope cho sự kiện <code>PaymentFailed</code> và liệt kê header nên có.", "Một topic dùng <code>customerType</code> (3 giá trị) làm key và bị lag nặng ở một partition: phân tích nguyên nhân và đề xuất sửa."]}, {"n": 13, "title": "Bảng tra cứu cấu hình và các phiên bản Kafka", "sections": ["13.1. Cấu hình broker và controller", "13.2. Cấu hình topic", "13.3. Cấu hình producer", "13.4. Cấu hình consumer", "13.5. Kafka qua các phiên bản"], "summary": ["Broker production: tắt auto-create, RF mặc định 3, <code>min.insync.replicas=2</code>, giữ unclean election tắt, đặt <code>broker.rack</code>.", "Topic: chọn <code>cleanup.policy</code>, retention, segment theo mục đích; <code>max.message.bytes</code> khớp với producer.", "Producer mặc định hiện đại đã an toàn (<code>acks=all</code>, idempotence); tinh chỉnh <code>linger.ms</code>, <code>batch.size</code>, nén.", "Consumer: cân nhắc <code>group.protocol=consumer</code>, <code>auto.offset.reset</code>, commit thủ công, <code>max.poll.*</code>, <code>read_committed</code>.", "Kafka 4.0 là bước ngoặt (bỏ ZooKeeper); 4.2 có share group; 5.0 sẽ dọn các phần deprecated."], "exercises": ["Viết file <code>server.properties</code> cho một broker production (tách controller) dựa trên bảng gợi ý.", "Viết bộ cấu hình producer cho dịch vụ ghi log (throughput cao, chấp nhận độ trễ 50 ms) và cho dịch vụ thanh toán (an toàn tối đa).", "Liệt kê các cấu hình phải đổi khi chuyển một ứng dụng từ client Kafka 2.x sang 4.x.", "Kiểm tra cụm Kafka của bạn bằng <code>kafka-configs.sh --describe --all</code> và so sánh với bảng gợi ý."]}]}, {"id": "p2", "name": "Lập trình Kafka với Go", "short": "Lập trình với Go", "chapters": [{"n": 1, "title": "Chọn thư viện và chuẩn bị môi trường", "sections": ["1.1. Các thư viện Kafka cho Go", "1.2. Dựng Kafka 4.4 bằng Docker Compose", "1.3. Tạo module Go", "1.4. Kết nối và kiểm tra cụm", "1.5. Cấu trúc thư mục gợi ý"], "summary": ["franz-go là client Go thuần, hỗ trợ đầy đủ Kafka 4.x (transaction, KIP-848, share group, Admin API, kfake); confluent-kafka-go cần cgo; segmentio/kafka-go đơn giản; sarama dành cho dự án cũ.", "Kafka 4.4 chạy KRaft, không cần ZooKeeper; Docker Compose 1 node đủ cho phát triển, chú ý cấu hình hai listener và advertised listener.", "Đọc broker từ <code>KAFKA_BROKERS</code>; <code>kgo.NewClient</code> kết nối lười, dùng <code>Ping</code> để kiểm tra lúc khởi động.", "Một <code>kgo.Client</code> an toàn đa goroutine, tạo một lần và dùng lại; luôn <code>Close()</code> khi tắt.", "<code>kadm.NewClient(cl)</code> cung cấp Admin API: liệt kê broker, tạo và liệt kê topic."], "exercises": ["Dựng Docker Compose ở trên, mở Kafka UI và tạo thử một topic bằng giao diện.", "Sửa chương trình kết nối để bỏ qua lỗi <code>kerr.TopicAlreadyExists</code> khi chạy lại nhiều lần.", "Cố ý đổi <code>KAFKA_ADVERTISED_LISTENERS</code> thành địa chỉ sai, quan sát lỗi mà client Go báo và giải thích nguyên nhân.", "Viết hàm <code>newClient(role string, opts ...kgo.Opt) (*kgo.Client, error)</code> dùng chung cho mọi chương trình, tự đọc <code>KAFKA_BROKERS</code> và gắn <code>ClientID</code> theo vai trò.", "Dùng <code>adm.ListTopics</code> để in thêm leader và danh sách replica của từng partition."]}, {"n": 2, "title": "Producer: ghi dữ liệu vào Kafka", "sections": ["2.1. Cấu trúc một Record", "2.2. Ghi đồng bộ với ProduceSync", "2.3. Ghi bất đồng bộ với Produce và promise", "2.4. Chọn partition (partitioner)", "2.5. Các cấu hình producer quan trọng", "2.6. Xử lý lỗi khi produce", "2.7. Flush, Close và tắt ứng dụng an toàn"], "summary": ["Record gồm topic, key, value, headers, timestamp; partition và offset được điền sau khi ghi thành công.", "<code>ProduceSync</code> đơn giản nhưng chậm nếu gọi từng record; <code>Produce</code> + promise + <code>Flush</code> cho thông lượng cao.", "Cùng key → cùng partition (murmur2, tương thích Java) → giữ thứ tự theo key; tăng partition làm thay đổi ánh xạ.", "Mặc định franz-go: <code>acks=all</code> + idempotent; thêm linger 5–20ms và nén zstd/lz4 cho hiệu năng.", "Client tự thử lại lỗi tạm thời; xử lý lỗi không thể thử lại bằng <code>errors.Is</code> với <code>kerr</code>/<code>kgo</code>.", "Tắt an toàn: ngừng nhận việc → <code>Flush</code> có timeout → <code>Close</code>."], "exercises": ["Viết CLI <code>produce -topic t -key k -value v</code> gửi một record và in partition/offset.", "Đo thông lượng ghi 100 000 record với <code>ProducerLinger</code> 0, 5ms, 20ms và nén none/lz4/zstd; lập bảng kết quả.", "Viết promise đẩy record lỗi vào một channel; một goroutine riêng ghi các record này ra file <code>failed.jsonl</code>.", "Thêm header <code>trace-id</code> (sinh bằng package <code>uuid</code> của Go 1.27) cho mọi record và in lại ở consumer.", "Viết partitioner tuỳ chỉnh đưa mọi key bắt đầu bằng <code>vip-</code> vào partition 0, các key khác băm vào partition còn lại."]}, {"n": 3, "title": "Consumer group: đọc dữ liệu từ Kafka", "sections": ["3.1. Vòng lặp poll cơ bản", "3.2. Offset và commit", "3.3. Rebalance và các callback", "3.4. Giao thức consumer group mới (KIP-848)", "3.5. Xử lý song song theo partition", "3.6. Đọc không dùng group: ConsumePartitions", "3.7. Tắt consumer an toàn (graceful shutdown)", "3.8. Các cấu hình consumer quan trọng"], "summary": ["Vòng lặp chuẩn: <code>PollFetches</code> → kiểm tra <code>IsClientClosed</code>/ctx → <code>EachError</code> → <code>EachRecord</code>; thứ tự chỉ đảm bảo trong partition.", "Offset commit là vị trí record kế tiếp; at-least-once = xử lý xong rồi mới commit, kèm xử lý idempotent.", "Autocommit mặc định 5s; <code>AutoCommitMarks</code> + <code>MarkCommitRecords</code> hoặc <code>DisableAutoCommit</code> + <code>CommitUncommittedOffsets</code> để kiểm soát.", "Rebalance: commit trong <code>OnPartitionsRevoked</code>, không commit trong <code>OnPartitionsLost</code>; <code>BlockRebalanceOnPoll</code> + <code>AllowRebalance</code> tránh rebalance giữa lô.", "KIP-848 (<code>ServerSideBalancer</code>) chuyển phân chia sang broker, rebalance tăng dần; static membership giảm rebalance khi deploy.", "Song song theo partition giữ thứ tự; <code>ConsumePartitions</code> đọc không cần group từ offset/thời điểm; tắt sạch bằng <code>signal.NotifyContext</code> + commit + <code>Close</code>."], "exercises": ["Chạy 3 instance của chương trình consumer cùng group trên topic 6 partition, in partition được giao cho mỗi instance; tắt một instance và quan sát rebalance.", "Viết consumer commit thủ công mỗi 100 record <strong>hoặc</strong> mỗi 2 giây, tuỳ điều kiện nào đến trước.", "Viết công cụ <code>replay -topic t -from \"2026-11-01T08:00:00Z\"</code> đọc lại dữ liệu từ một thời điểm bằng <code>ConsumePartitions</code> cho mọi partition.", "Sửa ví dụ xử lý song song để giới hạn tối đa 4 goroutine đồng thời dù có 12 partition.", "So sánh thời gian rebalance giữa giao thức classic và <code>ServerSideBalancer()</code> khi thêm/bớt instance (dùng Kafka thật 4.3+)."]}, {"n": 4, "title": "Serialization và Schema Registry", "sections": ["4.1. So sánh các định dạng", "4.2. JSON với envelope có phiên bản", "4.3. Schema Registry", "4.4. Tiến hoá schema và mức tương thích"], "summary": ["Kafka chỉ lưu byte; producer/consumer chịu trách nhiệm serialize/deserialize — định dạng dữ liệu là hợp đồng giữa các dịch vụ.", "JSON dễ bắt đầu (dùng envelope có id/type/version); Protobuf và Avro nhỏ gọn, có schema và tiến hoá tốt.", "Schema Registry lưu schema theo subject, cấp ID toàn cục; wire format = magic byte 0 + 4 byte ID + payload.", "<code>sr.Serde</code> của franz-go mã hoá/giải mã theo wire format, hỗ trợ nhiều kiểu trong một topic (<code>DecodeNew</code>).", "Mức tương thích BACKWARD/FORWARD/FULL quyết định thay đổi nào được phép và thứ tự nâng cấp producer/consumer."], "exercises": ["Mở rộng <code>Envelope[T]</code> với header Kafka: viết hàm <code>ToRecord(topic string, key string, ev Envelope[T]) *kgo.Record</code> đặt <code>type</code> và <code>version</code> vào header.", "Viết consumer đọc một topic chứa nhiều loại event, định tuyến theo header <code>type</code> tới các handler khác nhau.", "Định nghĩa <code>order.proto</code>, sinh code Go bằng <code>buf generate</code>, rồi mã hoá/giải mã bằng <code>sr.Serde</code>.", "Dựng Schema Registry bằng Docker, đăng ký schema Avro V1, thử đăng ký V2 xoá một trường không có mặc định với mức <code>BACKWARD</code> và đọc lỗi trả về.", "Viết bảng so sánh kích thước message của cùng một đơn hàng khi mã hoá bằng JSON, Protobuf và Avro."]}, {"n": 5, "title": "Xử lý lỗi, retry và dead-letter topic", "sections": ["5.1. Phân loại lỗi", "5.2. Retry tại chỗ với backoff và DLQ", "5.3. Retry topic: thử lại không chặn partition", "5.4. Consumer idempotent: chịu được đọc lại"], "summary": ["Phân loại lỗi: tạm thời → retry; dữ liệu sai/nghiệp vụ vĩnh viễn → DLQ; hệ thống sập → dừng tiêu thụ và cảnh báo.", "Retry tại chỗ với backoff mũ + jitter, tổng thời gian nhỏ hơn rebalance timeout; sau đó ghi DLQ kèm header lỗi rồi mới commit.", "Retry topic không chặn partition nhưng phá vỡ thứ tự theo key.", "DLQ cần cảnh báo, công cụ xem và phát lại, retention đủ dài.", "At-least-once luôn có trùng lặp: consumer phải idempotent (event_id UNIQUE trong cùng transaction, upsert, điều kiện phiên bản)."], "exercises": ["Thêm metric đếm số lần retry và số message vào DLQ cho ví dụ ở trên (dùng <code>sync/atomic</code>, in ra mỗi 10 giây).", "Viết công cụ <code>dlq-replay</code> đọc topic <code>payments.dlq</code>, cho phép lọc theo header <code>dlq-error</code>, và ghi lại vào topic gốc.", "Cài đặt chuỗi retry topic <code>payments.retry.5s</code> → <code>payments.retry.30s</code> → <code>payments.dlq</code>.", "Viết <code>Ledger</code> dùng PostgreSQL thật: bảng <code>processed_events(event_id PRIMARY KEY)</code> và cập nhật số dư trong cùng transaction.", "Thiết kế cơ chế \"tạm dừng\" consumer khi database down (gợi ý: <code>cl.PauseFetchTopics</code>/<code>ResumeFetchTopics</code>) và tự tiếp tục khi health check của DB thành công."]}, {"n": 6, "title": "Exactly-once và transaction", "sections": ["6.1. Ba mức đảm bảo giao nhận", "6.2. Idempotent producer", "6.3. Transaction phía producer", "6.4. Consume → transform → produce với GroupTransactSession", "6.5. Transactional outbox: ghi database và phát event nhất quán"], "summary": ["Ba mức: at-most-once, at-least-once (phổ biến nhất, cần consumer idempotent), exactly-once (chỉ trong phạm vi Kafka → Kafka).", "Idempotent producer (mặc định bật) loại bản ghi trùng do retry và giữ thứ tự.", "Transaction producer: <code>TransactionalID</code>, <code>BeginTransaction</code>, <code>EndTransaction(TryCommit/TryAbort)</code>; consumer phải <code>ReadCommitted()</code>.", "<code>GroupTransactSession</code> thực hiện consume → transform → produce với offset commit nằm trong transaction.", "Transactional outbox giải bài toán ghi DB + phát event nhất quán; relay polling <code>FOR UPDATE SKIP LOCKED</code> hoặc CDC Debezium."], "exercises": ["Sửa ví dụ <code>GroupTransactSession</code> để cố ý gây lỗi (<code>TryAbort</code>) ở lô đầu tiên, kiểm tra rằng kết quả cuối vẫn đúng 4 tên, không trùng.", "Viết consumer <code>read_uncommitted</code> và <code>read_committed</code> chạy song song trên cùng topic có transaction bị abort, giải thích sự khác nhau.", "Cài đặt đầy đủ outbox với PostgreSQL (dùng <code>pgx/v5/stdlib</code>), chạy 2 relay song song và chứng minh không có event bị gửi hai lần trong điều kiện bình thường.", "Thiết kế <code>TransactionalID</code> cho một Deployment Kubernetes 5 replica; giải thích vì sao không dùng UUID ngẫu nhiên mỗi lần khởi động.", "Đo độ trễ trung bình khi produce 10 000 record theo lô 100 record/transaction so với không dùng transaction."]}, {"n": 7, "title": "Admin API với kadm", "sections": ["7.1. Quản lý topic và cấu hình", "7.2. Theo dõi lag của consumer group", "7.3. Health check Kafka cho ứng dụng"], "summary": ["<code>kadm.NewClient(kgoClient)</code> cung cấp Admin API: topic, cấu hình, partition, offset, group, ACL, transaction.", "Tạo topic kèm cấu hình bằng <code>map[string]*string</code> và <code>kadm.StringPtr</code>; sửa cấu hình bằng <code>AlterTopicConfigs</code> (incremental).", "Partition chỉ tăng, không giảm; tăng partition ảnh hưởng ánh xạ key → partition.", "<code>adm.Lag(ctx, group)</code> trả lag theo partition; lag tăng liên tục là tín hiệu consumer quá tải.", "Reset offset bằng <code>CommitOffsets</code> khi group <code>Empty</code>; health check dùng <code>Ping</code> với timeout ngắn."], "exercises": ["Viết CLI <code>topicctl</code> với lệnh <code>create</code>, <code>describe</code>, <code>set-config</code>, <code>delete</code> dùng kadm.", "Viết công cụ in bảng lag của mọi consumer group, sắp xếp giảm dần theo tổng lag, cảnh báo group có lag &gt; 10 000.", "Viết lệnh <code>reset-to-time -group g -topic t -time 2026-11-01T00:00:00Z</code> dùng <code>ListOffsetsAfterMilli</code> rồi <code>CommitOffsets</code>.", "Viết \"migration\" tạo topic idempotent: đọc file YAML mô tả topic (tên, partition, cấu hình), tạo mới hoặc cập nhật cấu hình nếu đã tồn tại."]}, {"n": 8, "title": "Share group: Queues for Kafka", "sections": ["8.1. Share group khác consumer group thế nào?", "8.2. Dùng share group với franz-go", "8.3. Khi nào chọn share group?"], "summary": ["Share group (KIP-932, production-ready từ Kafka 4.2) cho phép nhiều consumer cùng đọc một partition, xác nhận từng record — mô hình hàng đợi công việc.", "franz-go: <code>kgo.ShareGroup(name)</code> + <code>r.Ack(kgo.AckAccept | AckRelease | AckReject | AckRenew)</code>; <code>r.DeliveryCount()</code> cho biết lần giao.", "Group mới mặc định chỉ đọc dữ liệu mới; đặt <code>share.auto.offset.reset=earliest</code> ở cấp group nếu cần.", "<code>share.delivery.count.limit</code> chặn poison pill; Kafka 4.4 thêm DLQ cho share group.", "Không có thứ tự, vẫn là at-least-once: dùng cho tác vụ độc lập, worker idempotent."], "exercises": ["Chạy 3 instance của ví dụ trên (bỏ phần produce), ghi 100 job, in số job mỗi instance xử lý.", "Viết worker gọi HTTP webhook: 2xx → accept, 5xx/timeout → release, 4xx → reject.", "Đặt <code>share.delivery.count.limit=3</code>, cho một job luôn release, quan sát job dừng được giao sau 3 lần.", "Viết worker xử lý lâu (5 giây/job) dùng <code>AckRenew</code> mỗi giây trong lúc xử lý.", "So sánh: xử lý 1 000 job thời gian ngẫu nhiên 10–500ms bằng consumer group 3 partition và bằng share group 10 worker; đo tổng thời gian."]}, {"n": 9, "title": "Kiểm thử ứng dụng Kafka", "sections": ["9.1. Unit test: tách logic khỏi Kafka", "9.2. Test với kfake: Kafka thật trong bộ nhớ", "9.3. Integration test với Testcontainers", "9.4. Kiểm thử idempotency và xử lý trùng"], "summary": ["Ba tầng: unit test với interface + fake; test với kfake (Kafka trong bộ nhớ); integration test với Testcontainers và Kafka thật.", "Logic nghiệp vụ phụ thuộc interface nhỏ (<code>Publisher</code>), cài đặt bằng franz-go được kiểm tra riêng.", "<code>kfake.NewCluster(kfake.SeedTopics(...))</code> + <code>t.Cleanup(c.Close)</code>: mỗi test một cụm, chạy dưới 1 giây, hỗ trợ group, transaction, share group.", "kfake không thay thế hoàn toàn Kafka thật: hành vi phụ thuộc cấu hình broker cần integration test (build tag <code>integration</code>).", "Luôn có test cho idempotency: event trùng không làm sai trạng thái."], "exercises": ["Thêm test cho <code>KafkaPublisher</code> khi topic không tồn tại và client không bật auto-create: test phải kết thúc nhờ context timeout.", "Viết test kfake cho consumer commit thủ công: xử lý 5 record, đóng client, mở client mới cùng group và kiểm tra không đọc lại.", "Viết test kfake cho <code>GroupTransactSession</code> ở Chương 6: abort lô đầu, kiểm tra đầu ra không trùng.", "Dùng <code>c.ControlKey</code> của kfake để trả lỗi <code>NotLeaderForPartition</code> cho request Produce đầu tiên, kiểm tra client tự thử lại thành công.", "Thiết lập GitHub Actions chạy <code>go test ./...</code> mọi lúc và <code>go test -tags=integration ./...</code> chỉ trên nhánh <code>main</code>."]}, {"n": 10, "title": "Observability: log, metrics, tracing", "sections": ["10.1. Log của client với slog", "10.2. Metrics qua hook", "10.3. Tracing phân tán qua header", "10.4. Theo dõi lag"], "summary": ["Bật log client bằng <code>kgo.WithLogger</code> (adapter slog hoặc plugin kslog), mức Warn/Info cho production; log ứng dụng luôn kèm topic/partition/offset.", "Hook (<code>kgo.WithHooks</code>) cho phép đếm record, đo độ trễ, theo dõi kết nối; kprom cung cấp sẵn metrics Prometheus.", "Truyền trace context qua header <code>traceparent</code>; kotel tự inject/extract với OpenTelemetry.", "Theo dõi lag là bắt buộc: từ ứng dụng (<code>adm.Lag</code>), exporter hoặc nền tảng quản lý; ưu tiên lag theo thời gian."], "exercises": ["Mở rộng <code>metrics</code> để đo histogram thời gian từ <code>Record.Timestamp</code> đến lúc xử lý (end-to-end latency).", "Tích hợp <code>kprom</code> vào một consumer, chạy Prometheus + Grafana bằng Docker Compose và vẽ biểu đồ record/s theo topic.", "Viết goroutine trong consumer tự gọi <code>adm.Lag</code> mỗi 30 giây và log cảnh báo khi tổng lag &gt; 1 000.", "Dựng Jaeger, dùng kotel cho một producer và một consumer, xác nhận hai span nằm cùng một trace."]}, {"n": 11, "title": "Tích hợp Kafka với Gin", "sections": ["11.1. Kiến trúc", "11.2. Producer dùng chung trong Gin", "11.3. Worker chạy cùng process hay tách riêng?"], "summary": ["API ghi event lên Kafka và trả <code>202 Accepted</code>; worker xử lý bất đồng bộ; client hỏi lại trạng thái hoặc nhận thông báo.", "Một <code>*kgo.Client</code> producer dùng chung, inject vào handler; không tạo client theo request.", "Không dùng context của request cho <code>Produce</code>; gắn nó vào <code>Record.Context</code> chỉ để tracing.", "Chọn mức đảm bảo: async + log, <code>ProduceSync</code> có timeout, hoặc outbox cho event gắn với DB.", "Readiness probe dùng <code>Ping</code> với timeout ngắn; tắt theo thứ tự HTTP → Flush producer → đóng consumer."], "exercises": ["Thêm endpoint <code>GET /orders/:id</code> đọc trạng thái từ một map trong bộ nhớ được worker cập nhật khi xử lý event.", "Đổi <code>PlaceOrder</code> sang <code>ProduceSync</code> với timeout 3 giây; trả 503 kèm <code>Retry-After</code> khi Kafka lỗi; viết test bằng <code>httptest</code> + kfake.", "Viết middleware Gin gắn <code>X-Request-ID</code> vào context và vào header <code>request-id</code> của mọi record được produce trong request.", "Tách worker ra binary riêng (<code>cmd/worker</code>) dùng chung package <code>internal/events</code> với API."]}, {"n": 12, "title": "Hiệu năng và tinh chỉnh", "sections": ["12.1. Thông lượng và độ trễ: đánh đổi cốt lõi", "12.2. Đo thông lượng producer", "12.3. Các núm vặn của franz-go", "12.4. Số partition và số consumer"], "summary": ["Thông lượng và độ trễ là đánh đổi: linger + nén + batch lớn tăng thông lượng, tăng độ trễ.", "Đo bằng chương trình benchmark trên môi trường gần production, hoặc công cụ perf-test của Kafka.", "Núm vặn chính: linger, compression, buffered records/bytes cho producer; fetch bytes/min/wait, concurrent fetches cho consumer.", "Nút thắt thường ở ứng dụng: xử lý theo lô, song song theo partition, ghi DB hàng loạt, giảm cấp phát; dùng pprof để tìm.", "Số consumer hữu ích tối đa bằng số partition; thiết kế số partition dư cho tăng trưởng."], "exercises": ["Chạy chương trình benchmark với Kafka thật trong Docker, so sánh với kết quả trên cụm giả lập.", "Viết consumer ghi vào PostgreSQL theo lô 500 record bằng <code>pgx.CopyFrom</code>, so sánh với ghi từng record.", "Dùng <code>go tool pprof</code> để tìm hàm tốn CPU nhất của một consumer giải mã JSON; thử thay bằng <code>encoding/json/v2</code> (Go 1.27) và đo lại.", "Tính số partition cần cho topic nhận 50 MB/s, mỗi consumer xử lý được 4 MB/s, mỗi partition ghi được 10 MB/s."]}, {"n": 13, "title": "Các thư viện khác: segmentio/kafka-go và confluent-kafka-go", "sections": ["13.1. segmentio/kafka-go", "13.2. confluent-kafka-go", "13.3. Bảng đối chiếu nhanh"], "summary": ["segmentio/kafka-go: API <code>Writer</code>/<code>Reader</code> đơn giản; chú ý balancer băm khác Java (dùng <code>Murmur2Balancer</code>) và <code>ReadMessage</code> tự commit.", "confluent-kafka-go: bọc librdkafka (cgo), cấu hình giống hệt Java, ổn định, hỗ trợ transaction và KIP-848.", "franz-go: thuần Go, đầy đủ tính năng nhất (share group, kadm, kfake) — lựa chọn mặc định của tài liệu.", "Khi nhiều ngôn ngữ cùng ghi một topic, đảm bảo cùng thuật toán chọn partition để giữ thứ tự theo key."], "exercises": ["Viết lại producer và consumer ở Chương 2–3 bằng segmentio/kafka-go; so sánh số dòng code và hành vi commit.", "Kiểm chứng: ghi cùng key bằng <code>kafka.Hash{}</code> của segmentio và bằng franz-go vào topic 6 partition, so sánh partition nhận được.", "Build một chương trình confluent-kafka-go thành image Docker; so sánh kích thước image và thời gian build với bản franz-go.", "Lập bảng tiêu chí (tính năng, hiệu năng, độ phức tạp, hỗ trợ) để chọn thư viện cho một dự án mới trong công ty bạn."]}, {"n": 14, "title": "Dự án mẫu: hệ thống xử lý đơn hàng hướng sự kiện", "sections": ["14.1. Kiến trúc tổng thể", "14.2. Event dùng chung", "14.3. Gói kafkax: cấu hình chuẩn và vòng lặp xử lý", "14.4. order-api", "14.5. payment-worker", "14.6. notification-worker", "14.7. Kiểm thử", "14.8. Đóng gói và chạy", "14.9. Hướng mở rộng"], "summary": ["Ba dịch vụ độc lập giao tiếp qua topic <code>orders</code> và <code>payments</code>, key = <code>order_id</code> để giữ thứ tự theo đơn hàng.", "Gói <code>kafkax</code> chuẩn hoá cấu hình và vòng lặp xử lý (retry + DLQ + commit sau xử lý) cho mọi consumer.", "API dùng <code>ProduceSync</code> có timeout trên context tách khỏi request, trả 202 hoặc 503; đọc trạng thái từ read model dựng từ event.", "Payment-worker idempotent hai lớp: dedup theo event ID và idempotency key với cổng thanh toán.", "Test đầu-cuối với kfake kiểm tra cả bản trùng và poison pill; Docker Compose chạy toàn hệ thống; graceful shutdown cho mọi dịch vụ."], "exercises": ["Thay <code>MemoryDeduper</code> bằng cài đặt PostgreSQL và chạy 2 replica payment-worker; chứng minh không thu tiền trùng khi kill một replica giữa chừng.", "Thêm topic <code>orders.retry.1m</code> và cho <code>FakeGateway</code> thỉnh thoảng trả lỗi tạm thời kéo dài 30 giây.", "Thêm endpoint <code>POST /api/v1/orders/:id/cancel</code> phát event <code>order.cancelled</code>; payment-worker hoàn tiền nếu đơn đã thanh toán.", "Viết công cụ <code>dlq-replay</code> cho <code>orders.dlq</code> (Chương 5) và thêm vào Makefile.", "Triển khai hệ thống lên Kubernetes với 3 broker Kafka (Strimzi) — tham khảo Phần 3."]}]}, {"id": "p3", "name": "Kiến trúc hướng sự kiện & Vận hành Kafka", "short": "Kiến trúc & vận hành", "chapters": [{"n": 1, "title": "Kiến trúc hướng sự kiện (Event-Driven Architecture)", "sections": ["1.1. Từ request/response đến sự kiện", "1.2. Event, Command và Message", "1.3. Ba kiểu sử dụng sự kiện", "1.4. CQRS — tách ghi và đọc", "1.5. Choreography và Orchestration", "1.6. Saga — giao dịch phân tán", "1.7. Khi nào KHÔNG nên dùng Kafka"], "summary": ["Event-driven giảm liên kết thời gian và liên kết hiểu biết giữa các service, đổi lại là nhất quán cuối cùng và khó gỡ lỗi hơn.", "Event là sự thật đã xảy ra (thì quá khứ, bên phát sở hữu schema); command là yêu cầu cho đúng một bên xử lý.", "Ba kiểu: event notification (payload nhỏ, gọi lại), event-carried state transfer (payload đầy đủ, bên nhận tự chủ), event sourcing (chuỗi sự kiện là nguồn sự thật).", "CQRS tách mô hình ghi và đọc; Kafka nối hai phía, read model luôn trễ một chút.", "Choreography phân tán và lỏng; orchestration tập trung và dễ nhìn toàn cảnh. Saga dùng giao dịch bù trừ thay cho transaction phân tán; mọi bước phải idempotent.", "Không dùng Kafka cho hệ thống nhỏ, nhu cầu đồng bộ, truy vấn tuỳ ý hay dữ liệu blob lớn."], "exercises": ["Liệt kê 10 sự kiện nghiệp vụ của một ứng dụng đặt đồ ăn (đặt tên thì quá khứ), phân loại đâu là event, đâu là command.", "Viết payload JSON cho sự kiện <code>OrderPlaced</code> theo hai kiểu: event notification và event-carried state transfer. Nêu ưu, nhược điểm của từng kiểu trong ngữ cảnh đó.", "Mở rộng chương trình event sourcing: thêm sự kiện <code>Closed</code>, cấm rút tiền vượt số dư (trả lỗi trong hàm xử lý command, không phải trong <code>Apply</code>).", "Vẽ luồng saga đặt vé máy bay + khách sạn theo cả choreography và orchestration; chỉ rõ các giao dịch bù trừ.", "Thêm vào chương trình saga một bước \"Giao hàng\" có thể thất bại; kiểm tra rằng bù trừ diễn ra đúng thứ tự ngược."]}, {"n": 2, "title": "Các mẫu thiết kế tích hợp với Kafka", "sections": ["2.1. Bài toán \"dual write\"", "2.2. Transactional Outbox", "2.3. Idempotent consumer và mẫu Inbox", "2.4. CDC với Debezium", "2.5. Envelope, phiên bản sự kiện và CloudEvents", "2.6. Thứ tự sự kiện và chọn khoá phân vùng", "2.7. Compacted topic như một \"bảng\"", "2.8. Request-reply qua Kafka"], "summary": ["\"Dual write\" (ghi DB rồi gửi Kafka) luôn có thể lệch; giải pháp chuẩn là <strong>transactional outbox</strong> + relay (polling hoặc CDC).", "Kafka giao at-least-once: consumer phải <strong>idempotent</strong> — bảng <code>processed_events</code> cùng transaction, thao tác tự nhiên idempotent hoặc so sánh version. Sinh <code>event-id</code> tại nguồn.", "<strong>CDC với Debezium</strong> biến WAL thành sự kiện; dùng trên bảng outbox với Outbox Event Router để không lộ cấu trúc bảng; giám sát replication slot.", "Dùng envelope chuẩn (CloudEvents) với <code>id</code>, <code>type</code> có phiên bản, <code>source</code>, <code>time</code>; thay đổi phá vỡ thì tạo type/topic mới và phát song song.", "Thứ tự chỉ có trong partition: sự kiện cần đúng thứ tự phải cùng key; giữa các topic không có thứ tự — consumer phải chịu được.", "Compacted topic hoạt động như bảng key-value; tombstone xoá key. Request-reply qua Kafka làm được nhưng nên hạn chế."], "exercises": ["Viết schema SQL và hàm Go <code>PlaceOrder(ctx, tx, order)</code> ghi bảng <code>orders</code> và <code>outbox</code> trong cùng một transaction (<code>database/sql</code>).", "Mở rộng chương trình relay: giả lập Kafka lỗi ở lần gửi đầu (trả lỗi), chứng minh sự kiện không bị mất và được gửi ở lần sau.", "Viết consumer idempotent dùng PostgreSQL với bảng <code>processed_events</code> và <code>INSERT ... ON CONFLICT DO NOTHING</code>.", "Thiết kế envelope CloudEvents (binary mode — dùng header) cho 3 sự kiện của hệ thống đặt vé; viết hàm Go chuyển <code>kgo.Record</code> thành struct envelope.", "Dùng compacted topic để lưu bảng tỉ giá ngoại tệ; viết service đọc topic khi khởi động để dựng cache trong bộ nhớ, rồi tiếp tục cập nhật cache theo thời gian thực."]}, {"n": 3, "title": "Kafka Connect — tích hợp dữ liệu không cần viết code", "sections": ["3.1. Kiến trúc: worker, connector, task", "3.2. Standalone và Distributed", "3.3. Các connector phổ biến", "3.4. Converter: định dạng dữ liệu trong Kafka", "3.5. SMT — Single Message Transforms", "3.6. REST API của Kafka Connect", "3.7. Xử lý lỗi và Dead Letter Queue", "3.8. Ví dụ hoàn chỉnh: PostgreSQL → Debezium → Kafka → OpenSearch", "3.9. Vận hành Kafka Connect"], "summary": ["Kafka Connect di chuyển dữ liệu giữa Kafka và hệ thống ngoài bằng cấu hình: worker chạy connector, connector chia việc thành task.", "Production dùng chế độ <strong>distributed</strong>: trạng thái lưu trong 3 topic nội bộ, quản lý qua REST API cổng 8083, tự chịu lỗi.", "Converter quyết định định dạng byte trong topic; dùng Avro/Protobuf + Schema Registry để gọn và an toàn.", "SMT cho biến đổi nhẹ từng bản ghi (định tuyến, che dữ liệu, lọc với predicate); logic nặng thì dùng stream processing.", "Bật DLQ (<code>errors.tolerance=all</code> + <code>errors.deadletterqueue.*</code>) cho sink connector và giám sát nó.", "Debezium + PostgreSQL (<code>wal_level=logical</code>) là cách phổ biến nhất để đưa thay đổi dữ liệu vào Kafka."], "exercises": ["Chạy docker compose ở trên, tạo connector Debezium, thực hiện INSERT/UPDATE/DELETE và quan sát sự kiện (chú ý tombstone khi DELETE).", "Thêm SMT <code>RegexRouter</code> để đổi tên topic <code>shop.public.customers</code> thành <code>cdc.customers</code>; kiểm tra bằng console consumer.", "Cấu hình một sink connector với DLQ; cố ý gửi bản ghi JSON sai định dạng và đọc header <code>__connect.errors.*</code> trong DLQ.", "Viết script bash dùng REST API: liệt kê mọi connector có task FAILED và khởi động lại chỉ các task đó.", "So sánh: viết một consumer Go đẩy dữ liệu từ Kafka sang OpenSearch, liệt kê những gì bạn phải tự xử lý mà Kafka Connect đã làm sẵn."]}, {"n": 4, "title": "Quản lý schema và data contracts", "sections": ["4.1. Vì sao cần schema?", "4.2. Wire format", "4.3. Subject và chiến lược đặt tên", "4.4. Các chế độ tương thích", "4.5. Quy tắc tiến hoá theo định dạng", "4.6. Làm việc với Schema Registry qua REST API", "4.7. Data contracts và quản trị dữ liệu"], "summary": ["Kafka không kiểm tra nội dung; Schema Registry lưu schema có phiên bản và kiểm tra tương thích.", "Wire format: magic byte <code>0x00</code> + schema ID 4 byte + payload; franz-go có <code>sr.Serde</code> để mã hoá/giải mã.", "Subject đặt theo topic (mặc định), theo record hoặc kết hợp; chọn theo việc một topic có nhiều loại sự kiện hay không.", "BACKWARD = nâng cấp consumer trước; FORWARD = nâng cấp producer trước; FULL = cả hai; dùng bản TRANSITIVE vì dữ liệu cũ còn trong topic.", "Avro: trường mới cần default; Protobuf: không tái sử dụng field number, dùng <code>reserved</code>.", "Data contract gồm cả owner, ngữ nghĩa, ràng buộc chất lượng, SLA, phân loại PII; kiểm tra tương thích trong CI và tắt auto-register."], "exercises": ["Viết schema Avro v1 cho sự kiện <code>PaymentCompleted</code>, rồi 4 thay đổi v2 khác nhau; với mỗi thay đổi, xác định nó tương thích với BACKWARD, FORWARD, FULL hay không.", "Chuyển schema trên sang Protobuf; minh hoạ việc xoá một trường đúng cách bằng <code>reserved</code>.", "Mở rộng chương trình <code>sr.Serde</code>: thêm V3 xoá trường <code>total</code> và chứng minh consumer V1 đọc dữ liệu V3 sẽ nhận giá trị 0 (vì sao đây là lỗi ngữ nghĩa nguy hiểm?).", "Viết bước CI (bash) gọi endpoint <code>/compatibility</code> cho mọi file <code>.avsc</code> trong thư mục <code>schemas/</code> và làm build thất bại nếu không tương thích.", "Soạn một data contract (dạng YAML) cho topic <code>orders.placed</code>: owner, schema, ràng buộc, SLA, PII, chính sách thay đổi."]}, {"n": 5, "title": "Stream processing — xử lý luồng sự kiện", "sections": ["5.1. Stateless và stateful", "5.2. Thời gian trong stream processing", "5.3. Các loại cửa sổ (window)", "5.4. Các kiểu join", "5.5. Ví dụ Go: đếm theo cửa sổ tumbling bằng event time", "5.6. Kafka Streams", "5.7. Apache Flink và ksqlDB", "5.8. Lựa chọn cho đội phát triển bằng Go"], "summary": ["Stateless (filter, map) dễ; stateful (aggregate, window, join) cần state store chịu lỗi — Kafka Streams dùng RocksDB + changelog topic.", "Tính theo <strong>event time</strong>; watermark và grace period quyết định khi nào đóng cửa sổ và cách xử lý sự kiện muộn.", "Cửa sổ: tumbling, hopping, session, sliding. Join: stream–stream (có cửa sổ), stream–table, table–table, global table; cần co-partitioning.", "Kafka Streams là thư viện Java; Streams Rebalance Protocol production-ready từ 4.2, static membership từ 4.4.", "Flink mạnh cho trạng thái lớn và đa nguồn, có Flink SQL; ksqlDB cho SQL trên Kafka.", "Đội Go: consumer tự viết, goka, Redpanda Connect, Flink SQL, hoặc đổ vào kho phân tích thời gian thực."], "exercises": ["Sửa ví dụ Go thành cửa sổ <strong>hopping</strong> (size 2 phút, advance 1 phút); mỗi sự kiện thuộc mấy cửa sổ?", "Mở rộng ví dụ để phát kết quả mỗi cửa sổ ra topic <code>page.views.1m</code> <strong>khi cửa sổ đóng</strong> (watermark vượt quá end + grace).", "Viết consumer Go phát hiện \"hơn 3 lần đăng nhập thất bại của cùng tài khoản trong 5 phút\" và phát sự kiện <code>SuspiciousLogin</code>.", "Viết lại ứng dụng doanh thu Java bằng Flink SQL với cửa sổ hopping 10 phút, advance 1 phút.", "So sánh chi phí vận hành của ba phương án cho bài toán \"dashboard doanh thu thời gian thực\": Kafka Streams, Flink, ClickHouse đọc từ Kafka."]}, {"n": 6, "title": "Bảo mật Kafka", "sections": ["6.1. Listener và advertised.listeners", "6.2. Mã hoá với TLS và mTLS", "6.3. Xác thực với SASL", "6.4. Phân quyền với ACL", "6.5. Quota", "6.6. Mã hoá dữ liệu và bảo vệ dữ liệu cá nhân", "6.7. Multi-tenancy", "6.8. Client Go kết nối cụm có TLS và SASL/SCRAM"], "summary": ["Mặc định Kafka không bảo mật; production dùng <code>SASL_SSL</code> trên mọi listener; cấu hình <code>advertised.listeners</code> đúng cho từng góc nhìn mạng.", "TLS mã hoá đường truyền, mTLS xác thực bằng chứng chỉ; SASL có PLAIN, SCRAM (phổ biến nhất), OAUTHBEARER (SSO), GSSAPI.", "Từ Kafka 4.4, OAUTHBEARER với JWKS bắt buộc <code>expected.audience</code> và <code>expected.issuer</code>.", "Phân quyền bằng <code>StandardAuthorizer</code> + ACL; dùng ACL prefixed theo quy ước tên topic; nguyên tắc đặc quyền tối thiểu.", "Quota (byte rate, request percentage) chống client tham lam; broker throttle thay vì báo lỗi.", "Mã hoá at-rest bằng ổ đĩa; dữ liệu nhạy cảm nên mã hoá cấp trường; multi-tenancy dựa trên tiền tố, ACL, quota và GitOps."], "exercises": ["Dựng cụm Kafka 1 node với listener <code>SASL_PLAINTEXT</code> + SCRAM bằng Docker; tạo user <code>order-svc</code> và thử kết nối bằng client Go ở trên (bỏ TLS).", "Viết bộ ACL tối thiểu cho 3 service: order (ghi <code>orders.*</code>), payment (đọc <code>orders.*</code>, ghi <code>payments.*</code> có transaction), notification (đọc <code>orders.*</code> và <code>payments.*</code>).", "Đặt quota 1 MB/s cho một user và chạy producer perf test để quan sát throttle.", "Viết hàm Go mã hoá trường <code>phone</code> bằng AES-GCM trước khi gửi và giải mã ở consumer; khoá lấy từ biến môi trường.", "Liệt kê các bước nâng cấp an toàn một cụm đang dùng OAUTHBEARER lên Kafka 4.4."]}, {"n": 7, "title": "Giám sát và observability", "sections": ["7.1. Bốn tầng cần giám sát", "7.2. Metric then chốt của broker và controller", "7.3. Metric phía client", "7.4. JMX → Prometheus → Grafana", "7.5. Consumer lag", "7.6. Logging và tracing"], "summary": ["Giám sát 4 tầng: hạ tầng, broker/controller, client, nghiệp vụ.", "Báo động khẩn cấp: <code>OfflinePartitionsCount &gt; 0</code>, <code>UnderMinIsrPartitionCount &gt; 0</code>, tổng <code>ActiveControllerCount != 1</code>; cảnh báo: under-replicated, đĩa, lag, độ trễ request, idle của luồng mạng/IO.", "JMX Exporter (Java agent) → Prometheus → Grafana + Alertmanager là cấu hình phổ biến.", "Consumer lag = log end offset − committed offset; quan trọng là <strong>xu hướng</strong>; tính bằng <code>kafka-consumer-groups.sh</code>, exporter chuyên dụng hoặc <code>kadm.Lag</code> trong Go.", "Truyền trace context và correlation ID qua header để truy vết xuyên service."], "exercises": ["Dựng Prometheus + Grafana + JMX Exporter cho cụm Kafka Docker; tạo dashboard có 5 panel: under-replicated, offline partitions, bytes in/out, p99 produce latency, lag theo group.", "Tắt một broker trong cụm 3 node (RF=3, min ISR=2) và quan sát metric nào thay đổi; tắt thêm broker thứ hai và quan sát producer <code>acks=all</code>.", "Viết một HTTP endpoint <code>/healthz/lag</code> bằng Go (Gin) trả về 503 nếu tổng lag của group vượt ngưỡng, dùng <code>kadm.Lag</code>.", "Mở rộng chương trình lag để tính <strong>lag theo thời gian</strong>: đọc timestamp của bản ghi tại offset đã commit và so với hiện tại.", "Viết thêm 3 luật cảnh báo Prometheus cho: tỉ lệ request handler idle thấp, ISR dao động, số bản ghi vào DLQ tăng."]}, {"n": 8, "title": "Hoạch định dung lượng và tối ưu hiệu năng", "sections": ["8.1. Ước lượng thông lượng và dung lượng", "8.2. Chọn số partition", "8.3. Phần cứng và hệ điều hành", "8.4. Cấu hình broker ảnh hưởng hiệu năng", "8.5. Tối ưu producer và consumer", "8.6. Đo đạc với công cụ perf test"], "summary": ["Ước lượng từ msg/s cao điểm × kích thước: ghi vào, ghi đĩa (× RF), đọc ra (× fan-out), lưu trữ (× retention × RF × dự phòng).", "Số partition dựa trên thông lượng mục tiêu chia thông lượng một consumer; chọn dư vì tăng sau gây xáo trộn key; tránh quá nhiều partition nhỏ.", "Kafka dựa vào page cache: heap nhỏ, nhiều RAM cho OS; mạng thường là nút cổ chai; tinh chỉnh ulimit, <code>vm.max_map_count</code>, swappiness.", "Tinh chỉnh broker theo metric idle (<code>num.network.threads</code>, <code>num.io.threads</code>), producer theo batch/linger/nén, consumer theo fetch.", "Luôn đo bằng <code>kafka-producer-perf-test.sh</code>, <code>kafka-consumer-perf-test.sh</code>, <code>kafka-e2e-latency.sh</code>; thay một tham số mỗi lần."], "exercises": ["Dùng chương trình Go ở trên để tính kế hoạch cho hệ thống log: 200 000 msg/s, 300 byte, RF 2, 2 consumer group, retention 3 ngày.", "Chạy perf test producer với 4 cấu hình (<code>acks=1/all</code> × không nén/zstd) và lập bảng so sánh throughput, p99 latency.", "Đo ảnh hưởng của <code>linger.ms</code> (0, 5, 20, 100) tới throughput và latency; vẽ biểu đồ.", "Tính số partition cần cho topic <code>orders</code> nếu mục tiêu 30 000 msg/s và mỗi consumer Go xử lý được 1 500 msg/s; giải thích vì sao bạn chọn số đó.", "Viết checklist tinh chỉnh hệ điều hành cho một máy broker mới (10 mục) và cách kiểm tra từng mục."]}, {"n": 9, "title": "Vận hành cụm Kafka", "sections": ["9.1. Rolling restart an toàn", "9.2. Nâng cấp phiên bản và metadata.version", "9.3. Thêm và bớt broker, reassignment", "9.4. Rack awareness", "9.5. Quản lý controller quorum (KRaft)", "9.6. Tiered storage", "9.7. MirrorMaker 2 và nhiều tru ition, <code>__transaction_state</code>, <code>__consumer_offsets</code>.", "Chuẩn bị một \"câu chuyện sự cố\" theo cấu trúc STAR (Situation, Task, Action, Result) dựa trên một tình huống ở Chương 11.", "Soạn thêm 5 câu hỏi nâng cao về chủ đề bạn thấy khó nhất và tự tìm câu trả lời trong tài liệu chính thức."]}, {"n": 13, "title": "Case study: nền tảng sự kiện cho sàn thương mại điện tử", "sections": ["13.1. Yêu cầu", "13.2. Miền nghiệp vụ và dịch vụ", "13.3. Danh mục topic", "13.4. Ước lượng dung lượng", "13.5. Luồng saga đặt hàng", "13.6. Xử lý lỗi, retry và DLQ", "13.7. Bảo mật và tuân thủ", "13.8. Giám sát và vận hành", "13.9. Lộ trình triển khai"], "summary": ["Thiết kế bắt đầu từ yêu cầu nghiệp vụ và phi chức năng (thông lượng cao điểm, độ trễ, mức chịu mất dữ liệu, tuân thủ).", "Topic theo miền, key là ID thực thể, partition theo bội số dễ chia, RF=3/min ISR=2, retention theo nhu cầu, compacted cho dữ liệu dạng bảng.", "Outbox + consumer idempotent cho mọi service; saga orchestration cho đặt hàng, choreography cho tác vụ phụ.", "Ước lượng dung lượng cho từng topic → số broker, AZ, tiered storage.", "Phân loại lỗi tạm thời/vĩnh viễn/nghiệp vụ; retry topic và DLQ có quy trình phát lại.", "Bảo mật theo miền, mã hoá PII, GitOps; giám sát cả cụm lẫn SLO nghiệp vụ; triển khai theo lát cắt."], "exercises": ["Bổ sung miền \"Khuyến mãi\" (voucher, điểm thưởng) vào thiết kế: sự kiện, topic, key, ai phát ai nhận.", "Viết schema Avro cho <code>OrderPlaced</code>, <code>StockReserved</code>, <code>PaymentCompleted</code> và chọn chiến lược subject.", "Chạy lại chương trình ước lượng với giả định ngày sale gấp đôi (6 000 đơn/giây) và clickstream 120 000 sự kiện/giây; cần bao nhiêu broker?", "Thiết kế bảng <code>order_sagas</code> và viết hàm Go xử lý sự kiện <code>PaymentFailed</code> (cập nhật trạng thái + ghi outbox <code>OrderCancelled</code> trong cùng transaction).", "Viết kịch bản diễn tập \"mất một AZ\" cho cụm 6 broker trên 3 AZ: kỳ vọng metric nào thay đổi, client let state = {};
function load() { if (!PERSIST) return; try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; } }
function save() { if (!PERSIST) return; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
load();

const ids = (p, c) => [...c.sections.map((_, i) => `${p.id}-c${c.n}-s${i}`), ...c.exercises.map((_, i) => `${p.id}-c${c.n}-e${i}`)];
const count = list => ({ done: list.filter(id => state[id]).length, total: list.length });
const partIds = p => p.chapters.flatMap(c => ids(p, c));
const allIds = () => DATA.flatMap(partIds);
const pct = ({ done, total }) => total ? Math.round(done * 100 / total) : 0;
const setBar = (el, c) => { el.querySelector('i').style.width = pct(c) + '%'; el.classList.toggle('full', c.total > 0 && c.done === c.total); };
const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

function updateOverall() {
  const c = count(allIds());
  setBar(document.getElementById('ovBar'), c);
  document.getElementById('ovTxt').textContent = `${c.done}/${c.total}`;
}

let filter = { q: '', hideDone: false };

function highlight(html, q) {
  if (!q) return html;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return html.split(/(<[^>]+>)/).map(seg => seg.startsWith('<') ? seg : seg.replace(re, '<mark>$1</mark>')).join('');
}
const plain = h => h.replace(/<[^>]+>/g, '').toLowerCase();

function renderPart(p) {
  const app = document.getElementById('app');
  const idx = DATA.indexOf(p) + 1;
  const firstOpen = p.chapters.find(c => { const k = count(ids(p, c)); return k.done < k.total; });
  app.innerHTML = `
  <div class="part-head">
    <div><div class="eyebrow">Phần ${idx} / 3 · ${p.chapters.length} chương</div>
    <h1 class="view-title">${esc(p.name)}</h1></div>
    <div class="part-stats"><div class="bar" id="pBar"><i></i></div><span id="pTxt"></span></div>
    <div class="toolbar">
      <label for="q" style="position:absolute;left:-9999px">Tìm trong phần này</label>
      <input type="search" id="q" placeholder="Tìm: ISR, offset, rebalance, transaction…" value="${esc(filter.q)}">
      <button class="btn" id="hideDone" aria-pressed="${filter.hideDone}">Ẩn mục đã xong</button>
      <button class="btn" id="openAll">Mở tất cả</button>
      <button class="btn" id="closeAll">Thu gọn</button>
    </div>
  </div>
  <div class="layout">
    <aside class="toc" aria-label="Danh sách chương">${p.chapters.map(c => `
      <a href="#${p.id}" data-jump="${p.id}-c${c.n}" id="toc-${p.id}-c${c.n}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="f"></span></a>`).join('')}
    </aside>
    <div class="chapters ${filter.hideDone ? 'hide-done' : ''}" id="chs"></div>
  </div>`;
  const chs = document.getElementById('chs');
  const q = filter.q.trim().toLowerCase();
  let shown = 0;
  p.chapters.forEach(c => {
    const hay = plain([c.title, ...c.sections, ...c.summary, ...c.exercises].join(' '));
    if (q && !hay.includes(q)) return;
    shown++;
    const open = q ? true : (c === firstOpen);
    const sec = c.sections.map((s, i) => item(`${p.id}-c${c.n}-s${i}`, s, false, q)).join('');
    const ex = c.exercises.map((s, i) => item(`${p.id}-c${c.n}-e${i}`, s, i + 1, q)).join('');
    const d = document.createElement('details');
    d.className = 'ch'; d.id = `${p.id}-c${c.n}`; d.open = open;
    d.innerHTML = `
      <summary><span class="chnum">Chương ${c.n}</span><span class="chtitle">${highlight(esc(c.title), q)}</span>
        <span class="chmeta"><span class="bar"><i></i></span><span class="frac"></span><span class="chev" aria-hidden="true">›</span></span></summary>
      <div class="chbody">
        <div class="col"><h3>Kiến thức cốt lõi</h3><ul class="know">${c.summary.map(s => `<li>${highlight(s, q)}</li>`).join('')}</ul></div>
        <div class="col">
          <h3><span>Cần nắm</span><button class="linkbtn" data-all="${p.id}-c${c.n}">Đánh dấu cả chương</button></h3>
          <ul class="checks">${sec}</ul>
          <h3 class="sp"><span>Bài tập thực hành</span></h3>
          <ul class="checks">${ex}</ul>
        </div>
      </div>`;
    chs.appendChild(d);
  });
  if (!shown) chs.innerHTML = `<div class="empty">Không có chương nào chứa “${esc(filter.q)}”. Thử từ khoá khác, ví dụ <code>ISR</code> hoặc <code>outbox</code>.</div>`;
  refreshPart(p);

  document.getElementById('q').addEventListener('input', e => {
    filter.q = e.target.value; const pos = e.target.selectionStart;
    renderPart(p); const inp = document.getElementById('q'); inp.focus(); inp.setSelectionRange(pos, pos);
  });
  document.getElementById('hideDone').onclick = () => { filter.hideDone = !filter.hideDone; renderPart(p); };
  document.getElementById('openAll').onclick = () => chs.querySelectorAll('details').forEach(d => d.open = true);
  document.getElementById('closeAll').onclick = () => chs.querySelectorAll('details').forEach(d => d.open = false);
  app.querySelectorAll('[data-jump]').forEach(a => a.onclick = e => {
    e.preventDefault(); const t = document.getElementById(a.dataset.jump);
    if (t) { t.open = true; t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  chs.addEventListener('change', e => {
    if (e.target.matches('input[type=checkbox]')) {
      const id = e.target.dataset.id;
      if (e.target.checked) state[id] = 1; else delete state[id];
      e.target.closest('li').classList.toggle('is-done', e.target.checked);
      save(); refreshPart(p);
    }
  });
  chs.addEventListener('click', e => {
    const b = e.target.closest('[data-all]'); if (!b) return;
    e.preventDefault();
    const c = p.chapters.find(x => `${p.id}-c${x.n}` === b.dataset.all);
    const list = ids(p, c); const allDone = list.every(id => state[id]);
    list.forEach(id => { if (allDone) delete state[id]; else state[id] = 1; });
    save(); renderPart(p); const t = document.getElementById(b.dataset.all); if (t) t.open = true;
  });
}

function item(id, html, exNo, q) {
  const on = !!state[id];
  return `<li class="${on ? 'is-done' : ''}"><label><input type="checkbox" id="cb-${id}" data-id="${id}" ${on ? 'checked' : ''}><span>${exNo ? `<span class="ex-tag">BT${exNo}</span>` : ''}${highlight(html, q)}</span></label></li>`;
}

function refreshPart(p) {
  const c = count(partIds(p));
  setBar(document.getElementById('pBar'), c);
  document.getElementById('pTxt').textContent = `${c.done}/${c.total} mục · ${pct(c)}%`;
  p.chapters.forEach(ch => {
    const k = count(ids(p, ch)); const complete = k.done === k.total;
    const d = document.getElementById(`${p.id}-c${ch.n}`);
    if (d) { setBar(d.querySelector('.chmeta .bar'), k); d.querySelector('.frac').textContent = `${k.done}/${k.total}`; d.classList.toggle('complete', complete); }
    const t = document.getElementById(`toc-${p.id}-c${ch.n}`);
    if (t) { t.querySelector('.f').textContent = complete ? '✓' : `${k.done}/${k.total}`; t.classList.toggle('complete', complete); }
    const b = d && d.querySelector('[data-all]'); if (b) b.textContent = complete ? 'Bỏ đánh dấu chương' : 'Đánh dấu cả chương';
  });
  updateOverall();
}

function renderRoadmap() {
  const app = document.getElementById('app');
  const partCards = DATA.map((p, i) => { const c = count(partIds(p)); return `
    <a class="psum" href="#${p.id}"><span class="k">Phần ${i + 1}</span><span class="nm">${esc(p.name)}</span>
      <div class="bar ${c.done === c.total ? 'full' : ''}"><i style="width:${pct(c)}%"></i></div>
      <span class="num">${c.done}/${c.total} mục · ${p.chapters.length} chương</span></a>`; }).join('');
  const weeks = WEEKS.map((w, i) => {
    const list = w.sets.flatMap(([pid, chs]) => { const p = DATA.find(x => x.id === pid); return chs.flatMap(n => ids(p, p.chapters.find(c => c.n === n))); });
    const c = count(list); const done = c.done === c.total;
    const rng = w.sets.map(([pid, chs]) => `Phần ${pid.slice(1)}, chương ${chs.length > 1 ? chs[0] + '–' + chs[chs.length - 1] : chs[0]}`).join(' + ');
    return `<li class="${done ? 'wdone' : ''}"><span class="wk">Tuần ${i + 1}</span>
      <div><div class="wk-t">${esc(w.t)}</div><div class="wk-d">${rng} · ${esc(w.d)}</div></div>
      <div class="wk-p"><div class="bar ${done ? 'full' : ''}"><i style="width:${pct(c)}%"></i></div><span>${done ? 'Xong' : pct(c) + '%'}</span></div></li>`;
  }).join('');
  app.innerHTML = `
    <div class="eyebrow">Sổ tay học · 3 phần · ${DATA.reduce((a, p) => a + p.chapters.length, 0)} chương</div>
    <h1 class="view-title">Từ commit log đến hệ thống hướng sự kiện</h1>
    <p class="lede">Mỗi chương có phần kiến thức cốt lõi rút từ mục “Tóm tắt chương” của tài liệu, danh sách mục cần nắm theo đúng số mục trong file Word và bài tập cuối chương. Đánh dấu khi bạn đã hiểu và tự viết lại được code của mục đó.</p>
    <div class="parts-sum">${partCards}</div>
    <h2 class="sec">Lộ trình 8 tuần</h2>
    <ol class="weeks">${weeks}</ol>
    <h2 class="sec">Sao lưu tiến độ</h2>
    <div class="backup">
      <div class="card"><p>${PERSIST ? 'Tiến độ được lưu trong trình duyệt này. Sao chép mã dưới đây để chuyển sang máy khác.' : 'Bản file này không tự lưu. Trước khi đóng trang, sao chép mã tiến độ và dán lại ở lần mở sau.'}</p>
        <textarea id="exportBox" readonly aria-label="Mã tiến độ"></textarea>
        <div class="row"><button class="btn" id="copyBtn">Sao chép mã</button><span class="status" id="copySt"></span></div></div>
      <div class="card"><p>Dán mã tiến độ đã sao chép rồi bấm Khôi phục. Tiến độ hiện tại sẽ được thay thế.</p>
        <textarea id="importBox" aria-label="Dán mã tiến độ"></textarea>
        <div class="row"><button class="btn" id="importBtn">Khôi phục</button><button class="btn" id="resetBtn">Xoá toàn bộ tiến độ</button><span class="status" id="impSt"></span></div></div>
    </div>`;
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(Object.keys(state)))));
  const box = document.getElementById('exportBox'); box.value = code;
  document.getElementById('copyBtn').onclick = () => {
    const st = document.getElementById('copySt');
    const fallback = () => { box.focus(); box.select(); st.textContent = 'Đã chọn mã, nhấn Ctrl+C để sao chép.'; };
    try { navigator.clipboard.writeText(code).then(() => st.textContent = 'Đã sao chép.', fallback); } catch (e) { fallback(); }
  };
  document.getElementById('importBtn').onclick = () => {
    const st = document.getElementById('impSt'); st.classList.remove('err');
    try {
      const arr = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('importBox').value.trim()))));
      if (!Array.isArray(arr)) throw 0;
      const valid = new Set(allIds()); state = {}; arr.forEach(id => { if (valid.has(id)) state[id] = 1; });
      save(); updateOverall(); renderRoadmap(); document.getElementById('impSt').textContent = `Đã khôi phục ${Object.keys(state).length} mục.`;
    } catch (e) { st.classList.add('err'); st.textContent = 'Mã không hợp lệ. Hãy dán đúng toàn bộ mã đã sao chép.'; }
  };
  let armed = false;
  document.getElementById('resetBtn').onclick = e => {
    const st = document.getElementById('impSt');
    if (!armed) { armed = true; e.target.textContent = 'Bấm lần nữa để xoá'; st.classList.add('err'); st.textContent = 'Thao tác này không hoàn tác được.'; return; }
    state = {}; save(); updateOverall(); renderRoadmap(); document.getElementById('impSt').textContent = 'Đã xoá tiến độ.';
  };
  updateOverall();
}

function route() {
  const v = (location.hash || '#lo-trinh').slice(1);
  const p = DATA.find(x => x.id === v);
  document.querySelectorAll('nav.tabs a').forEach(a => a.toggleAttribute('aria-current', false));
  const tab = document.querySelector(`nav.tabs a[data-v="${p ? v : 'lo-trinh'}"]`);
  if (tab) tab.setAttribute('aria-current', 'page');
  if (p) { filter.q = ''; renderPart(p); } else renderRoadmap();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
