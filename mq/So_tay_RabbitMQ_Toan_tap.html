hBatch(ctx, msgs []amqp.Publishing) []error<\/code> cho <code>Publisher<\/code>, publish cả lô rồi chờ từng <code>DeferredConfirmation<\/code>, trả lỗi theo đúng vị trí từng message (kể cả <code>ErrUnroutable<\/code>).", "Chạy hai tiến trình <code>outbox relay<\/code> song song và tạo 200 đơn hàng. Kiểm chứng bằng truy vấn SQL và số message trong queue rằng không sự kiện nào bị gửi hai lần trong điều kiện bình thường (nhờ <code>SKIP LOCKED<\/code>).", "Thay polling bằng <code>LISTEN/NOTIFY<\/code>: tạo trigger <code>AFTER INSERT ON outbox<\/code> gọi <code>pg_notify('outbox', '')<\/code>, dùng <code>pq.NewListener<\/code> để đánh thức relay ngay khi có dòng mới, vẫn giữ polling dài (ví dụ 5 giây) làm lưới an toàn.", "Thêm cột <code>aggregate_id<\/code> (mã đơn hàng) vào outbox và thiết kế cách relay đảm bảo thứ tự sự kiện cho cùng một đơn hàng khi chạy nhiều relay (gợi ý: <code>pg_try_advisory_xact_lock(hashtext(aggregate_id))<\/code> hoặc phân vùng theo hash).", "Viết job dọn dẹp xóa các dòng outbox đã gửi quá N ngày theo từng lô 1000 dòng để không khóa bảng lâu."]}, {"id": "p2c5", "num": 5, "title": "Consume tin cậy và xử lý lỗi", "intro": "Chương 4 đảm bảo message không mất trên đường tới broker. Nửa còn lại của bài toán nằm ở consumer: xử lý lỗi thế nào để không mất message nhưng cũng không kẹt mãi một message hỏng; thử lại bao nhiêu lần, cách nhau bao lâu; làm gì khi cùng một message tới hai lần; làm sao một panic trong handler không làm sập cả worker. Chương này xây dựng lần lượt: bảng quyết định ack/nack/reject, phân loại lỗi tạm thời và vĩnh viễn, retry trễ bằng TTL + dead letter exchange (DLX) có đếm số lần thử qua header <code>x-death<\/code>, parking-lot, phục hồi panic, delivery-limit của quorum queue (kèm một hành vi dễ gây nhầm lẫn đã kiểm chứng trên RabbitMQ 4.3.7), consumer idempotent với PostgreSQL, single active consumer và consumer timeout. Lý thuyết về dead lettering và TTL có ở Phần 1, Chương 5 và Chương 7.", "sections": [{"n": "5.1", "t": "Ack, Nack, Reject: chọn đúng thao tác", "sub": ["Bảng quyết định", "Reject và Nack không tương đương với quorum queue"]}, {"n": "5.2", "t": "Phân loại lỗi", "sub": []}, {"n": "5.3", "t": "Retry trễ bằng TTL + DLX", "sub": ["Topology", "Mã nguồn", "Chạy thật", "Giới hạn của phương án một hàng chờ"]}, {"n": "5.4", "t": "Phục hồi panic trong handler", "sub": []}, {"n": "5.5", "t": "Parking-lot: vận hành", "sub": []}, {"n": "5.6", "t": "Quorum queue và delivery-limit", "sub": []}, {"n": "5.7", "t": "Consumer idempotent với PostgreSQL", "sub": ["Ý tưởng", "Mã nguồn", "Chạy thật: chết sau commit, trước ack", "Những điều cần cân nhắc"]}, {"n": "5.8", "t": "Single active consumer", "sub": []}, {"n": "5.9", "t": "Consumer timeout", "sub": ["Cơ chế", "Kết quả trên RabbitMQ 4.3.7", "Chọn giá trị timeout"]}, {"n": "5.10", "t": "Lỗi thường gặp", "sub": []}], "summary": ["Mọi delivery phải kết thúc bằng đúng một ack/nack/reject; ack chỉ sau khi hiệu ứng đã bền vững.", "Phân loại lỗi tạm thời và vĩnh viễn bằng kiểu lỗi bọc; panic được recover và coi là vĩnh viễn.", "Retry trễ không chặn consumer bằng TTL + DLX: Nack không requeue sang hàng chờ có TTL, hết hạn quay lại queue chính; đếm số lần thử bằng <code>x-death<\/code>, vượt giới hạn thì park (publish có confirm rồi ack).", "Quorum queue có delivery-limit mặc định 20 từ RabbitMQ 4.0; đã kiểm chứng trên 4.3.7 rằng <code>basic.reject<\/code> tăng <code>x-delivery-count<\/code> còn <code>basic.nack<\/code> thì không.", "Consumer idempotent: ghi <code>message_id<\/code> vào <code>processed_messages<\/code> cùng transaction với hiệu ứng nghiệp vụ; demo thật loại bỏ cả trùng do relay outbox lẫn do consumer chết trước ack.", "Single active consumer cho thứ tự với dự phòng nóng; consumer timeout mặc định 30 phút, với quorum queue có thể đặt riêng và broker hủy consumer thay vì đóng channel."], "exercises": ["Thêm vào worker <code>retry<\/code> một metric đếm số message theo từng kết quả (ok, retry, parking, panic) và in mỗi 10 giây.", "Hiện thực backoff tăng dần với ba hàng chờ <code>jobs.wait.1s<\/code>, <code>jobs.wait.5s<\/code>, <code>jobs.wait.30s<\/code>: consumer tự publish (có confirm) bản sao sang hàng chờ phù hợp với header <code>x-retry-count<\/code>, rồi ack bản gốc. So sánh ưu nhược điểm với cách đếm <code>x-death<\/code>.", "Viết lệnh <code>retry replay<\/code> đọc tối đa N message từ <code>jobs.parking<\/code> bằng <code>ch.Get<\/code>, in <code>x-error<\/code>, và publish lại vào exchange <code>jobs<\/code> với routing key <code>x-original-routing-key<\/code> (xóa các header <code>x-death<\/code>, <code>x-error<\/code>, <code>x-attempts<\/code>), ack sau khi có confirm.", "Chạy hai tiến trình <code>idempotent<\/code> song song trên cùng queue có nhiều bản trùng (dùng <code>outbox relay -crash<\/code> nhiều lần để tạo). Kiểm chứng số hóa đơn bằng số đơn hàng. Điều gì đảm bảo hai transaction cùng chèn một <code>message_id<\/code> không cùng thành công?", "Sửa <code>idempotent<\/code> để khi DB không truy cập được (tắt kết nối bằng DSN sai), consumer không reject liên tục mà tạm dừng consume (Cancel), chờ DB hồi phục với backoff, rồi consume lại.", "Đặt <code>x-delivery-limit: 5<\/code> cho <code>jobs.work<\/code> và thử thay <code>Nack(false, false)<\/code> bằng <code>Reject(true)<\/code> cho lỗi tạm thời. Quan sát thời điểm message vào DLX và giải thích vì sao retry ngay lập tức kém hơn retry trễ.", "Kết hợp SAC với consumer timeout: consumer A đang active nhưng treo (không ack). Sau khi timeout, B có được kích hoạt không? Kiểm chứng trên quorum queue với <code>x-consumer-timeout<\/code> nhỏ."]}, {"id": "p2c6", "num": 6, "title": "Kết nối lại &amp; khả năng phục hồi", "intro": "Bốn chương trước đã giả định một điều ngầm: connection tới RabbitMQ luôn sống. Thực tế production không như vậy. Broker được nâng cấp theo kiểu rolling, node bị khởi động lại, load balancer cắt kết nối nhàn rỗi, mạng chập chờn vài giây, quản trị viên đóng connection để bảo trì, hay broker chặn publisher vì sắp hết bộ nhớ. Một service Go chạy hàng tháng chắc chắn sẽ gặp tất cả những tình huống đó. Chương này trả lời câu hỏi: khi connection rớt, chương trình của bạn sẽ tự hồi phục, hay lặng lẽ \"chết lâm sàng\" — tiến trình vẫn chạy, health check vẫn xanh, nhưng không còn consume hay publish được gì?", "sections": [{"n": "6.1", "t": "Điều gì xảy ra khi connection rớt?", "sub": ["Các nguyên nhân thường gặp", "Thí nghiệm: chương trình \"ngây thơ\"", "Mất gì và còn gì sau khi connection rớt"]}, {"n": "6.2", "t": "Môi trường thí nghiệm: một node riêng để restart thoải mái", "sub": []}, {"n": "6.3", "t": "Tự phục hồi có sẵn trong amqp091-go (v1.12.0 trở lên)", "sub": ["Các kiểu dữ liệu chính", "Thí nghiệm với Recovery"]}, {"n": "6.4", "t": "Tự viết lớp phục hồi: package rmq", "sub": ["Thiết kế", "Mã nguồn đầy đủ", "Giải thích từng phần", "Kiểm thử tích hợp với broker thật"]}, {"n": "6.5", "t": "Thí nghiệm thật: producer và consumer vượt qua sự cố", "sub": ["Producer có health check", "Consumer phát hiện trùng lặp và thiếu hụt", "Kịch bản và log thật"]}, {"n": "6.6", "t": "Xử lý connection.blocked", "sub": []}, {"n": "6.7", "t": "Health check và quan sát", "sub": []}, {"n": "6.8", "t": "So sánh: Recovery có sẵn và wrapper tự viết", "sub": []}, {"n": "6.9", "t": "Lỗi thường gặp", "sub": []}], "summary": ["Connection sẽ rớt: restart node, nâng cấp, mạng, load balancer, quản trị viên. Memory/disk alarm không làm rớt mà <i>chặn<\/i> connection publish; lỗi cấp channel chỉ đóng channel.", "Không có xử lý, consumer chết im lặng (kênh <code>Delivery<\/code> bị đóng) và publish trả <code>Exception (504) channel/connection is not open<\/code>.", "Sau khi kết nối lại phải dựng lại: channel, confirm mode, Qos, consumer, queue tạm; delivery tag cũ mất hiệu lực; message chưa ack được giao lại với <code>Redelivered=true<\/code>.", "amqp091-go từ v1.12.0 có tự phục hồi (bật bằng <code>Config.Recovery<\/code>), từ v1.13.0 có khôi phục topology; mặc định tắt, khoảng thử lại cố định, publish trong lúc phục hồi vẫn thất bại.", "Wrapper <code>rmq.Client<\/code>: một goroutine sở hữu vòng đời connection, backoff equal jitter, topology chạy lại mỗi lần kết nối, <code>Publish<\/code> chờ confirm và tự gửi lại (at-least-once, cần <code>MessageId<\/code>), <code>Consume<\/code> tự consume lại và tắt êm bằng <code>Cancel<\/code> + <code>WithoutCancel<\/code>.", "Thí nghiệm thật: qua một lần đóng connection và một lần tắt node 9 giây, 33/33 message tới nơi, không mất message nào; health check trả 503 khi mất kết nối hoặc bị block.", "Tách connection publish và consume; readiness phụ thuộc broker, liveness thì không."], "exercises": ["Chạy lại thí nghiệm 6.1.2 nhưng bật confirm mode cho chương trình \"ngây thơ\". <code>msg-5<\/code> nhận được kết quả gì từ <code>DeferredConfirmation<\/code>?", "Thêm trường <code>URLs []string<\/code> vào <code>rmq.Config<\/code> để kết nối luân phiên tới các node của một cluster (lần thử thứ n dùng <code>URLs[n % len(URLs)]<\/code>). Kiểm tra bằng cách cho URL đầu tiên trỏ tới một cổng không tồn tại.", "Bổ sung cho <code>rmq.Client<\/code> các metric: tổng số lần kết nối lại, gauge trạng thái kết nối, gauge blocked; xuất ra <code>/metrics<\/code> theo định dạng văn bản Prometheus chỉ bằng thư viện chuẩn (gợi ý: xem <code>internal/metrics<\/code> ở Chương 9).", "Viết lại chương trình <code>builtin<\/code> sao cho không mất message nào: khi publish lỗi 504 hoặc confirm thất bại thì chờ trạng thái <code>StateOpen<\/code> (qua <code>NotifyStateChange<\/code>) rồi gửi lại. So sánh độ phức tạp với <code>rmq.Client<\/code>.", "Thí nghiệm <code>docker pause<\/code> (hoặc <code>kill -STOP<\/code> tiến trình beam của node thí nghiệm) trong 40 giây với heartbeat 10 giây. Sau bao lâu client phát hiện mất kết nối? Lặp lại với heartbeat 60 giây và giải thích.", "Viết test tích hợp cho <code>rmq.Client<\/code>: publish 1.000 message trong khi một goroutine khác gọi <code>rabbitmqctl close_all_connections<\/code> mỗi giây (qua <code>os/exec<\/code>), sau đó xác nhận consumer nhận đủ 1.000 <code>MessageId<\/code> khác nhau (cho phép trùng).", "(Nâng cao) Thay channel publish dùng chung có mutex bằng một pool N channel confirm. Đo thông lượng với 1, 4, 16 goroutine publish đồng thời và giải thích kết quả."]}, {"id": "p2c7", "num": 7, "title": "RPC &amp; Request-Reply", "intro": "Phần lớn sách này nói về giao tiếp một chiều: publisher bắn sự kiện rồi quên, consumer xử lý lúc nào tùy nó. Nhưng đôi khi bên gửi cần câu trả lời: \"báo giá cho giỏ hàng này\", \"kiểm tra tồn kho\", \"tạo thumbnail rồi cho tôi URL\". RabbitMQ hỗ trợ mô hình yêu cầu - phản hồi (request-reply), thường gọi là RPC qua broker, bằng hai thuộc tính message có sẵn trong AMQP 0-9-1: <code>reply_to<\/code> và <code>correlation_id<\/code> (xem Phần 1, Chương 2).", "sections": [{"n": "7.1", "t": "Mô hình request-reply qua broker", "sub": []}, {"n": "7.2", "t": "Hai cách nhận phản hồi", "sub": ["Queue phản hồi riêng cho mỗi client", "Direct reply-to: amq.rabbitmq.reply-to", "So sánh"]}, {"n": "7.3", "t": "Server RPC đa luồng", "sub": []}, {"n": "7.4", "t": "Client RPC an toàn cho nhiều goroutine", "sub": []}, {"n": "7.5", "t": "Chạy thật", "sub": ["Bốn tình huống cơ bản", "Khi server không chạy", "Đo độ trễ và thông lượng"]}, {"n": "7.6", "t": "Các tình huống lỗi và cách xử lý", "sub": []}, {"n": "7.7", "t": "Khi nào KHÔNG nên dùng RPC qua broker", "sub": []}, {"n": "7.8", "t": "Lỗi thường gặp", "sub": []}], "summary": ["Request-reply dùng <code>reply_to<\/code> (nơi gửi phản hồi) và <code>correlation_id<\/code> (ghép phản hồi với request); server publish phản hồi qua default exchange và chỉ ack request sau khi đã phản hồi.", "Hai cách nhận phản hồi: queue exclusive server-named cho mỗi client, hoặc direct reply-to <code>amq.rabbitmq.reply-to<\/code> (bắt buộc autoAck, consume trước trên cùng channel). Đừng tạo queue cho mỗi request.", "Client tốt: bảng <code>pending<\/code> có khóa, một goroutine dispatch, timeout bằng <code>context<\/code>, <code>Expiration<\/code> bằng thời gian còn lại, <code>mandatory<\/code> + <code>NotifyReturn<\/code> để phát hiện NO_ROUTE ngay, đếm phản hồi muộn.", "Server tốt: worker pool, prefetch nhỏ, channel phản hồi riêng có khóa, lỗi nghiệp vụ trả về như phản hồi, logic idempotent vì request có thể được giao lại.", "Số liệu thật: khoảng 0,3ms p50 khi gọi tuần tự; direct reply-to nhanh hơn queue riêng khoảng 30% khi tải đồng thời cao.", "Timeout không hủy được công việc phía server. Phần lớn tương tác giữa microservice nên là sự kiện bất đồng bộ; dùng gRPC/HTTP khi cần lời gọi đồng bộ độ trễ thấp."], "exercises": ["Chạy client ở chế độ <code>queue<\/code> và quan sát queue <code>amq.gen-...<\/code> trên Management UI trong lúc chạy và sau khi client thoát. Giải thích vì sao nó biến mất.", "Thêm vào <code>RPCClient<\/code> giới hạn số lời gọi đồng thời (semaphore bằng kênh có bộ đệm). Khi vượt giới hạn, <code>Call<\/code> chờ hoặc trả lỗi theo <code>ctx<\/code>.", "Đặt <code>x-message-ttl=5000<\/code> cho queue <code>rpc.quote<\/code> và thử khai báo lại với server đang chạy (queue đã tồn tại không có tham số này). Lỗi gì xuất hiện? Cách nào đặt TTL cho queue đang tồn tại mà không phải xóa nó? (Gợi ý: policy, Phần 1, Chương 4.)", "Đo lại bảng 7.5.3 với <code>-workers 16<\/code> cho server. Độ trễ p50 ở <code>c=16<\/code> thay đổi thế nào? Giải thích.", "Viết server thứ hai cùng consume <code>rpc.quote<\/code> nhưng chậm hơn (<code>time.Sleep<\/code> 50ms mỗi request). Với prefetch 1 và prefetch 100, phân bố độ trễ p99 của client khác nhau thế nào?", "Kết hợp <code>RPCClient<\/code> với <code>rmq.Client<\/code> của Chương 6 để client RPC tự kết nối lại: khi connection mới được tạo phải consume lại <code>amq.rabbitmq.reply-to<\/code> trước khi gửi request mới, và mọi lời gọi đang chờ trên connection cũ phải nhận lỗi ngay.", "(Nâng cao) Thiết kế lại luồng \"báo giá\" thành bất đồng bộ: client publish command <code>quote.requested<\/code> kèm <code>quote_id<\/code>, server publish sự kiện <code>quote.calculated<\/code>, client nhận qua queue riêng và lưu vào bảng. So sánh độ phức tạp và khả năng chịu lỗi với phiên bản RPC."]}, {"id": "p2c8", "num": 8, "title": "Streams với Go", "intro": "Queue truyền thống (classic, quorum) có một tính chất cốt lõi: message được ack là biến mất. Điều đó hoàn hảo cho phân phối công việc, nhưng bất lực khi bạn cần đọc lại lịch sử (\"xử lý lại toàn bộ sự kiện của tuần trước sau khi sửa bug\"), cần nhiều nhóm consumer độc lập cùng đọc một luồng sự kiện mà không phải nhân bản message ra nhiều queue, hay cần thông lượng rất cao với hàng triệu message. RabbitMQ Streams — nhật ký chỉ ghi thêm (append-only log) có nhân bản, tương tự một partition Kafka — giải quyết các nhu cầu đó. Khái niệm (offset, chunk, segment, retention, super stream) đã được trình bày ở Phần 1, Chương 8; chương này tập trung vào cách dùng từ Go.", "sections": [{"n": "8.1", "t": "Stream qua AMQP 0-9-1 với amqp091-go", "sub": ["Khai báo stream", "Chương trình mẫu: publish, consume từ nhiều điểm, lọc, theo dõi offset", "Publish", "Consume từ các điểm khác nhau: x-stream-offset", "Ba quy tắc bắt buộc khi consume stream qua AMQP", "Lọc stream (stream filtering)", "Tự theo dõi offset (offset tracking) với AMQP"]}, {"n": "8.2", "t": "Giao thức stream với rabbitmq-stream-go-client", "sub": ["Vấn đề phiên bản Go", "Chương trình mẫu", "Khử trùng lặp phía producer", "Lưu offset trên broker", "Super stream"]}, {"n": "8.3", "t": "Chọn AMQP hay giao thức stream?", "sub": []}, {"n": "8.4", "t": "Lỗi thường gặp", "sub": []}], "summary": ["Stream là log append-only, đọc không xóa, mỗi consumer chọn vị trí riêng; phù hợp phát lại sự kiện, nhiều nhóm đọc độc lập, thông lượng cao.", "Qua amqp091-go: <code>QueueDeclare<\/code> với <code>x-queue-type=stream<\/code> và retention (<code>x-max-age<\/code>, <code>x-max-length-bytes<\/code>); consume bắt buộc <code>Qos<\/code> và manual ack; <code>x-stream-offset<\/code> nhận <code>first<\/code>/<code>last<\/code>/<code>next<\/code>/<code>int64<\/code>/<code>time.Time<\/code>/khoảng thời gian; offset đọc từ header <code>x-stream-offset<\/code>.", "Lọc stream (<code>x-stream-filter-value<\/code>, <code>x-stream-filter<\/code>) hoạt động ở mức chunk, luôn phải lọc lại phía client.", "AMQP không lưu offset hộ: tự lưu offset (tốt nhất trong cùng transaction với kết quả) và tiếp tục từ <code>offset + 1<\/code>.", "rabbitmq-stream-go-client: v1.8+ cần Go 1.25; với Go 1.24 dùng v1.7.x hoặc v1.6.3 (sách dùng v1.6.3, đã build và chạy thật). Có khử trùng producer, lưu offset trên broker, super stream, SAC.", "Chọn AMQP cho sự đơn giản và tích hợp; chọn giao thức stream cho thông lượng và tính năng nâng cao."], "exercises": ["Publish 10.000 message vào <code>events.stream<\/code> theo lô 100 message mỗi region (100 <code>eu<\/code>, rồi 100 <code>us<\/code>, ...). Chạy lại <code>consume -filter eu<\/code> và so sánh số message client phải tự bỏ qua với thí nghiệm 8.1.6. Giải thích.", "Sửa lệnh <code>resume<\/code> để lưu offset vào PostgreSQL (<code>database/sql<\/code> + <code>lib/pq<\/code>) trong cùng transaction với việc ghi một bảng <code>events_processed<\/code>. Giết tiến trình giữa chừng bằng <code>kill -9<\/code> và chứng minh không có bản ghi nào bị xử lý hai lần.", "Tạo stream với <code>x-max-length-bytes=1000000<\/code> và <code>x-stream-max-segment-size-bytes=100000<\/code>, publish 50.000 message nhỏ. Kiểm tra offset của <code>first<\/code> trước và sau. Vì sao <code>first<\/code> không còn là 0?", "Viết consumer AMQP đọc từ <code>\"1h\"<\/code> và in ra khoảng cách (theo giây) giữa timestamp của message đầu tiên nhận được và mốc \"bây giờ trừ 1 giờ\". Kết quả có luôn dương không? Vì sao?", "Với <code>sclient<\/code>, viết producer gửi 100.000 message và đo thông lượng; so sánh với <code>amqpstream publish -n 100000<\/code>.", "Chạy hai instance của một super stream consumer có <code>SetSingleActiveConsumer<\/code> cùng tên. Tắt instance đang hoạt động và quan sát partition được chuyển giao cho instance còn lại từ offset nào.", "(Nâng cao) Thiết kế cơ chế \"replay\": một lệnh quản trị cho phép một service đọc lại toàn bộ <code>order.*<\/code> của 7 ngày qua từ stream để dựng lại một read model, trong khi consumer thường vẫn xử lý message mới. Những vấn đề idempotency nào phải giải quyết?"]}, {"id": "p2c9", "num": 9, "title": "Dự án microservice mẫu &amp; thực chiến", "intro": "Chương cuối gom mọi kỹ thuật của Phần 2 vào một hệ thống chạy được từ đầu đến cuối: hệ thống đặt hàng gồm ba service Go giao tiếp qua RabbitMQ. <code>order-service<\/code> nhận đơn qua HTTP API, ghi PostgreSQL và bảng outbox trong cùng một transaction (Chương 4); <code>inventory-worker<\/code> giữ hàng và phát kết quả cũng qua outbox; <code>notification-worker<\/code> gửi email cho khách. Hai worker tiêu thụ với retry qua hàng đợi trễ TTL + DLX, parking-lot, khử trùng lặp bằng bảng <code>processed_messages<\/code> (Chương 5), và tất cả dùng lớp tự kết nối lại <code>rabbitmq.Client<\/code> (Chương 6).", "sections": [{"n": "9.1", "t": "Bài toán và kiến trúc", "sub": []}, {"n": "9.2", "t": "Cấu trúc thư mục", "sub": []}, {"n": "9.3", "t": "Hợp đồng sự kiện và topology", "sub": ["events.go", "topology.go"]}, {"n": "9.4", "t": "Nền móng dùng chung", "sub": ["config.go", "obs.go: log, trace id, metrics", "db.go", "app.go", "rabbitmq/client.go"]}, {"n": "9.5", "t": "order-service: HTTP API và outbox", "sub": ["order.go", "outbox.go", "cmd/order-service/main.go"]}, {"n": "9.6", "t": "Khung worker: retry, parking-lot, idempotency", "sub": []}, {"n": "9.7", "t": "inventory-worker", "sub": ["inventory.go", "cmd/inventory-worker/main.go"]}, {"n": "9.8", "t": "notification-worker", "sub": ["notification.go", "cmd/notification-worker/main.go"]}, {"n": "9.9", "t": "Đóng gói: Dockerfile và docker-compose", "sub": []}, {"n": "9.10", "t": "Chạy thật", "sub": ["Topology được tạo tự động", "Đặt hàng thành công: một trace id xuyên ba service", "Hết hàng: kết quả nghiệp vụ, không phải lỗi", "Kiểm tra đầu vào ở biên HTTP", "Lỗi tạm thời được retry thành công", "Lỗi kéo dài: retry rồi vào parking-lot", "Message độc: DLX đưa thẳng vào parking-lot", "Trùng lặp: phát lại outbox, consumer bỏ qua", "Sự kiện không ai nhận: alternate exchange", "Trạng thái cuối cùng", "Tắt êm"]}, {"n": "9.11", "t": "Kiểm thử tích hợp với broker thật", "sub": []}, {"n": "9.12", "t": "Vận hành parking-lot", "sub": []}, {"n": "9.13", "t": "Hướng phát triển", "sub": []}, {"n": "9.16", "t": "Phụ lục A — Cheat sheet amqp091-go v1.16.0", "sub": ["Connection", "Topology", "Publish", "Consume"]}, {"n": "9.17", "t": "Phụ lục B — Bảng lỗi thường gặp", "sub": []}, {"n": "9.18", "t": "Phụ lục C — Checklist production cho ứng dụng Go", "sub": []}, {"n": "9.19", "t": "Phụ lục D — Lộ trình học tiếp", "sub": []}], "summary": ["Hệ thống ba service, giao tiếp qua topic exchange <code>orders.events<\/code>; mỗi service sở hữu dữ liệu riêng, chỉ biết nhau qua sự kiện.", "Outbox trong cùng transaction với nghiệp vụ + relay publish có confirm (<code>FOR UPDATE SKIP LOCKED<\/code>) loại bỏ dual write; <code>message_id<\/code> ổn định cho phép khử trùng.", "Topology mỗi service: queue chính quorum (delivery-limit, DLX → parking-lot), các hàng đợi trễ TTL dead-letter về queue chính, alternate exchange bắt sự kiện không ai nhận.", "Khung worker phân loại kết quả: thành công → ack; vĩnh viễn/panic → reject → parking-lot; tạm thời → publish bản sao vào bậc retry (có confirm) rồi ack; hết bậc → parking-lot.", "Idempotency bằng <code>INSERT ... ON CONFLICT DO NOTHING<\/code> vào <code>processed_messages<\/code> đầu tiên trong transaction nghiệp vụ; hiệu ứng ngoài DB (email) chỉ đạt at-least-once.", "Chạy thật đã chứng minh: trace id xuyên ba service, retry thành công, retry rồi vào parking-lot, message độc qua DLX, bản trùng bị bỏ qua, alternate exchange, tắt êm; số liệu kho khớp tuyệt đối.", "Hai connection cho mỗi service (publish/consume), readiness probe dựa trên DB và broker, metric theo route pattern, test tích hợp với broker thật."], "exercises": ["Hoàn thiện saga: thêm consumer vào order-service (queue <code>orders.q<\/code> bind <code>stock.*<\/code>) để cập nhật trạng thái đơn thành <code>CONFIRMED<\/code> hoặc <code>REJECTED<\/code>, có khử trùng bằng <code>orders.processed_messages<\/code>. Kiểm tra bằng <code>GET /orders/{id}<\/code>.", "Thêm endpoint <code>POST /orders/{id}/cancel<\/code>: ghi sự kiện <code>order.cancelled<\/code> qua outbox; inventory trả hàng về kho nếu đã giữ. Xử lý trường hợp <code>order.cancelled<\/code> đến trước <code>order.created<\/code> (thứ tự không được đảm bảo giữa hai lần publish khác nhau).", "Viết lệnh <code>cmd/parking-replay<\/code>: đọc từng message trong một parking-lot (<code>basic.get<\/code>), in tóm tắt (<code>message_id<\/code>, <code>x-trace-id<\/code>, <code>x-death<\/code>), hỏi xác nhận, xóa header <code>x-retry-count<\/code> rồi publish lại vào queue chính có confirm trước khi ack.", "Thay vòng thăm dò của relay bằng <code>LISTEN/NOTIFY<\/code> (<code>pq.NewListener<\/code>), giữ thăm dò 5 giây làm lưới an toàn. Đo độ trễ từ lúc HTTP trả 201 tới lúc worker nhận sự kiện, trước và sau.", "Chạy hai instance <code>inventory-worker<\/code> và gửi 200 đơn hàng đồng thời cho cùng một SKU có tồn kho 50. Chứng minh không bán vượt (đúng 50 <code>stock.reserved<\/code>) và giải thích vai trò của <code>FOR UPDATE<\/code>.", "Trong lúc gửi đơn liên tục bằng một vòng <code>curl<\/code>, khởi động lại node RabbitMQ thí nghiệm (Chương 6). Xác nhận không mất đơn nào: số dòng <code>orders.orders<\/code> bằng số <code>order.created<\/code> mà inventory đã xử lý.", "Viết test tích hợp cho <code>outbox.Relay<\/code> với PostgreSQL thật: chèn 1.000 dòng, chạy hai relay song song, xác nhận mỗi <code>message_id<\/code> được publish ít nhất một lần và phần lớn đúng một lần.", "(Nâng cao) Thay <code>obs<\/code> bằng <code>prometheus/client_golang<\/code> và OpenTelemetry trong môi trường có mạng đầy đủ: histogram thời gian xử lý message theo <code>svc<\/code> và <code>result<\/code>, span cho HTTP request, cho relay publish và cho mỗi lần xử lý, nối với nhau qua header <code>traceparent<\/code>."]}]}]</script>
<script>
(() => {
  const PARTS_META = {
    1: {
      title: "Nền tảng & Kiến trúc RabbitMQ",
      file: "RabbitMQ_P1_Nen_tang_Kien_truc.docx · 10 chương · 142 trang",
      desc: "Message broker, mô hình AMQP 0-9-1, exchange và định tuyến, classic/quorum queue và stream, ack và prefetch, publisher confirm, dead lettering và retry, cluster, bảo mật, giám sát, vận hành.",
      milestones: [
        "Chạy RabbitMQ 4.x, mở Management UI, dùng rabbitmqctl / rabbitmq-diagnostics / HTTP API thành thạo",
        "Vẽ được đường đi của message qua direct, fanout, topic, headers exchange và alternate exchange",
        "Chọn đúng classic / quorum / stream cho từng bài toán và giải thích vì sao",
        "Thiết lập độ tin cậy đầu-cuối: confirm + mandatory + durable/quorum + manual ack",
        "Dựng retry có backoff bằng TTL + DLX, đọc được header x-death, có parking-lot queue",
        "Tự dựng cluster 3 node, tắt một node và quan sát quorum queue bầu leader mới",
        "Có dashboard giám sát (Prometheus) và checklist cảnh báo: queue phình, unacked, alarm"
      ]
    },
    2: {
      title: "Lập trình RabbitMQ với Go",
      file: "RabbitMQ_P2_Lap_trinh_Go.docx · 9 chương · 205 trang",
      desc: "amqp091-go: kết nối, worker pool, pub/sub, publisher confirm, outbox, consume tin cậy, retry/DLX, idempotency, tự kết nối lại, RPC, stream, dự án microservice đặt hàng hoàn chỉnh.",
      milestones: [
        "Viết producer/consumer Go có graceful shutdown, không chia sẻ channel giữa goroutine",
        "Worker pool có prefetch hợp lý, đo được thông lượng theo prefetch",
        "Publisher dùng confirm bất đồng bộ + mandatory/NotifyReturn, có retry backoff",
        "Outbox với PostgreSQL và consumer idempotent khử message trùng",
        "Client tự kết nối lại, khai báo lại topology, sống sót khi broker restart",
        "Chạy dự án ordersys (order-service + 2 worker) và theo dõi một đơn hàng qua retry → parking-lot"
      ]
    }
  };

  const DATA = JSON.parse(document.getElementById("data").textContent);
  const $ = (s, r = document) => r.querySelector(s);
  const LS_KEY = "rabbitmq-aio-progress-v1";
  const LS_UI = "rabbitmq-aio-ui-v1";

  // ---- Danh sách mọi mục có thể đánh dấu (để tính tiến độ) ----
  const chapterKeys = {};   // chId -> [keys tính vào tiến độ chương (mục nội dung)]
  const partKeys = { 1: [], 2: [] };
  DATA.forEach(p => p.chapters.forEach(c => {
    chapterKeys[c.id] = c.sections.map(s => `${c.id}:s:${s.n}`);
    partKeys[p.id].push(...chapterKeys[c.id]);
  }));
  const allKeys = [].concat(partKeys[1], partKeys[2]);

  // ---- Trạng thái ----
  let done = {};
  try { done = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { done = {}; }
  let ui = { part: 0, hideDone: false, open: {} };
  try { Object.assign(ui, JSON.parse(localStorage.getItem(LS_UI) || "{}")); } catch (e) {}
  const saveUi = () => { try { localStorage.setItem(LS_UI, JSON.stringify(ui)); } catch (e) {} };

  // ---- Đồng bộ với tài khoản qua capability db (nếu có) ----
  let docRef = null, pendingTimer = null, writing = false, dirty = false;
  const syncEl = $("#sync");
  function setSync(state, text) { syncEl.dataset.state = state; syncEl.textContent = text; }

  function persist() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(done)); } catch (e) {}
    if (!docRef) return;
    dirty = true;
    setSync("saving", "Đang lưu…");
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(flush, 700);
  }
  async function flush() {
    if (!docRef || writing || !dirty) return;
    writing = true; dirty = false;
    try {
      await docRef.set({ done, updatedAt: new Date().toISOString() });
      setSync("cloud", "Đã lưu vào tài khoản");
    } catch (e) {
      setSync("local", "Không lưu được lên tài khoản · đang lưu trên trình duyệt");
      if (e && e.code === "invalid_argument") docRef = null;
    } finally {
      writing = false;
      if (dirty) flush();
    }
  }

  (async () => {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      docRef = db.doc("data/users/" + uid + "/progress");
      setSync("saving", "Đang tải tiến độ…");
      const timer = setTimeout(() => setSync("local", "Chưa kết nối được · đang lưu trên trình duyệt"), 10000);
      let first = true;
      docRef.onSnapshot(snap => {
        if (!snap.metadata.fromCache) clearTimeout(timer);
        if (dirty || writing || snap.metadata.hasPendingWrites) return;
        if (snap.exists) {
          const remote = (snap.data() || {}).done || {};
          if (first) {
            // Lần đầu: gộp tiến độ đã lưu trên trình duyệt (nếu có) vào tài khoản.
            const merged = Object.assign({}, remote, done);
            const extra = Object.keys(merged).length !== Object.keys(remote).length;
            done = merged;
            if (extra) persist();
          } else {
            done = Object.assign({}, remote);
          }
        } else if (first && Object.keys(done).length) {
          persist();
        }
        if (!snap.metadata.fromCache) first = false;
        try { localStorage.setItem(LS_KEY, JSON.stringify(done)); } catch (e) {}
        if (!dirty && !writing) setSync("cloud", "Đồng bộ với tài khoản của bạn");
        refreshAll();
      }, () => {
        clearTimeout(timer);
        docRef = null;
        setSync("local", "Lưu trên trình duyệt này");
      });
    } catch (e) { /* giữ chế độ trình duyệt */ }
  })();

  // ---- Tìm kiếm ----
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
  const strip = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent; };
  DATA.forEach(p => p.chapters.forEach(c => {
    c._hay = norm([c.title, c.intro || "", ...c.sections.map(s => s.t + " " + s.sub.join(" ")), ...c.summary, ...c.exercises].map(strip).join(" \n "));
  }));
  function highlight(html, q) {
    if (!q) return html;
    // Đánh dấu trong text node, không chạm vào thẻ.
    const tpl = document.createElement("template"); tpl.innerHTML = html;
    const walk = document.createTreeWalker(tpl.content, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walk.nextNode()) nodes.push(walk.currentNode);
    nodes.forEach(n => {
      const t = n.nodeValue, nt = norm(t); let i = nt.indexOf(q); if (i < 0) return;
      const frag = document.createDocumentFragment(); let last = 0;
      while (i >= 0) {
        frag.append(t.slice(last, i));
        const m = document.createElement("mark"); m.textContent = t.slice(i, i + q.length); frag.append(m);
        last = i + q.length; i = nt.indexOf(q, last);
      }
      frag.append(t.slice(last)); n.replaceWith(frag);
    });
    return tpl.innerHTML;
  }

  // ---- Render ----
  const main = $("#main"), toc = $("#toc");
  const chev = '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>';
  const count = keys => keys.reduce((a, k) => a + (done[k] ? 1 : 0), 0);

  function checkItem(key, labelHtml, extraHtml = "") {
    return `<li><label class="item"><input type="checkbox" data-key="${key}" ${done[key] ? "checked" : ""}><span>${labelHtml}${extraHtml}</span></label></li>`;
  }

  function render() {
    const q = norm($("#q").value.trim());
    const searching = q.length >= 2;
    let html = "", tocHtml = "", shown = 0;
    DATA.forEach(p => {
      if (ui.part && ui.part !== p.id) return;
      const meta = PARTS_META[p.id];
      const chs = p.chapters.filter(c => {
        if (searching && !c._hay.includes(q)) return false;
        if (ui.hideDone && !searching) {
          const ks = chapterKeys[c.id]; if (ks.length && count(ks) === ks.length) return false;
        }
        return true;
      });
      tocHtml += `<h2>Phần ${p.id}</h2>`;
      p.chapters.forEach(c => {
        const ks = chapterKeys[c.id], d = count(ks);
        tocHtml += `<a href="#${c.id}" data-toc="${c.id}" class="${ks.length && d === ks.length ? "full" : ""}"><span class="n">${String(c.num).padStart(2, "0")}</span><span>${c.title}</span><span class="p">${d}/${ks.length}</span></a>`;
      });
      if (!chs.length) return;
      shown += chs.length;
      const pk = partKeys[p.id], pd = count(pk);
      html += `<section class="part" id="part${p.id}">
        <div class="part-head">
          <div>
            <div class="eyebrow">Phần ${p.id}</div>
            <h2>${meta.title}</h2>
            <p>${meta.desc}</p>
            <div class="file">${meta.file}</div>
          </div>
          <div class="ring"><b data-ppct="${p.id}">${Math.round(pd / pk.length * 100)}%</b><small data-pcount="${p.id}">${pd} / ${pk.length} mục</small></div>
        </div>
        ${searching ? "" : `<div class="milestones"><h3>Mốc thực hành của phần ${p.id}</h3><ul class="checks">${meta.milestones.map((m, i) => checkItem(`m:${p.id}:${i}`, m)).join("")}</ul></div>`}
        <div class="part-body">`;
      chs.forEach(c => {
        const ks = chapterKeys[c.id], d = count(ks);
        const open = searching || $("#expandAll").checked || !!ui.open[c.id];
        const st = ks.length && d === ks.length ? "done" : d ? "started" : "";
        const H = s => searching ? highlight(s, q) : s;
        html += `<article class="ch ${st} ${open ? "open" : ""}" id="${c.id}" data-ch="${c.id}">
          <div class="ch-head" role="button" tabindex="0" aria-expanded="${open}" data-toggle="${c.id}">
            <div class="ch-num">${c.num}</div>
            <div><h3>${H(c.title)}</h3>${c.intro ? `<p class="intro">${H(c.intro)}</p>` : ""}</div>
            <div class="ch-meta"><span class="pill" data-cpill="${c.id}">${d}/${ks.length}</span>${chev}</div>
          </div>
          <div class="mini"><i data-cbar="${c.id}" style="width:${ks.length ? d / ks.length * 100 : 0}%"></i></div>
          ${open ? `<div class="ch-body">
            <div class="col">
              <h4><span>Kiến thức cốt lõi</span></h4>
              ${c.summary.length ? `<ul class="sum">${c.summary.map(s => `<li>${H(s)}</li>`).join("")}</ul>` : `<p style="margin:0;color:var(--ink-2)">Chương tra cứu: dùng checklist bên cạnh để đánh dấu những phần đã đọc.</p>`}
            </div>
            <div class="col">
              <h4><span>Checklist khi học</span><button type="button" data-all="${c.id}">${d === ks.length ? "Bỏ chọn hết" : "Đánh dấu hết"}</button></h4>
              <ul class="checks">${c.sections.map(s => checkItem(`${c.id}:s:${s.n}`, `<span class="sn">${s.n}</span>${H(s.t)}`, s.sub.length ? `<span class="subs">${H(s.sub.join(" · "))}</span>` : "")).join("")}</ul>
              ${c.exercises.length ? `<details class="ex" ${searching && c.exercises.some(e => norm(strip(e)).includes(q)) ? "open" : ""}><summary>Bài tập (${count(c.exercises.map((_, i) => `${c.id}:e:${i}`))}/${c.exercises.length})</summary><ul class="checks">${c.exercises.map((e, i) => checkItem(`${c.id}:e:${i}`, H(e))).join("")}</ul></details>` : ""}
            </div>
          </div>` : ""}
        </article>`;
      });
      html += `</div></section>`;
    });
    if (!shown) html = `<div class="empty">Không có chương nào khớp. Thử từ khóa khác, ví dụ “ack”, “topic”, “reconnect”.</div>`;
    html += `<div class="foot"><span>Dựa trên bộ 2 file Word “RabbitMQ Toàn tập” (RabbitMQ 4.3 · Go 1.24 · amqp091-go 1.16). Mục trong checklist khớp với số mục trong tài liệu.</span><span id="resetBox"><button class="danger" type="button" id="reset">Đặt lại tiến độ</button></span></div>`;
    main.innerHTML = html;
    toc.innerHTML = tocHtml;
    refreshTotals();
  }

  function refreshTotals() {
    const d = count(allKeys), t = allKeys.length;
    $("#ovBar").style.width = (d / t * 100) + "%";
    $("#ovPct").textContent = `${d} / ${t} mục · ${Math.round(d / t * 100)}%`;
    [1, 2].forEach(p => {
      const pk = partKeys[p], pd = count(pk);
      const a = main.querySelector(`[data-ppct="${p}"]`), b = main.querySelector(`[data-pcount="${p}"]`);
      if (a) a.textContent = Math.round(pd / pk.length * 100) + "%";
      if (b) b.textContent = `${pd} / ${pk.length} mục`;
    });
  }

  function refreshChapter(id) {
    const ks = chapterKeys[id], d = count(ks);
    const art = main.querySelector(`[data-ch="${id}"]`);
    if (art) {
      art.classList.toggle("done", ks.length > 0 && d === ks.length);
      art.classList.toggle("started", d > 0 && d < ks.length);
      const pill = art.querySelector("[data-cpill]"); if (pill) pill.textContent = `${d}/${ks.length}`;
      const bar = art.querySelector("[data-cbar]"); if (bar) bar.style.width = (ks.length ? d / ks.length * 100 : 0) + "%";
      const btn = art.querySelector("[data-all]"); if (btn) btn.textContent = d === ks.length ? "Bỏ chọn hết" : "Đánh dấu hết";
      const sum = art.querySelector("details.ex summary");
      if (sum) {
        const ex = art.querySelectorAll('input[data-key*=":e:"]');
        const exd = [...ex].filter(i => i.checked).length;
        sum.textContent = `Bài tập (${exd}/${ex.length})`;
      }
    }
    const t = toc.querySelector(`[data-toc="${id}"]`);
    if (t) { t.classList.toggle("full", ks.length > 0 && d === ks.length); t.querySelector(".p").textContent = `${d}/${ks.length}`; }
  }

  function refreshAll() {
    main.querySelectorAll("input[data-key]").forEach(i => { i.checked = !!done[i.dataset.key]; });
    Object.keys(chapterKeys).forEach(refreshChapter);
    refreshTotals();
  }

  // ---- Sự kiện ----
  main.addEventListener("change", e => {
    const i = e.target.closest("input[data-key]"); if (!i) return;
    if (i.checked) done[i.dataset.key] = true; else delete done[i.dataset.key];
    const ch = i.dataset.key.split(":")[0];
    if (chapterKeys[ch]) refreshChapter(ch);
    refreshTotals(); persist();
  });
  main.addEventListener("click", e => {
    const all = e.target.closest("[data-all]");
    if (all) {
      e.stopPropagation();
      const id = all.dataset.all, ks = chapterKeys[id], full = count(ks) === ks.length;
      ks.forEach(k => { if (full) delete done[k]; else done[k] = true; });
      main.querySelectorAll(`[data-ch="${id}"] input[data-key^="${id}:s:"]`).forEach(i => { i.checked = !full; });
      refreshChapter(id); refreshTotals(); persist();
      return;
    }
    if (e.target.id === "reset") {
      $("#resetBox").innerHTML = `<span class="confirm">Xóa toàn bộ dấu tích? <button class="danger yes" type="button" id="resetYes">Xóa</button><button class="danger" type="button" id="resetNo">Giữ lại</button></span>`;
      return;
    }
    if (e.target.id === "resetYes") { done = {}; persist(); render(); return; }
    if (e.target.id === "resetNo") { render(); return; }
    const head = e.target.closest("[data-toggle]");
    if (head) toggleChapter(head.dataset.toggle);
  });
  main.addEventListener("keydown", e => {
    const head = e.target.closest("[data-toggle]");
    if (head && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleChapter(head.dataset.toggle); }
  });
  function toggleChapter(id) {
    ui.open[id] = !ui.open[id]; if (!ui.open[id]) delete ui.open[id];
    saveUi();
    const y = main.querySelector(`[data-ch="${id}"]`).getBoundingClientRect().top;
    render();
    const el = main.querySelector(`[data-ch="${id}"]`);
    if (el) window.scrollBy(0, el.getBoundingClientRect().top - y);
  }
  toc.addEventListener("click", e => {
    const a = e.target.closest("a[data-toc]"); if (!a) return;
    const id = a.dataset.toc;
    const part = +id.match(/^p(\d)/)[1];
    if (ui.part && ui.part !== part) setPart(part);
    if (!ui.open[id]) { ui.open[id] = true; saveUi(); render(); }
  });
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setPart(+b.dataset.part)));
  function setPart(p) {
    ui.part = p; saveUi();
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.part === p)));
    render();
  }
  let qt; $("#q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(render, 150); });
  $("#hideDone").addEventListener("change", e => { ui.hideDone = e.target.checked; saveUi(); render(); });
  $("#expandAll").addEventListener("change", render);

  // Khởi tạo
  $("#hideDone").checked = !!ui.hideDone;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.part === (ui.part || 0))));
  const h = location.hash.slice(1);
  if (/^p[12]c\d+$/.test(h)) { ui.open[h] = true; }
  else if (!Object.keys(ui.open).length) { ui.open.p1c2 = true; }
  render();
  if (/^p[12]c\d+$/.test(h)) { const el = document.getElementById(h); if (el) el.scrollIntoView(); }
  window.addEventListener("hashchange", () => {
    const id = location.hash.slice(1);
    if (/^p[12]c\d+$/.test(id) && !ui.open[id]) { ui.open[id] = true; render(); document.getElementById(id)?.scrollIntoView(); }
  });
})();
</script>

</body>
</html>
