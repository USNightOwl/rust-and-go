# CHỈ LÀ MẪU. Đừng commit secret thật vào Git: dùng Sealed Secrets,
# External Secrets Operator hoặc `kubectl create secret ... --from-literal`.
apiVersion: v1
kind: Secret
metadata:
  name: taskapi-secret
  labels:
    app: taskapi
type: Opaque
stringData:
  DATABASE_URL: "postgres://taskapi:CHANGE_ME@postgres.db.svc:5432/taskapi"
  JWT_SECRET: "CHANGE_ME_TO_A_RANDOM_STRING_OF_AT_LEAST_32_CHARS"
