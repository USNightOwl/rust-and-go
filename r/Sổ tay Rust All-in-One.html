mes<\/code> sinh số nguyên tố vô hạn. Dùng nó để tính tổng 1000 số nguyên tố đầu tiên và tìm số nguyên tố đầu tiên lớn hơn 1 000 000. Implement thêm <code>size_hint<\/code> hợp lý.", "Viết struct <code>Grid { w: usize, h: usize, cells: Vec&lt;u8&gt; }<\/code> với method <code>rows(&amp;self) -&gt; impl Iterator&lt;Item = &amp;[u8]&gt;<\/code> và <code>neighbors(&amp;self, x: usize, y: usize) -&gt; impl Iterator&lt;Item = (usize, usize)&gt; + '_<\/code> trả về tối đa 8 ô lân cận hợp lệ.", "Implement <code>IntoIterator<\/code> cho <code>&amp;Grid<\/code> sao cho <code>for (x, y, value) in &amp;grid<\/code> hoạt động. Gợi ý: kết hợp <code>enumerate<\/code> và <code>map<\/code> rồi trả về kiểu <code>impl Iterator<\/code> hoặc định nghĩa struct iterator riêng.", "(Nâng cao) Viết hàm tính độ lệch chuẩn của một <code>&amp;[f64]<\/code> theo hai cách: vòng lặp chỉ số và iterator (<code>map<\/code>, <code>sum<\/code>). Đo thời gian với 50 triệu phần tử ở <code>--release<\/code> và ở chế độ debug. Giải thích khác biệt giữa hai chế độ dựa trên inline."]}, {"id": "p1c13", "num": 13, "title": "Smart Pointers &amp; Interior Mutability", "intro": "Tham chiếu <code>&amp;T<\/code> và <code>&amp;mut T<\/code> của Chương 4 là con trỏ \"câm\": chúng chỉ mượn dữ liệu và không làm gì thêm. Smart pointer (con trỏ thông minh) là các struct hành xử như con trỏ (implement <code>Deref<\/code>) nhưng mang thêm khả năng và metadata: <code>Box&lt;T&gt;<\/code> sở hữu dữ liệu trên heap, <code>Rc&lt;T&gt;<\/code> và <code>Arc&lt;T&gt;<\/code> cho phép nhiều chủ sở hữu bằng bộ đếm tham chiếu, <code>Weak&lt;T&gt;<\/code> tham chiếu mà không giữ dữ liệu sống. Bên cạnh đó là nhóm kiểu interior mutability (khả biến bên trong) như <code>Cell&lt;T&gt;<\/code>, <code>RefCell&lt;T&gt;<\/code>, <code>Mutex&lt;T&gt;<\/code>: chúng cho phép thay đổi dữ liệu qua một tham chiếu chia sẻ, bằng cách chuyển việc kiểm tra quy tắc mượn từ lúc biên dịch sang lúc chạy. Chương này giải thích từng kiểu, bố cục bộ nhớ, chi phí, các cạm bẫy (panic lúc chạy, chu trình tham chiếu gây rò rỉ bộ nhớ), giới thiệu <code>Pin<\/code>, và kết thúc bằng bảng chọn lựa giúp bạn quyết định dùng kiểu nào.", "sections": [{"n": "13.1", "t": "Box: sở hữu dữ liệu trên heap", "sub": ["Khi nào cần Box", "Kiểu đệ quy và lỗi E0072"]}, {"n": "13.2", "t": "Rc: nhiều chủ sở hữu trong một luồng", "sub": ["Đếm tham chiếu", "Rc chỉ cho mượn chia sẻ"]}, {"n": "13.3", "t": "Interior mutability: Cell và RefCell", "sub": ["Ý tưởng", "Ví dụ Cell và RefCell", "Cơ chế bên trong RefCell"]}, {"n": "13.4", "t": "Kết hợp Rc và RefCell: chia sẻ và thay đổi", "sub": []}, {"n": "13.5", "t": "Weak: phá chu trình tham chiếu", "sub": ["Chu trình gây rò rỉ bộ nhớ", "Weak: tham chiếu không sở hữu"]}, {"n": "13.6", "t": "Arc, Mutex và RwLock (giới thiệu)", "sub": []}, {"n": "13.7", "t": "Cow như một smart pointer", "sub": []}, {"n": "13.8", "t": "Pin (giới thiệu)", "sub": ["Vấn đề struct tự tham chiếu"]}, {"n": "13.9", "t": "Bảng chọn lựa smart pointer", "sub": ["Kích thước thực tế", "Chọn kiểu nào"]}], "summary": ["Smart pointer là struct hành xử như con trỏ nhờ <code>Deref<\/code>, mang thêm ngữ nghĩa sở hữu và dọn dẹp nhờ <code>Drop<\/code>.", "<code>Box&lt;T&gt;<\/code> sở hữu dữ liệu trên heap, cần cho kiểu đệ quy (lỗi E0072) và trait object; <code>Option&lt;Box&lt;T&gt;&gt;<\/code> vẫn 8 byte nhờ niche.", "<code>Rc&lt;T&gt;<\/code> cho phép nhiều chủ sở hữu bằng đếm tham chiếu không nguyên tử; <code>Rc::clone<\/code> rẻ; chỉ cho mượn chia sẻ; <code>make_mut<\/code>, <code>get_mut<\/code>, <code>try_unwrap<\/code> là các lối thoát khi cần sửa hoặc lấy lại giá trị.", "Interior mutability dựa trên <code>UnsafeCell<\/code>: <code>Cell<\/code> sao chép giá trị ra/vào, không có chi phí; <code>RefCell<\/code> đếm số lần mượn lúc chạy và panic khi vi phạm.", "<code>Rc&lt;RefCell&lt;T&gt;&gt;<\/code> là mẫu chia sẻ có thể sửa trong một luồng, bản đa luồng là <code>Arc&lt;Mutex&lt;T&gt;&gt;<\/code>; tránh lạm dụng.", "Đếm tham chiếu không xử lý được chu trình: rò rỉ bộ nhớ là \"an toàn\" trong Rust. Dùng <code>Weak<\/code> cho chiều không sở hữu; <code>upgrade()<\/code> trả <code>None<\/code> khi dữ liệu đã bị hủy.", "<code>Arc<\/code> dùng atomics để an toàn đa luồng; <code>Mutex<\/code> chờ thay vì panic; <code>RwLock<\/code> cho nhiều đọc hoặc một ghi.", "<code>Pin<\/code> cam kết giá trị không bị move nữa, cần cho struct tự tham chiếu và future; kiểu <code>Unpin<\/code> (đa số) không bị ảnh hưởng."], "exercises": ["Định nghĩa enum <code>Expr { Num(f64), Add(Box&lt;Expr&gt;, Box&lt;Expr&gt;), Mul(Box&lt;Expr&gt;, Box&lt;Expr&gt;), Neg(Box&lt;Expr&gt;) }<\/code>, viết hàm <code>eval<\/code> và <code>Display<\/code> in biểu thức có ngoặc. Dựng biểu thức <code>-(2 + 3) * 4<\/code> và tính giá trị.", "Viết chương trình tạo một <code>Rc&lt;String&gt;<\/code>, clone nó vào ba struct khác nhau, in <code>strong_count<\/code> sau mỗi bước tạo và sau khi từng struct bị drop. Giải thích vì sao <code>Rc::clone<\/code> không sao chép <code>String<\/code>.", "Viết struct <code>Logger { lines: RefCell&lt;Vec&lt;String&gt;&gt; }<\/code> với method <code>log(&amp;self, s: &amp;str)<\/code> và <code>dump(&amp;self)<\/code>. Cố ý viết một hàm giữ <code>borrow()<\/code> trong khi gọi <code>log<\/code> để quan sát panic, sau đó sửa bằng cách thu hẹp phạm vi mượn.", "Cài đặt danh sách liên kết đôi với <code>Rc&lt;RefCell&lt;Node&gt;&gt;<\/code> cho <code>next<\/code> và <code>Weak&lt;RefCell&lt;Node&gt;&gt;<\/code> cho <code>prev<\/code>, hỗ trợ <code>push_back<\/code>, <code>push_front<\/code>, <code>pop_front<\/code> và in xuôi/ngược. Gắn <code>Drop<\/code> vào <code>Node<\/code> để chứng minh không rò rỉ bộ nhớ.", "Tạo chu trình giữa hai <code>Rc&lt;RefCell&lt;Node&gt;&gt;<\/code> và xác nhận <code>Drop<\/code> không chạy. Sau đó sửa bằng <code>Weak<\/code> và xác nhận <code>Drop<\/code> chạy đúng thứ tự.", "Viết <code>struct Memo { cache: RefCell&lt;HashMap&lt;u64, u64&gt;&gt; }<\/code> với method <code>fib(&amp;self, n: u64) -&gt; u64<\/code> có ghi nhớ. Cẩn thận: không giữ <code>borrow_mut()<\/code> trong khi gọi đệ quy (vì sao?).", "Viết lại bài 2 bằng <code>Arc<\/code> và năm luồng, mỗi luồng in <code>strong_count<\/code> mà nó thấy. Giải thích vì sao kết quả có thể khác nhau giữa các lần chạy.", "(Nâng cao) Thiết kế đồ thị có hướng bằng arena: <code>struct Graph { nodes: Vec&lt;NodeData&gt;, edges: Vec&lt;Vec&lt;usize&gt;&gt; }<\/code>, so sánh với phiên bản <code>Rc&lt;RefCell&lt;Node&gt;&gt;<\/code> về độ phức tạp code, khả năng có chu trình, và chi phí bộ nhớ."]}, {"id": "p1c14", "num": 14, "title": "Lập trình đồng thời với Thread", "intro": "\"Fearless concurrency\" (đồng thời không sợ hãi) là một trong những lời hứa lớn nhất của Rust: các lỗi data race (tranh chấp dữ liệu) vốn là ác mộng trong C/C++/Java bị biến thành lỗi biên dịch. Điều kỳ diệu là Rust không có cơ chế đặc biệt nào dành riêng cho đa luồng trong ngôn ngữ: toàn bộ sự an toàn đến từ ownership, borrowing và hai trait marker <code>Send<\/code>, <code>Sync<\/code>. Chương này trình bày các công cụ đồng thời của thư viện chuẩn: tạo luồng với <code>thread::spawn<\/code> và <code>thread::scope<\/code>, truyền thông điệp qua kênh <code>mpsc<\/code>, chia sẻ trạng thái với <code>Arc&lt;Mutex&lt;T&gt;&gt;<\/code> và <code>RwLock<\/code>, atomics cùng memory ordering, <code>Condvar<\/code>, <code>Barrier<\/code>, khởi tạo một lần với <code>OnceLock<\/code>/<code>LazyLock<\/code>, cách tránh deadlock, giải thích sâu về <code>Send<\/code>/<code>Sync<\/code>, và cuối cùng là song song dữ liệu với rayon. Lập trình bất đồng bộ (async) được trình bày riêng ở Chương 15.", "sections": [{"n": "14.1", "t": "Đồng thời, song song và data race", "sub": []}, {"n": "14.2", "t": "Tạo luồng với thread::spawn", "sub": []}, {"n": "14.3", "t": "move closure và ràng buộc 'static", "sub": []}, {"n": "14.4", "t": "Scoped threads với thread::scope", "sub": []}, {"n": "14.5", "t": "Truyền thông điệp với mpsc", "sub": ["Kênh nhiều nhà sản xuất, một người tiêu thụ", "Giá trị đã gửi thì không còn là của bạn"]}, {"n": "14.6", "t": "Chia sẻ trạng thái với Arc, Mutex và RwLock", "sub": ["Mutex và MutexGuard", "Poisoning và các cạm bẫy với guard"]}, {"n": "14.7", "t": "Atomics và memory ordering", "sub": ["Kiểu nguyên tử", "Memory ordering cơ bản"]}, {"n": "14.8", "t": "Condvar và Barrier", "sub": []}, {"n": "14.9", "t": "Khởi tạo một lần: OnceLock, LazyLock, thread_local!", "sub": []}, {"n": "14.10", "t": "Deadlock", "sub": []}, {"n": "14.11", "t": "Send và Sync giải thích sâu", "sub": ["Định nghĩa chính xác", "Các lỗi Send/Sync thường gặp", "unsafe impl Send và PhantomData"]}, {"n": "14.12", "t": "Song song dữ liệu với rayon", "sub": []}], "summary": ["<code>std::thread<\/code> dùng luồng hệ điều hành 1:1. <code>spawn<\/code> yêu cầu closure <code>FnOnce + Send + 'static<\/code>; <code>join<\/code> chờ và nhận kết quả hoặc panic của luồng con.", "<code>move<\/code> chuyển ownership dữ liệu vào luồng; muốn chia sẻ thì dùng <code>Arc<\/code>; muốn mượn thì dùng <code>thread::scope<\/code>, nơi mọi luồng tự động được join.", "Kênh <code>mpsc<\/code> truyền giá trị bằng move; vòng lặp nhận kết thúc khi mọi <code>Sender<\/code> bị drop; <code>sync_channel<\/code> cho backpressure.", "<code>Mutex&lt;T&gt;<\/code> gói dữ liệu cùng khóa, truy cập qua guard RAII; mutex bị poisoned khi luồng panic lúc giữ khóa; <code>RwLock<\/code> cho nhiều đọc hoặc một ghi.", "Atomics thao tác không khóa; <code>Ordering<\/code> quyết định bảo đảm thứ tự: <code>Relaxed<\/code> cho bộ đếm, Release/Acquire để công bố dữ liệu, <code>SeqCst<\/code> khi không chắc.", "<code>Condvar<\/code> để ngủ chờ điều kiện (luôn kiểm tra trong vòng lặp hoặc dùng <code>wait_while<\/code>), <code>Barrier<\/code> để đồng bộ theo pha.", "<code>OnceLock<\/code>, <code>LazyLock<\/code> thay cho <code>lazy_static<\/code>/<code>once_cell<\/code>; <code>thread_local!<\/code> cho dữ liệu riêng từng luồng.", "Rust không ngăn deadlock; phòng tránh bằng thứ tự khóa toàn cục, giữ khóa ngắn, hoặc truyền thông điệp.", "<code>Send<\/code> (chuyển ownership qua luồng) và <code>Sync<\/code> (chia sẻ <code>&amp;T<\/code> qua luồng) là auto trait lan truyền theo cấu trúc kiểu; <code>unsafe impl<\/code> là lời hứa của lập trình viên.", "rayon biến iterator tuần tự thành song song chỉ bằng <code>par_iter()<\/code>, phù hợp tác vụ CPU-bound."], "exercises": ["Viết chương trình tạo 8 luồng, luồng thứ <code>i<\/code> tính tổng các số từ <code>i * 1_000_000<\/code> đến <code>(i + 1) * 1_000_000 - 1<\/code> và trả về qua <code>JoinHandle<\/code>. Cộng kết quả ở <code>main<\/code> và so sánh với công thức.", "Viết lại bài 1 bằng <code>thread::scope<\/code> với dữ liệu là một <code>Vec&lt;u64&gt;<\/code> cục bộ chia thành 8 phần bằng <code>chunks<\/code>. So sánh độ dài code và số lần cấp phát so với bài 1.", "Xây dựng pipeline 3 giai đoạn bằng <code>mpsc<\/code>: luồng 1 sinh các dòng văn bản, luồng 2 tách từ và chuẩn hóa chữ thường, luồng 3 đếm tần suất từ vào <code>HashMap<\/code> và in top 5 khi kết thúc. Đảm bảo chương trình tự dừng khi dữ liệu hết.", "Cài đặt một thread pool tối giản: <code>ThreadPool::new(n)<\/code> tạo n worker, <code>execute(f)<\/code> gửi <code>Box&lt;dyn FnOnce() + Send + 'static&gt;<\/code> qua kênh dùng chung <code>Arc&lt;Mutex&lt;Receiver&lt;Job&gt;&gt;&gt;<\/code>. Implement <code>Drop<\/code> để đóng kênh và join mọi worker.", "Viết bộ đếm truy cập web giả lập: 4 luồng mỗi luồng tăng 1 triệu lần. Cài bằng ba cách: <code>Mutex&lt;u64&gt;<\/code>, <code>AtomicU64<\/code> với <code>Relaxed<\/code>, và mỗi luồng đếm cục bộ rồi cộng lại cuối cùng. Đo thời gian ở <code>--release<\/code> và giải thích kết quả.", "Cố ý tạo deadlock với ba mutex và ba luồng khóa theo vòng tròn. Sau đó sửa bằng thứ tự khóa toàn cục, và viết thêm phiên bản dùng <code>try_lock<\/code> với lùi lại ngẫu nhiên.", "Viết struct <code>FfiHandle { raw: *mut c_void }<\/code> mô phỏng handle của thư viện C chỉ dùng được trên một luồng. Chứng minh bằng các hàm <code>is_send<\/code>/<code>is_sync<\/code> rằng nó <code>!Send<\/code>, và giải thích khi nào được phép viết <code>unsafe impl Send<\/code>.", "(Nâng cao) Dùng rayon để tính tập Mandelbrot kích thước 2000x2000 (đếm số điểm thuộc tập với tối đa 256 vòng lặp). So sánh <code>par_iter<\/code> trên từng hàng với <code>par_iter<\/code> trên từng điểm, và thử <code>with_min_len<\/code> để điều chỉnh độ mịn của việc chia."]}, {"id": "p1c15", "num": 15, "title": "Async/Await — Lập trình bất đồng bộ", "intro": "Một máy chủ web phải phục vụ hàng chục nghìn kết nối cùng lúc, nhưng phần lớn thời gian mỗi kết nối chỉ <i>chờ<\/i>: chờ client gửi dữ liệu, chờ database trả kết quả, chờ một API khác phản hồi. Dành cho mỗi kết nối một luồng hệ điều hành (Chương 14) thì tốn bộ nhớ và chi phí chuyển ngữ cảnh. Lập trình bất đồng bộ (asynchronous programming) giải quyết bài toán này: hàng nghìn tác vụ (task) chia sẻ một số ít luồng, tác vụ nào đang chờ I/O thì nhường luồng cho tác vụ khác. Rust hiện thực async theo cách rất riêng: <code>async fn<\/code> được biên dịch thành một máy trạng thái (state machine) không cần cấp phát, <code>Future<\/code> là lazy và dựa trên cơ chế poll, còn runtime (Tokio, smol...) là thư viện bên ngoài chứ không nằm trong ngôn ngữ. Chương này đi từ trait <code>Future<\/code> và một executor tự viết bằng vài chục dòng, qua cách compiler biến <code>async fn<\/code> thành máy trạng thái, đến Tokio, các ràng buộc <code>Send<\/code>, async trong trait, xử lý tác vụ chặn, <code>Stream<\/code>, hủy tác vụ, và bảng so sánh thread với async. Phần 3, Chương 3 sẽ đi sâu vào Tokio cho backend.", "sections": [{"n": "15.1", "t": "Vì sao cần async", "sub": ["Bài toán I/O-bound", "Mô hình của Rust khác các ngôn ngữ khác thế nào"]}, {"n": "15.2", "t": "Future trait và mô hình poll", "sub": ["Định nghĩa", "Tự viết một Future và một executor"]}, {"n": "15.3", "t": "async fn và .await: máy trạng thái", "sub": ["async fn là đường tắt", "Compiler sinh ra máy trạng thái như thế nào", "Vì sao poll cần Pin"]}, {"n": "15.4", "t": "Runtime Tokio", "sub": ["Cài đặt và #[tokio::main]", "spawn, join!, select!, timeout và JoinSet"]}, {"n": "15.5", "t": "Bound Send và 'static khi spawn", "sub": []}, {"n": "15.6", "t": "async fn trong trait", "sub": []}, {"n": "15.7", "t": "Đừng chặn runtime: spawn_blocking", "sub": []}, {"n": "15.8", "t": "Stream và async closure", "sub": ["Stream", "Async closure"]}, {"n": "15.9", "t": "Hủy tác vụ (cancellation)", "sub": []}, {"n": "15.10", "t": "So sánh thread và async", "sub": []}], "summary": ["Async phục vụ tác vụ I/O-bound: nhiều task nhẹ chia sẻ vài luồng, task đang chờ thì nhường luồng.", "<code>Future::poll<\/code> trả <code>Ready<\/code> hoặc <code>Pending<\/code>; trước khi trả <code>Pending<\/code>, future phải sắp xếp để waker được gọi. Executor chỉ poll lại khi được wake. Future là lazy.", "<code>async fn<\/code> là đường tắt cho hàm trả <code>impl Future<\/code>; compiler biến thân hàm thành enum máy trạng thái, mỗi <code>.await<\/code> là một trạng thái, biến sống qua <code>.await<\/code> được lưu trong future. Kích thước future bằng trạng thái lớn nhất.", "Future do <code>async<\/code> sinh ra có thể tự tham chiếu nên cần <code>Pin<\/code>; <code>.await<\/code> tự lo việc pin, còn khi poll thủ công thì dùng <code>Box::pin<\/code> hoặc <code>pin!<\/code>.", "Tokio cung cấp runtime multi-thread với work stealing; <code>join!<\/code> cho đồng thời trong một task, <code>spawn<\/code> cho task độc lập, <code>select!<\/code> cho cuộc đua, <code>timeout<\/code>, <code>JoinSet<\/code> cho nhóm task.", "<code>tokio::spawn<\/code> yêu cầu <code>Send + 'static<\/code>: không giữ <code>Rc<\/code> hay <code>std::sync::MutexGuard<\/code> qua <code>.await<\/code>; dùng <code>Arc<\/code>, thả guard sớm hoặc <code>tokio::sync::Mutex<\/code>.", "<code>async fn<\/code> trong trait ổn định từ 1.75 nhưng không bảo đảm <code>Send<\/code> và không dyn compatible; dùng <code>impl Future + Send<\/code>, <code>Pin&lt;Box&lt;dyn Future&gt;&gt;<\/code> hoặc <code>async-trait<\/code>.", "Không chặn runtime; dùng <code>spawn_blocking<\/code> cho CPU nặng hoặc API chặn, dùng các API async của Tokio.", "<code>Stream<\/code> là iterator bất đồng bộ; <code>buffer_unordered(n)<\/code> giới hạn mức đồng thời. Async closure và <code>AsyncFn<\/code> có từ Rust 1.85.", "Hủy future là drop nó; destructor vẫn chạy; cần chú ý cancel safety khi dùng <code>select!<\/code> trong vòng lặp."], "exercises": ["Mở rộng executor tự viết ở mục 15.2.2 để chạy được nhiều future: dùng hàng đợi <code>VecDeque&lt;Pin&lt;Box&lt;dyn Future&lt;Output = ()&gt;&gt;&gt;&gt;<\/code> và waker đẩy chỉ số task trở lại hàng đợi khi được wake.", "Viết một future <code>Delay { until: Instant }<\/code> tự cài đặt: lần poll đầu spawn một luồng ngủ đến <code>until<\/code> rồi gọi <code>waker.wake()<\/code>, các lần poll sau kiểm tra thời gian. Chạy nó bằng executor của bạn và bằng Tokio.", "Viết hàm async <code>fetch_all(urls: Vec&lt;String&gt;) -&gt; Vec&lt;Result&lt;usize, String&gt;&gt;<\/code> giả lập tải bằng <code>sleep<\/code> ngẫu nhiên, chạy tối đa 4 yêu cầu cùng lúc bằng <code>buffer_unordered<\/code>, mỗi yêu cầu có <code>timeout<\/code> 300 ms. In thời gian tổng.", "Viết lại bài thread pool ở Chương 14 thành \"worker pool\" async: một kênh <code>tokio::sync::mpsc<\/code>, N task worker nhận job, và một kênh <code>oneshot<\/code> để trả kết quả cho người gửi.", "Cố ý viết một handler giữ <code>std::sync::MutexGuard<\/code> qua <code>.await<\/code> bên trong <code>tokio::spawn<\/code> để đọc lỗi, rồi sửa theo ba cách: khối scope riêng, <code>tokio::sync::Mutex<\/code>, và tái cấu trúc để không cần khóa (gửi lệnh qua kênh tới một task sở hữu dữ liệu).", "Định nghĩa trait <code>Storage<\/code> với method async <code>get(&amp;self, key: &amp;str) -&gt; Option&lt;Vec&lt;u8&gt;&gt;<\/code>, hai cài đặt (bộ nhớ và file qua <code>tokio::fs<\/code>). Viết hai phiên bản: generic với <code>impl Future + Send<\/code>, và <code>Arc&lt;dyn Storage&gt;<\/code> với <code>Pin&lt;Box&lt;dyn Future&gt;&gt;<\/code>. So sánh chữ ký và chi phí.", "Viết chương trình có một task tính toán nặng (vòng lặp 2 tỷ lần) chạy trực tiếp trong <code>tokio::spawn<\/code> trên runtime <code>current_thread<\/code>, cùng một task in thời gian mỗi 100 ms. Quan sát task in bị \"đứng\", rồi sửa bằng <code>spawn_blocking<\/code> hoặc <code>tokio::task::yield_now()<\/code> định kỳ.", "(Nâng cao) Viết vòng lặp <code>select!<\/code> đọc từ một <code>mpsc::Receiver<\/code> và một <code>interval<\/code> tick, dừng khi nhận Ctrl+C (<code>tokio::signal::ctrl_c<\/code>). Xác định nhánh nào cancel safe dựa vào tài liệu Tokio và giải thích vì sao vòng lặp không làm mất tin nhắn."]}, {"id": "p1c16", "num": 16, "title": "Macros — Code sinh ra code", "intro": "Ngay từ chương đầu, bạn đã dùng macro mà có thể không để ý: <code>println!<\/code>, <code>vec!<\/code>, <code>format!<\/code>, <code>#[derive(Debug)]<\/code>, <code>#[tokio::main]<\/code>. Macro là cơ chế metaprogramming (lập trình siêu hình) của Rust: code viết ra để sinh code khác tại thời điểm biên dịch. Nhờ macro, Rust có được những thứ mà hàm thông thường không làm được: nhận số lượng đối số tùy ý, sinh ra struct và impl, kiểm tra chuỗi định dạng lúc biên dịch, hay viết DSL (ngôn ngữ chuyên biệt) như <code>sqlx::query!<\/code> kiểm tra SQL với database thật. Chương này trình bày hai họ macro: declarative macro (<code>macro_rules!<\/code>) dựa trên khớp mẫu token, và procedural macro (derive, attribute, function-like) là các hàm Rust nhận và trả về luồng token, viết với crate <code>syn<\/code> và <code>quote<\/code>. Cuối chương là bảng tổng hợp các macro chuẩn hay dùng nhất.", "sections": [{"n": "16.1", "t": "Macro khác hàm như thế nào", "sub": []}, {"n": "16.2", "t": "Declarative macro với macro_rules!", "sub": ["Cú pháp và fragment specifier", "Ví dụ tổng hợp", "Xem code sau khi mở rộng", "Hygiene và $crate", "Phạm vi và export", "Thay đổi của edition 2024 với fragment expr", "Lỗi thường gặp với macro_rules!"]}, {"n": "16.3", "t": "Procedural macro", "sub": ["Ba loại procedural macro", "Thiết lập workspace", "Crate macro: derive, attribute và function-like", "Dùng macro trong crate app", "Lỗi biên dịch do macro tự sinh", "Chi phí và kinh nghiệm thực tế"]}, {"n": "16.4", "t": "Các macro chuẩn hay dùng", "sub": []}, {"n": "16.5", "t": "Khi nào nên viết macro", "sub": []}], "summary": ["Macro chạy lúc biên dịch, nhận và trả về token; code sinh ra được kiểm tra kiểu như code thường. Macro làm được điều hàm không làm được: số đối số tùy ý, sinh item, DSL.", "<code>macro_rules!<\/code> gồm các quy tắc matcher/transcriber thử lần lượt; fragment specifier (<code>expr<\/code>, <code>ident<\/code>, <code>ty<\/code>, <code>tt<\/code>, <code>literal<\/code>, <code>pat<\/code>, <code>block<\/code>...) bắt các đoạn cú pháp; <code>$(...),*<\/code>, <code>+<\/code>, <code>?<\/code> cho phép lặp.", "<code>$x:expr<\/code> được thay vào như một nút cú pháp nên không có bẫy ưu tiên toán tử như macro C; sau <code>expr<\/code> chỉ được đặt <code>=&gt;<\/code>, <code>,<\/code>, <code>;<\/code>.", "Hygiene áp dụng cho biến cục bộ trong macro; dùng đường dẫn tuyệt đối và <code>$crate<\/code> cho item. <code>#[macro_export]<\/code> để crate khác dùng.", "Edition 2024: fragment <code>expr<\/code> khớp thêm <code>const { }<\/code> và <code>_<\/code>; <code>expr_2021<\/code> giữ hành vi cũ.", "Procedural macro nằm trong crate <code>proc-macro = true<\/code>, có ba loại derive, attribute, function-like; viết với <code>syn<\/code> (parse) và <code>quote<\/code> (sinh code); báo lỗi bằng <code>syn::Error::to_compile_error<\/code>.", "Dùng <code>cargo expand<\/code> để xem code sau mở rộng, <code>trybuild<\/code> để test macro.", "Các macro chuẩn quan trọng: <code>format!<\/code>/<code>println!<\/code>/<code>write!<\/code>, <code>vec!<\/code>, <code>assert*!<\/code>, <code>dbg!<\/code>, <code>todo!<\/code>, <code>unreachable!<\/code>, <code>matches!<\/code>, <code>include_str!<\/code>, <code>env!<\/code>, <code>cfg!<\/code>, <code>concat!<\/code>, <code>stringify!<\/code>."], "exercises": ["Viết macro <code>min!<\/code> nhận một hoặc nhiều biểu thức và trả về giá trị nhỏ nhất, tương tự <code>max!<\/code> trong mục 16.2.2. Thử với số nguyên, số thực và chuỗi.", "Viết macro <code>btreemap!<\/code> giống <code>hashmap!<\/code> nhưng tạo <code>BTreeMap<\/code>, dùng đường dẫn tuyệt đối <code>::std::collections::BTreeMap<\/code> để không cần <code>use<\/code> ở nơi gọi. Thêm hỗ trợ dấu phẩy cuối.", "Viết macro <code>impl_area!<\/code> nhận danh sách <code>Kiểu =&gt; biểu_thức<\/code> và sinh <code>impl Area for Kiểu { fn area(&amp;self) -&gt; f64 { ... } }<\/code> cho mỗi kiểu, trong đó biểu thức có thể dùng <code>self<\/code>. (Gợi ý: truyền cả tên <code>self<\/code> vào macro dưới dạng <code>ident<\/code> để vượt qua hygiene.)", "Viết macro <code>newtype!(UserId: u64)<\/code> sinh tuple struct với derive <code>Debug, Clone, Copy, PartialEq, Eq, Hash<\/code>, cùng <code>impl From&lt;u64&gt;<\/code> và <code>impl Display<\/code>. Dùng <code>cargo expand<\/code> hoặc đọc kỹ để kiểm tra code sinh ra.", "Viết macro <code>enum_str!<\/code> nhận một enum chỉ có các biến thể unit và sinh thêm method <code>fn as_str(&amp;self) -&gt; &amp;'static str<\/code> dùng <code>stringify!<\/code> cho từng biến thể.", "Mở rộng derive <code>Describe<\/code> ở mục 16.3.3 để thêm method <code>fn describe(&amp;self) -&gt; String<\/code> in ra <code>TênKiểu { trường1: giá_trị, ... }<\/code> dùng <code>Debug<\/code> của từng trường. Báo lỗi biên dịch rõ ràng cho tuple struct.", "Viết attribute macro <code>#[retry(3)]<\/code> cho hàm trả về <code>Result<\/code>: gọi lại tối đa n lần khi gặp <code>Err<\/code>. Parse tham số bằng <code>syn::LitInt<\/code>.", "(Nâng cao) Viết function-like macro <code>sql_check!(\"SELECT ...\")<\/code> kiểm tra lúc biên dịch rằng chuỗi bắt đầu bằng <code>SELECT<\/code>, <code>INSERT<\/code>, <code>UPDATE<\/code> hoặc <code>DELETE<\/code> và số dấu ngoặc đóng mở cân bằng, nếu không thì báo lỗi tại đúng literal. So sánh ý tưởng với <code>sqlx::query!<\/code> ở Phần 3, Chương 8."]}, {"id": "p1c17", "num": 17, "title": "Testing, Documentation &amp; Tooling", "intro": "Một ngôn ngữ trưởng thành không chỉ là trình biên dịch mà còn là cả bộ công cụ xung quanh. Rust tích hợp sẵn trình chạy test (<code>cargo test<\/code>), trình sinh tài liệu (<code>rustdoc<\/code>, <code>cargo doc<\/code>) với ví dụ trong tài liệu được biên dịch và chạy như test, công cụ định dạng (<code>rustfmt<\/code>) và bộ phân tích tĩnh (<code>clippy<\/code>) với hàng trăm quy tắc. Hệ sinh thái bổ sung thêm benchmark thống kê (criterion), trình thông dịch phát hiện hành vi không xác định (Miri), kiểm tra lỗ hổng bảo mật trong dependency (cargo-audit). Chương này dùng một thư viện nhỏ tên <code>wallet<\/code> làm ví dụ xuyên suốt: viết unit test, integration test, doc test, test cho code async, benchmark, rồi chạy clippy và rustfmt, kèm đầu ra thật của từng công cụ. Phần 3, Chương 13 sẽ áp dụng các kỹ thuật này cho backend (mock, test handler, test với database).", "sections": [{"n": "17.1", "t": "Ba loại test trong Rust", "sub": []}, {"n": "17.2", "t": "Unit test", "sub": ["Module tests và #[cfg(test)]", "Các công cụ kiểm tra", "Đọc kết quả khi test thất bại"]}, {"n": "17.3", "t": "Integration test", "sub": []}, {"n": "17.4", "t": "Test code async", "sub": []}, {"n": "17.5", "t": "Chạy test và các tùy chọn", "sub": []}, {"n": "17.6", "t": "Tài liệu với rustdoc và doc test", "sub": ["Doc comment", "Doc test"]}, {"n": "17.7", "t": "Benchmark với criterion", "sub": []}, {"n": "17.8", "t": "Clippy: bộ phân tích tĩnh", "sub": []}, {"n": "17.9", "t": "rustfmt: định dạng code tự động", "sub": []}, {"n": "17.10", "t": "Các công cụ khác", "sub": ["cargo expand", "Miri", "Kiểm tra dependency và các công cụ hữu ích"]}], "summary": ["Rust có ba loại test: unit test (trong <code>mod tests<\/code> với <code>#[cfg(test)]<\/code>, thấy cả item private), integration test (thư mục <code>tests/<\/code>, mỗi file một crate, chỉ thấy API công khai), doc test (khối code trong <code>///<\/code>, <code>//!<\/code>).", "<code>assert!<\/code>, <code>assert_eq!<\/code>, <code>assert_ne!<\/code> kèm thông báo tùy chọn; test có thể trả <code>Result<\/code> để dùng <code>?<\/code>; <code>#[should_panic(expected = ...)]<\/code> cho test phải panic; <code>#[ignore]<\/code> cho test chậm.", "Đặt logic ứng dụng trong <code>src/lib.rs<\/code> để test được; code dùng chung cho integration test đặt ở <code>tests/common/mod.rs<\/code>.", "<code>#[tokio::test]<\/code> để test code async; dependency chỉ dùng cho test đặt trong <code>[dev-dependencies]<\/code>.", "Test chạy song song mặc định; dùng bộ lọc tên, <code>--lib<\/code>, <code>--test<\/code>, <code>--doc<\/code>, <code>-- --ignored<\/code>, <code>-- --no-capture<\/code>, <code>-- --test-threads=1<\/code> để điều khiển.", "rustdoc sinh tài liệu từ Markdown trong doc comment; các mục quy ước <code># Examples<\/code>, <code># Errors<\/code>, <code># Panics<\/code>, <code># Safety<\/code>; doc test có các chế độ <code>should_panic<\/code>, <code>compile_fail<\/code>, <code>no_run<\/code>. Edition 2024 gộp doc test vào một binary để biên dịch nhanh hơn.", "criterion cho benchmark có thống kê trên stable; luôn dùng <code>black_box<\/code> để tránh compiler tối ưu mất phần cần đo.", "Clippy phát hiện code sai hoặc chưa idiomatic; cấu hình lint qua bảng <code>[lints]<\/code> trong <code>Cargo.toml<\/code>; CI dùng <code>-D warnings<\/code>. rustfmt chuẩn hóa định dạng, <code>cargo fmt --check<\/code> trong CI.", "Miri phát hiện hành vi không xác định trong code <code>unsafe<\/code>; cargo-audit/cargo-deny kiểm tra lỗ hổng và license của dependency."], "exercises": ["Viết module <code>stack<\/code> với struct <code>Stack&lt;T&gt;<\/code> (push, pop, peek, len, is_empty) và ít nhất 6 unit test, trong đó có một test trả <code>Result<\/code>, một test <code>#[should_panic(expected = ...)]<\/code> cho method <code>pop_or_panic<\/code>, và một test <code>#[ignore]<\/code> đẩy 10 triệu phần tử.", "Viết tài liệu đầy đủ cho <code>Stack&lt;T&gt;<\/code> với mục <code># Examples<\/code> ở mỗi method public, một ví dụ <code>compile_fail<\/code> minh họa không thể truy cập trường private, và bật <code>missing_docs<\/code>. Chạy <code>cargo test --doc<\/code> và <code>cargo doc --open<\/code>.", "Tách một chương trình CLI nhỏ (ví dụ đếm từ trong file) thành <code>src/lib.rs<\/code> và <code>src/main.rs<\/code>, rồi viết integration test trong <code>tests/<\/code> kiểm tra hàm public với file tạm (dùng <code>std::env::temp_dir<\/code>).", "Viết một hàm async giả lập gọi API với <code>tokio::time::sleep<\/code> và <code>timeout<\/code>, kèm <code>#[tokio::test]<\/code> kiểm tra cả trường hợp thành công lẫn quá hạn. Thử <code>#[tokio::test(start_paused = true)]<\/code> (cần feature <code>test-util<\/code>) để test chạy tức thì mà vẫn mô phỏng thời gian.", "Dùng criterion so sánh ba cách nối 10 000 chuỗi: <code>+=<\/code> trên <code>String<\/code>, <code>format!<\/code> trong vòng lặp, và <code>String::with_capacity<\/code> kết hợp <code>push_str<\/code>. Giải thích kết quả dựa trên số lần cấp phát.", "Chạy <code>cargo clippy -- -W clippy::pedantic<\/code> trên một dự án cũ của bạn, sửa ít nhất 10 cảnh báo, và ghi lại những lint bạn quyết định <code>allow<\/code> cùng lý do.", "(Nâng cao) Viết một hàm <code>unsafe<\/code> nhỏ dùng raw pointer có lỗi off-by-one cố ý, cài toolchain nightly và chạy <code>cargo +nightly miri test<\/code> để Miri bắt lỗi. Sau đó sửa lỗi và xác nhận Miri không còn báo."]}, {"id": "p1c18", "num": 18, "title": "Unsafe, FFI &amp; Idiomatic Rust", "intro": "Mọi bảo đảm an toàn mà các chương trước trình bày đều do compiler kiểm tra một cách bảo thủ: nó thà từ chối một chương trình đúng còn hơn chấp nhận một chương trình sai. Nhưng có những việc compiler không thể kiểm chứng: gọi hàm C, thao tác trực tiếp với phần cứng, cài đặt cấu trúc dữ liệu cấp thấp như <code>Vec<\/code> hay <code>Mutex<\/code>. Cho những trường hợp đó, Rust có từ khóa <code>unsafe<\/code>: một \"cửa thoát hiểm\" có kiểm soát, nơi lập trình viên nhận trách nhiệm bảo đảm các quy tắc mà compiler không kiểm tra được. Nửa đầu chương này trình bày unsafe Rust và FFI (Foreign Function Interface): năm \"siêu năng lực\", raw pointer, cách xây dựng safe abstraction, gọi C và để C gọi Rust, <code>static mut<\/code>, <code>union<\/code>, <code>unsafe trait<\/code>. Nửa sau chuyển sang câu hỏi \"viết Rust thế nào cho đúng chất\": các pattern idiomatic (newtype, builder, typestate, RAII guard), các anti-pattern thường gặp, mẹo hiệu năng, những thay đổi đáng chú ý của edition 2024, và lộ trình học tiếp theo.", "sections": [{"n": "18.1", "t": "Unsafe Rust là gì", "sub": ["Năm siêu năng lực", "Hành vi không xác định"]}, {"n": "18.2", "t": "Raw pointer", "sub": []}, {"n": "18.3", "t": "unsafe fn, khối unsafe và quy ước SAFETY", "sub": []}, {"n": "18.4", "t": "Safe abstraction: tự viết split_at_mut", "sub": []}, {"n": "18.5", "t": "FFI: gọi C và để C gọi Rust", "sub": ["Gọi hàm C", "Edition 2024: unsafe extern và unsafe attribute", "Chuỗi và công cụ FFI"]}, {"n": "18.6", "t": "static mut, union và unsafe trait", "sub": []}, {"n": "18.7", "t": "Các pattern idiomatic", "sub": ["Bốn pattern nền tảng", "Các nguyên tắc idiomatic khác"]}, {"n": "18.8", "t": "Các anti-pattern thường gặp", "sub": []}, {"n": "18.9", "t": "Mẹo hiệu năng", "sub": []}, {"n": "18.10", "t": "Thay đổi đáng chú ý của edition 2024", "sub": ["Edition là gì", "Minh họa các thay đổi về ngôn ngữ", "Bảng tổng hợp"]}, {"n": "18.11", "t": "Lộ trình tiếp theo", "sub": []}], "summary": ["<code>unsafe<\/code> mở khóa đúng năm thao tác: dereference raw pointer, gọi hàm unsafe, truy cập <code>static mut<\/code>, implement <code>unsafe trait<\/code>, đọc trường <code>union<\/code>. Nó không tắt borrow checker hay kiểm tra kiểu.", "Vi phạm điều kiện của unsafe dẫn tới hành vi không xác định; giữ khối unsafe nhỏ, bọc trong API safe, ghi <code># Safety<\/code> cho hàm và <code>// SAFETY:<\/code> cho khối, kiểm tra bằng Miri.", "Raw pointer có thể null, treo, không có lifetime; tạo thì safe, dereference thì unsafe; dùng <code>&amp;raw const<\/code>/<code>&amp;raw mut<\/code> khi không được tạo tham chiếu.", "Safe abstraction như <code>split_at_mut<\/code> kiểm tra mọi điều kiện trước khối unsafe và để chữ ký hàm ràng buộc lifetime.", "FFI: khai báo hàm C trong <code>unsafe extern \"C\"<\/code> (bắt buộc từ edition 2024), có thể đánh dấu <code>safe fn<\/code>; xuất hàm bằng <code>#[unsafe(no_mangle)] pub extern \"C\" fn<\/code>; dùng <code>CString<\/code>/<code>CStr<\/code> cho chuỗi; không để panic chạy qua ranh giới FFI.", "Tránh <code>static mut<\/code> (edition 2024 cấm tạo tham chiếu tới nó); dùng atomics, <code>Mutex<\/code>, <code>OnceLock<\/code>. <code>union<\/code> và <code>unsafe trait<\/code> chủ yếu cho FFI và code cấp thấp.", "Pattern idiomatic: newtype (an toàn kiểu, \"parse, don't validate\"), builder (tham số tùy chọn), typestate (trạng thái trong kiểu), RAII guard (dọn dẹp trong <code>Drop<\/code>).", "Tránh clone/unwrap tràn lan, lạm dụng <code>Rc&lt;RefCell&gt;<\/code>, tham số <code>&amp;String<\/code>/<code>&amp;Vec<\/code>, <code>Deref<\/code> giả kế thừa; đo trước khi tối ưu; cấp phát trước, tái sử dụng bộ đệm, dùng iterator.", "Edition 2024 thay đổi quy tắc capture của <code>impl Trait<\/code>, phạm vi temporary của biểu thức cuối khối và <code>if let<\/code>, yêu cầu <code>unsafe extern<\/code> và unsafe attribute, cấm tham chiếu tới <code>static mut<\/code>, biến <code>set_var<\/code> thành unsafe, dành riêng từ khóa <code>gen<\/code>, và dùng resolver 3 nhận biết MSRV."], "exercises": ["Viết hàm <code>fn swap_raw(a: *mut i32, b: *mut i32)<\/code> (unsafe fn) với mục <code># Safety<\/code> đầy đủ, dùng <code>std::ptr::swap<\/code>, rồi viết một wrapper safe <code>fn swap_in_slice(v: &amp;mut [i32], i: usize, j: usize)<\/code> kiểm tra chỉ số trước khi gọi. Chạy test dưới Miri nếu có nightly.", "Tự cài đặt <code>fn my_chunks_mut(v: &amp;mut [u8], size: usize) -&gt; Vec&lt;&amp;mut [u8]&gt;<\/code> bằng raw pointer và <code>slice::from_raw_parts_mut<\/code>, với comment SAFETY cho từng khối unsafe. So sánh kết quả với <code>chunks_mut<\/code> của std.", "Khai báo và gọi các hàm C <code>strtol<\/code> và <code>getenv<\/code> qua <code>unsafe extern \"C\"<\/code>, chuyển đổi chuỗi bằng <code>CString<\/code>/<code>CStr<\/code>, xử lý trường hợp <code>getenv<\/code> trả về null. Đánh dấu hàm nào có thể là <code>safe fn<\/code> và giải thích.", "Thay thế một <code>static mut CONFIG: Option&lt;Config&gt;<\/code> trong một chương trình cũ bằng <code>OnceLock&lt;Config&gt;<\/code>, và một <code>static mut HITS: u64<\/code> bằng <code>AtomicU64<\/code>. Chứng minh phiên bản mới không cần <code>unsafe<\/code>.", "Cài đặt typestate cho <code>TcpConnection&lt;State&gt;<\/code> với ba trạng thái <code>Disconnected<\/code>, <code>Connected<\/code>, <code>Authenticated<\/code>: chỉ <code>Connected<\/code> mới có <code>authenticate<\/code>, chỉ <code>Authenticated<\/code> mới có <code>send<\/code>. Viết test <code>compile_fail<\/code> (doc test) chứng minh không thể gọi <code>send<\/code> khi chưa xác thực.", "Viết builder cho <code>struct Query { table, columns, filters, limit, order_by }<\/code> sinh câu SQL <code>SELECT ...<\/code>; <code>build()<\/code> trả lỗi nếu thiếu <code>table<\/code>. Thêm newtype <code>TableName<\/code> chỉ nhận chuỗi gồm chữ, số và dấu gạch dưới.", "Lấy một chương trình Rust bạn đã viết, chạy <code>cargo clippy -- -W clippy::pedantic<\/code> và tìm mọi <code>clone()<\/code>, <code>unwrap()<\/code>. Phân loại từng chỗ: cần thiết, thay được bằng tham chiếu, hay thay được bằng <code>?<\/code>. Ghi lại số lượng trước và sau khi sửa.", "(Nâng cao) Tạo một crate edition 2021 có hàm trả về <code>impl Iterator&lt;Item = &amp;str&gt;<\/code> và một khối <code>if let<\/code> dùng <code>Mutex::lock()<\/code> trong điều kiện; chạy <code>cargo fix --edition<\/code>, chuyển sang edition 2024 và quan sát những gì công cụ tự sửa, những gì phải sửa tay, và hành vi chương trình thay đổi ra sao."]}]}, {"id": 2, "chapters": [{"id": "p2c1", "num": 1, "title": "Phân tích giải thuật", "intro": "Trước khi cài đặt bất kỳ cấu trúc dữ liệu hay giải thuật nào, ta cần một \"thước đo\" để trả lời câu hỏi: cách làm này nhanh hay chậm, tốn bộ nhớ nhiều hay ít, và quan trọng hơn cả, nó sẽ hành xử thế nào khi dữ liệu lớn gấp 10, gấp 1000 lần? Chương này xây dựng thước đo đó: ký hiệu tiệm cận Big-O/Ω/Θ, cách phân tích độ phức tạp thời gian và không gian của một đoạn code Rust, phân tích khấu hao (amortized analysis) qua ví dụ <code>Vec<\/code> tăng gấp đôi dung lượng, cách đo thực nghiệm bằng <code>std::time::Instant<\/code> và crate <code>criterion<\/code>, cùng những lưu ý riêng khi viết giải thuật bằng Rust (kiểu <code>usize<\/code>, kiểm tra biên, iterator, ownership). Toàn bộ Phần 2 sẽ dùng lại những công cụ này, vì vậy hãy đọc kỹ chương này trước khi đi tiếp.", "sections": [{"n": "1.1", "t": "Giải thuật là gì và vì sao phải phân tích", "sub": ["Mô hình chi phí: đếm phép toán cơ bản"]}, {"n": "1.2", "t": "Ký hiệu tiệm cận: Big-O, Big-Ω, Big-Θ", "sub": ["Định nghĩa hình thức", "Quy tắc rút gọn", "Các lớp độ phức tạp thường gặp"]}, {"n": "1.3", "t": "Phân tích code thực tế", "sub": ["Các mẫu vòng lặp", "Chi phí ẩn trong các lời gọi thư viện", "Độ phức tạp không gian"]}, {"n": "1.4", "t": "Trường hợp tốt nhất, xấu nhất và trung bình", "sub": []}, {"n": "1.5", "t": "Phân tích khấu hao (amortized analysis)", "sub": ["Vec tăng gấp đôi dung lượng", "Các ví dụ khấu hao khác"]}, {"n": "1.6", "t": "Đệ quy và hệ thức truy hồi", "sub": []}, {"n": "1.7", "t": "Đo thực nghiệm", "sub": ["Đo bằng std::time::Instant", "Benchmark nghiêm túc với criterion"]}, {"n": "1.8", "t": "Lưu ý khi viết giải thuật bằng Rust", "sub": ["usize và lỗi tràn dưới (underflow)", "Kiểm tra biên (bounds checking)", "Ưu tiên iterator", "Ownership và borrow checker trong giải thuật", "Đệ quy và giới hạn stack"]}, {"n": "1.9", "t": "Bảng độ phức tạp các collection chuẩn", "sub": []}], "summary": ["Phân tích độ phức tạp đếm số phép toán cơ bản theo kích thước đầu vào và chỉ giữ tốc độ tăng trưởng; nó độc lập với máy và trình biên dịch.", "Big-O là cận trên, Big-Ω là cận dưới, Big-Θ là cận chặt. Rút gọn bằng cách bỏ hằng số và số hạng bậc thấp; cơ số logarit không quan trọng.", "Đếm số lần thân vòng lặp thực sự chạy, không chỉ đếm số vòng <code>for<\/code>: mẫu nhân đôi cho O(log n), mẫu điều hòa cho O(n log n).", "Coi chừng chi phí ẩn: <code>remove(0)<\/code>, <code>contains<\/code>, <code>chars().nth(i)<\/code>, <code>clone()<\/code> trong vòng lặp có thể biến O(n) thành O(n²).", "Không gian phụ bao gồm cả stack của đệ quy.", "Phân biệt trường hợp tốt nhất/xấu nhất/trung bình; phân tích khấu hao đảm bảo chi phí trung bình cho cả chuỗi thao tác (ví dụ <code>Vec::push<\/code> khấu hao O(1) nhờ gấp đôi capacity).", "Đo thực nghiệm với <code>--release<\/code>, <code>black_box<\/code>, lặp nhiều lần; dùng <code>criterion<\/code> cho benchmark nghiêm túc; dùng tỉ lệ nhân đôi để đoán bậc.", "Trong Rust: cẩn thận tràn dưới <code>usize<\/code> (<code>saturating_sub<\/code>, <code>checked_add_signed<\/code>, <code>windows<\/code>), ưu tiên iterator, dùng <code>swap<\/code>/<code>split_at_mut<\/code>/<code>get_disjoint_mut<\/code> cho giải thuật tại chỗ, nhớ rằng không có TCO."], "exercises": ["Xác định độ phức tạp Big-Θ của: (a) <code>5n³ + 2n log n + 100<\/code>; (b) <code>n + √n + log n<\/code>; (c) <code>2^(n+1)<\/code>; (d) <code>log(n!)<\/code>. Gợi ý: với (d), dùng <code>n!<\/code> nằm giữa <code>(n/2)^(n/2)<\/code> và <code>n^n<\/code>.", "Viết hàm đếm số lần thân vòng lặp chạy trong đoạn <code>let mut i = n; while i &gt; 0 { for _ in 0..i {} i /= 2; }<\/code> với n = 1024 và giải thích vì sao tổng là O(n) chứ không phải O(n log n). Gợi ý: <code>n + n/2 + n/4 + ... &lt; 2n<\/code>.", "Viết lại hàm <code>tong_chenh_lech_loi<\/code> thành hàm generic nhận <code>&amp;[i64]<\/code> dùng <code>iter().zip(iter().skip(1))<\/code> và viết unit test cho mảng rỗng, một phần tử, nhiều phần tử.", "Sửa chương trình mô phỏng ở mục 1.5.1 để thử hệ số tăng 1.5 thay vì 2. Tổng số phần tử bị chép thay đổi thế nào? Vì sao hệ số nhỏ hơn có thể giúp tái sử dụng bộ nhớ đã giải phóng tốt hơn?", "Dùng <code>Instant<\/code> đo thời gian của <code>v.remove(0)<\/code> lặp lại cho đến khi rỗng so với <code>VecDeque::pop_front<\/code> với n = 10⁴, 2·10⁴, 4·10⁴. Tính tỉ lệ nhân đôi và kết luận bậc của mỗi cách.", "Viết benchmark criterion so sánh <code>slice::sort<\/code> và <code>slice::sort_unstable<\/code> trên <code>Vec&lt;u32&gt;<\/code> ngẫu nhiên kích thước 10⁵. Gợi ý: dùng <code>iter_batched<\/code> với <code>BatchSize::SmallInput<\/code> để không tính thời gian clone dữ liệu.", "Chứng minh bằng phương pháp thế năng rằng nếu <code>Vec<\/code> thu nhỏ capacity xuống một nửa khi <code>len &lt; capacity/4<\/code>, thì cả <code>push<\/code> và <code>pop<\/code> đều có chi phí khấu hao O(1). Vì sao ngưỡng <code>capacity/2<\/code> lại gây ra chi phí O(n) cho một chuỗi push/pop xen kẽ?"]}, {"id": "p2c2", "num": 2, "title": "Mảng, Vec &amp; Slice — kỹ thuật cơ bản", "intro": "Mảng là cấu trúc dữ liệu nền tảng nhất: các phần tử nằm liền nhau trong bộ nhớ, truy cập theo chỉ số trong O(1) và cực kỳ thân thiện với bộ nhớ đệm CPU. Phần lớn bài toán phỏng vấn và lập trình thi đấu về mảng được giải bằng một nhóm nhỏ kỹ thuật lặp đi lặp lại: hai con trỏ (two pointers), cửa sổ trượt (sliding window), mảng cộng dồn (prefix sum), mảng hiệu (difference array), giải thuật Kadane, các phép đảo và xoay tại chỗ, cùng cách tổ chức ma trận. Chương này trình bày từng kỹ thuật với trực giác, bảng mô phỏng từng bước, cài đặt Rust idiomatic, phân tích độ phức tạp và các bẫy riêng của Rust. Kiến thức API cơ bản của <code>Vec<\/code> và slice đã có ở Phần 1, Chương 4 và Chương 8; ở đây ta tập trung vào giải thuật.", "sections": [{"n": "2.1", "t": "Mảng, Vec và slice dưới góc nhìn giải thuật", "sub": []}, {"n": "2.2", "t": "Kỹ thuật hai con trỏ (two pointers)", "sub": ["Hai con trỏ ngược chiều: two sum trên mảng đã sắp xếp", "Hai con trỏ cùng chiều: lọc tại chỗ"]}, {"n": "2.3", "t": "Cửa sổ trượt (sliding window)", "sub": ["Cửa sổ kích thước cố định", "Cửa sổ kích thước thay đổi", "Bài kinh điển: chuỗi con dài nhất không lặp ký tự"]}, {"n": "2.4", "t": "Mảng cộng dồn (prefix sum)", "sub": ["Prefix sum một chiều", "Đếm mảng con có tổng bằng k", "Prefix sum hai chiều"]}, {"n": "2.5", "t": "Mảng hiệu (difference array)", "sub": []}, {"n": "2.6", "t": "Giải thuật Kadane: mảng con có tổng lớn nhất", "sub": []}, {"n": "2.7", "t": "Đảo và xoay mảng tại chỗ", "sub": ["Xoay bằng ba lần đảo"]}, {"n": "2.8", "t": "Ma trận: Vec lồng nhau hay Vec phẳng?", "sub": []}, {"n": "2.9", "t": "Thêm các bài kinh điển và bảng tổng hợp", "sub": []}], "summary": ["Hàm giải thuật nên nhận <code>&amp;[T]<\/code>/<code>&amp;mut [T]<\/code>; <code>Vec<\/code> chỉ khi cần đổi độ dài hoặc sở hữu dữ liệu.", "Hai con trỏ ngược chiều khai thác tính đã sắp xếp để loại bỏ ứng viên; hai con trỏ cùng chiều lọc tại chỗ. Trong Rust, dùng <code>swap<\/code> để di chuyển phần tử không phải <code>Copy<\/code>.", "Cửa sổ trượt cập nhật trạng thái tăng dần; mỗi phần tử vào và ra cửa sổ tối đa một lần nên tổng O(n). Cửa sổ thay đổi theo tổng cần dữ liệu không âm.", "Prefix sum (độ dài n + 1) trả lời tổng đoạn trong O(1); kết hợp <code>HashMap<\/code> để đếm mảng con có tổng k kể cả khi có số âm. Mảng hiệu là phép ngược, cho cập nhật đoạn O(1).", "Kadane: <code>cur = max(x, cur + x)<\/code>; khởi tạo bằng phần tử đầu, trả <code>Option<\/code> cho mảng rỗng.", "Xoay mảng bằng ba lần đảo; nhớ <code>k % n<\/code> với <code>n = 0<\/code> sẽ panic.", "Ma trận phẳng (<code>Vec&lt;T&gt;<\/code> + <code>r * cot + c<\/code>) nhanh và dễ hoán đổi hơn <code>Vec&lt;Vec&lt;T&gt;&gt;<\/code>; với <code>Vec&lt;Vec&lt;T&gt;&gt;<\/code>, hoán đổi giữa hai hàng cần <code>split_at_mut<\/code> hoặc biến tạm.", "Các bẫy <code>usize<\/code>: <code>len() - 1<\/code> khi rỗng, <code>j -= 1<\/code> khi <code>j = 0<\/code>; giải quyết bằng kiểm tra đầu hàm, <code>saturating_sub<\/code>, hoặc lưu \"vị trí + 1\"."], "exercises": ["Viết <code>fn tron_hai_mang&lt;T: Ord + Clone&gt;(a: &amp;[T], b: &amp;[T]) -&gt; Vec&lt;T&gt;<\/code> trộn hai mảng đã sắp xếp bằng hai con trỏ, kèm test. Gợi ý: sau vòng lặp chính, dùng <code>extend_from_slice<\/code> cho phần còn lại.", "Bài \"Trapping Rain Water\": cho độ cao các cột, tính tổng lượng nước đọng lại. Giải bằng hai con trỏ ngược chiều trong O(n) thời gian, O(1) bộ nhớ. Gợi ý: duy trì <code>max_trai<\/code>, <code>max_phai<\/code>; dịch phía có max nhỏ hơn.", "Tìm độ dài chuỗi con dài nhất chứa nhiều nhất <code>k<\/code> ký tự phân biệt (cửa sổ trượt + <code>HashMap&lt;char, usize&gt;<\/code> đếm số lần xuất hiện).", "Cho ma trận số nguyên và nhiều truy vấn hình chữ nhật, hãy cài đặt prefix sum 2D trên ma trận phẳng <code>MaTran&lt;i64&gt;<\/code> của mục 2.8 thay vì <code>Vec&lt;Vec&lt;i64&gt;&gt;<\/code>.", "Mở rộng Kadane cho bài \"tích lớn nhất của mảng con\" (maximum product subarray). Gợi ý: số âm đảo dấu, nên duy trì cả tích lớn nhất và nhỏ nhất kết thúc tại <code>i<\/code>.", "Viết hàm duyệt ma trận theo hình xoắn ốc (spiral order) trả về <code>Vec&lt;T&gt;<\/code>. Cẩn thận với ma trận rỗng và ma trận một hàng/một cột khi giảm biên <code>usize<\/code>.", "Bài \"Maximum Sum Circular Subarray\": mảng con có thể vòng qua cuối về đầu. Gợi ý: đáp án là <code>max(kadane_max, tổng - kadane_min)<\/code>, trừ trường hợp mọi phần tử đều âm.", "Cài đặt mảng hiệu hai chiều: hỗ trợ \"cộng <code>v<\/code> vào hình chữ nhật\" trong O(1) và khôi phục lưới kết quả trong O(h·w). Viết test so sánh với cách cộng trực tiếp."]}, {"id": "p2c3", "num": 3, "title": "Xử lý chuỗi", "intro": "Chuỗi xuất hiện ở khắp nơi: phân tích log, xử lý văn bản, tìm kiếm, so khớp DNA, kiểm tra dữ liệu đầu vào. Rust có mô hình chuỗi khác hẳn C, Java hay Python: <code>String<\/code> và <code>&amp;str<\/code> luôn là UTF-8 hợp lệ, không cho phép truy cập <code>s[i]<\/code>, và phân biệt rõ byte, ký tự (<code>char<\/code>) và cụm ký tự hiển thị (grapheme). Điều đó ban đầu gây khó chịu khi giải bài thuật toán, nhưng lại ngăn được cả một lớp lỗi với dữ liệu tiếng Việt và các ngôn ngữ khác. Chương này trước hết chỉ ra cách chọn biểu diễn phù hợp (byte hay <code>char<\/code>), sau đó đi qua các bài toán kinh điển: palindrome, anagram, và ba giải thuật tìm mẫu tuyến tính quan trọng nhất là KMP, Z-algorithm và Rabin-Karp với rolling hash. Cuối chương bàn về cách xây dựng chuỗi hiệu quả. API cơ bản của <code>String<\/code> đã được giới thiệu ở Phần 1, Chương 8.", "sections": [{"n": "3.1", "t": "Chuỗi trong Rust dưới góc nhìn giải thuật", "sub": ["String, &amp;str và ba cách nhìn một chuỗi", "Chọn biểu diễn cho bài toán"]}, {"n": "3.2", "t": "Palindrome", "sub": ["Kiểm tra palindrome", "Chuỗi con palindrome dài nhất"]}, {"n": "3.3", "t": "Anagram", "sub": []}, {"n": "3.4", "t": "Tìm mẫu trong văn bản (pattern matching)", "sub": ["KMP và hàm tiền tố", "Z-algorithm", "Rabin-Karp và rolling hash", "So sánh các giải thuật tìm mẫu"]}, {"n": "3.5", "t": "Xây dựng chuỗi hiệu quả", "sub": []}], "summary": ["<code>String<\/code>/<code>&amp;str<\/code> là UTF-8; <code>len()<\/code> là số byte; không có <code>s[i]<\/code>. Cắt <code>&amp;s[a..b]<\/code> theo byte, panic nếu sai ranh giới; dùng <code>get<\/code> để an toàn.", "Chọn biểu diễn theo dữ liệu: <code>&amp;[u8]<\/code> cho ASCII (nhanh, mảng đếm 256), <code>chars()<\/code> để duyệt Unicode, <code>Vec&lt;char&gt;<\/code> khi cần truy cập ngẫu nhiên. Byte và ký tự cho kết quả khác nhau với tiếng Việt (palindrome, anagram, cửa sổ trượt).", "Hai chuỗi hiển thị giống nhau có thể khác nhau ở mức <code>char<\/code> (dựng sẵn và tổ hợp); cần chuẩn hóa Unicode khi so sánh dữ liệu từ nhiều nguồn.", "Palindrome: hai con trỏ hoặc <code>chars().eq(chars().rev())<\/code>; chuỗi con palindrome dài nhất bằng mở rộng từ tâm O(n²).", "Anagram: đếm tần suất O(n) hoặc sắp xếp O(n log n); tìm vị trí anagram bằng cửa sổ trượt.", "KMP dùng hàm tiền tố, không lùi trên văn bản, O(n + m). Z-algorithm dùng hộp Z, O(n + m); mẹo <code>Option&lt;u8&gt;<\/code> làm phân cách. Rabin-Karp dùng rolling hash, phải kiểm tra lại khi băm trùng và cộng <code>MOD<\/code> trước khi trừ.", "Thực tế dùng <code>str::find<\/code>/<code>contains<\/code> (Two-Way) hoặc crate <code>memchr<\/code>; lưu ý <code>match_indices<\/code> không trả lần khớp chồng lấn.", "Xây dựng chuỗi bằng <code>push_str<\/code>, <code>write!<\/code>, <code>with_capacity<\/code>, <code>join<\/code>; tránh <code>format!<\/code> lặp lại trong vòng lặp."], "exercises": ["Viết <code>fn dao_tu(s: &amp;str) -&gt; String<\/code> đảo thứ tự các từ trong câu, chuẩn hóa nhiều khoảng trắng thành một, không dùng <code>split_whitespace<\/code> (tự duyệt <code>char_indices<\/code>).", "Tối ưu <code>vi_tri_anagram<\/code> để mỗi bước trượt chỉ tốn O(1): duy trì biến <code>so_khop<\/code> là số chữ cái có tần suất trong cửa sổ bằng tần suất trong mẫu.", "Cài đặt giải thuật Manacher tìm chuỗi con palindrome dài nhất trong O(n). Gợi ý: chèn ký tự phân cách giữa các ký tự (có thể dùng lại mẹo <code>Option&lt;T&gt;<\/code>) để chỉ phải xử lý palindrome độ dài lẻ.", "Dùng hàm tiền tố tìm chu kỳ nhỏ nhất của chuỗi: chuỗi <code>s<\/code> dài <code>n<\/code> là lặp lại của chuỗi con độ dài <code>p = n - pi[n-1]<\/code> nếu <code>n % p == 0<\/code>. Viết hàm và test với \"abcabcabc\", \"abab\", \"abc\".", "Dùng mảng Z để đếm, với mỗi tiền tố của <code>s<\/code>, số lần tiền tố đó xuất hiện trong <code>s<\/code>.", "\"Chuỗi con lặp lại dài nhất\": tìm chuỗi con dài nhất xuất hiện ít nhất hai lần trong <code>s<\/code>. Gợi ý: tìm kiếm nhị phân trên độ dài <code>L<\/code>, với mỗi <code>L<\/code> dùng <code>BamTienTo<\/code> và <code>HashSet&lt;u64&gt;<\/code> kiểm tra có hai chuỗi con độ dài <code>L<\/code> trùng băm (nhớ kiểm tra lại để loại va chạm).", "Viết hàm so khớp ký tự đại diện (wildcard) đơn giản: <code>?<\/code> khớp đúng một ký tự, <code>*<\/code> khớp dãy bất kỳ (kể cả rỗng). Làm việc trên <code>Vec&lt;char&gt;<\/code> để đúng với tiếng Việt.", "Viết benchmark criterion so sánh <code>kmp_tim<\/code>, <code>z_tim<\/code>, <code>rabin_karp<\/code> và <code>memchr::memmem::find_iter<\/code> trên văn bản 1 MB với mẫu dài 10 và 1000 byte. Giải thích kết quả."]}, {"id": "p2c4", "num": 4, "title": "Danh sách liên kết", "intro": "Trong C, danh sách liên kết (linked list) là cấu trúc dữ liệu \"nhập môn\": vài dòng <code>struct<\/code> và con trỏ là xong. Trong Rust, nó lại nổi tiếng là khó, khó đến mức cộng đồng có hẳn một cuốn sách trực tuyến mang tên \"Learning Rust With Entirely Too Many Linked Lists\". Lý do không nằm ở danh sách liên kết, mà ở chỗ nó buộc ta đối mặt trực tiếp với ownership, borrowing và lifetime. Chương này dùng danh sách liên kết như một bài tập nâng cao về hệ thống kiểu của Rust: ta sẽ cài đặt danh sách liên kết đơn bằng <code>Option&lt;Box&lt;Node&lt;T&gt;&gt;&gt;<\/code> với đầy đủ thao tác, ba loại iterator và <code>Drop<\/code> không đệ quy; danh sách liên kết đôi bằng <code>Rc&lt;RefCell&lt;...&gt;&gt;<\/code> và <code>Weak<\/code>; tìm hiểu <code>std::collections::LinkedList<\/code>; và cuối cùng là cách tiếp cận thực dụng nhất: arena với chỉ số. Bạn nên nắm vững Phần 1, Chương 3 đến 5 (ownership, borrowing, lifetime) và Chương 13 (smart pointer) trước khi đọc.", "sections": [{"n": "4.1", "t": "Danh sách liên kết và vì sao khó trong Rust", "sub": []}, {"n": "4.2", "t": "Danh sách liên kết đơn với Option và Box", "sub": ["Thiết kế kiểu dữ liệu", "push_front, pop_front và vai trò của Option::take", "Đảo ngược, thêm vào cuối, xóa và tìm phần tử giữa", "Ba loại iterator: IntoIter, Iter, IterMut", "Drop không đệ quy", "Trộn hai danh sách đã sắp xếp"]}, {"n": "4.3", "t": "Danh sách liên kết đôi với Rc, RefCell và Weak", "sub": ["Thiết kế: ai sở hữu ai?", "Cài đặt", "Rò rỉ bộ nhớ khi dùng Rc cho cả hai chiều"]}, {"n": "4.4", "t": "std::collections::LinkedList", "sub": []}, {"n": "4.5", "t": "Giải pháp thực dụng: arena và chỉ số", "sub": ["Ý tưởng", "Cài đặt danh sách liên kết đôi trên arena", "Tư duy \"mảng như danh sách liên kết\": thuật toán Floyd"]}, {"n": "4.6", "t": "So sánh các cách cài đặt", "sub": []}], "summary": ["Danh sách liên kết hiếm khi nhanh hơn <code>Vec<\/code>/<code>VecDeque<\/code> trên phần cứng hiện đại; học nó chủ yếu để thành thạo ownership và borrowing.", "Kiểu đệ quy cần một lớp con trỏ (<code>Box<\/code>) để có kích thước xác định. <code>Option&lt;Box&lt;T&gt;&gt;<\/code> chỉ tốn 8 byte nhờ niche optimization.", "<code>Option::take()<\/code> là công cụ trung tâm: lấy giá trị ra khỏi chỗ đang mượn và để lại <code>None<\/code>. <code>as_ref<\/code>/<code>as_mut<\/code>/<code>as_deref<\/code>/<code>as_deref_mut<\/code> cho phép nhìn vào <code>Option&lt;Box&lt;Node&gt;&gt;<\/code> mà không lấy quyền sở hữu.", "\"Con trỏ tới liên kết\" <code>&amp;mut Link&lt;T&gt;<\/code> giúp thêm vào cuối, xóa giữa và trộn danh sách mà không cần xử lý riêng nút đầu.", "Ba iterator: <code>IntoIter<\/code> (bọc và <code>pop<\/code>), <code>Iter<\/code> (<code>Option&lt;&amp;Node&gt;<\/code> là <code>Copy<\/code>), <code>IterMut<\/code> (phải <code>take()<\/code> vì <code>&amp;mut<\/code> không <code>Copy<\/code>).", "Hủy mặc định của danh sách liên kết là đệ quy và tràn stack với danh sách dài: tự cài <code>Drop<\/code> bằng vòng lặp. Kiểu có <code>Drop<\/code> không cho move trường ra ngoài (E0509).", "Danh sách đôi an toàn cần <code>Rc<\/code> (mạnh) cho một chiều và <code>Weak<\/code> cho chiều ngược lại để tránh rò rỉ; <code>RefCell<\/code> chuyển kiểm tra mượn sang lúc chạy.", "<code>std::collections::LinkedList<\/code> là danh sách đôi, nhưng không có chèn/xóa giữa trên stable. Arena + chỉ số là giải pháp thực dụng, cần chỉ số thế hệ để tránh handle cũ.", "Thuật toán Floyd (rùa và thỏ) phát hiện chu trình và điểm vào chu trình với O(1) bộ nhớ."], "exercises": ["Thêm vào <code>DanhSach&lt;T&gt;<\/code> phương thức <code>xoa_thu_n_tu_cuoi(&amp;mut self, n: usize) -&gt; Option&lt;T&gt;<\/code> (xóa phần tử thứ <code>n<\/code> tính từ cuối, <code>n = 1<\/code> là phần tử cuối). Gợi ý: biết <code>len<\/code> thì quy về xóa phần tử thứ <code>len - n<\/code> từ đầu; cẩn thận khi <code>n == 0<\/code> hoặc <code>n &gt; len<\/code>.", "Viết <code>fn la_palindrome(ds: &amp;DanhSach&lt;i32&gt;) -&gt; bool<\/code> với O(1) bộ nhớ phụ bằng cách tách nửa sau, đảo ngược, so sánh, rồi khôi phục. Sau đó viết phiên bản đơn giản dùng <code>iter()<\/code> và <code>Vec<\/code>, và so sánh độ phức tạp.", "Cài đặt <code>peek_back<\/code> cho <code>DanhSach&lt;T&gt;<\/code> trong O(1) bằng cách thêm con trỏ đuôi. Vì sao con trỏ đuôi không thể là <code>&amp;mut Node&lt;T&gt;<\/code> thông thường? (Gợi ý: thử, đọc lỗi, rồi đọc về <code>*mut Node&lt;T&gt;<\/code> ở Phần 1, Chương 18.)", "Viết lại <code>tron_lien_ket<\/code> bằng đệ quy và kiểm tra với hai danh sách 10⁶ phần tử. Chuyện gì xảy ra? Chạy lại trong một thread có stack 256 MiB bằng <code>std::thread::Builder::new().stack_size(...)<\/code>.", "Viết <code>fn chia_chan_le(ds: DanhSach&lt;i32&gt;) -&gt; (DanhSach&lt;i32&gt;, DanhSach&lt;i32&gt;)<\/code> tách thành hai danh sách số chẵn và số lẻ, giữ nguyên thứ tự, không cấp phát nút mới.", "Sửa <code>DanhSachArena<\/code> dùng chỉ số thế hệ: mỗi ô có thêm <code>the_he: u32<\/code> tăng khi tái sử dụng; <code>Handle<\/code> lưu <code>(chi_so, the_he)<\/code>; <code>remove<\/code> và <code>insert_after<\/code> trả về <code>None<\/code>/panic nếu thế hệ không khớp. Viết test chứng minh <code>remove(b)<\/code> ở ví dụ mục 4.5.2 không còn xóa nhầm \"d\".", "Thêm <code>move_to_front(h: Handle)<\/code> vào <code>DanhSachArena<\/code> trong O(1). Đây là thao tác cốt lõi của LRU cache ở Chương 6.", "<code>std::collections::LinkedList<\/code> có iterator hai chiều (<code>iter().rev()<\/code>). Hãy viết một kiểu iterator riêng cho <code>DanhSachArena<\/code> và cài cả <code>Iterator<\/code> lẫn <code>DoubleEndedIterator<\/code> cho nó. Gợi ý: iterator giữ chỉ số <code>dau<\/code>, <code>cuoi<\/code> và số phần tử còn lại để biết khi nào hai đầu gặp nhau."]}, {"id": "p2c5", "num": 5, "title": "Stack, Queue và Deque", "intro": "Stack (ngăn xếp), queue (hàng đợi) và deque (hàng đợi hai đầu) là những cấu trúc dữ liệu \"hạn chế truy cập\": thay vì cho phép đọc ghi tùy ý như mảng, chúng chỉ cho thao tác ở một hoặc hai đầu. Chính sự hạn chế đó làm chúng trở thành công cụ mô hình hóa mạnh: stack cho lời gọi hàm, phân tích cú pháp, hoàn tác (undo); queue cho BFS, lập lịch, bộ đệm giữa các tiến trình; deque cho cửa sổ trượt. Chương này trình bày cách dùng <code>Vec<\/code> và <code>VecDeque<\/code> của std, tự viết một ring buffer dung lượng cố định bằng const generic, cài queue bằng hai stack với phân tích khấu hao, và quan trọng nhất là hai kỹ thuật giải thuật hay gặp: <b>monotonic stack<\/b> (ngăn xếp đơn điệu) và <b>monotonic deque<\/b> (hàng đợi đơn điệu). Hàng đợi ưu tiên (<code>BinaryHeap<\/code>) có chương riêng (Chương 12).", "sections": [{"n": "5.1", "t": "Stack: vào sau, ra trước (LIFO)", "sub": ["Khái niệm và cài đặt bằng Vec", "Kiểm tra dấu ngoặc hợp lệ", "Tính biểu thức hậu tố (RPN) và giải thuật Shunting-yard"]}, {"n": "5.2", "t": "Queue: vào trước, ra trước (FIFO)", "sub": ["Vì sao không dùng Vec làm queue", "VecDeque của std", "Tự viết ring buffer dung lượng cố định", "Queue bằng hai stack"]}, {"n": "5.3", "t": "Deque: hàng đợi hai đầu", "sub": []}, {"n": "5.4", "t": "Monotonic stack: ngăn xếp đơn điệu", "sub": ["Phần tử lớn hơn kế tiếp", "Hình chữ nhật lớn nhất trong biểu đồ cột"]}, {"n": "5.5", "t": "Monotonic deque: giá trị lớn nhất trong cửa sổ trượt", "sub": []}, {"n": "5.6", "t": "Bảng tổng hợp", "sub": []}], "summary": ["<code>Vec<\/code> là stack hoàn hảo (<code>push<\/code>, <code>pop<\/code>, <code>last<\/code>); <code>VecDeque<\/code> là queue và deque (ring buffer tự tăng dung lượng). Không dùng <code>Vec::remove(0)<\/code> làm queue.", "Kiểm tra ngoặc và tính RPN là hai ứng dụng kinh điển của stack. Khi pop toán hạng, phần tử ra trước là toán hạng phải. Shunting-yard dùng <code>&gt;=<\/code> để có kết hợp trái.", "Ring buffer dùng chỉ số <code>(dau + i) % N<\/code>; với const generic, <code>[const { None }; N]<\/code> và <code>const { assert!(..) }<\/code> cho một cài đặt không cấp phát, kiểm tra lúc biên dịch.", "<code>VecDeque::as_slices<\/code> phản ánh việc dữ liệu có thể quấn vòng; <code>make_contiguous<\/code> gom lại thành một slice.", "Queue bằng hai stack có <code>pop<\/code> O(1) khấu hao vì mỗi phần tử chỉ được chuyển một lần.", "Monotonic stack giải \"phần tử lớn/nhỏ hơn kế tiếp\" và \"hình chữ nhật lớn nhất\" trong O(n); monotonic deque giải \"max cửa sổ trượt\" trong O(n). Lập luận độ phức tạp: mỗi phần tử vào và ra tối đa một lần.", "Lưu chỉ số thay vì giá trị trong stack/deque để biết vị trí và để kiểm tra hết hạn; viết điều kiện dạng cộng (<code>dau + k &lt;= i<\/code>) để tránh tràn dưới <code>usize<\/code>."], "exercises": ["Mở rộng <code>kiem_tra_ngoac<\/code> để bỏ qua ngoặc nằm trong chuỗi ký tự <code>\"...\"<\/code> (có hỗ trợ ký tự thoát <code>\\\"<\/code>). Gợi ý: thêm một biến trạng thái \"đang trong chuỗi\".", "Viết bộ tách token cho <code>trung_to_sang_hau_to<\/code> để nhận được biểu thức không có khoảng trắng như <code>\"3+4*(2-1)\"<\/code>, kể cả số nhiều chữ số. Thêm toán tử lũy thừa <code>^<\/code> kết hợp phải (pop khi ưu tiên đỉnh lớn hơn <b>ngặt<\/b>).", "Cài <code>MinStack&lt;T: Ord + Clone&gt;<\/code> hỗ trợ <code>push<\/code>, <code>pop<\/code>, <code>min<\/code> đều O(1). Gợi ý: mỗi phần tử lưu kèm min tại thời điểm push.", "Cài <code>Iterator<\/code> (trả <code>T<\/code> theo thứ tự FIFO, tiêu thụ buffer) và <code>IntoIterator for &amp;RingBuffer<\/code> cho <code>RingBuffer&lt;T, N&gt;<\/code>.", "Cài queue hỗ trợ <code>max()<\/code> O(1) khấu hao: kết hợp ý tưởng hai stack với <code>MinStack<\/code> ở bài 3, hoặc dùng một monotonic deque phụ. So sánh hai cách.", "\"Mảng con ngắn nhất có tổng ít nhất K\" khi mảng có số âm: tính prefix sum <code>p<\/code>, rồi dùng monotonic deque giữ các chỉ số có <code>p<\/code> tăng dần; với mỗi <code>j<\/code>, pop ở đầu khi <code>p[j] - p[đầu] &gt;= K<\/code>. Viết hàm và test so với vét cạn O(n²).", "\"Trapping Rain Water\" bằng monotonic stack (khác với cách hai con trỏ ở Chương 2, bài tập 2). Giải thích vì sao hai cách cho cùng kết quả.", "Hình chữ nhật toàn số 1 lớn nhất trong ma trận nhị phân: với mỗi hàng, coi số ô 1 liên tiếp tính từ hàng đó trở lên là chiều cao cột, rồi gọi <code>hinh_chu_nhat_lon_nhat<\/code>. Độ phức tạp O(hàng × cột)."]}, {"id": "p2c6", "num": 6, "title": "Bảng băm", "intro": "Bảng băm (hash table) là cấu trúc dữ liệu được dùng nhiều nhất trong lập trình thực tế: từ điển, bộ đếm, chỉ mục, cache, tập hợp, khử trùng lặp. Nó hứa hẹn thêm, tìm và xóa trong O(1) trung bình, nhưng lời hứa đó chỉ đúng khi hàm băm tốt, va chạm được xử lý khéo và hệ số tải được kiểm soát. Chương này đi từ nguyên lý (hàm băm, va chạm, chaining, open addressing, load factor), qua hai cài đặt bảng băm generic tự viết, đến cách <code>HashMap<\/code> của std hoạt động bên trong (SwissTable, port từ crate <code>hashbrown<\/code>), hệ thống trait <code>Hash<\/code>/<code>Hasher<\/code>/<code>BuildHasher<\/code>, khi nào nên thay hàm băm mặc định, và cuối cùng là các bài kinh điển: two sum, nhóm anagram, dãy liên tiếp dài nhất và LRU cache. API cơ bản của <code>HashMap<\/code>/<code>HashSet<\/code> đã có ở Phần 1, Chương 8.", "sections": [{"n": "6.1", "t": "Từ mảng đến bảng băm", "sub": []}, {"n": "6.2", "t": "Hàm băm", "sub": ["Tính chất mong muốn", "Hash, Hasher và BuildHasher trong Rust", "Từ giá trị băm đến chỉ số ô"]}, {"n": "6.3", "t": "Xử lý va chạm", "sub": ["Nối chuỗi (separate chaining)", "Địa chỉ mở (open addressing) và dò tuyến tính", "Hệ số tải và chi phí dò"]}, {"n": "6.4", "t": "Tự cài bảng băm generic", "sub": ["Phiên bản nối chuỗi", "Phiên bản địa chỉ mở với dò tuyến tính"]}, {"n": "6.5", "t": "HashMap của std bên trong: SwissTable", "sub": ["Cấu trúc", "Những điều cần nhớ khi dùng HashMap", "Thay hàm băm: tốc độ và rủi ro"]}, {"n": "6.6", "t": "Các bài toán kinh điển", "sub": ["Two sum (mảng chưa sắp xếp)", "Nhóm các anagram", "Dãy số nguyên liên tiếp dài nhất", "LRU cache"]}, {"n": "6.7", "t": "Bảng so sánh", "sub": []}], "summary": ["Bảng băm biến khóa thành chỉ số qua hàm băm; va chạm là không tránh khỏi (nghịch lý ngày sinh). Thao tác O(1) trung bình khi hàm băm tốt và hệ số tải được kiểm soát; xấu nhất O(n).", "Hai họ xử lý va chạm: nối chuỗi (danh sách mỗi ô) và địa chỉ mở (dò trong mảng, xóa cần bia mộ). Khi vượt ngưỡng hệ số tải, băm lại với gấp đôi số ô: khấu hao O(1).", "Rust tách <code>Hash<\/code> (dữ liệu), <code>Hasher<\/code> (thuật toán), <code>BuildHasher<\/code> (nhà máy, tham số <code>S<\/code> của <code>HashMap<\/code>). Hợp đồng: <code>a == b<\/code> thì <code>hash(a) == hash(b)<\/code>; tự cài <code>Eq<\/code> thì phải tự cài <code>Hash<\/code>. <code>Borrow<\/code> cho phép tra <code>HashMap&lt;String, _&gt;<\/code> bằng <code>&amp;str<\/code>.", "<code>HashMap<\/code> của std là SwissTable (port từ <code>hashbrown<\/code>): byte điều khiển chứa h2 (7 bit cao), dò theo nhóm 16 byte bằng SIMD, hệ số tải tối đa 7/8, mặc định SipHash-1-3 với khóa ngẫu nhiên (<code>RandomState<\/code>) chống HashDoS.", "Thứ tự duyệt <code>HashMap<\/code> không xác định: sắp xếp hoặc dùng <code>BTreeMap<\/code>/<code>IndexMap<\/code> khi cần kết quả ổn định.", "Hàm băm nhanh hơn (Fx, ahash, foldhash, FNV) có thể tăng tốc đáng kể với khóa nhỏ, nhưng hàm băm yếu kết hợp với dữ liệu có cấu trúc có thể suy biến thành O(n²).", "Bài kinh điển: two sum (tra trước, chèn sau), nhóm anagram (khóa chuẩn hóa), dãy liên tiếp dài nhất (chỉ đếm từ đầu dãy), LRU cache (<code>HashMap<\/code> + danh sách đôi trên arena, tái sử dụng nút cuối)."], "exercises": ["Thêm vào <code>BangBam<\/code> một entry API đơn giản: <code>fn get_or_insert_with(&amp;mut self, k: K, f: impl FnOnce() -&gt; V) -&gt; &amp;mut V<\/code>. Cẩn thận với borrow checker khi vừa tìm vừa chèn (gợi ý: tìm chỉ số trước, rồi mới mượn).", "Cài <code>IntoIterator<\/code> (lấy quyền sở hữu) và <code>FromIterator&lt;(K, V)&gt;<\/code> cho <code>BangBam<\/code>, rồi viết test <code>collect()<\/code> từ một <code>Vec<\/code> cặp.", "Thay bia mộ trong <code>DoTuyenTinh<\/code> bằng <b>xóa dịch lùi<\/b> (backward shift deletion): sau khi xóa ô <code>i<\/code>, dịch các phần tử phía sau trong cùng cụm về trước nếu điều đó không đưa chúng ra trước vị trí băm gốc. Viết lại test so với <code>HashMap<\/code> của std.", "Đo số lần dò trung bình của <code>DoTuyenTinh<\/code> ở các hệ số tải 0.5, 0.75, 0.9 (sửa ngưỡng mở rộng) và so với bảng lý thuyết của Knuth ở mục 6.3.3.", "Viết <code>fn tan_suat_k_lon_nhat(v: &amp;[i32], k: usize) -&gt; Vec&lt;i32&gt;<\/code> trả về <code>k<\/code> phần tử xuất hiện nhiều nhất trong O(n) bằng <code>HashMap<\/code> đếm kết hợp \"bucket sort\" theo tần suất (mảng <code>Vec&lt;Vec&lt;i32&gt;&gt;<\/code> chỉ số là số lần xuất hiện).", "\"Mảng con dài nhất có tổng bằng k\": kết hợp prefix sum với <code>HashMap&lt;i64, usize&gt;<\/code> lưu vị trí <b>đầu tiên<\/b> của mỗi giá trị prefix (so sánh với bài đếm mảng con ở Chương 2).", "Mở rộng <code>LruCache<\/code> với thời hạn sống (TTL): mỗi phần tử kèm <code>Instant<\/code> hết hạn; <code>get<\/code> coi phần tử hết hạn như không tồn tại và gỡ nó. Thảo luận: có nên chủ động dọn phần tử hết hạn không, và chi phí là bao nhiêu?", "Dùng crate <code>rustc-hash<\/code> (<code>FxHashMap<\/code>) và <code>ahash<\/code> thay cho hasher tự viết trong chương trình đo ở mục 6.5.3, chạy lại và so sánh. Sau đó thử với khóa là <code>String<\/code> dài 100 byte: thứ hạng các hàm băm có thay đổi không?"]}, {"id": "p2c7", "num": 7, "title": "Đệ quy và chia để trị", "intro": "Đệ quy (recursion) là cách giải một bài toán bằng cách quy nó về các phiên bản nhỏ hơn của chính nó. Chia để trị (divide and conquer) là chiến lược thiết kế giải thuật dựa trên đệ quy: chia bài toán thành các bài con độc lập, giải từng bài con, rồi kết hợp kết quả. Nhiều giải thuật quan trọng nhất của khoa học máy tính thuộc nhóm này: merge sort, quicksort, tìm kiếm nhị phân, FFT, nhân Karatsuba. Chương này bắt đầu từ cơ chế bên dưới (call stack, giới hạn stack, việc Rust không đảm bảo tối ưu đệ quy đuôi, cách khử đệ quy), qua kỹ thuật ghi nhớ (memoization) cùng một bẫy borrow checker kinh điển, đến định lý thợ (Master theorem) để phân tích độ phức tạp, rồi áp dụng vào lũy thừa nhanh, tháp Hà Nội, đếm nghịch thế bằng merge sort và bài cặp điểm gần nhất.", "sections": [{"n": "7.1", "t": "Đệ quy và call stack", "sub": ["Cấu trúc một hàm đệ quy", "Giới hạn stack và cách nới rộng", "Rust không đảm bảo tối ưu đệ quy đuôi", "Khử đệ quy bằng stack tường minh"]}, {"n": "7.2", "t": "Ghi nhớ (memoization)", "sub": []}, {"n": "7.3", "t": "Chia để trị và định lý thợ", "sub": ["Khuôn mẫu chia để trị", "Lũy thừa nhanh", "Tháp Hà Nội", "Đếm nghịch thế bằng merge sort", "Cặp điểm gần nhất (tổng quan)"]}, {"n": "7.4", "t": "Bảng tổng hợp", "sub": []}], "summary": ["Hàm đệ quy cần trường hợp cơ sở, bước đệ quy và sự tiến triển. Mỗi lời gọi tốn một khung stack; độ sâu đệ quy chính là bộ nhớ stack phải dùng.", "Luồng chính thường có stack khoảng 8 MiB, luồng mới mặc định 2 MiB; tràn stack hủy chương trình ngay. Có thể nới bằng <code>thread::Builder::stack_size<\/code>, nhưng giải pháp bền vững là khử đệ quy.", "Rust không đảm bảo TCO (<code>become<\/code> vẫn chưa ổn định). Chuyển đệ quy đuôi thành vòng lặp; chuyển đệ quy tổng quát thành vòng lặp với <code>Vec<\/code> làm stack tường minh. Nhớ rằng hủy cấu trúc lồng sâu cũng là đệ quy ngầm.", "Ghi nhớ biến đệ quy có bài con chồng lấn từ hàm mũ thành đa thức. Trong Rust, truyền bảng ghi nhớ qua <code>&amp;mut<\/code>; không gọi đệ quy bên trong <code>entry().or_insert_with<\/code> (E0500): tra, tính, rồi chèn.", "Định lý thợ giải <code>T(n) = aT(n/b) + f(n)<\/code> bằng cách so <code>f(n)<\/code> với <code>n^(log_b a)<\/code>: lá thống trị, cân bằng (thêm thừa số log), hoặc gốc thống trị.", "Lũy thừa nhanh O(log n) áp dụng cho mọi phép toán kết hợp: số modulo, ma trận (Fibonacci thứ <code>10^18<\/code>). Nhân modulo qua <code>u128<\/code> để tránh tràn.", "Tháp Hà Nội cần đúng <code>2^n − 1<\/code> bước. Đếm nghịch thế \"ăn theo\" bước trộn của merge sort; dùng <code>split_at_mut<\/code> và một bộ đệm chung. Cặp điểm gần nhất dùng dải <code>2d<\/code> và mỗi điểm so tối đa 7 điểm."], "exercises": ["Viết hàm đệ quy <code>fn hoan_vi(v: &amp;mut Vec&lt;i32&gt;, k: usize, kq: &amp;mut Vec&lt;Vec&lt;i32&gt;&gt;)<\/code> sinh mọi hoán vị bằng cách hoán đổi phần tử <code>k<\/code> với từng phần tử phía sau. Vẽ cây đệ quy cho <code>[1, 2, 3]<\/code>. Độ sâu đệ quy và số lá là bao nhiêu?", "Chuyển hàm <code>ha_noi<\/code> thành phiên bản không đệ quy dùng stack tường minh chứa các \"việc\" dạng <code>enum Viec { Chuyen(u32, char, char, char), In(u32, char, char) }<\/code>. Kiểm tra cho cùng dãy bước với bản đệ quy.", "Tính <code>C(n, k) mod p<\/code> với <code>p = 10^9 + 7<\/code> và <code>n, k<\/code> tới <code>10^6<\/code>: dùng giai thừa và nghịch đảo modulo <code>a^(p − 2) mod p<\/code> (định lý Fermat nhỏ) qua <code>luy_thua_mod<\/code>.", "Áp dụng định lý thợ cho: (a) <code>T(n) = 4T(n/2) + n<\/code>; (b) <code>T(n) = 4T(n/2) + n²<\/code>; (c) <code>T(n) = 4T(n/2) + n³<\/code>; (d) <code>T(n) = T(n/2) + n<\/code>. Viết chương trình đếm số phép toán cho (a) và (b) với <code>n = 2^10, 2^11, 2^12<\/code> để kiểm chứng.", "Cài đặt nhân số nguyên lớn Karatsuba trên <code>Vec&lt;u32&gt;<\/code> (mỗi phần tử là một chữ số cơ số 10^4), so sánh với nhân trường học O(n²) cho các số 1000, 2000, 4000 chữ số. Từ kích thước nào Karatsuba bắt đầu nhanh hơn?", "Viết <code>fn dem_cap_tong_trong_khoang(a: &amp;[i64], lo: i64, hi: i64) -&gt; u64<\/code> đếm số cặp <code>i &lt; j<\/code> có <code>lo &lt;= a[i] + a[j] &lt;= hi<\/code> bằng chia để trị kiểu merge sort (gợi ý: trước khi trộn, với hai nửa đã sắp xếp, dùng hai con trỏ để đếm cặp chéo).", "Nâng cấp <code>cap_gan_nhat<\/code> lên O(n log n): hàm đệ quy trả về các điểm của đoạn đã được sắp xếp theo y (trộn hai nửa như merge sort), nhờ đó không phải sắp xếp lại dải ở mỗi tầng. Đo thời gian với <code>n = 10^5, 2·10^5, 4·10^5<\/code> cho cả hai phiên bản.", "Viết hàm ghi nhớ đếm số cách phân tích <code>n<\/code> thành tổng các số nguyên dương không quan tâm thứ tự (hàm phân hoạch <code>p(n)<\/code>, ví dụ <code>p(5) = 7<\/code>), dùng <code>HashMap&lt;(u32, u32), u64&gt;<\/code> với trạng thái (số còn lại, số hạng lớn nhất được dùng). Tính <code>p(100)<\/code> và kiểm tra bằng <code>190569292<\/code>."]}, {"id": "p2c8", "num": 8, "title": "Sắp xếp", "intro": "Sắp xếp là bài toán được nghiên cứu kỹ nhất trong khoa học máy tính, và cũng là nơi hội tụ gần như mọi ý tưởng thiết kế giải thuật: vét cạn, tăng dần, chia để trị, ngẫu nhiên hóa, cấu trúc dữ liệu (heap), khai thác cấu trúc của khóa (counting, radix). Dữ liệu đã sắp xếp mở đường cho tìm kiếm nhị phân, khử trùng lặp, trộn, tìm trung vị và rất nhiều giải thuật khác. Chương này cài đặt generic chín thuật toán sắp xếp kinh điển với chữ ký kiểu <code>fn sort&lt;T: Ord&gt;(v: &amp;mut [T])<\/code>, mô phỏng từng bước trên dữ liệu nhỏ, phân tích độ phức tạp và tính ổn định, rồi kiểm thử tất cả với cùng một bộ test và đếm số phép so sánh thực tế. Phần cuối đi sâu vào API sắp xếp của std (<code>sort<\/code>, <code>sort_unstable<\/code>, <code>sort_by<\/code>, <code>sort_by_key<\/code>, <code>sort_by_cached_key<\/code>, <code>select_nth_unstable<\/code>) cùng các giải thuật hiện đại đứng sau chúng: driftsort và ipnsort (từ Rust 1.81).", "sections": [{"n": "8.1", "t": "Các khái niệm nền tảng", "sub": ["Tại chỗ, ổn định, thích nghi", "Cận dưới Ω(n log n) cho sắp xếp dựa trên so sánh", "Kiểu dữ liệu và các bẫy Rust"]}, {"n": "8.2", "t": "Ba thuật toán O(n²) cơ bản", "sub": ["Bubble sort (sắp xếp nổi bọt)", "Selection sort (sắp xếp chọn)", "Insertion sort (sắp xếp chèn)"]}, {"n": "8.3", "t": "Merge sort (sắp xếp trộn)", "sub": ["Ý tưởng và mô phỏng", "Cài đặt top-down và bottom-up"]}, {"n": "8.4", "t": "Quicksort (sắp xếp nhanh)", "sub": ["Phân hoạch Lomuto và Hoare", "Chọn chốt và độ sâu đệ quy"]}, {"n": "8.5", "t": "Heap sort (sắp xếp vun đống)", "sub": []}, {"n": "8.6", "t": "Sắp xếp không dựa trên so sánh", "sub": ["Counting sort (sắp xếp đếm)", "Radix sort (sắp xếp theo cơ số)", "Bucket sort (sắp xếp theo xô)"]}, {"n": "8.7", "t": "Kiểm thử và đo đạc tất cả các thuật toán", "sub": ["Bộ test chung và đếm phép so sánh", "Đo thời gian"]}, {"n": "8.8", "t": "Sắp xếp với thư viện chuẩn", "sub": ["driftsort và ipnsort", "Bảng API"]}, {"n": "8.9", "t": "Bảng so sánh tổng hợp", "sub": []}], "summary": ["Ba tính chất cần biết của mọi thuật toán sắp xếp: tại chỗ, ổn định, thích nghi. Sắp xếp dựa trên so sánh có cận dưới Ω(n log n) (cây quyết định); counting, radix, bucket vượt qua nhờ khai thác cấu trúc khóa.", "Bubble, selection, insertion là O(n²); insertion sort là O(n + nghịch thế), ổn định và là thành phần của mọi thuật toán lai hiện đại.", "Merge sort: O(n log n) mọi trường hợp, ổn định, cần bộ nhớ phụ; dùng một bộ đệm chung, chỉ chép nửa trái, bỏ qua bước trộn khi hai nửa đã nối tiếp.", "Quicksort: phân hoạch Lomuto hoặc Hoare; chốt ngẫu nhiên tránh xấu nhất với dữ liệu đã sắp; đệ quy phía nhỏ, lặp phía lớn để độ sâu O(log n) (mẹo <code>std::mem::take(&amp;mut v)<\/code> trong Rust); phân hoạch ba đường cho dữ liệu nhiều trùng lặp.", "Heap sort: O(n log n) mọi trường hợp và O(1) bộ nhớ, nhưng chậm do truy cập nhảy cóc.", "Radix sort LSD dựa trên counting sort ổn định, nhanh hơn mọi sắp xếp so sánh với số nguyên lớn.", "std: <code>sort<\/code> (driftsort, ổn định, thích nghi, có cấp phát) và <code>sort_unstable<\/code> (ipnsort, không cấp phát, thường nhanh hơn) từ Rust 1.81; <code>Ord<\/code> không nhất quán có thể gây panic. Dùng <code>sort_by<\/code> cho thứ tự tùy biến, <code>Reverse<\/code> và tuple cho nhiều khóa, <code>total_cmp<\/code> cho số thực, <code>sort_by_cached_key<\/code> cho khóa đắt, <code>select_nth_unstable<\/code> cho trung vị/top-k.", "Kiểm thử thuật toán sắp xếp bằng so sánh với <code>slice::sort<\/code> trên dữ liệu ngẫu nhiên và các trường hợp biên; đếm phép so sánh bằng newtype có <code>Ord<\/code> tự cài."], "exercises": ["Cải tiến bubble sort: ghi nhớ vị trí lần đổi chỗ cuối cùng trong mỗi lượt và chỉ duyệt tới đó ở lượt sau. Đo số phép so sánh trên dữ liệu \"đã sắp, trừ 10 phần tử cuối ngẫu nhiên\".", "Thêm vào <code>quick_rec<\/code> một ngưỡng: khi đoạn còn tối đa 16 phần tử thì gọi <code>insertion_sort<\/code> rồi dừng. Đo thời gian với một triệu phần tử cho các ngưỡng 0, 8, 16, 32, 64.", "Biến <code>quick_sort<\/code> thành introsort: truyền thêm \"ngân sách độ sâu\" <code>2 * log2(n)<\/code>, giảm dần mỗi tầng; khi về 0 thì gọi <code>heap_sort<\/code> cho đoạn hiện tại. Xây dựng một đầu vào khiến quicksort với chốt ở giữa (<code>v[len/2]<\/code>) suy biến, và kiểm tra introsort vẫn nhanh.", "Cài đặt <b>natural merge sort<\/b>: tìm các dãy chạy tăng dần có sẵn (đảo ngược các dãy giảm ngặt), rồi trộn từng cặp dãy liền kề cho đến khi chỉ còn một. So sánh số phép so sánh với <code>merge_sort<\/code> trên dữ liệu \"nối của 5 dãy đã sắp\".", "Viết <code>fn radix_sort_i32(v: &amp;mut [i32])<\/code> dùng mẹo đảo bit dấu, và <code>fn radix_sort_chuoi(v: &amp;mut [&amp;str])<\/code> cho chuỗi ASCII độ dài tối đa 8 (MSD hoặc LSD với ký tự đệm). Kiểm tra với <code>sort<\/code> làm trọng tài.", "Sắp xếp danh bạ tiếng Việt: viết hàm khóa bỏ dấu (ánh xạ \"á\", \"à\", \"ả\", \"ã\", \"ạ\" về \"a\"...) và chữ thường để dùng với <code>sort_by_cached_key<\/code>, sao cho \"Ánh\" đứng giữa \"An\" và \"Bảo\". Vì sao <code>sort_by_cached_key<\/code> phù hợp hơn <code>sort_by_key<\/code> ở đây?", "Viết một <code>Ord<\/code> cố ý không bắc cầu (ví dụ \"oẳn tù tì\": kéo thắng bao, bao thắng búa, búa thắng kéo) rồi gọi <code>sort<\/code> trên một <code>Vec<\/code> lớn chứa các giá trị đó. Quan sát hành vi (panic hay kết quả lộn xộn) và giải thích vì sao Rust vẫn đảm bảo an toàn bộ nhớ.", "Đếm số lần <b>gán/đổi chỗ<\/b> (thay vì so sánh) của mỗi thuật toán bằng cách cài <code>Clone<\/code> tự viết cho newtype và đếm <code>swap<\/code> thủ công. Thuật toán nào ít ghi bộ nhớ nhất? Điều này quan trọng khi nào (ví dụ bộ nhớ flash)?"]}, {"id": "p2c9", "num": 9, "title": "Tìm kiếm", "intro": "Tìm kiếm là thao tác phổ biến nhất trong lập trình: kiểm tra một người dùng có tồn tại không, tìm vị trí chèn một phần tử để giữ dãy luôn có thứ tự, tìm giá trị nhỏ nhất thỏa một điều kiện... Chương này đi từ tìm kiếm tuyến tính đơn giản đến tìm kiếm nhị phân (binary search) với đầy đủ các biến thể <code>lower_bound<\/code>, <code>upper_bound<\/code>, <code>partition_point<\/code>, rồi mở rộng sang kỹ thuật cực kỳ mạnh là <b>tìm kiếm nhị phân trên đáp án<\/b> (binary search on the answer). Cuối chương là ternary search, exponential search và interpolation search. Trọng tâm không chỉ là thuật toán mà còn là cách viết chúng trong Rust sao cho không tràn số <code>usize<\/code>, không lặp vô hạn và tận dụng đúng API của thư viện chuẩn.", "sections": [{"n": "9.1", "t": "Bài toán tìm kiếm và những câu hỏi cần đặt ra", "sub": []}, {"n": "9.2", "t": "Tìm kiếm tuyến tính", "sub": ["Ý tưởng và cài đặt", "Khi nào tuyến tính lại thắng"]}, {"n": "9.3", "t": "Tìm kiếm nhị phân", "sub": ["Ý tưởng và bất biến", "Cài đặt trên nửa khoảng [lo, hi)", "Ba cái bẫy kinh điển khi viết bằng Rust", "lower_bound, upper_bound và partition_point", "API của thư viện chuẩn", "Kiểm thử tìm kiếm nhị phân"]}, {"n": "9.4", "t": "Tìm kiếm nhị phân trên đáp án", "sub": ["Tư duy \"hàm kiểm tra đơn điệu\"", "Khung <code>first_true<\/code> và các bài toán kinh điển"]}, {"n": "9.5", "t": "Các biến thể kinh điển", "sub": ["Mảng tăng dần bị xoay", "Tìm đỉnh (peak element)", "Ma trận như một mảng phẳng"]}, {"n": "9.6", "t": "Ternary search", "sub": []}, {"n": "9.7", "t": "Exponential search", "sub": []}, {"n": "9.8", "t": "Interpolation search", "sub": []}, {"n": "9.9", "t": "Bảng so sánh các thuật toán tìm kiếm", "sub": []}], "summary": ["Tìm kiếm tuyến tính O(n) không cần dữ liệu có thứ tự; trong Rust dùng <code>contains<\/code>, <code>position<\/code>, <code>find<\/code>, <code>find_map<\/code>, <code>any<\/code>, <code>all<\/code> thay vì tự viết vòng lặp.", "Tìm kiếm nhị phân O(log n) cần dãy đã sắp và truy cập ngẫu nhiên. Viết thống nhất trên nửa khoảng <code>[lo, hi)<\/code>, <code>mid = lo + (hi - lo) / 2<\/code>, nhánh phải <code>lo = mid + 1<\/code>, nhánh trái <code>hi = mid<\/code>.", "Ba bẫy trong Rust: tràn số khi <code>lo + hi<\/code>, tràn dưới <code>usize<\/code> khi <code>mid - 1<\/code> với <code>mid = 0<\/code>, vòng lặp vô hạn khi gán <code>lo = mid<\/code>.", "<code>lower_bound<\/code>/<code>upper_bound<\/code> là trường hợp riêng của <code>partition_point<\/code>; std cung cấp <code>binary_search*<\/code> (trả <code>Result&lt;usize, usize&gt;<\/code>, <code>Err<\/code> là vị trí chèn) và <code>partition_point<\/code>. Với phần tử trùng, <code>binary_search<\/code> trả về một chỉ số bất kỳ.", "Tìm kiếm nhị phân trên đáp án: biến bài tối ưu thành câu hỏi có/không đơn điệu, tìm điểm chuyển đầu tiên. Chi phí O(T log R).", "Số thực: lặp số lần cố định; so sánh <code>f64<\/code> bằng <code>total_cmp<\/code>.", "Ternary cho hàm unimodal trên số thực; với số nguyên dùng nhị phân trên độ dốc. Exponential cho dãy không biết độ dài; interpolation chỉ nên dùng khi dữ liệu phân bố đều.", "Kiểm thử bằng cách so sánh với vét cạn trên mọi đích trong một khoảng rộng hơn miền dữ liệu."], "exercises": ["Viết hàm <code>fn equal_range&lt;T: Ord&gt;(a: &amp;[T], x: &amp;T) -&gt; std::ops::Range&lt;usiz
