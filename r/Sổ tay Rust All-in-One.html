afe<\/code>.", "Macro <code>query!<\/code>/<code>query_as!<\/code>/<code>query_scalar!<\/code> kiểm tra SQL với DB thật lúc biên dịch; dùng alias <code>\"col!\"<\/code>, <code>\"col?\"<\/code>, <code>\"col: Type\"<\/code> để ghi đè suy luận. <code>cargo sqlx prepare<\/code> tạo <code>.sqlx<\/code> cho build offline với <code>SQLX_OFFLINE=true<\/code>.", "Cột NULL ánh xạ <code>Option&lt;T&gt;<\/code>; enum, JSONB (<code>Json&lt;T&gt;<\/code>) và mảng (<code>Vec&lt;T&gt;<\/code>) được hỗ trợ tốt.", "Transaction rollback tự động khi drop; luôn dùng <code>&amp;mut *tx<\/code>; giữ transaction ngắn, không gọi dịch vụ ngoài bên trong.", "Keyset pagination ổn định và nhanh hơn OFFSET cho dữ liệu lớn.", "Phân loại lỗi DB theo SQLSTATE (23505 → 409...), không lộ thông điệp lỗi gốc cho client.", "Dùng EXPLAIN để kiểm tra index, gộp truy vấn để tránh N+1, dùng <code>fetch<\/code> để stream dữ liệu lớn."], "exercises": ["Tạo database mới, viết migration đảo ngược được cho bảng <code>projects (id, owner_id, name, created_at)<\/code> có khóa ngoại tới <code>users<\/code>. Chạy <code>sqlx migrate run<\/code>, rồi <code>sqlx migrate revert<\/code> và kiểm tra bảng đã biến mất.", "Viết hàm <code>rename_user(pool, id, new_name) -&gt; Result&lt;bool, sqlx::Error&gt;<\/code> trả <code>false<\/code> nếu không có user nào được cập nhật (gợi ý: <code>rows_affected()<\/code>). Viết hai phiên bản: dùng <code>sqlx::query<\/code> và dùng <code>sqlx::query!<\/code>.", "Thêm cột <code>completed_at TIMESTAMPTZ NULL<\/code> vào <code>tasks<\/code> bằng migration mới. Viết <code>query_as!<\/code> đọc cột này và cố tình khai báo field là <code>DateTime&lt;Utc&gt;<\/code> thay vì <code>Option<\/code>: quan sát lỗi biên dịch, rồi sửa.", "Mở rộng <code>TaskFilter<\/code> với <code>status: Option&lt;TaskStatus&gt;<\/code> và <code>due_before: Option&lt;NaiveDate&gt;<\/code>, đồng thời cho phép sắp xếp tăng hoặc giảm theo tham số <code>order=asc|desc<\/code> (an toàn trước SQL injection).", "Viết hàm chuyển toàn bộ task từ user A sang user B trong một transaction, trả lỗi và rollback nếu B không tồn tại. Viết thêm phiên bản dùng <code>ON CONFLICT DO NOTHING<\/code> cho bảng <code>user_tags (user_id, tag)<\/code> có khóa chính ghép.", "Sinh 200.000 task bằng <code>push_values<\/code> (chia lô 5.000 dòng). Đo thời gian lấy trang thứ 3.000 (kích thước 20) bằng OFFSET và bằng keyset, so sánh kết quả <code>EXPLAIN ANALYZE<\/code> của hai cách.", "Viết hàm <code>users_with_tasks(pool) -&gt; Vec&lt;(User, Vec&lt;TaskSummary&gt;)&gt;<\/code> chỉ dùng đúng hai truy vấn (một cho users, một cho tasks với <code>= ANY($1)<\/code>), sau đó ghép bằng <code>HashMap<\/code>.", "(Nâng cao) Đặt <code>max_connections(2)<\/code> và <code>acquire_timeout(1 giây)<\/code>, rồi mở 5 task Tokio đồng thời, mỗi task chạy <code>SELECT pg_sleep(2)<\/code>. Quan sát lỗi <code>PoolTimedOut<\/code>, giải thích bằng định luật Little và đề xuất cấu hình hợp lý."]}, {"id": "p3c9", "num": 9, "title": "Kiến trúc dự án backend", "intro": "Viết một API nhỏ trong một file <code>main.rs<\/code> là cách học tốt, nhưng khi dự án lớn lên tới vài chục endpoint, vài bảng dữ liệu và vài người cùng làm, mã nguồn cần một cấu trúc rõ ràng: logic nghiệp vụ nằm ở đâu, truy cập database ở đâu, và làm sao kiểm thử từng phần độc lập. Chương này trình bày kiến trúc phân lớp (layered architecture) handler → service → repository, cách phân biệt domain model với DTO, repository pattern bằng trait (với <code>async fn<\/code> trong trait gốc và <code>async-trait<\/code>), các cách tiêm phụ thuộc (dependency injection) qua <code>AppState<\/code>, newtype như <code>UserId<\/code> và <code>Email<\/code>, rồi mở rộng sang clean/hexagonal architecture và tách workspace thành nhiều crate. Mọi đoạn code đều lấy từ hai ví dụ chạy được <code>f_ch09_layered.rs<\/code> và <code>f_ch09_dyn.rs<\/code>.", "sections": [{"n": "9.1", "t": "Vì sao cần kiến trúc", "sub": ["Triệu chứng của \"handler làm tất cả\"", "Nguyên tắc nền tảng"]}, {"n": "9.2", "t": "Kiến trúc phân lớp", "sub": ["Ba lớp và chiều phụ thuộc", "Trách nhiệm từng lớp", "Cây thư mục mẫu"]}, {"n": "9.3", "t": "Domain model, newtype và DTO", "sub": ["Newtype: để kiểu dữ liệu nói thay comment", "Ba loại mô hình dữ liệu", "Đừng tách quá tay"]}, {"n": "9.4", "t": "Repository pattern bằng trait", "sub": ["async fn trong trait và ràng buộc Send", "Adapter PostgreSQL", "Adapter in-memory"]}, {"n": "9.5", "t": "Service layer", "sub": []}, {"n": "9.6", "t": "Tầng HTTP: handler mỏng", "sub": []}, {"n": "9.7", "t": "Dependency injection qua AppState", "sub": ["Cách 1: generic (static dispatch)", "Cách 2: Arc&lt;dyn Trait&gt;", "So sánh hai cách"]}, {"n": "9.8", "t": "Clean architecture và hexagonal architecture", "sub": []}, {"n": "9.9", "t": "Tách workspace: domain, infra, api", "sub": ["Vì sao tách crate", "Cargo.toml của workspace", "Mã nguồn domain và infra"]}, {"n": "9.10", "t": "Những sai lầm thường gặp", "sub": []}], "summary": ["Kiến trúc phân lớp handler → service → repository tách ba mối quan tâm HTTP, nghiệp vụ và lưu trữ; phụ thuộc chỉ đi một chiều, domain không phụ thuộc ai.", "Newtype (<code>UserId<\/code>, <code>Email<\/code>) với constructor kiểm tra theo tinh thần \"parse, don't validate\" giúp trình biên dịch bảo vệ bất biến nghiệp vụ.", "Tách Row, domain model và DTO; ít nhất luôn tách DTO response để tránh lộ dữ liệu nhạy cảm. Chuyển đổi bằng <code>From<\/code>/<code>TryFrom<\/code>.", "Repository là trait; với trait công khai, viết <code>fn ... -&gt; impl Future&lt;Output = T&gt; + Send<\/code> để đảm bảo future <code>Send<\/code> cho Axum. Trait như vậy không dyn-compatible.", "DI trong Axum đi qua <code>AppState<\/code>: generic (static dispatch, chữ ký dài) hoặc <code>Arc&lt;dyn Trait&gt;<\/code> với <code>async-trait<\/code> (gọn, chọn implementation lúc runtime, chi phí Box không đáng kể).", "Composition root (<code>main<\/code>) là nơi duy nhất biết implementation cụ thể.", "Hexagonal/clean architecture: lõi định nghĩa port, adapter bên ngoài cài đặt; lợi ích lớn nhất là khả năng kiểm thử.", "Tách workspace <code>domain<\/code>/<code>infra<\/code>/<code>api<\/code> để trình biên dịch thực thi ranh giới, đánh đổi bằng boilerplate."], "exercises": ["Thêm newtype <code>TaskId(i64)<\/code> và <code>TaskTitle(String)<\/code> (1–200 ký tự, không toàn khoảng trắng) với constructor <code>parse<\/code>. Viết unit test cho các trường hợp biên.", "Mở rộng ví dụ <code>f_ch09_layered.rs<\/code> với <code>TaskRepository<\/code> (tạo, liệt kê theo user) và <code>TaskService<\/code>, đảm bảo service kiểm tra user tồn tại trước khi tạo task. Thêm route <code>POST /users/{id}/tasks<\/code>.", "Viết lại <code>UserRepository<\/code> bằng <code>#[async_trait]<\/code> và chuyển <code>AppState<\/code> sang <code>Arc&lt;dyn UserRepository&gt;<\/code>. So sánh lượng code thay đổi ở handler và ở <code>main<\/code>.", "Thêm port <code>Clock<\/code> (trait có <code>fn now(&amp;self) -&gt; DateTime&lt;Utc&gt;<\/code>) để service không gọi <code>Utc::now()<\/code> trực tiếp. Viết <code>FixedClock<\/code> cho test và chứng minh <code>created_at<\/code> trở nên xác định.", "Tạo workspace ba crate như mục 9.9 cho dự án Task Manager. Thử <code>use sqlx<\/code> trong crate <code>domain<\/code> và quan sát lỗi biên dịch; sau đó thêm feature tùy chọn <code>sqlx<\/code> cho domain như gợi ý.", "(Nâng cao) Thiết kế cơ chế transaction trải qua hai repository (ví dụ \"tạo user kèm task chào mừng\"): cho các hàm repository nhận <code>&amp;mut PgConnection<\/code>, service mở transaction và truyền <code>&amp;mut *tx<\/code> cho cả hai. Thảo luận cách giữ service không phụ thuộc trực tiếp vào sqlx."]}, {"id": "p3c10", "num": 10, "title": "Cấu hình và quản lý secret", "intro": "Cùng một binary phải chạy được trên máy lập trình viên, trong CI, trên staging và production, mỗi nơi với địa chỉ database, mức log, khóa ký JWT khác nhau. Nếu những giá trị này nằm cứng trong code, mỗi lần đổi môi trường lại phải sửa và biên dịch lại; tệ hơn, mật khẩu database sẽ nằm trong lịch sử Git mãi mãi. Chương này xây dựng một hệ thống cấu hình hoàn chỉnh: biến môi trường và file <code>.env<\/code> với <code>dotenvy<\/code>, cấu hình phân tầng với crate <code>config<\/code> (file mặc định, file theo môi trường, ghi đè bằng biến môi trường), struct <code>Settings<\/code> có kiểu, bảo vệ secret bằng <code>secrecy<\/code>, kiểm tra cấu hình ngay khi khởi động, cách test cấu hình và cách quản lý secret trong production. Ví dụ đầy đủ nằm trong file <code>f_ch10_config.rs<\/code> cùng thư mục <code>f_config/<\/code>.", "sections": [{"n": "10.1", "t": "Nguyên tắc 12-factor về cấu hình", "sub": []}, {"n": "10.2", "t": "Biến môi trường và dotenvy", "sub": ["Đọc biến môi trường với std::env", "File .env với dotenvy"]}, {"n": "10.3", "t": "Cấu hình phân tầng với crate config", "sub": ["Thứ tự ưu tiên", "File cấu hình", "Struct Settings có kiểu", "Hàm load_settings"]}, {"n": "10.4", "t": "Bảo vệ secret với secrecy", "sub": ["Secret rò rỉ bằng cách nào", "Dùng SecretString", "secrecy chặn cả những rò rỉ khó thấy"]}, {"n": "10.5", "t": "Kiểm tra cấu hình khi khởi động", "sub": ["Fail fast", "Hàm main hoàn chỉnh", "Chạy thử các kịch bản"]}, {"n": "10.6", "t": "Test cấu hình mà không đụng biến môi trường", "sub": []}, {"n": "10.7", "t": "Đưa Settings vào ứng dụng", "sub": []}, {"n": "10.8", "t": "Secret trong production", "sub": []}], "summary": ["12-factor: cấu hình thay đổi theo môi trường không thuộc về code; secret không bao giờ nằm trong Git.", "Kết hợp file TOML (mặc định và theo môi trường, không chứa secret) với biến môi trường (secret, ghi đè khi triển khai). Thứ tự ưu tiên: <code>default.toml<\/code> &lt; <code>{env}.toml<\/code> &lt; <code>.env<\/code> &lt; biến môi trường thật.", "dotenvy nạp <code>.env<\/code> cho máy dev và không ghi đè biến đã tồn tại; commit <code>.env.example<\/code>, không commit <code>.env<\/code>.", "Crate <code>config<\/code> xếp chồng nguồn; <code>Environment::with_prefix(\"APP\").prefix_separator(\"__\").separator(\"__\")<\/code> ánh xạ <code>APP__DATABASE__URL<\/code> thành <code>database.url<\/code>.", "Đọc cấu hình vào struct <code>Settings<\/code> có kiểu, ở một chỗ duy nhất, một lần khi khởi động.", "<code>SecretString<\/code> của secrecy che giá trị khi <code>Debug<\/code>, không <code>Serialize<\/code>, xóa bộ nhớ khi drop; chỉ đọc qua <code>expose_secret()<\/code>.", "Fail fast: kiểm tra kiểu (serde), ràng buộc field (validator) và ràng buộc theo môi trường (hàm riêng) trước khi mở cổng.", "Test cấu hình bằng <code>Environment::source<\/code> thay vì <code>set_var<\/code> (vốn là <code>unsafe<\/code> từ edition 2024).", "Production: lấy secret từ trình quản lý secret, ưu tiên mount file, quyền tối thiểu, xoay vòng định kỳ."], "exercises": ["Thêm nhóm cấu hình <code>[redis]<\/code> gồm <code>url: SecretString<\/code> và <code>pool_size: u32<\/code> (1–50). Đảm bảo <code>APP__REDIS__POOL_SIZE=0<\/code> khiến ứng dụng từ chối khởi động với thông báo rõ ràng.", "Thêm môi trường <code>staging<\/code> với file <code>staging.toml<\/code> riêng. Viết test chứng minh staging dùng log JSON nhưng cho phép <code>require_ssl = false<\/code>.", "Chuyển <code>access_token_ttl_secs<\/code> sang dạng chuỗi dễ đọc như <code>\"15m\"<\/code> hoặc <code>\"14d\"<\/code>, viết hàm deserialize tùy biến (gợi ý: <code>#[serde(deserialize_with = \"...\")]<\/code>, xem Chương 6) và test các giá trị sai.", "Cài đặt quy ước <code>_FILE<\/code>: nếu tồn tại biến <code>APP__DATABASE__PASSWORD_FILE<\/code>, đọc nội dung file (bỏ ký tự xuống dòng cuối) làm mật khẩu và bọc vào <code>SecretString<\/code>. Dựng <code>PgConnectOptions<\/code> bằng các setter thay vì URL.", "Viết lệnh con <code>--print-config<\/code> in toàn bộ cấu hình đã nạp dưới dạng TOML nhưng thay mọi secret bằng <code>\"***\"<\/code>. Giải thích vì sao không thể đơn giản derive <code>Serialize<\/code> cho <code>Settings<\/code>.", "(Nâng cao) Hỗ trợ xoay vòng khóa JWT: cấu hình nhận danh sách khóa <code>jwt_secrets<\/code> (khóa đầu tiên dùng để ký, mọi khóa dùng để xác minh), mỗi khóa có <code>kid<\/code>. Phác thảo cách tích hợp với <code>jsonwebtoken<\/code> ở Chương 11."]}, {"id": "p3c11", "num": 11, "title": "Authentication và Authorization", "intro": "Hai câu hỏi mà mọi API phải trả lời trước khi xử lý một request là: <i>bạn là ai?<\/i> và <i>bạn có được phép làm việc này không?<\/i> Câu hỏi thứ nhất là <b>xác thực<\/b> (authentication), câu thứ hai là <b>phân quyền<\/b> (authorization). Sai sót ở đây không gây ra lỗi giao diện hay chậm trễ, mà dẫn thẳng đến rò rỉ dữ liệu. Chương này xây dựng một hệ thống xác thực hoàn chỉnh và an toàn với Rust: băm mật khẩu bằng Argon2 (API của argon2 0.6) trong <code>spawn_blocking<\/code>, JWT với jsonwebtoken 11, extractor <code>AuthUser<\/code> và middleware xác thực trong Axum, cặp access token và refresh token có xoay vòng, lưu trong database và thu hồi được, phân quyền theo vai trò (RBAC), cookie an toàn với axum-extra, CORS, rate limiting, security headers và cuối cùng là checklist OWASP API Security Top 10. Code lấy từ bốn ví dụ đã chạy thật: <code>f_ch11_password.rs<\/code>, <code>f_ch11_jwt.rs<\/code>, <code>f_ch11_auth_api.rs<\/code> và <code>f_ch11_hardening.rs<\/code>.", "sections": [{"n": "11.1", "t": "Tổng quan", "sub": ["Session hay token", "Luồng tổng thể"]}, {"n": "11.2", "t": "Băm mật khẩu với Argon2", "sub": ["Vì sao không dùng SHA-256", "API của argon2 0.6", "Vì sao bắt buộc dùng spawn_blocking", "Chống dò tài khoản qua thời gian phản hồi"]}, {"n": "11.3", "t": "JWT với jsonwebtoken 11", "sub": ["Cấu trúc của JWT", "Cấu hình crate", "Claims và JwtKeys", "Validation: những gì được kiểm tra", "HS256 hay RS256/EdDSA"]}, {"n": "11.4", "t": "Xác thực trong Axum", "sub": ["Extractor AuthUser", "Middleware xác thực cho cả nhóm route"]}, {"n": "11.5", "t": "Access token và refresh token", "sub": ["Bài toán thu hồi JWT", "Lược đồ lưu refresh token", "Đăng nhập: phát hành cặp token", "Xoay vòng và phát hiện tái sử dụng", "Đăng xuất", "Chạy thử toàn bộ luồng"]}, {"n": "11.6", "t": "Cookie an toàn với axum-extra", "sub": []}, {"n": "11.7", "t": "Phân quyền theo vai trò (RBAC)", "sub": ["Extractor kiểm tra vai trò", "Phân quyền theo đối tượng"]}, {"n": "11.8", "t": "CORS đúng cách", "sub": []}, {"n": "11.9", "t": "Rate limiting với tower_governor", "sub": []}, {"n": "11.10", "t": "Security headers và giới hạn body", "sub": []}, {"n": "11.11", "t": "Checklist OWASP API Security Top 10 (2023)", "sub": []}], "summary": ["Authentication xác định danh tính, authorization quyết định quyền. <code>401<\/code> cho chưa xác thực, <code>403<\/code> cho không đủ quyền.", "Băm mật khẩu bằng Argon2id (m = 19 MiB, t = 2, p = 1 trở lên). API argon2 0.6: <code>hash_password(bytes)<\/code> tự sinh salt, kết quả là chuỗi PHC tự mô tả; <code>verify_password(bytes, &amp;str)<\/code>.", "Argon2 tốn 30–50 ms CPU mỗi lần: bắt buộc chạy trong <code>spawn_blocking<\/code> để không chặn worker thread của Tokio; kết hợp rate limit.", "Chống dò tài khoản bằng hash giả và thông điệp lỗi thống nhất.", "JWT được ký chứ không mã hóa; jsonwebtoken 11 cần đúng một backend (<code>rust_crypto<\/code> hoặc <code>aws_lc_rs<\/code>); <code>Validation<\/code> cố định thuật toán, kiểm tra <code>exp<\/code>, <code>iss<\/code>, <code>aud<\/code>.", "Extractor <code>AuthUser<\/code> (FromRequestParts + TypedHeader) và middleware <code>require_auth<\/code> bổ sung cho nhau; phân biệt access token và refresh token bằng claim <code>typ<\/code>.", "Access token ngắn hạn không tra DB; refresh token lưu DB, xoay vòng mỗi lần dùng, phát hiện tái sử dụng thì thu hồi cả họ.", "Refresh token trong cookie <code>HttpOnly; Secure; SameSite=Strict; Path=/auth<\/code> qua <code>CookieJar<\/code> của axum-extra.", "RBAC bằng extractor <code>AdminUser<\/code>; phân quyền theo đối tượng đưa điều kiện sở hữu vào câu SQL.", "CORS là cơ chế của trình duyệt, không phải phân quyền; liệt kê origin cụ thể, không dùng <code>*<\/code> với credentials.", "Rate limit bằng tower_governor (nhớ ConnectInfo, cẩn thận với proxy); security headers bằng <code>SetResponseHeaderLayer<\/code>; giới hạn kích thước body."], "exercises": ["Thêm endpoint <code>POST /auth/change-password<\/code> (cần <code>AuthUser<\/code>, mật khẩu cũ và mới). Sau khi đổi thành công, thu hồi mọi refresh token của người dùng. Viết kịch bản curl chứng minh refresh token cũ không còn dùng được.", "Cài đặt nâng cấp hash: khi đăng nhập thành công, phân tích chuỗi PHC (gợi ý: <code>argon2::PasswordHash::new<\/code>) và nếu <code>m_cost<\/code> nhỏ hơn cấu hình hiện tại thì băm lại và cập nhật DB.", "Giới hạn tối đa 4 phép băm Argon2 đồng thời bằng <code>tokio::sync::Semaphore<\/code> đặt trong <code>AppState<\/code>. Đo thời gian phản hồi khi gửi 20 request đăng nhập song song, trước và sau khi giới hạn.", "Thay <code>AdminUser<\/code> bằng extractor tổng quát <code>RequireRole&lt;R&gt;<\/code> với <code>R<\/code> là kiểu đánh dấu (marker) implement trait <code>RoleMarker { const ROLE: Role; }<\/code>. Thêm vai trò <code>Moderator<\/code> và một route chỉ dành cho nó.", "Thêm claim <code>ver<\/code> vào access token và cột <code>token_version INT<\/code> vào bảng <code>users<\/code>. Extractor so sánh hai giá trị (có cache trong bộ nhớ 30 giây bằng moka hoặc HashMap) để hỗ trợ \"đăng xuất mọi nơi\" có hiệu lực gần như tức thì.", "Chuyển sang ký bằng EdDSA: tạo cặp khóa Ed25519 bằng <code>openssl genpkey -algorithm ed25519<\/code>, dùng <code>EncodingKey::from_ed_pem<\/code> và <code>DecodingKey::from_ed_pem<\/code>. Thảo luận lợi ích khi có thêm một microservice chỉ cần xác minh token.", "Viết key extractor tùy biến cho tower_governor giới hạn theo email trong body của request đăng nhập (gợi ý: cân nhắc vì sao đọc body trong key extractor là khó, và giải pháp thay thế bằng bảng đếm số lần sai trong DB hoặc Redis).", "(Nâng cao) Cài đặt \"khoảng ân hạn\" 10 giây cho refresh token vừa bị thay thế: nếu token đã thu hồi được gửi lại trong 10 giây và <code>replaced_by<\/code> chưa bị dùng, trả lại access token mới thay vì thu hồi cả họ. Phân tích rủi ro an ninh của thay đổi này."]}, {"id": "p3c12", "num": 12, "title": "Logging, Tracing và Observability", "intro": "Khi một request chậm bất thường lúc 2 giờ sáng hay người dùng báo \"thỉnh thoảng bị lỗi 500\", câu hỏi đầu tiên luôn là: <i>chuyện gì đã xảy ra bên trong hệ thống?<\/i> Khả năng trả lời câu hỏi đó chỉ từ dữ liệu hệ thống phát ra, không cần thêm code hay gắn debugger, gọi là <b>khả năng quan sát<\/b> (observability). Chương này xây dựng ba trụ cột của observability cho backend Rust: log có cấu trúc và trace bằng hệ sinh thái <code>tracing<\/code> (macro, span, field, <code>#[instrument]<\/code>), cấu hình <code>tracing-subscriber<\/code> (định dạng văn bản, JSON, <code>EnvFilter<\/code>, <code>RUST_LOG<\/code>), <code>TraceLayer<\/code> của tower-http gắn với request id, metrics theo chuẩn Prometheus bằng crate <code>metrics<\/code>, tổng quan OpenTelemetry để có distributed tracing, và các endpoint kiểm tra sức khỏe <code>/health<\/code> (liveness), <code>/ready<\/code> (readiness). Ví dụ nằm trong <code>f_ch12_tracing.rs<\/code> và <code>f_ch12_http.rs<\/code>.", "sections": [{"n": "12.1", "t": "Ba trụ cột của observability", "sub": []}, {"n": "12.2", "t": "tracing: hơn cả logging", "sub": ["Vì sao không dùng println! hay crate log", "Event, level và field", "Span và cách dùng đúng với async", "#[instrument]: span tự động cho hàm"]}, {"n": "12.3", "t": "tracing-subscriber: lọc và định dạng", "sub": ["EnvFilter và RUST_LOG", "Định dạng: văn bản hay JSON"]}, {"n": "12.4", "t": "TraceLayer và request id", "sub": ["Một span cho mỗi request", "Request id: sinh, lan truyền và trả về"]}, {"n": "12.5", "t": "Metrics với Prometheus", "sub": ["Mô hình của Prometheus và crate metrics", "Cài recorder và endpoint /metrics", "Middleware ghi RED metrics"]}, {"n": "12.6", "t": "OpenTelemetry và distributed tracing", "sub": ["Tổng quan", "Kết nối tracing với OpenTelemetry"]}, {"n": "12.7", "t": "Health check: /health và /ready", "sub": ["Liveness và readiness khác nhau thế nào", "Cài đặt"]}, {"n": "12.8", "t": "Thực hành tốt và những điều cần tránh", "sub": []}], "summary": ["Observability gồm log, metrics, trace; request id hoặc trace id là sợi chỉ nối chúng.", "<code>tracing<\/code> phát event (có field cấu trúc) và span (khoảng thời gian, lồng nhau); subscriber quyết định xuất ở đâu và thế nào.", "Trong code async, dùng <code>#[instrument]<\/code> hoặc <code>.instrument(span)<\/code>, không giữ <code>span.enter()<\/code> qua <code>.await<\/code>. Dùng <code>skip_all<\/code> để tránh ghi dữ liệu nhạy cảm, <code>err<\/code> để tự ghi lỗi.", "<code>tracing-subscriber<\/code>: <code>EnvFilter<\/code> đọc <code>RUST_LOG<\/code> (ví dụ <code>info,sqlx=warn,taskapi=debug<\/code>); định dạng văn bản khi dev, JSON (<code>with_span_list(true)<\/code>) khi production.", "<code>TraceLayer<\/code> với <code>make_span_with<\/code> tạo span cho mỗi request chứa route mẫu (<code>MatchedPath<\/code>) và request id; <code>SetRequestIdLayer<\/code> đặt trước, <code>PropagateRequestIdLayer<\/code> trả id về client.", "Metrics: crate <code>metrics<\/code> + <code>metrics-exporter-prometheus<\/code> (<code>install_recorder<\/code>, tự chạy <code>run_upkeep<\/code>), endpoint <code>/metrics<\/code>; RED metrics với nhãn cardinality thấp.", "OpenTelemetry chuẩn hóa distributed tracing; <code>tracing-opentelemetry<\/code> chuyển span <code>tracing<\/code> sang OTLP mà không đổi instrumentation.", "<code>/health<\/code> (liveness) không kiểm tra phụ thuộc; <code>/ready<\/code> (readiness) kiểm tra DB với timeout và trả 503 khi chưa sẵn sàng."], "exercises": ["Thêm <code>#[instrument(skip_all, fields(user_id = %user.id))]<\/code> cho các handler ở ví dụ Chương 11 và cấu hình để mọi log trong request đăng nhập có <code>request_id<\/code> và <code>user_id<\/code> (khi đã biết). Kiểm tra không có mật khẩu nào xuất hiện trong log.", "Viết hàm <code>init_tracing(settings: &amp;LogSettings)<\/code> dùng cấu hình của Chương 10 (<code>level<\/code>, <code>json<\/code>), dùng <code>EnvFilter::try_new<\/code> để báo lỗi rõ ràng khi chuỗi level sai cú pháp.", "Thêm gauge <code>db_pool_connections{state=\"idle|used\"}<\/code> cập nhật mỗi 5 giây từ <code>pool.size()<\/code> và <code>pool.num_idle()<\/code>. Dùng <code>oha<\/code> hoặc <code>wrk<\/code> tạo tải và quan sát giá trị thay đổi.", "Loại <code>/health<\/code>, <code>/ready<\/code> và <code>/metrics<\/code> ra khỏi log của <code>TraceLayer<\/code> (gợi ý: tách thành router riêng không gắn <code>TraceLayer<\/code>, rồi <code>merge<\/code>).", "Thêm counter <code>auth_login_failures_total{reason}<\/code> với <code>reason<\/code> thuộc tập cố định (<code>bad_password<\/code>, <code>unknown_email<\/code>, <code>rate_limited<\/code>) và viết truy vấn PromQL cảnh báo khi tỷ lệ thất bại vượt 20% trong 5 phút.", "Chạy Jaeger bằng Docker, tích hợp đoạn code OpenTelemetry của mục 12.6 vào ví dụ <code>f_ch12_http.rs<\/code> (dưới dạng package riêng), gọi vài request và quan sát waterfall gồm span <code>http<\/code> và span <code>get_task<\/code>.", "(Nâng cao) Viết middleware trích xuất header <code>traceparent<\/code> và đặt làm parent của span request (gợi ý: <code>opentelemetry::global::get_text_map_propagator<\/code> và <code>tracing_opentelemetry::OpenTelemetrySpanExt::set_parent<\/code>), rồi kiểm tra bằng cách gọi API với một <code>traceparent<\/code> tự tạo."]}, {"id": "p3c13", "num": 13, "title": "Testing backend", "intro": "Trình biên dịch Rust loại bỏ được cả một lớp lỗi (null, data race, dùng bộ nhớ đã giải phóng), nhưng nó không biết rằng email trùng phải trả <code>409<\/code> chứ không phải <code>500<\/code>, hay người dùng A không được đọc task của người dùng B. Những điều đó chỉ được bảo vệ bằng test. Chương này xây dựng chiến lược kiểm thử cho backend Axum + SQLx theo từng tầng: unit test cho service với mock repository bằng mockall, test handler và router bằng <code>tower::ServiceExt::oneshot<\/code> mà không cần mở cổng mạng, test với database thật bằng <code>#[sqlx::test]<\/code> (database tạm, migrations, fixtures), integration test chạy server trên cổng ngẫu nhiên và gọi bằng reqwest, cách tổ chức thư mục test, công cụ cargo-nextest và đo độ phủ bằng cargo-llvm-cov. Mọi test trong chương đều đã chạy thật: 4 test mockall, 4 test oneshot và 5 test với PostgreSQL.", "sections": [{"n": "13.1", "t": "Chiến lược kiểm thử", "sub": ["Kim tự tháp kiểm thử", "Đặc thù của backend Rust"]}, {"n": "13.2", "t": "Unit test service với mockall", "sub": ["Service cần kiểm thử", "Viết test với kỳ vọng", "Khi kỳ vọng không được đáp ứng"]}, {"n": "13.3", "t": "Test handler và router bằng oneshot", "sub": ["Router là một tower::Service", "Viết test"]}, {"n": "13.4", "t": "Test với database thật: #[sqlx::test]", "sub": ["Cơ chế hoạt động", "Test repository", "Fixtures"]}, {"n": "13.5", "t": "Integration test: server thật trên cổng ngẫu nhiên", "sub": ["Mẫu TestApp", "Mở rộng TestApp"]}, {"n": "13.6", "t": "Tổ chức test trong dự án", "sub": ["Vị trí đặt test", "Test và chế độ offline của SQLx", "Đặt tên và nguyên tắc"]}, {"n": "13.7", "t": "Công cụ: cargo-nextest và cargo-llvm-cov", "sub": ["cargo-nextest", "Đo độ phủ với cargo-llvm-cov"]}, {"n": "13.8", "t": "Những lỗi thường gặp", "sub": []}], "summary": ["Kim tự tháp kiểm thử: nhiều unit test, ít E2E; với backend, test với database thật ở tầng giữa có giá trị đặc biệt cao.", "Unit test service bằng mockall: <code>#[cfg_attr(test, mockall::automock)]<\/code> trên trait; <code>expect_xxx().with(..).times(n).returning(..)<\/code>; phương thức trả <code>impl Future<\/code> cần <code>Box::pin(async { .. })<\/code> trong <code>returning<\/code>. Mock là strict; ưu tiên kiểm tra kết quả hơn tương tác.", "Test router bằng <code>tower::ServiceExt::oneshot<\/code>: không mở cổng, chạy đủ routing, extractor, middleware; dùng <code>http_body_util::BodyExt::collect<\/code> đọc body; viết test dạng bảng.", "<code>#[sqlx::test]<\/code>: mỗi test một database tạm, tự chạy migrations (<code>migrations = \"./...\"<\/code>) và fixtures (đường dẫn tương đối với file test), xóa khi pass, giữ lại khi fail.", "Integration test: bind cổng 0, <code>tokio::spawn(axum::serve(..))<\/code>, gọi bằng reqwest; kết hợp với <code>#[sqlx::test]<\/code> để vừa cô lập vừa nhanh.", "Tổ chức: unit test cạnh code, integration test trong <code>tests/<\/code>, helper trong <code>tests/common/mod.rs<\/code>; <code>cargo sqlx prepare -- --all-targets<\/code> khi test dùng macro.", "cargo-nextest chạy mỗi test một tiến trình, song song tốt, có retry và timeout; cargo-llvm-cov đo độ phủ, dùng để tìm vùng chưa test chứ không phải chỉ số tuyệt đối."], "exercises": ["Viết unit test (không cần mock) cho newtype <code>Email::parse<\/code> ở Chương 9 với ít nhất 8 trường hợp dạng bảng: hợp lệ, có khoảng trắng, chữ hoa, thiếu <code>@<\/code>, thiếu domain, quá 254 ký tự.", "Thêm vào <code>RegisterService<\/code> yêu cầu: nếu gửi mail thất bại thì đăng ký vẫn thành công nhưng phải ghi lại vào hàng đợi gửi lại (trait <code>RetryQueue<\/code>). Viết test với mockall dùng <code>Sequence<\/code> để khẳng định thứ tự <code>insert<\/code> rồi <code>send_welcome<\/code> rồi <code>enqueue<\/code>.", "Viết test oneshot cho middleware <code>require_auth<\/code> của Chương 11: không có token trả 401 kèm header <code>www-authenticate<\/code>, token hết hạn trả 401, token hợp lệ trả 200. (Gợi ý: tạo token trong test bằng <code>JwtKeys<\/code> với secret cố định.)", "Chuyển <code>f_ch13_db_test.rs<\/code> thành cấu trúc <code>tests/<\/code> chuẩn trong một crate riêng: <code>src/lib.rs<\/code> chứa <code>app()<\/code>, <code>tests/common/mod.rs<\/code> chứa <code>TestApp<\/code>, <code>tests/fixtures/*.sql<\/code>, và dùng cú pháp <code>fixtures(\"users\", \"tasks\")<\/code>.", "Viết integration test cho luồng refresh token của Chương 11 với reqwest bật <code>cookie_store<\/code>: đăng nhập, gọi <code>/auth/refresh<\/code> hai lần, rồi dùng lại cookie cũ và khẳng định cả họ token bị thu hồi.", "Viết test kiểm tra phân quyền theo đối tượng: dùng fixture hai người dùng, người dùng B gọi <code>GET /tasks/{id}<\/code> với task của A và phải nhận 404. Giải thích vì sao đây là một trong những test quan trọng nhất của API.", "Cài cargo-nextest và cargo-llvm-cov, chạy <code>cargo llvm-cov nextest --html<\/code> cho dự án Chương 17, tìm hai nhánh xử lý lỗi chưa được phủ và viết test cho chúng."]}, {"id": "p3c14", "num": 14, "title": "OpenAPI &amp; Thiết kế REST API", "intro": "Một API tốt không chỉ chạy đúng mà còn phải dễ hiểu, dễ dùng và ổn định theo thời gian. Người dùng API của bạn (đội frontend, ứng dụng di động, đối tác bên ngoài, hay chính bạn sáu tháng sau) cần một bản \"hợp đồng\" mô tả chính xác: có những endpoint nào, nhận tham số gì, trả về cấu trúc JSON ra sao, lỗi trông như thế nào và cần xác thực kiểu gì. Chương này trình bày hai mảng gắn chặt với nhau: (1) sinh tài liệu OpenAPI tự động từ code Rust bằng crate <code>utoipa<\/code> 6 và hiển thị bằng Swagger UI (<code>utoipa-swagger-ui<\/code> 10); (2) các quy ước thiết kế REST API thực chiến: đặt tên tài nguyên, chọn HTTP method và status code, versioning, phân trang, lọc, sắp xếp, định dạng lỗi và idempotency.", "sections": [{"n": "14.1", "t": "OpenAPI là gì và vì sao cần", "sub": ["Code-first hay design-first"]}, {"n": "14.2", "t": "Thiết lập utoipa và Swagger UI", "sub": []}, {"n": "14.3", "t": "Mô tả kiểu dữ liệu với <code>ToSchema<\/code>", "sub": ["Các thuộc tính <code>#[schema(...)]<\/code> hay dùng"]}, {"n": "14.4", "t": "Tham số query, path, header với <code>IntoParams<\/code>", "sub": []}, {"n": "14.5", "t": "Mô tả endpoint với <code>#[utoipa::path]<\/code>", "sub": []}, {"n": "14.6", "t": "Gom tài liệu với <code>#[derive(OpenApi)]<\/code> và khai báo bảo mật", "sub": []}, {"n": "14.7", "t": "Phục vụ Swagger UI và chạy thử", "sub": ["Sinh client từ spec"]}, {"n": "14.8", "t": "Thiết kế REST API: quy ước thực chiến", "sub": ["Tài nguyên và URL", "Ngữ nghĩa HTTP method", "Bảng status code nên dùng"]}, {"n": "14.9", "t": "Versioning API", "sub": []}, {"n": "14.10", "t": "Phân trang, lọc và sắp xếp", "sub": ["Offset pagination", "Cursor (keyset) pagination", "Lọc và sắp xếp"]}, {"n": "14.11", "t": "Định dạng lỗi thống nhất", "sub": []}, {"n": "14.12", "t": "Idempotency cho POST", "sub": []}, {"n": "14.13", "t": "Kiểm tra tài liệu tự động", "sub": []}], "summary": ["OpenAPI là hợp đồng máy đọc được của API: từ đó sinh tài liệu tương tác, SDK client, mock và contract test.", "<code>utoipa<\/code> theo hướng code-first: <code>#[derive(ToSchema)]<\/code> cho kiểu dữ liệu, <code>#[derive(IntoParams)]<\/code> cho tham số query/path, <code>#[utoipa::path]<\/code> cho handler, <code>#[derive(OpenApi)]<\/code> gom tất cả; doc comment trở thành mô tả.", "utoipa đọc thuộc tính serde để schema khớp JSON thật; dùng <code>value_type<\/code> cho kiểu đặc biệt; khai báo security scheme bằng <code>Modify<\/code>.", "<code>utoipa-swagger-ui<\/code> với feature <code>vendored<\/code> phục vụ Swagger UI mà không cần mạng lúc build; cân nhắc bảo vệ hoặc tắt ở production.", "Quy ước REST: danh từ số nhiều, method đúng ngữ nghĩa (safe/idempotent), status code chính xác (201 + Location, 204, 401 vs 403, 404 cho tài nguyên của người khác, 409, 422).", "Version theo URL (<code>/api/v1<\/code>) bằng <code>Router::nest<\/code>; chỉ tăng version khi có breaking change.", "Phân trang offset (đơn giản) hoặc cursor (ổn định, nhanh); whitelist cột sắp xếp; giới hạn kích thước trang.", "Một định dạng lỗi thống nhất với <code>code<\/code> ổn định; idempotency key cho POST quan trọng; kiểm tra spec tự động trong CI."], "exercises": ["Thêm endpoint <code>PUT /api/v1/books/{id}<\/code> và <code>DELETE /api/v1/books/{id}<\/code> vào ví dụ, kèm <code>#[utoipa::path]<\/code> đầy đủ (200/204/404). Kiểm tra trên Swagger UI.", "Thêm tham số <code>sort<\/code> (giá trị <code>title<\/code>, <code>-title<\/code>, <code>year<\/code>, <code>-year<\/code>) vào <code>ListParams<\/code> dưới dạng enum với <code>#[serde(rename = \"-title\")]<\/code>... và đảm bảo schema hiển thị đúng danh sách giá trị cho phép.", "Chuyển <code>ApiError<\/code> sang định dạng RFC 9457 (<code>type<\/code>, <code>title<\/code>, <code>status<\/code>, <code>detail<\/code>, <code>instance<\/code>) với header <code>content-type: application/problem+json<\/code>. Cập nhật annotation <code>responses<\/code> tương ứng.", "Bảo vệ <code>/swagger-ui<\/code> và <code>/api-docs/openapi.json<\/code> bằng HTTP Basic Auth qua một middleware <code>from_fn<\/code>, chỉ bật khi biến môi trường <code>ENABLE_DOCS=true<\/code>.", "Cài đặt cursor pagination cho danh sách sách: cursor là base64 của <code>title|id<\/code>, response có <code>next_cursor<\/code> và <code>has_more<\/code>. Viết test cho trường hợp trang cuối.", "Viết middleware idempotency đơn giản lưu trong <code>HashMap<\/code> (bộ nhớ) cho <code>POST /api/v1/books<\/code>: cùng <code>Idempotency-Key<\/code> trả lại đúng response cũ (cả status và header <code>Location<\/code>). Sau đó suy nghĩ: cần thay đổi gì để chạy đúng khi có nhiều instance server?", "Viết test kiểm tra spec: mọi operation đều có ít nhất một response lỗi được khai báo và mọi path có <code>security<\/code> đều tham chiếu tới scheme tồn tại. (Gợi ý: duyệt <code>doc.paths.paths<\/code>.)"]}, {"id": "p3c15", "num": 15, "title": "Hiệu năng &amp; Caching", "intro": "Rust cho bạn điểm xuất phát rất tốt: không có bộ gom rác (garbage collector) gây khựng, abstraction gần như không tốn chi phí, và Tokio phục vụ hàng chục nghìn kết nối chỉ với vài thread. Nhưng một API Rust vẫn có thể chậm nếu nó chặn runtime, mở quá nhiều (hoặc quá ít) kết nối database, truy vấn lặp lại cùng một dữ liệu, hoặc nhận nhiều việc hơn khả năng xử lý cho đến khi sụp. Chương này đi qua các đòn bẩy hiệu năng quan trọng nhất của backend Axum + SQLx: cấu hình biên dịch, bộ cấp phát bộ nhớ, tránh chặn runtime, kích thước connection pool, cache bằng Redis và moka, backpressure/timeout, rồi cách đo bằng load test và profiler. Mọi con số trong chương được đo thật trên máy thử nghiệm của tác giả (2 CPU, dùng chung với tiến trình khác), chỉ mang tính minh họa xu hướng.", "sections": [{"n": "15.1", "t": "Tư duy hiệu năng: đo trước, tối ưu sau", "sub": ["Độ trễ, thông lượng và phân vị", "Định luật Little"]}, {"n": "15.2", "t": "Tối ưu lúc biên dịch", "sub": ["Profile release cho server"]}, {"n": "15.3", "t": "Bộ cấp phát bộ nhớ: mimalloc và jemalloc", "sub": []}, {"n": "15.4", "t": "Đừng chặn runtime", "sub": ["Vì sao blocking phá hỏng tail latency", "Thí nghiệm đo được", "Nhận diện và xử lý code chặn"]}, {"n": "15.5", "t": "Kích thước connection pool", "sub": ["Toán học của pool", "Thí nghiệm: pool to hơn không nhanh hơn", "Cấu hình PgPool cho production"]}, {"n": "15.6", "t": "Caching: nguyên lý và các mẫu", "sub": ["Cache ở đâu và cache cái gì?", "Cache-aside", "Nhất quán và invalidation", "Stampede, penetration và TTL jitter"]}, {"n": "15.7", "t": "Cache Redis với deadpool-redis", "sub": []}, {"n": "15.8", "t": "Cache in-memory với moka", "sub": ["API cơ bản và chống stampede", "Hai tầng cache L1/L2"]}, {"n": "15.9", "t": "Backpressure, load shedding và timeout", "sub": ["Vì sao hàng đợi không giới hạn là kẻ thù", "Ngăn xếp tower: load_shed, giới hạn đồng thời, timeout", "Bẫy: ConcurrencyLimitLayer qua Router::layer", "Timeout ở mọi tầng"]}, {"n": "15.10", "t": "Load test", "sub": []}, {"n": "15.11", "t": "Profiling", "sub": ["Flamegraph CPU", "tokio-console"]}], "summary": ["Đo trước khi tối ưu; theo dõi p95/p99 thay vì trung bình; định luật Little <code>L = λ × W<\/code> giúp ước lượng số request đồng thời, kích thước pool và hàng đợi.", "Profile release cho server: <code>lto<\/code>, <code>codegen-units = 1<\/code>, <code>strip<\/code>; giữ <code>panic = \"unwind\"<\/code>; tạo profile <code>profiling<\/code> có debug symbol cho profiler.", "Thay bộ cấp phát bằng mimalloc hoặc jemalloc chỉ với <code>#[global_allocator]<\/code>, có lợi rõ khi cấp phát chéo thread và trên musl.", "Không chặn worker của Tokio: dùng API async, <code>spawn_blocking<\/code> (kèm semaphore cho việc CPU nặng), rayon hoặc <code>block_in_place<\/code>. Một handler chặn có thể làm p50 của endpoint khác tăng hàng trăm lần.", "Pool lớn hơn không nhanh hơn: tính theo thông lượng × thời gian giữ kết nối, giới hạn theo số lõi DB và tổng <code>max_connections<\/code> của mọi replica; đặt <code>acquire_timeout<\/code> ngắn, <code>statement_timeout<\/code>, map <code>PoolTimedOut<\/code> thành 503.", "Cache-aside: đọc cache, miss thì đọc DB rồi ghi cache với TTL + jitter; khi ghi thì cập nhật DB rồi xóa key; TTL là lưới an toàn; lỗi cache không được làm hỏng request.", "moka cho cache in-process có TTL/TTI và gộp request đồng thời (<code>get_with<\/code>, <code>try_get_with<\/code>); Redis cho cache dùng chung giữa replica; có thể kết hợp L1/L2.", "Backpressure và load shedding bằng tower (<code>load_shed<\/code>, giới hạn đồng thời, <code>timeout<\/code>) với <code>HandleErrorLayer<\/code>; dùng <code>GlobalConcurrencyLimitLayer<\/code> để giới hạn thật sự toàn cục.", "Load test bằng oha, wrk, k6 trên bản release, cẩn thận coordinated omission; profiling CPU bằng flamegraph/samply, phân tích task bằng tokio-console."], "exercises": ["Chạy lại thí nghiệm mục 15.4.2 nhưng thay <code>std::thread::sleep<\/code> bằng vòng lặp tính toán thuần CPU khoảng 300 ms. So sánh ba phương án: chạy trực tiếp, <code>spawn_blocking<\/code>, và <code>spawn_blocking<\/code> kèm <code>Semaphore<\/code> 1 permit. Giải thích p99 của <code>/fast<\/code> trong từng trường hợp.", "Sửa thí nghiệm pool ở mục 15.5.2 để dùng <code>SELECT pg_sleep(0.02)<\/code> (không tốn CPU). Kết quả khác gì so với truy vấn tốn CPU? Điều đó nói gì về kích thước pool khi truy vấn chủ yếu chờ khóa hoặc I/O?", "Thêm negative caching vào ví dụ mục 15.7: khi sản phẩm không tồn tại, lưu một giá trị đánh dấu với TTL 30 giây; đảm bảo endpoint tạo sản phẩm mới xóa giá trị đánh dấu đó.", "Cài đặt cache hai tầng moka (TTL 10 giây) + Redis (TTL 5 phút) cho <code>GET /products/{id}<\/code>; đếm số lần chạm Redis và DB khi gửi 1 000 request đồng thời cho cùng id.", "Viết integration test (Chương 13) chứng minh <code>GlobalConcurrencyLimitLayer::new(3)<\/code> kết hợp <code>load_shed<\/code> trả đúng ba response 200 khi gửi 10 request đồng thời chia cho hai route. Thay bằng <code>.concurrency_limit(3)<\/code> và quan sát test thất bại.", "Thêm middleware đo thời gian xử lý và xuất histogram <code>http_request_duration_seconds<\/code> bằng crate <code>metrics<\/code> (Chương 12). Chạy <code>oha -q 200<\/code> rồi <code>oha -q 2000<\/code> (kèm <code>--latency-correction<\/code>), so sánh p99 và tìm \"điểm gãy\" của server trên máy bạn.", "(Nâng cao) Dùng <code>cargo flamegraph --profile profiling<\/code> để tìm hàm tốn CPU nhất của endpoint đăng nhập trong dự án Task Manager (Chương 17). Chứng minh bằng flamegraph rằng argon2 chạy trên thread của <code>spawn_blocking<\/code> chứ không phải worker của Tokio."]}, {"id": "p3c16", "num": 16, "title": "Background Jobs, Messaging &amp; Real-time", "intro": "Không phải việc gì cũng nên làm trong lúc client đang chờ response. Gửi email xác nhận, tạo ảnh thumbnail, đồng bộ dữ liệu sang hệ thống khác, tổng hợp báo cáo hằng đêm — những việc này chậm, có thể thất bại tạm thời và cần thử lại, nên được đẩy ra <b>xử lý nền (background processing)<\/b>. Chiều ngược lại, nhiều ứng dụng cần <b>đẩy (push)<\/b> dữ liệu tới client ngay khi có sự kiện: tin nhắn chat, thông báo \"task vừa được giao cho bạn\". Chương này xây dựng từng lớp: worker trong tiến trình với <code>mpsc<\/code> và tắt an toàn bằng <code>CancellationToken<\/code>/<code>TaskTracker<\/code>, hàng đợi job bền vững trên PostgreSQL với <code>FOR UPDATE SKIP LOCKED<\/code>, outbox pattern, job định kỳ, tổng quan message broker, rồi real-time bằng WebSocket và Server-Sent Events. Nền tảng về task, channel và <code>select!<\/code> đã có ở Chương 3; ở đây ta tập trung vào thiết kế để không mất việc, không làm trùng việc và không treo khi deploy.", "sections": [{"n": "16.1", "t": "Các lựa chọn xử lý nền", "sub": []}, {"n": "16.2", "t": "Worker trong tiến trình và tắt an toàn", "sub": ["Bounded channel là backpressure", "Ví dụ hoàn chỉnh: worker, job định kỳ và graceful shutdown", "Giải thích: CancellationToken, TaskTracker và thứ tự tắt"]}, {"n": "16.3", "t": "Hàng đợi job bền vững trên PostgreSQL", "sub": ["Vì sao lại là PostgreSQL?", "Ngữ nghĩa của FOR UPDATE SKIP LOCKED", "Ví dụ hoàn chỉnh: 4 worker, retry, dead letter, LISTEN/NOTIFY", "At-least-once và idempotency"]}, {"n": "16.4", "t": "Outbox pattern", "sub": []}, {"n": "16.5", "t": "Job định kỳ", "sub": ["tokio::time::interval", "tokio-cron-scheduler và chống chạy trùng giữa nhiều instance"]}, {"n": "16.6", "t": "Message broker: tổng quan", "sub": []}, {"n": "16.7", "t": "Real-time với WebSocket", "sub": ["broadcast channel và hiện tượng Lagged", "Phòng chat WebSocket"]}, {"n": "16.8", "t": "Server-Sent Events cho thông báo", "sub": []}, {"n": "16.9", "t": "Mở rộng real-time ra nhiều instance", "sub": []}], "summary": ["Chọn cơ chế xử lý nền theo câu hỏi \"crash lúc này có mất việc không\": <code>tokio::spawn<\/code>/<code>mpsc<\/code> chỉ cho việc mất được; việc quan trọng cần hàng đợi bền vững.", "Hàng đợi trong tiến trình nên dùng channel bounded + <code>try_send<\/code> (trả 503 khi đầy) và dispatcher có giới hạn đồng thời.", "Graceful shutdown: <code>CancellationToken<\/code> phát tín hiệu dừng, <code>with_graceful_shutdown<\/code> chờ request đang chạy, <code>rx.close()<\/code> để drain, <code>TaskTracker::close()<\/code> + <code>wait()<\/code> có timeout ngắn hơn grace period của orchestrator.", "<code>FOR UPDATE SKIP LOCKED<\/code> cho phép nhiều worker nhận job song song mà không chờ nhau và không trùng; chiến lược claim + lease cần reaper; retry bằng exponential backoff, hết lượt thì chuyển <code>dead<\/code>; <code>LISTEN/NOTIFY<\/code> giảm độ trễ nhưng vẫn cần poll dự phòng.", "Mọi hàng đợi và broker thực tế là at-least-once; hiệu ứng phải idempotent (bảng khóa idempotency với <code>UNIQUE<\/code>, <code>ON CONFLICT DO NOTHING<\/code>, idempotency key).", "Outbox pattern loại bỏ dual write: ghi sự kiện cùng transaction với dữ liệu, relay publish sau, consumer dedupe theo <code>event_id<\/code>.", "Job định kỳ: <code>interval<\/code> với <code>MissedTickBehavior<\/code> phù hợp, hoặc <code>tokio-cron-scheduler<\/code> (6 trường có giây, UTC); khi nhiều replica dùng <code>pg_try_advisory_xact_lock<\/code> hoặc enqueue có khóa duy nhất.", "Broker (RabbitMQ/lapin, Kafka/rdkafka, NATS/async-nats) cho quy mô lớn và nhiều hệ thống; ngữ nghĩa ack và idempotency không đổi.", "<code>broadcast<\/code> là nền của real-time trong một tiến trình: receiver chậm nhận <code>Lagged(n)<\/code> thay vì làm chậm bên gửi; WebSocket cho hai chiều, SSE cho một chiều đơn giản; nhiều replica cần lớp fan-out (Redis Pub/Sub, NATS, <code>LISTEN/NOTIFY<\/code>)."], "exercises": ["Trong ví dụ mục 16.2, đổi <code>select!<\/code> của dispatcher thành không có <code>biased;<\/code> và chạy lại nhiều lần với SIGTERM. Quan sát và giải thích sự khác biệt trong log \"drain\".", "Thêm endpoint <code>GET /jobs/stats<\/code> vào hàng đợi Postgres ở mục 16.3, trả về số job theo từng trạng thái và tuổi của job <code>pending<\/code> lâu nhất. Đây là hai số đo quan trọng nhất để cảnh báo hàng đợi bị nghẽn.", "Sửa <code>claim<\/code> để nhận tối đa 5 job một lần (<code>IN (... LIMIT 5)<\/code>) và xử lý song song bằng <code>JoinSet<\/code>. Đo thời gian hoàn tất 1 000 job với 1, 2, 4 worker.", "Viết bài kiểm tra cho chiến lược lease: nhận một job, \"giả chết\" (không gọi <code>complete<\/code>), chạy <code>reap_stale<\/code> với lease 1 giây và chứng minh worker khác nhận lại được job đó.", "Mở rộng outbox ở mục 16.4: thay <code>mpsc<\/code> bằng một <code>broadcast<\/code> có hai \"dịch vụ\" consumer độc lập (email và thống kê), mỗi dịch vụ có bảng <code>processed_events<\/code> riêng. Chứng minh mỗi dịch vụ xử lý mỗi sự kiện đúng một lần dù relay phát lại.", "Thêm xác thực vào phòng chat: client gửi JWT qua query <code>?token=...<\/code>, handler kiểm tra token (Chương 11) trước khi gọi <code>on_upgrade<\/code> và lấy tên người dùng từ claim <code>sub<\/code> thay vì từ path.", "Thêm <code>Event::id(..)<\/code> tăng dần cho ví dụ SSE và lưu 100 thông báo gần nhất trong bộ nhớ; khi client kết nối lại với header <code>Last-Event-ID<\/code>, phát bù các thông báo bị lỡ trước khi chuyển sang stream trực tiếp.", "(Nâng cao) Cho phòng chat chạy được trên hai instance (cổng 3311 và 3313) bằng cách fan-out qua <code>LISTEN/NOTIFY<\/code> của Postgres với <code>PgListener<\/code>: mỗi tin nhắn được <code>pg_notify('chat', ...)<\/code> và mỗi instance chuyển notification nhận được vào <code>broadcast<\/code> cục bộ."]}, {"id": "p3c17", "num": 17, "title": "Dự án mẫu hoàn chỉnh: Task Manager API", "intro": "Mười sáu chương trước đã lần lượt giới thiệu từng mảnh ghép của một backend Rust: Cargo, Tokio, Axum, Serde, xử lý lỗi, SQLx, cấu hình, xác thực, tracing, testing, OpenAPI. Chương này lắp ráp tất cả thành một dịch vụ hoàn chỉnh có thể chạy thật: <b>Task Manager API<\/b>, một REST API quản lý công việc cá nhân với đăng ký, đăng nhập bằng JWT, CRUD task theo từng người dùng, phân trang, lọc, tìm kiếm, sắp xếp, tài liệu OpenAPI và bộ integration test chạy trên PostgreSQL thật.", "sections": [{"n": "17.1", "t": "Mục tiêu và phạm vi dự án", "sub": ["Danh sách tính năng", "Danh sách endpoint", "Crate và vai trò"]}, {"n": "17.2", "t": "Kiến trúc tổng thể", "sub": ["Các tầng và hướng phụ thuộc", "Cây thư mục"]}, {"n": "17.3", "t": "Thiết lập dự án", "sub": ["Cargo.toml", "rustfmt.toml và .env.example"]}, {"n": "17.4", "t": "Cơ sở dữ liệu và migrations", "sub": ["Lược đồ dữ liệu", "Migration tạo bảng users", "Migration tạo bảng tasks"]}, {"n": "17.5", "t": "Nền móng: cấu hình, lỗi, trạng thái, telemetry", "sub": ["config.rs: cấu hình có kiểu", "error.rs: một kiểu lỗi cho toàn bộ API", "state.rs: trạng thái dùng chung", "telemetry.rs: log có cấu trúc"]}, {"n": "17.6", "t": "Xác thực: mật khẩu, JWT và extractor", "sub": ["password.rs: Argon2id trong spawn_blocking", "jwt.rs: phát hành và kiểm tra token", "extractor.rs và auth/mod.rs"]}, {"n": "17.7", "t": "Models và DTO", "sub": ["models/user.rs", "models/task.rs", "models/mod.rs và extract.rs"]}, {"n": "17.8", "t": "Tầng repository", "sub": ["repository/mod.rs và user_repo.rs", "task_repo.rs"]}, {"n": "17.9", "t": "Tầng service và routes", "sub": ["services/mod.rs và auth_service.rs", "routes/health.rs", "routes/auth.rs", "routes/mod.rs và routes/tasks.rs"]}, {"n": "17.10", "t": "OpenAPI và Swagger UI", "sub": []}, {"n": "17.11", "t": "Lắp ráp ứng dụng: lib.rs và main.rs", "sub": ["lib.rs", "main.rs"]}, {"n": "17.12", "t": "Chạy dự án", "sub": ["Chuẩn bị database và cấu hình", "Khởi động server", "Swagger UI"]}, {"n": "17.13", "t": "Kịch bản kiểm thử bằng curl", "sub": ["Chuẩn bị shell", "Health check", "Đăng ký và đăng nhập", "Tạo và xem task", "Danh sách: lọc, tìm kiếm, sắp xếp, phân trang", "Cập nhật một phần", "Quyền sở hữu và xóa task", "Các ca lỗi đầu vào", "Log phía server"]}, {"n": "17.14", "t": "Integration test", "sub": []}, {"n": "17.15", "t": "Hướng mở rộng", "sub": []}], "summary": ["Task Manager API ghép các kỹ thuật của 16 chương trước thành một dịch vụ hoàn chỉnh: Axum 0.8, SQLx 0.9 với PostgreSQL, Argon2 + JWT, validator, utoipa, tracing, integration test.", "Kiến trúc phân tầng <code>routes -&gt; services -&gt; repository<\/code> với các module cắt ngang (<code>config<\/code>, <code>error<\/code>, <code>state<\/code>, <code>telemetry<\/code>); <code>main.rs<\/code> mỏng, mọi thứ nằm trong <code>lib.rs<\/code> để test gọi được <code>build_app<\/code>.", "<code>AppError<\/code> + <code>IntoResponse<\/code> + <code>From&lt;sqlx::Error&gt;<\/code> cho phép handler dùng <code>?<\/code> khắp nơi mà client vẫn nhận lỗi JSON thống nhất; mã SQLSTATE 23505 thành 409, lỗi nội bộ chỉ ghi log.", "Các extractor <code>ValidatedJson<\/code>, <code>ValidatedQuery<\/code>, <code>AppPath<\/code>, <code>AuthUser<\/code> đưa validation và xác thực vào <b>kiểu của tham số<\/b>: handler chỉ chạy khi dữ liệu hợp lệ và người dùng đã đăng nhập.", "Phân quyền theo chủ sở hữu được thực thi ngay trong SQL (<code>AND user_id = $2<\/code>), trả 404 thay vì 403.", "SQL động an toàn với <code>QueryBuilder<\/code>: giá trị qua <code>push_bind<\/code>, tên cột qua whitelist, escape ký tự đại diện của LIKE; sqlx 0.9 chặn chuỗi SQL động không được đánh dấu ngay lúc biên dịch.", "PATCH dùng <code>Option&lt;Option&lt;T&gt;&gt;<\/code> và một câu <code>UPDATE<\/code> nguyên tử với <code>COALESCE<\/code>/<code>CASE<\/code>.", "Argon2 chạy trong <code>spawn_blocking<\/code>; khóa JWT tạo một lần và chia sẻ qua <code>Arc<\/code>; bí mật bọc trong <code>SecretString<\/code>.", "Middleware: request id xuyên suốt log và response, TraceLayer, CORS, timeout, giới hạn body; graceful shutdown lắng nghe cả SIGTERM.", "Migration nhúng vào binary, chạy lúc khởi động hoặc bằng <code>taskapi migrate<\/code>; <code>#[sqlx::test]<\/code> cho mỗi test một database riêng."], "exercises": ["Thêm trường <code>tags TEXT[]<\/code> cho task (migration mới, model, DTO) và tham số lọc <code>?tag=rust<\/code>. Gợi ý: toán tử <code>= ANY(tags)<\/code> và <code>push_bind<\/code> với <code>String<\/code>.", "Loại bỏ kênh rò rỉ thời gian trong <code>login<\/code>: khi email không tồn tại, vẫn chạy <code>verify_password<\/code> với một chuỗi hash giả tạo sẵn (lưu trong <code>LazyLock<\/code>) trước khi trả lỗi. Đo thời gian phản hồi hai trường hợp trước và sau khi sửa.", "Thêm endpoint <code>GET /api/v1/tasks/stats<\/code> trả số task theo từng trạng thái của người dùng hiện tại (một truy vấn <code>GROUP BY status<\/code>), kèm <code>#[utoipa::path]<\/code> và một integration test.", "Bật extension <code>pg_trgm<\/code> trong một migration mới, tạo index GIN trên <code>title<\/code> và <code>description<\/code>, rồi dùng <code>EXPLAIN ANALYZE<\/code> so sánh kế hoạch truy vấn tìm kiếm trước và sau khi có index với 100.000 task giả lập.", "Chuyển <code>task_repo::find<\/code> và <code>task_repo::create<\/code> sang <code>query_as!<\/code>, chạy <code>cargo sqlx prepare<\/code>, commit thư mục <code>.sqlx/<\/code> và xác nhận <code>SQLX_OFFLINE=true cargo build<\/code> thành công khi tắt PostgreSQL.", "Thay phân trang OFFSET bằng phân trang keyset cho kiểu sắp xếp mặc định: response trả thêm <code>next_cursor<\/code> (mã hóa <code>created_at<\/code> và <code>id<\/code>), request nhận <code>?cursor=...<\/code>. Viết test bảo đảm duyệt hết các trang không bỏ sót và không trùng task nào.", "Cài đặt refresh token: bảng <code>refresh_tokens(id, user_id, token_hash, expires_at, revoked_at)<\/code>, endpoint <code>POST /auth/refresh<\/code> (xoay vòng token) và <code>POST /auth/logout<\/code> (thu hồi). Gợi ý: lưu SHA-256 của token, không lưu token gốc.", "Tách repository thành trait <code>TaskRepository<\/code> với hai cài đặt: PostgreSQL và in-memory (<code>RwLock&lt;HashMap&gt;<\/code>). Đưa nó vào <code>AppState<\/code> dưới dạng <code>Arc&lt;dyn TaskRepository&gt;<\/code> và viết unit test cho handler bằng bản in-memory, không cần database."]}, {"id": "p3c18", "num": 18, "title": "Đóng gói &amp; Triển khai", "intro": "Một API chỉ thật sự có giá trị khi nó chạy ổn định trên máy chủ, tự khởi động lại khi gặp sự cố, cập nhật phiên bản mà người dùng không nhận ra, và để lại đủ dấu vết khi có chuyện. Chương này đưa Task Manager API của Chương 17 từ <code>cargo run<\/code> trên máy cá nhân lên production theo ba con đường phổ biến: container với Docker và docker-compose, máy chủ ảo (VPS) với systemd + nginx + TLS, và Kubernetes. Xuyên suốt là một pipeline CI trên GitHub Actions kiểm tra mọi commit, cùng các nguyên tắc chung cho mọi nền tảng: binary release tối ưu, cấu hình qua biến môi trường, chạy migration an toàn, tắt máy nhẹ nhàng (graceful shutdown) và quan sát hệ thống.", "sections": [{"n": "18.1", "t": "Chuẩn bị binary cho production", "sub": ["Profile release", "Cấu hình qua biến môi trường", "Những gì binary cần lúc chạy"]}, {"n": "18.2", "t": "Đóng gói bằng Docker", "sub": ["Dockerfile đa tầng với cargo-chef", ".dockerignore", "Chọn image runtime", "SQLX_OFFLINE và thư mục .sqlx"]}, {"n": "18.3", "t": "docker-compose cho môi trường phát triển", "sub": []}, {"n": "18.4", "t": "Chạy migration khi triển khai", "sub": []}, {"n": "18.5", "t": "Graceful shutdown và triển khai không gián đoạn", "sub": []}, {"n": "18.6", "t": "CI với GitHub Actions", "sub": []}, {"n": "18.7", "t": "Triển khai lên VPS: systemd, nginx, TLS", "sub": ["Chuẩn bị máy chủ", "Dịch vụ systemd", "nginx làm reverse proxy", "TLS với Let's Encrypt (certbot)", "Cập nhật phiên bản"]}, {"n": "18.8", "t": "Triển khai lên Kubernetes", "sub": ["ConfigMap và Secret", "Deployment", "Service và triển khai"]}, {"n": "18.9", "t": "Quan sát hệ thống trong production", "sub": []}], "summary": ["Profile release với <code>lto<\/code>, <code>codegen-units = 1<\/code>, <code>strip<\/code> cho binary nhanh và gọn; giữ <code>panic = \"unwind\"<\/code> để một handler panic không kéo sập cả server.", "Cùng một image chạy ở mọi môi trường, khác nhau chỉ ở biến môi trường; bí mật đi qua Secret hoặc file quyền 600, không bao giờ nằm trong image hay Git.", "Dockerfile đa tầng với cargo-chef cache riêng lớp dependency; runtime <code>debian-slim<\/code> hoặc distroless, người dùng không có quyền root, <code>ENTRYPOINT<\/code> dạng exec để nhận SIGTERM.", "docker-compose với healthcheck và <code>depends_on: condition: service_healthy<\/code> cho môi trường dev và staging.", "Migration chạy lúc khởi động, bằng <code>taskapi migrate<\/code>, hoặc bằng initContainer; advisory lock của sqlx bảo đảm an toàn khi nhiều instance cùng chạy; thay đổi phá vỡ lược đồ theo mẫu expand/contract.", "Triển khai không gián đoạn cần cả graceful shutdown phía ứng dụng lẫn <code>preStop<\/code>, readiness probe và rolling update <code>maxUnavailable: 0<\/code> phía hạ tầng; liveness không bao giờ kiểm tra database.", "CI trên GitHub Actions: fmt, clippy <code>-D warnings<\/code>, test với PostgreSQL service container, <code>cargo audit<\/code>, rồi build và đẩy image gắn tag SHA.", "VPS: systemd (restart, hardening, <code>ExecStartPre<\/code> migrate, journald) + nginx (TLS, HTTP/2, header bảo mật, request id) + certbot tự gia hạn.", "Kubernetes: ConfigMap, Secret, Deployment với ba loại probe, initContainer migrate, securityContext chặt chẽ, Service ClusterIP.", "Quan sát: log JSON có request id xuyên suốt, metrics RED, tracing phân tán, cảnh báo theo triệu chứng."], "exercises": ["Build image bằng Dockerfile của chương, ghi lại kích thước bằng <code>docker images<\/code>. Sau đó lần lượt thêm profile release ở mục 18.1.1 và chuyển runtime sang distroless; so sánh kích thước image và thời gian build lại khi chỉ sửa một dòng trong <code>src/<\/code>.", "Thêm lệnh <code>taskapi healthcheck<\/code> gọi <code>GET http://127.0.0.1:$APP_PORT/health<\/code> và thoát với mã 0 hoặc 1, rồi dùng nó cho chỉ thị <code>HEALTHCHECK<\/code> trong Dockerfile và <code>healthcheck<\/code> của service <code>app<\/code> trong docker-compose (image không có curl).", "Giới hạn số tác vụ Argon2 chạy đồng thời bằng một <code>tokio::sync::Semaphore<\/code> đặt trong <code>AppState<\/code> (ví dụ tối đa bằng số CPU). Dùng <code>oha<\/code> hoặc <code>k6<\/code> bắn 200 request đăng nhập đồng thời, so sánh bộ nhớ đỉnh (<code>docker stats<\/code>) trước và sau.", "Viết job <code>deploy<\/code> trong workflow CI: sau khi đẩy image, SSH vào VPS, tải binary hoặc image mới, chạy <code>taskapi migrate<\/code> rồi <code>systemctl restart taskapi<\/code>, cuối cùng gọi <code>/ready<\/code> để xác nhận; tự động báo lỗi nếu bước kiểm tra thất bại.", "Tạo <code>deny.toml<\/code> bằng <code>cargo deny init<\/code>, chỉ cho phép các giấy phép MIT, Apache-2.0, BSD-3-Clause, ISC, Unicode-3.0, rồi thêm <code>cargo deny check<\/code> vào CI. Crate nào vi phạm, và bạn xử lý thế nào?", "Trên một cluster thử nghiệm (kind hoặc minikube), triển khai PostgreSQL và <code>taskapi<\/code>, rồi chạy một vòng lặp gọi API liên tục trong khi <code>kubectl set image<\/code> sang phiên bản mới. Đếm số request thất bại khi có và khi bỏ hook <code>preStop<\/code>.", "Thêm endpoint <code>/metrics<\/code> dùng crate <code>metrics<\/code> và <code>metrics-exporter-prometheus<\/code> (Chương 12) với counter request theo route và status, histogram độ trễ; viết một <code>ServiceMonitor<\/code> (hoặc cấu hình scrape) và một cảnh báo khi tỉ lệ 5xx vượt 1% trong 5 phút."]}, {"id": "p3c19", "num": 19, "title": "Phụ lục", "intro": "Chương cuối gom lại những thứ bạn sẽ mở ra nhiều lần khi làm dự án thật: checklist trước khi đưa API lên production, bảng tra cứu crate theo nhóm kèm phiên bản dùng trong sách, danh sách lỗi thường gặp với thông báo lỗi <b>thật<\/b> (được tác giả tái hiện bằng cách biên dịch và chạy các ví dụ hỏng với Rust 1.97, axum 0.8.9, sqlx 0.9.0, tokio 1.54) kèm nguyên nhân và cách sửa, lộ trình học tiếp và tài liệu tham khảo. Các thông báo lỗi dài được xuống dòng cho vừa trang và lược bớt phần lặp (đánh dấu <code>...<\/code>).", "sections": [{"n": "19.1", "t": "Checklist production", "sub": []}, {"n": "19.2", "t": "Bảng cheat sheet crate", "sub": ["Runtime, HTTP và middleware", "Dữ liệu, cache và serialization", "Lỗi, bảo mật, observability", "Background, messaging, testing", "Công cụ dòng lệnh"]}, {"n": "19.3", "t": "Lỗi thường gặp và cách sửa", "sub": ["Handler không implement Handler", "Extractor tiêu thụ body không đứng cuối", "future cannot be sent between threads safely: MutexGuard qua .await", "future không Send vì Rc hoặc lỗi kiểu dyn Error", "Quên with_state", "State không khớp kiểu hoặc không Clone", "async block may outlive the current function (E0373)", "main không được async và \"no reactor running\"", "Lỗi trait bound của sqlx: FromRow, Encode, Type", "query! đòi DATABASE_URL", "Lỗi sqlx lúc chạy", "Panic khi dựng router: cú pháp path và route trùng", "Chặn runtime: block_on lồng nhau và block_in_place", "Request JSON bị từ chối: 415, 422, 400", "Address already in use", "Bảng tra nhanh các lỗi khác"]}, {"n": "19.4", "t": "Lộ trình học tiếp", "sub": []}, {"n": "19.5", "t": "Tài liệu tham khảo", "sub": []}], "summary": [], "exercises": []}]}]</script>

  const LS_KEY = "rust-aio-progress-v1";
  const LS_UI = "rust-aio-ui-v1";

  // ---- Danh sách mọi mục có thể đánh dấu (để tính tiến độ) ----
  const chapterKeys = {};   // chId -> [keys tính vào tiến độ chương (mục nội dung)]
  const partKeys = { 1: [], 2: [], 3: [] };
  DATA.forEach(p => p.chapters.forEach(c => {
    chapterKeys[c.id] = c.sections.map(s => `${c.id}:s:${s.n}`);
    partKeys[p.id].push(...chapterKeys[c.id]);
  }));
  const allKeys = [].concat(partKeys[1], partKeys[2], partKeys[3]);

  // ---- Trạng thái ----
  let done = {};
  try { done = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { done = {}; }
  let ui = { part: 0, hideDone: false, open: {} };
  try { Object.assign(ui, JSON.parse(localStorage.getItem(LS_UI) || "{}")); } catch (e) {}
  const saveUi = () => { try { localStorage.setItem(LS_UI, JSON.stringify(ui)); } catch (e) {} };

  // ---- Đồng bộ với tài khoản qua capability db (nếu có) ----
  let docRef = null, pendingTimer = null, writing = false, dirty = false;
  const syncEl = $("#sync");
  function setSync(state, text) { syncEl.dataset.state = state; syncEl.textContent = text; }

  function persist() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(done)); } catch (e) {}
    if (!docRef) return;
    dirty = true;
    setSync("saving", "Đang lưu…");
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(flush, 700);
  }
  async function flush() {
    if (!docRef || writing || !dirty) return;
    writing = true; dirty = false;
    try {
      await docRef.set({ done, updatedAt: new Date().toISOString() });
      setSync("cloud", "Đã lưu vào tài khoản");
    } catch (e) {
      setSync("local", "Không lưu được lên tài khoản · đang lưu trên trình duyệt");
      if (e && e.code === "invalid_argument") docRef = null;
    } finally {
      writing = false;
      if (dirty) flush();
    }
  }

  (async () => {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      docRef = db.doc("data/users/" + uid + "/progress");
      setSync("saving", "Đang tải tiến độ…");
      const timer = setTimeout(() => setSync("local", "Chưa kết nối được · đang lưu trên trình duyệt"), 10000);
      let first = true;
      docRef.onSnapshot(snap => {
        if (!snap.metadata.fromCache) clearTimeout(timer);
        if (dirty || writing || snap.metadata.hasPendingWrites) return;
        if (snap.exists) {
          const remote = (snap.data() || {}).done || {};
          if (first) {
            // Lần đầu: gộp tiến độ đã lưu trên trình duyệt (nếu có) vào tài khoản.
            const merged = Object.assign({}, remote, done);
            const extra = Object.keys(merged).length !== Object.keys(remote).length;
            done = merged;
            if (extra) persist();
          } else {
            done = Object.assign({}, remote);
          }
        } else if (first && Object.keys(done).length) {
          persist();
        }
        if (!snap.metadata.fromCache) first = false;
        try { localStorage.setItem(LS_KEY, JSON.stringify(done)); } catch (e) {}
        if (!dirty && !writing) setSync("cloud", "Đồng bộ với tài khoản của bạn");
        refreshAll();
      }, () => {
        clearTimeout(timer);
        docRef = null;
        setSync("local", "Lưu trên trình duyệt này");
      });
    } catch (e) { /* giữ chế độ trình duyệt */ }
  })();

  // ---- Tìm kiếm ----
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
  const strip = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent; };
  DATA.forEach(p => p.chapters.forEach(c => {
    c._hay = norm([c.title, c.intro || "", ...c.sections.map(s => s.t + " " + s.sub.join(" ")), ...c.summary, ...c.exercises].map(strip).join(" \n "));
  }));
  function highlight(html, q) {
    if (!q) return html;
    // Đánh dấu trong text node, không chạm vào thẻ.
    const tpl = document.createElement("template"); tpl.innerHTML = html;
    const walk = document.createTreeWalker(tpl.content, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walk.nextNode()) nodes.push(walk.currentNode);
    nodes.forEach(n => {
      const t = n.nodeValue, nt = norm(t); let i = nt.indexOf(q); if (i < 0) return;
      const frag = document.createDocumentFragment(); let last = 0;
      while (i >= 0) {
        frag.append(t.slice(last, i));
        const m = document.createElement("mark"); m.textContent = t.slice(i, i + q.length); frag.append(m);
        last = i + q.length; i = nt.indexOf(q, last);
      }
      frag.append(t.slice(last)); n.replaceWith(frag);
    });
    return tpl.innerHTML;
  }

  // ---- Render ----
  const main = $("#main"), toc = $("#toc");
  const chev = '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>';
  const count = keys => keys.reduce((a, k) => a + (done[k] ? 1 : 0), 0);

  function checkItem(key, labelHtml, extraHtml = "") {
    return `<li><label class="item"><input type="checkbox" data-key="${key}" ${done[key] ? "checked" : ""}><span>${labelHtml}${extraHtml}</span></label></li>`;
  }

  function render() {
    const q = norm($("#q").value.trim());
    const searching = q.length >= 2;
    let html = "", tocHtml = "", shown = 0;
    DATA.forEach(p => {
      if (ui.part && ui.part !== p.id) return;
      const meta = PARTS_META[p.id];
      const chs = p.chapters.filter(c => {
        if (searching && !c._hay.includes(q)) return false;
        if (ui.hideDone && !searching) {
          const ks = chapterKeys[c.id]; if (ks.length && count(ks) === ks.length) return false;
        }
        return true;
      });
      tocHtml += `<h2>Phần ${p.id}</h2>`;
      p.chapters.forEach(c => {
        const ks = chapterKeys[c.id], d = count(ks);
        tocHtml += `<a href="#${c.id}" data-toc="${c.id}" class="${ks.length && d === ks.length ? "full" : ""}"><span class="n">${String(c.num).padStart(2, "0")}</span><span>${c.title}</span><span class="p">${d}/${ks.length}</span></a>`;
      });
      if (!chs.length) return;
      shown += chs.length;
      const pk = partKeys[p.id], pd = count(pk);
      html += `<section class="part" id="part${p.id}">
        <div class="part-head">
          <div>
            <div class="eyebrow">Phần ${p.id}</div>
            <h2>${meta.title}</h2>
            <p>${meta.desc}</p>
            <div class="file">${meta.file}</div>
          </div>
          <div class="ring"><b data-ppct="${p.id}">${Math.round(pd / pk.length * 100)}%</b><small data-pcount="${p.id}">${pd} / ${pk.length} mục</small></div>
        </div>
        ${searching ? "" : `<div class="milestones"><h3>Mốc thực hành của phần ${p.id}</h3><ul class="checks">${meta.milestones.map((m, i) => checkItem(`m:${p.id}:${i}`, m)).join("")}</ul></div>`}
        <div class="part-body">`;
      chs.forEach(c => {
        const ks = chapterKeys[c.id], d = count(ks);
        const open = searching || $("#expandAll").checked || !!ui.open[c.id];
        const st = ks.length && d === ks.length ? "done" : d ? "started" : "";
        const H = s => searching ? highlight(s, q) : s;
        html += `<article class="ch ${st} ${open ? "open" : ""}" id="${c.id}" data-ch="${c.id}">
          <div class="ch-head" role="button" tabindex="0" aria-expanded="${open}" data-toggle="${c.id}">
            <div class="ch-num">${c.num}</div>
            <div><h3>${H(c.title)}</h3>${c.intro ? `<p class="intro">${H(c.intro)}</p>` : ""}</div>
            <div class="ch-meta"><span class="pill" data-cpill="${c.id}">${d}/${ks.length}</span>${chev}</div>
          </div>
          <div class="mini"><i data-cbar="${c.id}" style="width:${ks.length ? d / ks.length * 100 : 0}%"></i></div>
          ${open ? `<div class="ch-body">
            <div class="col">
              <h4><span>Kiến thức cốt lõi</span></h4>
              ${c.summary.length ? `<ul class="sum">${c.summary.map(s => `<li>${H(s)}</li>`).join("")}</ul>` : `<p style="margin:0;color:var(--ink-2)">Chương tra cứu: dùng checklist bên cạnh để đánh dấu những phần đã đọc.</p>`}
            </div>
            <div class="col">
              <h4><span>Checklist khi học</span><button type="button" data-all="${c.id}">${d === ks.length ? "Bỏ chọn hết" : "Đánh dấu hết"}</button></h4>
              <ul class="checks">${c.sections.map(s => checkItem(`${c.id}:s:${s.n}`, `<span class="sn">${s.n}</span>${H(s.t)}`, s.sub.length ? `<span class="subs">${H(s.sub.join(" · "))}</span>` : "")).join("")}</ul>
              ${c.exercises.length ? `<details class="ex" ${searching && c.exercises.some(e => norm(strip(e)).includes(q)) ? "open" : ""}><summary>Bài tập (${count(c.exercises.map((_, i) => `${c.id}:e:${i}`))}/${c.exercises.length})</summary><ul class="checks">${c.exercises.map((e, i) => checkItem(`${c.id}:e:${i}`, H(e))).join("")}</ul></details>` : ""}
            </div>
          </div>` : ""}
        </article>`;
      });
      html += `</div></section>`;
    });
    if (!shown) html = `<div class="empty">Không có chương nào khớp. Thử từ khóa khác, ví dụ “borrow”, “heap”, “middleware”.</div>`;
    html += `<div class="foot"><span>Dựa trên bộ 3 file Word “Rust All-in-One” (Rust 1.99 · edition 2024 · Axum 0.8 · SQLx 0.9). Mục trong checklist khớp với số mục trong tài liệu.</span><span id="resetBox"><button class="danger" type="button" id="reset">Đặt lại tiến độ</button></span></div>`;
    main.innerHTML = html;
    toc.innerHTML = tocHtml;
    refreshTotals();
  }

  function refreshTotals() {
    const d = count(allKeys), t = allKeys.length;
    $("#ovBar").style.width = (d / t * 100) + "%";
    $("#ovPct").textContent = `${d} / ${t} mục · ${Math.round(d / t * 100)}%`;
    [1, 2, 3].forEach(p => {
      const pk = partKeys[p], pd = count(pk);
      const a = main.querySelector(`[data-ppct="${p}"]`), b = main.querySelector(`[data-pcount="${p}"]`);
      if (a) a.textContent = Math.round(pd / pk.length * 100) + "%";
      if (b) b.textContent = `${pd} / ${pk.length} mục`;
    });
  }

  function refreshChapter(id) {
    const ks = chapterKeys[id], d = count(ks);
    const art = main.querySelector(`[data-ch="${id}"]`);
    if (art) {
      art.classList.toggle("done", ks.length > 0 && d === ks.length);
      art.classList.toggle("started", d > 0 && d < ks.length);
      const pill = art.querySelector("[data-cpill]"); if (pill) pill.textContent = `${d}/${ks.length}`;
      const bar = art.querySelector("[data-cbar]"); if (bar) bar.style.width = (ks.length ? d / ks.length * 100 : 0) + "%";
      const btn = art.querySelector("[data-all]"); if (btn) btn.textContent = d === ks.length ? "Bỏ chọn hết" : "Đánh dấu hết";
      const sum = art.querySelector("details.ex summary");
      if (sum) {
        const ex = art.querySelectorAll('input[data-key*=":e:"]');
        const exd = [...ex].filter(i => i.checked).length;
        sum.textContent = `Bài tập (${exd}/${ex.length})`;
      }
    }
    const t = toc.querySelector(`[data-toc="${id}"]`);
    if (t) { t.classList.toggle("full", ks.length > 0 && d === ks.length); t.querySelector(".p").textContent = `${d}/${ks.length}`; }
  }

  function refreshAll() {
    main.querySelectorAll("input[data-key]").forEach(i => { i.checked = !!done[i.dataset.key]; });
    Object.keys(chapterKeys).forEach(refreshChapter);
    refreshTotals();
  }

  // ---- Sự kiện ----
  main.addEventListener("change", e => {
    const i = e.target.closest("input[data-key]"); if (!i) return;
    if (i.checked) done[i.dataset.key] = true; else delete done[i.dataset.key];
    const ch = i.dataset.key.split(":")[0];
    if (chapterKeys[ch]) refreshChapter(ch);
    refreshTotals(); persist();
  });
  main.addEventListener("click", e => {
    const all = e.target.closest("[data-all]");
    if (all) {
      e.stopPropagation();
      const id = all.dataset.all, ks = chapterKeys[id], full = count(ks) === ks.length;
      ks.forEach(k => { if (full) delete done[k]; else done[k] = true; });
      main.querySelectorAll(`[data-ch="${id}"] input[data-key^="${id}:s:"]`).forEach(i => { i.checked = !full; });
      refreshChapter(id); refreshTotals(); persist();
      return;
    }
    if (e.target.id === "reset") {
      $("#resetBox").innerHTML = `<span class="confirm">Xóa toàn bộ dấu tích? <button class="danger yes" type="button" id="resetYes">Xóa</button><button class="danger" type="button" id="resetNo">Giữ lại</button></span>`;
      return;
    }
    if (e.target.id === "resetYes") { done = {}; persist(); render(); return; }
    if (e.target.id === "resetNo") { render(); return; }
    const head = e.target.closest("[data-toggle]");
    if (head) toggleChapter(head.dataset.toggle);
  });
  main.addEventListener("keydown", e => {
    const head = e.target.closest("[data-toggle]");
    if (head && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleChapter(head.dataset.toggle); }
  });
  function toggleChapter(id) {
    ui.open[id] = !ui.open[id]; if (!ui.open[id]) delete ui.open[id];
    saveUi();
    const y = main.querySelector(`[data-ch="${id}"]`).getBoundingClientRect().top;
    render();
    const el = main.querySelector(`[data-ch="${id}"]`);
    if (el) window.scrollBy(0, el.getBoundingClientRect().top - y);
  }
  toc.addEventListener("click", e => {
    const a = e.target.closest("a[data-toc]"); if (!a) return;
    const id = a.dataset.toc;
    const part = +id.match(/^p(\d)/)[1];
    if (ui.part && ui.part !== part) setPart(part);
    if (!ui.open[id]) { ui.open[id] = true; saveUi(); render(); }
  });
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setPart(+b.dataset.part)));
  function setPart(p) {
    ui.part = p; saveUi();
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.part === p)));
    render();
  }
  let qt; $("#q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(render, 150); });
  $("#hideDone").addEventListener("change", e => { ui.hideDone = e.target.checked; saveUi(); render(); });
  $("#expandAll").addEventListener("change", render);

  // Khởi tạo
  $("#hideDone").checked = !!ui.hideDone;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.part === (ui.part || 0))));
  const h = location.hash.slice(1);
  if (/^p[123]c\d+$/.test(h)) { ui.open[h] = true; }
  else if (!Object.keys(ui.open).length) { ui.open.p1c3 = true; }
  render();
  if (/^p[123]c\d+$/.test(h)) { const el = document.getElementById(h); if (el) el.scrollIntoView(); }
  window.addEventListener("hashchange", () => {
    const id = location.hash.slice(1);
    if (/^p[123]c\d+$/.test(id) && !ui.open[id]) { ui.open[id] = true; render(); document.getElementById(id)?.scrollIntoView(); }
  });
})();
</script>

</body></html>
