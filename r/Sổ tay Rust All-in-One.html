<title>Sổ tay Rust All-in-One</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sổ học dạng "bản đồ kim loại" — thanh tiến độ trên cùng, mục lục trái, thẻ chương bên phải.
   Thép (nền) · oxit (accent) · patina (đã hoàn thành). */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #17202a;
  --ink-2: #4a5866;
  --ink-3: #7b8794;
  --line: #d7dde3;
  --oxide: #b8461d;
  --oxide-soft: #f6e4dc;
  --patina: #237563;
  --patina-soft: #dcefe9;
  --code-bg: #e9edf1;
  --shadow: 0 1px 2px rgba(23, 32, 42, .06), 0 4px 16px rgba(23, 32, 42, .05);
  --f-display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --surface: #182029; --surface-2: #1d2630; --ink: #dfe6ec;
    --ink-2: #a8b4bf; --ink-3: #7c8893; --line: #2b3641; --oxide: #f0814f;
    --oxide-soft: #3a2419; --patina: #5cc0a8; --patina-soft: #17332d; --code-bg: #232d38;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #182029; --surface-2: #1d2630; --ink: #dfe6ec;
  --ink-2: #a8b4bf; --ink-3: #7c8893; --line: #2b3641; --oxide: #f0814f;
  --oxide-soft: #3a2419; --patina: #5cc0a8; --patina-soft: #17332d; --code-bg: #232d38;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 132px; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body);
  font-size: 15px; line-height: 1.6;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--surface);
}
code {
  font-family: var(--f-mono); font-size: .86em; background: var(--code-bg);
  padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--oxide); outline-offset: 2px; }

/* ---------- Thanh trên cùng ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1280px; margin: 0 auto; padding-block: 12px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: auto 1fr auto; gap: 8px 20px; align-items: center;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 {
  font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.01em;
  margin: 0; white-space: nowrap;
}
.brand h1 span { color: var(--oxide); }
.overall { display: flex; align-items: center; gap: 12px; min-width: 0; }
.bar {
  flex: 1; height: 8px; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 99px; overflow: hidden; min-width: 60px;
}
.bar > i { display: block; height: 100%; width: 0; background: var(--patina); transition: width .3s; }
.overall .pct {
  font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.sync {
  font-size: 12px; color: var(--ink-3); white-space: nowrap; display: flex; align-items: center; gap: 6px;
}
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.sync[data-state="cloud"]::before { background: var(--patina); }
.sync[data-state="saving"]::before { background: var(--oxide); }
.controls {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab {
  border: 1px solid var(--line); background: var(--surface); padding: 5px 12px;
  border-radius: 99px; cursor: pointer; font-size: 13px; font-weight: 500;
}
.tab[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.search {
  flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 99px; padding: 6px 14px; font: inherit; font-size: 14px; color: var(--ink);
}
.toggle { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.toggle input { accent-color: var(--patina); }

/* ---------- Khung chính ---------- */
.wrap {
  max-width: 1280px; margin: 0 auto; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; align-items: start;
}
nav.toc {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 116px);
  max-height: calc(100vh - 140px); overflow: auto; padding-right: 4px;
}
.toc h2 {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); margin: 18px 0 6px; font-weight: 600;
}
.toc h2:first-child { margin-top: 0; }
.toc a {
  display: grid; grid-template-columns: 26px 1fr 34px; gap: 6px; align-items: center;
  padding: 4px 6px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-size: 13px;
  line-height: 1.35;
}
.toc a:hover { background: var(--surface); color: var(--ink); }
.toc a .n { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.toc a .p {
  font-family: var(--f-mono); font-size: 11px; text-align: right; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.toc a.full { color: var(--patina); }
.toc a.full .p { color: var(--patina); }
main { min-width: 0; display: grid; gap: 40px; }

/* ---------- Tổng quan phần ---------- */
.part-head {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: end;
  border-bottom: 2px solid var(--ink); padding-bottom: 12px;
}
.part-head .eyebrow {
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; color: var(--oxide);
  text-transform: uppercase; font-weight: 600;
}
.part-head h2 {
  font-family: var(--f-display); font-weight: 800; font-size: clamp(24px, 3.2vw, 34px);
  line-height: 1.1; margin: 4px 0 6px; text-wrap: balance; letter-spacing: -.015em;
}
.part-head p { margin: 0; color: var(--ink-2); max-width: 68ch; }
.part-head .file { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.ring { text-align: right; }
.ring b {
  font-family: var(--f-display); font-size: 36px; font-weight: 800; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.ring small { display: block; font-size: 12px; color: var(--ink-3); font-family: var(--f-mono); }
.milestones {
  margin-top: 16px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px;
}
.milestones h3 {
  margin: 0 0 8px; font-size: 13px; font-family: var(--f-mono); letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-2); font-weight: 600;
}
.milestones ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.part-body { display: grid; gap: 18px; margin-top: 18px; }

/* ---------- Thẻ chương ---------- */
.ch {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.ch-head {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: start;
  padding: 16px 18px 12px; cursor: pointer;
}
.ch-num {
  font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1; color: var(--oxide);
  min-width: 2ch; font-variant-numeric: tabular-nums;
}
.ch.done .ch-num { color: var(--patina); }
.ch-head h3 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.ch-head .intro { margin: 4px 0 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ch.open .ch-head .intro { display: block; -webkit-line-clamp: unset; }
.ch-meta { display: grid; justify-items: end; gap: 6px; }
.pill {
  font-family: var(--f-mono); font-size: 12px; padding: 2px 8px; border-radius: 99px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.ch.done .pill { background: var(--patina-soft); border-color: transparent; color: var(--patina); }
.ch.started:not(.done) .pill { background: var(--oxide-soft); border-color: transparent; color: var(--oxide); }
.chev { width: 20px; height: 20px; color: var(--ink-3); transition: transform .2s; }
.ch.open .chev { transform: rotate(180deg); }
.mini { height: 3px; background: var(--surface-2); }
.mini > i { display: block; height: 100%; width: 0; background: var(--patina); transition: width .3s; }
.ch-body {
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 0;
  border-top: 1px solid var(--line);
}
.col { padding: 16px 18px 18px; min-width: 0; }
.col + .col { border-left: 1px solid var(--line); background: var(--surface-2); }
.col h4 {
  margin: 0 0 10px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3); font-weight: 600;
  display: flex; justify-content: space-between; gap: 8px;
}
.col h4 button {
  border: 0; background: none; color: var(--oxide); cursor: pointer; font-size: 11.5px;
  letter-spacing: .04em; text-transform: none; padding: 0;
}
.sum { margin: 0; padding-left: 18px; display: grid; gap: 7px; font-size: 14px; }
.sum li::marker { color: var(--oxide); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.item {
  display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; align-items: start;
  padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 1.45;
}
.item:hover { background: var(--surface); }
.item input {
  appearance: none; width: 17px; height: 17px; margin: 2px 0 0; border: 1.5px solid var(--ink-3);
  border-radius: 4px; display: grid; place-items: center; cursor: pointer; background: var(--surface);
}
.item input:checked { background: var(--patina); border-color: var(--patina); }
.item input:checked::after {
  content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0;
  transform: translateY(-1px) rotate(-45deg);
}
.item .sn { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); margin-right: 6px; }
.item input:checked + span { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line); }
.item .subs { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 1px; text-decoration: none; }
details.ex { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
details.ex summary {
  cursor: pointer; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-2); font-weight: 600; list-style: none;
}
details.ex summary::-webkit-details-marker { display: none; }
details.ex summary::before { content: "+ "; color: var(--oxide); }
details.ex[open] summary::before { content: "- "; }
details.ex .checks { margin-top: 8px; }
mark { background: var(--oxide-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.empty {
  text-align: center; color: var(--ink-2); padding: 48px 16px; border: 1px dashed var(--line);
  border-radius: var(--radius);
}
.foot {
  display: flex; flex-wrap: wrap; gap: 10px 20px; justify-content: space-between; align-items: center;
  color: var(--ink-3); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px;
}
.danger {
  border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px;
  cursor: pointer; font-size: 13px;
}
.confirm { display: inline-flex; gap: 8px; align-items: center; }
.confirm .yes { border-color: var(--oxide); color: var(--oxide); }

@media (max-width: 960px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav.toc { display: none; }
  .ch-body { grid-template-columns: minmax(0, 1fr); }
  .col + .col { border-left: 0; border-top: 1px solid var(--line); }
  html { scroll-padding-top: 150px; }
}
@media (max-width: 560px) {
  .topbar-inner { grid-template-columns: minmax(0, 1fr) auto; }
  .overall { grid-column: 1 / -1; grid-row: 2; }
  .brand h1 { font-size: 19px; }
  .ch-head { grid-template-columns: auto minmax(0, 1fr); }
  .ch-meta { grid-column: 2; justify-items: start; grid-auto-flow: column; align-items: center; }
  .ring b { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script type="application/json" id="data">[{"id": 1, "chapters": [{"id": "p1c1", "num": 1, "title": "Giới thiệu Rust, cài đặt &amp; công cụ", "intro": "Chương mở đầu này trả lời ba câu hỏi: Rust là gì và ra đời để giải quyết vấn đề gì; làm sao cài đặt một môi trường Rust chuyên nghiệp (rustup, toolchain, Cargo, rust-analyzer, rustfmt, clippy); và một chương trình Rust trông như thế nào khi được mổ xẻ từng dòng. Nếu bạn đến từ C/C++, bạn sẽ thấy Rust giữ được hiệu năng \"sát phần cứng\" nhưng loại bỏ cả một họ lỗi bộ nhớ ngay lúc biên dịch. Nếu bạn đến từ Go, Java hay Python, bạn sẽ thấy một ngôn ngữ không có bộ thu gom rác (garbage collector) nhưng vẫn an toàn, và bộ công cụ đi kèm được thiết kế rất thống nhất. Nắm vững công cụ ngay từ đầu giúp bạn học các chương sau nhanh hơn nhiều, vì trình biên dịch Rust chính là \"người thầy\" khó tính nhưng tận tâm nhất của bạn.", "sections": [{"n": "1.1", "t": "Rust là gì? Lịch sử ngắn gọn", "sub": []}, {"n": "1.2", "t": "Triết lý thiết kế", "sub": ["An toàn bộ nhớ không cần GC", "Trừu tượng không tốn chi phí (zero-cost abstractions)", "Đồng thời không sợ hãi (fearless concurrency)"]}, {"n": "1.3", "t": "So sánh Rust với các ngôn ngữ khác", "sub": []}, {"n": "1.4", "t": "Cài đặt với rustup", "sub": ["rustup là gì", "Kênh phát hành: stable, beta, nightly", "Component và target"]}, {"n": "1.5", "t": "Trình biên dịch rustc", "sub": []}, {"n": "1.6", "t": "Cargo cơ bản", "sub": ["Tạo dự án", "Cấu trúc thư mục dự án", "build, run, check", "Bảng lệnh Cargo thường dùng"]}, {"n": "1.7", "t": "Hello World phân tích từng dòng", "sub": ["Định dạng chuỗi với println! và format!", "Một chương trình nhỏ có tham số dòng lệnh"]}, {"n": "1.8", "t": "Hệ sinh thái crate", "sub": []}, {"n": "1.9", "t": "Editions", "sub": []}, {"n": "1.10", "t": "Công cụ phát triển", "sub": ["rust-analyzer", "rustfmt", "clippy"]}, {"n": "1.11", "t": "Tài liệu và nguồn học", "sub": []}], "summary": ["Rust là ngôn ngữ hệ thống biên dịch ra mã máy, an toàn bộ nhớ không cần GC nhờ ownership và borrow checker, có trừu tượng không tốn chi phí và ngăn data race lúc biên dịch.", "Rust 1.0 ra đời năm 2015, phát hành stable mới mỗi 6 tuần, có cam kết ổn định; tài liệu này dùng Rust 1.99 và edition 2024.", "rustup quản lý toolchain (stable/beta/nightly), component (rustfmt, clippy, rust-src, rust-analyzer, miri) và target; <code>rust-toolchain.toml<\/code> cố định toolchain cho dự án.", "Cargo là trung tâm của mọi dự án: <code>new<\/code>, <code>check<\/code>, <code>build<\/code>, <code>run<\/code>, <code>test<\/code>, <code>fmt<\/code>, <code>clippy<\/code>, <code>doc<\/code>, <code>add<\/code>; chế độ <code>--release<\/code> bật tối ưu và tắt kiểm tra tràn số.", "<code>println!<\/code> là macro, chuỗi định dạng được kiểm tra lúc biên dịch; <code>{}<\/code> dùng <code>Display<\/code>, <code>{:?}<\/code> dùng <code>Debug<\/code>, có thể viết tên biến trực tiếp như <code>{ten}<\/code>.", "Edition cho phép thay đổi ngôn ngữ mà không làm gãy hệ sinh thái; các crate khác edition vẫn dùng chung được.", "rust-analyzer, rustfmt và clippy là bộ ba công cụ nên dùng hằng ngày; <code>rustc --explain<\/code> và <code>rustup doc<\/code> là nguồn tài liệu offline quý giá."], "exercises": ["Cài đặt Rust bằng rustup, sau đó chạy <code>rustup show<\/code>, <code>rustc -vV<\/code> và <code>cargo --version<\/code>. Ghi lại host triple của máy bạn và giải thích từng phần của nó.", "Tạo dự án <code>cargo new bai1<\/code>, sửa <code>main<\/code> để in ra họ tên, năm sinh và tuổi của bạn (tính từ năm hiện tại là một hằng số trong code) bằng cú pháp <code>{ten}<\/code> và căn lề sao cho các giá trị thẳng cột.", "Viết chương trình in bảng cửu chương từ 2 đến 9, mỗi số căn phải trong độ rộng 3 ký tự. Gợi ý: hai vòng <code>for<\/code> lồng nhau với <code>1..=9<\/code> và <code>print!(\"{:&gt;3}\", ...)<\/code>.", "Mở rộng chương trình tham số dòng lệnh ở mục 1.7.2: nhận nhiều tên và chào từng người; nếu tên dài hơn 10 ký tự thì in thêm cảnh báo ra stderr. Thử chuyển hướng <code>2&gt;/dev/null<\/code> để thấy sự khác biệt giữa stdout và stderr.", "Viết lại hàm <code>tong_iterator<\/code> ở mục 1.2.2 để tính tổng lập phương các số lẻ. Đo thời gian chạy với n = 100 triệu ở chế độ debug và release bằng lệnh <code>time cargo run<\/code> và <code>time cargo run --release<\/code>, nhận xét chênh lệch.", "Cố ý viết một chương trình có lỗi chính tả trong tên biến và thiếu một tham số trong <code>println!(\"{} {}\", x)<\/code>. Đọc kỹ thông báo lỗi, sau đó dùng <code>rustc --explain<\/code> cho mã lỗi tương ứng (nếu có).", "Tạo file <code>rust-toolchain.toml<\/code> cố định kênh stable với component <code>clippy<\/code> và <code>rustfmt<\/code>, thêm cấu hình <code>[lints.clippy]<\/code> bật <code>pedantic<\/code>, rồi chạy <code>cargo clippy<\/code> trên các bài tập trên và sửa toàn bộ cảnh báo."]}, {"id": "p1c2", "num": 2, "title": "Cú pháp cơ bản", "intro": "Chương này trình bày những viên gạch đầu tiên của ngôn ngữ: biến và tính bất biến, hằng số, các kiểu dữ liệu vô hướng (số nguyên, số thực, bool, char), kiểu phức hợp (tuple, array), ép kiểu, hàm, comment và các cấu trúc điều khiển. Nhiều thứ trông quen thuộc nếu bạn biết C, Java hay Go, nhưng Rust có những lựa chọn thiết kế riêng rất đáng chú ý: biến bất biến theo mặc định, không có chuyển đổi kiểu ngầm định, tràn số nguyên bị bắt lỗi ở chế độ debug, và gần như mọi thứ (kể cả <code>if<\/code>, <code>loop<\/code>, khối lệnh) đều là biểu thức trả về giá trị. Hiểu \"tại sao\" của những lựa chọn này sẽ giúp bạn viết Rust tự nhiên ngay từ đầu.", "sections": [{"n": "2.1", "t": "Biến và tính bất biến", "sub": ["let và bất biến mặc định", "Biến khả biến với mut", "Shadowing — che khuất biến", "Suy luận kiểu"]}, {"n": "2.2", "t": "Hằng số: const và static", "sub": []}, {"n": "2.3", "t": "Kiểu số nguyên", "sub": ["Kích thước và phạm vi", "Tràn số: debug và release xử lý khác nhau", "Các họ phương thức xử lý tràn"]}, {"n": "2.4", "t": "Số thực", "sub": []}, {"n": "2.5", "t": "Kiểu bool và char", "sub": []}, {"n": "2.6", "t": "Kiểu phức hợp: tuple và array", "sub": ["Tuple", "Array", "Kiểm tra biên khi truy cập mảng"]}, {"n": "2.7", "t": "Ép kiểu với as và chuyển đổi an toàn", "sub": []}, {"n": "2.8", "t": "Hàm", "sub": ["Khai báo hàm", "Statement và expression"]}, {"n": "2.9", "t": "Comment và doc comment", "sub": []}, {"n": "2.10", "t": "Luồng điều khiển", "sub": ["if là một biểu thức", "loop, while, for", "Các loại range"]}], "summary": ["Biến bất biến mặc định; dùng <code>mut<\/code> khi cần thay đổi. Shadowing tạo biến mới cùng tên, có thể đổi kiểu.", "<code>const<\/code> được tính lúc biên dịch và nội tuyến; <code>static<\/code> có một địa chỉ duy nhất; tránh <code>static mut<\/code>.", "Số nguyên có kích thước rõ ràng (<code>i8<\/code>..<code>i128<\/code>, <code>u8<\/code>..<code>u128<\/code>, <code>isize<\/code>/<code>usize<\/code>); <code>usize<\/code> dùng cho chỉ số và độ dài. Tràn số panic ở debug, quấn vòng ở release; dùng <code>wrapping_<\/code>, <code>checked_<\/code>, <code>saturating_<\/code>, <code>overflowing_<\/code> để thể hiện ý định rõ ràng.", "<code>f64<\/code> là số thực mặc định; không so sánh <code>==<\/code> số thực; <code>NaN<\/code> khiến số thực chỉ có thứ tự bộ phận.", "<code>char<\/code> là Unicode scalar value 4 byte; chuỗi lưu UTF-8 nên số byte khác số ký tự.", "Tuple nhóm giá trị khác kiểu, array nhóm N giá trị cùng kiểu với N cố định; truy cập mảng luôn được kiểm tra biên.", "Không có chuyển đổi kiểu ngầm định; <code>as<\/code> theo quy tắc cắt bớt/kẹp xác định; ưu tiên <code>From<\/code>/<code>TryFrom<\/code>.", "Gần như mọi thứ là biểu thức: khối, <code>if<\/code>, <code>loop<\/code>. Dấu <code>;<\/code> biến biểu thức thành câu lệnh; thêm <code>;<\/code> thừa vào biểu thức cuối hàm là lỗi E0308 phổ biến.", "<code>loop<\/code> có thể trả giá trị qua <code>break<\/code>; nhãn <code>'ten<\/code> giúp thoát vòng lặp lồng nhau; <code>for<\/code> duyệt iterator và range thay cho vòng lặp kiểu C."], "exercises": ["Viết chương trình chuyển đổi nhiệt độ: khai báo <code>const<\/code> cho các hệ số, chuyển một mảng nhiệt độ độ C sang độ F và in ra dạng bảng hai cột căn phải với 1 chữ số thập phân.", "Viết hàm <code>fn giai_thua(n: u32) -&gt; Option&lt;u64&gt;<\/code> dùng <code>checked_mul<\/code> để trả về <code>None<\/code> khi tràn. Tìm giá trị n lớn nhất cho kết quả <code>Some<\/code>. Làm lại với <code>u128<\/code>.", "Viết hàm <code>fn fibonacci(n: u32) -&gt; u64<\/code> bằng <code>loop<\/code> và <code>break<\/code> mang giá trị, không dùng <code>return<\/code>. Sau đó viết lại bằng <code>for<\/code> trên range.", "Cho <code>let s = \"Rust thật tuyệt\";<\/code>, in ra số byte, số ký tự, và mã Unicode dạng <code>U+XXXX<\/code> của từng ký tự có dấu. Gợi ý: <code>s.chars()<\/code>, <code>c.is_ascii()<\/code>, <code>c as u32<\/code>.", "Dự đoán kết quả rồi kiểm chứng: <code>(-128i8) as u8<\/code>, <code>(-128i8).wrapping_neg()<\/code>, <code>(-128i8).checked_neg()<\/code>, <code>255u8 as i8 as i32<\/code>, <code>(2.9_f64 as u8) + (-2.9_f64 as u8)<\/code>. Giải thích từng kết quả bằng biểu diễn bit.", "Dùng vòng lặp có nhãn để tìm tất cả bộ ba Pythagoras (a, b, c) với a &lt; b &lt; c &lt;= 50, và dừng hẳn khi đã tìm đủ 10 bộ.", "Viết hàm <code>fn thong_ke(a: [i32; 8]) -&gt; (i32, i32, f64)<\/code> trả về (nhỏ nhất, lớn nhất, trung bình). Thử gọi với mảng 7 phần tử và đọc thông báo lỗi kiểu của trình biên dịch.", "(Nâng cao) Viết hàm kiểm tra số nguyên tố <code>fn la_so_nguyen_to(n: u64) -&gt; bool<\/code> chỉ dùng <code>while<\/code> và phép chia; in các số nguyên tố nhỏ hơn 100, mỗi dòng 10 số, căn phải độ rộng 4."]}, {"id": "p1c3", "num": 3, "title": "Ownership — Quyền sở hữu", "intro": "Quyền sở hữu (ownership) là tính năng đặc trưng nhất của Rust và là lý do Rust có thể an toàn bộ nhớ mà không cần bộ thu gom rác. Mọi khái niệm quan trọng phía sau như borrowing, lifetime, smart pointer, đa luồng đều xây dựng trên nền tảng này. Chương này bắt đầu từ mô hình bộ nhớ stack và heap, phát biểu ba quy tắc ownership, rồi phân tích chi tiết điều gì thực sự xảy ra trong bộ nhớ khi bạn gán, truyền tham số, trả về giá trị: move, clone, copy, drop. Chúng ta sẽ xem từng thông báo lỗi thật của trình biên dịch và hiểu vì sao nó đúng. Khi đã thấm chương này, phần lớn sự \"khó tính\" của Rust sẽ trở nên hợp lý.", "sections": [{"n": "3.1", "t": "Vấn đề mà ownership giải quyết", "sub": []}, {"n": "3.2", "t": "Stack và Heap", "sub": ["Stack", "Heap", "So sánh"]}, {"n": "3.3", "t": "Ba quy tắc ownership", "sub": []}, {"n": "3.4", "t": "Kiểu String và mô hình bộ nhớ", "sub": ["String và string literal", "Bên trong một String: ptr, capacity, len"]}, {"n": "3.5", "t": "Move — chuyển quyền sở hữu", "sub": ["Điều gì xảy ra khi gán một String", "Move khi gọi hàm", "Move trong vòng lặp", "Không thể move ra khỏi chỉ mục", "Move một phần (partial move)"]}, {"n": "3.6", "t": "Clone — sao chép sâu tường minh", "sub": []}, {"n": "3.7", "t": "Copy — kiểu sao chép ngầm định", "sub": ["Vì sao số nguyên không bị move", "Kiểu nào là Copy", "So sánh Copy và Clone"]}, {"n": "3.8", "t": "Drop và RAII", "sub": ["Trait Drop", "RAII: tài nguyên gắn với vòng đời đối tượng"]}, {"n": "3.9", "t": "Ownership với hàm và giá trị trả về", "sub": []}, {"n": "3.10", "t": "Lấy giá trị ra mà không phá vỡ ownership", "sub": []}, {"n": "3.11", "t": "Lỗi thường gặp và cách sửa", "sub": []}], "summary": ["Stack nhanh, kích thước cố định, tự dọn khi hàm trả về; heap linh hoạt nhưng cần ai đó giải phóng. Ownership giải quyết bài toán heap mà không cần GC.", "Ba quy tắc: mỗi giá trị có một chủ sở hữu; chỉ một chủ sở hữu tại một thời điểm; chủ sở hữu ra khỏi phạm vi thì giá trị bị drop.", "<code>String<\/code> gồm (ptr, capacity, len) 24 byte trên stack và bộ đệm UTF-8 trên heap; capacity tăng gấp đôi khi hết chỗ.", "Gán hoặc truyền một giá trị không <code>Copy<\/code> là move: chỉ sao chép phần stack, biến cũ bị vô hiệu hóa để tránh double free. Dùng biến sau khi move là lỗi E0382.", "<code>.clone()<\/code> sao chép sâu một cách tường minh và có chi phí; <code>Copy<\/code> là sao chép bit ngầm định cho kiểu nhỏ không sở hữu tài nguyên.", "<code>Drop<\/code> chạy khi giá trị bị hủy: biến cục bộ hủy theo thứ tự ngược khai báo; <code>drop(x)<\/code> hủy sớm; <code>let _ = ...<\/code> hủy ngay. RAII gắn mọi loại tài nguyên với vòng đời đối tượng.", "Hàm nhận tham số kiểu <code>T<\/code> sẽ lấy ownership; muốn chỉ dùng tạm, hãy nhận <code>&amp;T<\/code> hoặc <code>&amp;mut T<\/code> (Chương 4).", "<code>mem::take<\/code>, <code>mem::replace<\/code>, <code>Option::take<\/code> lấy giá trị ra khỏi chỗ chỉ có <code>&amp;mut<\/code> mà không phá vỡ ownership."], "exercises": ["Vẽ sơ đồ stack/heap (như mục 3.4.2) cho đoạn code <code>let a = String::from(\"Rust\"); let b = a; let c = b.clone();<\/code> tại thời điểm ngay trước khi <code>main<\/code> kết thúc. Chỉ rõ biến nào hợp lệ và vùng heap nào sẽ bị giải phóng.", "Viết hàm <code>fn noi(a: String, b: String) -&gt; String<\/code> nối hai chuỗi. Gọi nó trong <code>main<\/code> rồi thử dùng lại <code>a<\/code> và <code>b<\/code>, đọc thông báo lỗi. Sau đó viết lại thành <code>fn noi(a: &amp;str, b: &amp;str) -&gt; String<\/code>.", "Tạo struct <code>Ket<\/code> có trường <code>ten: String<\/code> và cài <code>Drop<\/code> in ra tên. Tạo một <code>Vec&lt;Ket&gt;<\/code> gồm 3 phần tử và một biến <code>Ket<\/code> riêng; dự đoán thứ tự các dòng in ra rồi chạy để kiểm chứng. Thử thêm <code>v.remove(1)<\/code> ở giữa chương trình.", "Giải thích vì sao đoạn <code>let v = vec![1, 2, 3]; let w = v; println!(\"{:?}\", v);<\/code> lỗi, nhưng <code>let a = [1, 2, 3]; let b = a; println!(\"{:?}\", a);<\/code> thì không.", "Viết chương trình đo <code>capacity<\/code> của một <code>Vec&lt;u64&gt;<\/code> khi push lần lượt 0 đến 100 phần tử, chỉ in ra mỗi khi capacity thay đổi. So sánh với <code>Vec&lt;u8&gt;<\/code> và rút ra quy luật.", "Cho <code>struct Hop { noi_dung: Option&lt;String&gt; }<\/code> và hàm <code>fn lay_ra(h: &amp;mut Hop) -&gt; Option&lt;String&gt;<\/code>. Cài đặt hàm mà không dùng <code>clone<\/code>. Gợi ý: <code>Option::take<\/code>.", "(Nâng cao) Viết guard <code>ThuTu<\/code> in \"mở\" khi tạo và \"đóng\" khi drop, kèm tên. Tạo ba guard lồng nhau trong các khối khác nhau, một guard bị move vào hàm, một guard bị gán <code>let _ = ...<\/code>. Dự đoán toàn bộ output trước khi chạy."]}, {"id": "p1c4", "num": 4, "title": "Borrowing, References &amp; Slices", "intro": "Chương 3 kết thúc với một sự bất tiện: muốn dùng một giá trị trong hàm mà vẫn giữ được nó, ta phải truyền vào rồi trả lại. Chương này giới thiệu giải pháp: tham chiếu (reference) và cơ chế mượn (borrowing). Tham chiếu cho phép dùng một giá trị mà không lấy quyền sở hữu, giống con trỏ trong C nhưng luôn được bảo đảm hợp lệ. Bảo đảm đó đến từ bộ kiểm tra mượn (borrow checker), thành phần của trình biên dịch kiểm tra hai quy tắc đơn giản nhưng có sức mạnh lớn. Chúng ta sẽ học quy tắc mượn, hiểu vì sao chúng tồn tại (bằng sơ đồ bộ nhớ của những lỗi chúng ngăn chặn), tìm hiểu NLL, slice (<code>&amp;str<\/code>, <code>&amp;[T]<\/code>), và cuối cùng phân tích chi tiết các thông báo lỗi borrow checker phổ biến nhất cùng cách sửa.", "sections": [{"n": "4.1", "t": "Tham chiếu và mượn", "sub": ["Tham chiếu chia sẻ &amp;T", "Tham chiếu khả biến &amp;mut T", "Toán tử deref và tự động deref"]}, {"n": "4.2", "t": "Quy tắc mượn", "sub": ["Hai quy tắc", "Hai tham chiếu khả biến cùng lúc (E0499)", "Mượn khả biến khi đang có mượn chia sẻ (E0502)", "Sửa collection khi đang duyệt", "Gán giá trị mới khi đang bị mượn (E0506) và thiếu mut (E0596)"]}, {"n": "4.3", "t": "NLL — Non-Lexical Lifetimes", "sub": ["Phạm vi của một lần mượn", "Cái bẫy: mượn qua phương thức"]}, {"n": "4.4", "t": "Tham chiếu treo (dangling reference)", "sub": []}, {"n": "4.5", "t": "Slice", "sub": ["String slice &amp;str", "Dùng &amp;str làm tham số", "Slice ngăn lỗi logic: ví dụ tu_dau_tien", "Ranh giới ký tự UTF-8"]}, {"n": "4.6", "t": "Phân tích thông báo lỗi borrow checker và cách sửa", "sub": ["Bảng tổng hợp", "E0382 với vòng lặp for", "E0505: move khi đang bị mượn", "Code đã sửa cho các lỗi trên", "Chiến lược chung khi \"đánh nhau\" với borrow checker"]}, {"n": "4.7", "t": "So sánh T, &amp;T và &amp;mut T", "sub": []}], "summary": ["Tham chiếu <code>&amp;T<\/code> cho phép dùng giá trị mà không lấy ownership; <code>&amp;mut T<\/code> cho phép sửa. Về máy, tham chiếu chỉ là con trỏ, nhưng luôn khác null và luôn hợp lệ.", "Quy tắc mượn: hoặc một <code>&amp;mut<\/code>, hoặc nhiều <code>&amp;<\/code>, không bao giờ cả hai cùng lúc; tham chiếu không được sống lâu hơn giá trị. Quy tắc \"chia sẻ XOR khả biến\" loại bỏ iterator invalidation, con trỏ treo và data race.", "NLL: một lần mượn kéo dài tới lần dùng cuối, không phải tới cuối khối. Two-phase borrow cho phép <code>v.push(v.len())<\/code>. Borrow checker tách biệt được các trường khi truy cập trực tiếp, nhưng không qua phương thức <code>&amp;mut self<\/code>.", "Không thể trả về tham chiếu tới biến cục bộ (E0106, E0597); hãy trả về giá trị sở hữu.", "Slice <code>&amp;str<\/code> và <code>&amp;[T]<\/code> là con trỏ béo (con trỏ + độ dài) tham chiếu tới một dãy liên tiếp; nên nhận <code>&amp;str<\/code>/<code>&amp;[T]<\/code> làm tham số thay vì <code>&amp;String<\/code>/<code>&amp;Vec&lt;T&gt;<\/code>.", "Chỉ số của string slice là chỉ số byte và phải nằm đúng ranh giới ký tự UTF-8, nếu không sẽ panic.", "Các mã lỗi cần thuộc lòng: E0382, E0499, E0502, E0505, E0506, E0596, E0597, E0106, E0716; mỗi lỗi có một nhóm cách sửa điển hình."], "exercises": ["Viết hàm <code>fn dem_nguyen_am(s: &amp;str) -&gt; usize<\/code> đếm nguyên âm (a, e, i, o, u, y, không phân biệt hoa thường, chỉ tính chữ không dấu). Gọi hàm với một <code>String<\/code>, một literal và một slice của <code>String<\/code>.", "Viết hàm <code>fn chuan_hoa(s: &amp;mut String)<\/code> thay mọi chuỗi nhiều dấu cách liên tiếp bằng một dấu cách và xóa khoảng trắng đầu cuối. Gợi ý: xây chuỗi mới rồi gán <code>*s = moi;<\/code>.", "Đoạn code sau lỗi gì? Sửa bằng ba cách khác nhau: <code>let mut v = vec![1, 2, 3]; let lon_nhat = v.iter().max().unwrap(); v.push(*lon_nhat + 1);<\/code>", "Viết hàm <code>fn tu_dai_nhat(s: &amp;str) -&gt; &amp;str<\/code> trả về từ dài nhất (theo số ký tự) trong câu. Thử gọi hàm, giữ kết quả, rồi sửa chuỗi gốc để thấy lỗi E0502.", "Viết hàm <code>fn hoan_doi_nua(xs: &amp;mut [i32])<\/code> đổi chỗ nửa đầu và nửa sau của slice có độ dài chẵn (ví dụ [1,2,3,4] thành [3,4,1,2]) bằng <code>split_at_mut<\/code> và <code>swap_with_slice<\/code>.", "Viết hàm <code>fn cat_an_toan(s: &amp;str, n: usize) -&gt; &amp;str<\/code> trả về n ký tự đầu tiên (không phải n byte) của chuỗi mà không bao giờ panic, kể cả với tiếng Việt có dấu. Gợi ý: <code>char_indices().nth(n)<\/code>.", "(Nâng cao) Cho <code>struct TroChoi { nguoi_choi: Vec&lt;String&gt;, diem: Vec&lt;u32&gt; }<\/code>. Viết phương thức cộng 10 điểm cho người chơi có tên dài nhất. Thử cách viết \"tự nhiên\" trước, quan sát lỗi borrow checker, rồi sửa bằng chiến lược hai pha (tìm chỉ số trước, cập nhật sau)."]}, {"id": "p1c5", "num": 5, "title": "Lifetimes", "intro": "Mọi tham chiếu trong Rust đều có một lifetime: khoảng code mà tham chiếu đó còn hợp lệ. Trong phần lớn trường hợp, trình biên dịch tự suy ra lifetime giống như suy ra kiểu, và bạn không cần viết gì. Nhưng khi quan hệ giữa các tham chiếu không hiển nhiên, ví dụ một hàm nhận hai tham chiếu và trả về một tham chiếu, bạn phải mô tả quan hệ đó bằng chú thích lifetime (lifetime annotation). Lifetime thường được coi là phần khó nhất của Rust, chủ yếu vì một hiểu lầm phổ biến: chú thích lifetime không thay đổi việc giá trị sống bao lâu. Nó chỉ là lời mô tả cho trình biên dịch về quan hệ giữa các tham chiếu, để trình biên dịch kiểm tra. Chương này đi từ cú pháp cơ bản, ba quy tắc elision, lifetime trong struct, <code>'static<\/code>, ràng buộc <code>T: 'a<\/code>, tới HRTB, variance và các bẫy thường gặp.", "sections": [{"n": "5.1", "t": "Lifetime là gì", "sub": ["Borrow checker so sánh các vùng sống", "Vì sao cần chú thích: hàm dai_nhat"]}, {"n": "5.2", "t": "Cú pháp chú thích lifetime", "sub": ["Tham số lifetime", "Khi bên gọi vi phạm hợp đồng", "Chú thích không kéo dài sự sống"]}, {"n": "5.3", "t": "Ba quy tắc elision", "sub": ["Phát biểu", "Kiểm chứng bằng code", "Khi elision chọn sai"]}, {"n": "5.4", "t": "Lifetime trong struct và impl", "sub": ["Struct chứa tham chiếu", "Khối impl và phương thức", "Lifetime ẩn danh '_"]}, {"n": "5.5", "t": "Lifetime 'static", "sub": ["Tham chiếu &amp;'static", "Ràng buộc T: 'static"]}, {"n": "5.6", "t": "Ràng buộc T: 'a", "sub": []}, {"n": "5.7", "t": "HRTB — ràng buộc trait cấp cao (giới thiệu)", "sub": ["Vấn đề", "Lời giải: ràng buộc trait cấp cao"]}, {"n": "5.8", "t": "Variance sơ lược", "sub": ["Quan hệ \"dài hơn\" như quan hệ kiểu con", "Vì sao &amp;mut T phải invariant"]}, {"n": "5.9", "t": "Các bẫy thường gặp", "sub": ["&amp;'a mut self trên struct có lifetime 'a", "Closure trả về tham chiếu", "Các bẫy khác"]}], "summary": ["Lifetime là vùng code mà tham chiếu hợp lệ. Trình biên dịch luôn tính lifetime; chú thích chỉ cần khi quan hệ giữa các tham chiếu ở ranh giới hàm hoặc struct không thể suy ra.", "Cú pháp <code>&amp;'a T<\/code>; tham số lifetime khai báo như generic <code>&lt;'a&gt;<\/code>. Chữ ký <code>fn f&lt;'a&gt;(x: &amp;'a str, y: &amp;'a str) -&gt; &amp;'a str<\/code> nghĩa là kết quả sống bằng phần giao của các đối số.", "Chú thích mô tả, không ra lệnh: không thể trả về tham chiếu tới biến cục bộ (E0515) bằng bất kỳ chú thích nào.", "Ba quy tắc elision: mỗi tham số tham chiếu một lifetime; một đầu vào thì gán cho đầu ra; có <code>&amp;self<\/code> thì đầu ra theo <code>self<\/code>. Không đủ thì lỗi E0106. Elision có thể chọn sai, khi đó phải viết tường minh.", "Struct chứa tham chiếu cần <code>struct S&lt;'a&gt;<\/code>; phân biệt trả về <code>&amp;'a T<\/code> (theo dữ liệu gốc) và <code>&amp;T<\/code> (theo <code>&amp;self<\/code>). Dùng <code>'_<\/code> khi không cần đặt tên.", "<code>&amp;'static T<\/code> trỏ tới dữ liệu tồn tại suốt chương trình; <code>T: 'static<\/code> nghĩa là T không chứa tham chiếu ngắn hạn, mọi kiểu sở hữu đều thỏa mãn. <code>dyn Trait<\/code> mặc định là <code>+ 'static<\/code>.", "<code>T: 'a<\/code> nghĩa là mọi tham chiếu trong T sống ít nhất bằng <code>'a<\/code>. HRTB <code>for&lt;'a&gt;<\/code> diễn đạt \"với mọi lifetime\", thường được sinh ngầm từ <code>Fn(&amp;str) -&gt; &amp;str<\/code>.", "Variance: <code>&amp;'a T<\/code> covariant, <code>&amp;'a mut T<\/code> invariant theo <code>T<\/code>; tính invariant ngăn việc ghi tham chiếu ngắn hạn vào chỗ đòi hỏi tham chiếu dài hạn.", "Tránh <code>&amp;'a mut self<\/code> trên struct <code>&lt;'a&gt;<\/code>, tránh dùng <code>'static<\/code> để \"làm im\" trình biên dịch, và nhớ rằng closure không áp dụng elision như hàm."], "exercises": ["Với mỗi chữ ký sau, viết dạng đầy đủ sau elision hoặc cho biết vì sao cần chú thích: <code>fn a(x: &amp;i32) -&gt; &amp;i32<\/code>, <code>fn b(x: &amp;i32, y: i32) -&gt; &amp;i32<\/code>, <code>fn c(x: &amp;str, y: &amp;str) -&gt; String<\/code>, <code>fn d(&amp;self, x: &amp;str) -&gt; &amp;str<\/code>, <code>fn e(x: &amp;[u8], y: &amp;[u8]) -&gt; &amp;[u8]<\/code>.", "Viết <code>fn tu_chung_dau_tien&lt;'a&gt;(a: &amp;'a str, b: &amp;str) -&gt; Option&lt;&amp;'a str&gt;<\/code> trả về từ đầu tiên của <code>a<\/code> cũng xuất hiện trong <code>b<\/code>. Giải thích vì sao <code>b<\/code> không cần lifetime <code>'a<\/code>, và viết một <code>main<\/code> chứng minh lợi ích đó.", "Viết struct <code>DongCsv&lt;'a&gt;<\/code> giữ một dòng CSV dạng <code>&amp;'a str<\/code> và phương thức <code>fn cot(&amp;self, i: usize) -&gt; Option&lt;&amp;'a str&gt;<\/code>. Đọc một văn bản nhiều dòng, tạo <code>Vec&lt;DongCsv&gt;<\/code> và thu thập cột thứ hai của mọi dòng vào <code>Vec&lt;&amp;str&gt;<\/code> sống lâu hơn các <code>DongCsv<\/code>.", "Viết lại <code>BoTachTu<\/code> sao cho <code>tu_tiep_theo<\/code> trả về <code>Option&lt;&amp;str&gt;<\/code> (dùng elision). Quan sát lỗi biên dịch khi lưu các từ vào <code>Vec<\/code>, giải thích lỗi bằng lời của bạn.", "Viết hàm <code>fn ghi_nho(v: &amp;mut Vec&lt;&amp;str&gt;, s: &amp;str)<\/code> thêm <code>s<\/code> vào <code>v<\/code>. Đọc lỗi, rồi sửa bằng cách thêm chú thích lifetime phù hợp. Giải thích vì sao cần liên kết lifetime giữa <code>v<\/code> và <code>s<\/code>.", "Giải thích bằng sơ đồ vì sao ví dụ <code>gan(&amp;mut s, &amp;cuc_bo)<\/code> ở mục 5.8.2 sẽ gây lỗi bộ nhớ nếu trình biên dịch chấp nhận. Sau đó sửa chương trình để hợp lệ mà vẫn gọi <code>gan<\/code> (gợi ý: thay đổi kiểu của <code>s<\/code>).", "(Nâng cao) Viết hàm <code>fn ap_dung_hai_lan&lt;F&gt;(f: F) -&gt; (String, String)<\/code> trong đó <code>F: for&lt;'a&gt; Fn(&amp;'a str) -&gt; &amp;'a str<\/code>; bên trong tạo hai <code>String<\/code> cục bộ khác nhau, gọi <code>f<\/code> lên từng chuỗi và trả về kết quả dạng sở hữu. Thử bỏ <code>for&lt;'a&gt;<\/code> và chuyển <code>'a<\/code> lên tham số của hàm, giải thích lỗi nhận được."]}, {"id": "p1c6", "num": 6, "title": "Struct, Enum &amp; Pattern Matching", "intro": "Struct và enum là hai công cụ chính để định nghĩa kiểu dữ liệu mới trong Rust. Struct gom nhiều giá trị liên quan thành một đơn vị có tên (\"và\": một người dùng có tên VÀ email VÀ tuổi). Enum biểu diễn một giá trị là một trong nhiều khả năng (\"hoặc\": một tin nhắn là Thoát HOẶC Di chuyển HOẶC Viết). Kết hợp với khớp mẫu (pattern matching) bằng <code>match<\/code>, chúng tạo nên phong cách lập trình đặc trưng của Rust: mô hình hóa dữ liệu sao cho trạng thái không hợp lệ không thể biểu diễn được, và để trình biên dịch kiểm tra rằng bạn đã xử lý mọi trường hợp. Chương này trình bày struct, phương thức, enum mang dữ liệu, <code>Option<\/code>, toàn bộ cú pháp pattern (destructuring, guard, <code>@<\/code>, range, slice pattern, <code>..<\/code>), các dạng rút gọn <code>if let<\/code>, <code>let-else<\/code>, <code>while let<\/code>, <code>matches!<\/code>, và cuối cùng là bố cục bộ nhớ của enum cùng tối ưu niche.", "sections": [{"n": "6.1", "t": "Struct", "sub": ["Ba loại struct", "Cú pháp cập nhật struct và move"]}, {"n": "6.2", "t": "Phương thức và hàm liên kết", "sub": ["Khối impl", "Ba dạng của self"]}, {"n": "6.3", "t": "Enum", "sub": ["Enum mang dữ liệu", "Option: không có null"]}, {"n": "6.4", "t": "Biểu thức match", "sub": ["Cấu trúc và tính đầy đủ", "Các thành phần của match"]}, {"n": "6.5", "t": "Cú pháp pattern chi tiết", "sub": ["Tổng hợp qua ví dụ", "Bảng cú pháp pattern", "Binding mode: move hay mượn trong pattern"]}, {"n": "6.6", "t": "if let, let-else, while let và matches!", "sub": ["Các dạng rút gọn", "Refutable và irrefutable"]}, {"n": "6.7", "t": "Bố cục bộ nhớ của enum và tối ưu niche", "sub": ["Tag và payload", "Niche optimization", "Enum kiểu C và discriminant"]}, {"n": "6.8", "t": "Thiết kế: làm cho trạng thái không hợp lệ không thể biểu diễn", "sub": []}], "summary": ["Ba loại struct: có tên trường, tuple struct (gồm mẫu newtype không tốn chi phí), unit struct. Struct update <code>..khac<\/code> move các trường không <code>Copy<\/code>.", "Khối <code>impl<\/code> chứa phương thức (<code>&amp;self<\/code>, <code>&amp;mut self<\/code>, <code>self<\/code>) và hàm liên kết (không có <code>self<\/code>, gọi bằng <code>Kieu::ham<\/code>); Rust tự động thêm <code>&amp;<\/code>/<code>&amp;mut<\/code> khi gọi phương thức. Phương thức nhận <code>self<\/code> tiêu thụ giá trị.", "Enum mỗi biến thể mang dữ liệu riêng (kiểu tổng); <code>Option&lt;T&gt;<\/code> thay thế null và buộc xử lý trường hợp không có giá trị.", "<code>match<\/code> phải đầy đủ (E0004); thứ tự nhánh quan trọng; mỗi nhánh là một biểu thức cùng kiểu.", "Pattern gồm literal, range, <code>|<\/code>, biến, <code>_<\/code>, guard, <code>@<\/code>, phân rã tuple/struct/enum lồng nhau, <code>..<\/code>, slice pattern, <code>&amp;<\/code>, <code>ref<\/code>. Pattern gắn giá trị không <code>Copy<\/code> sẽ move; dùng <code>match &amp;x<\/code>, <code>as_ref()<\/code> hoặc <code>ref<\/code> để mượn.", "<code>if let<\/code>, <code>let-else<\/code>, <code>while let<\/code>, <code>matches!<\/code> và let chains (edition 2024) là các dạng rút gọn; <code>let<\/code> thường chỉ nhận mẫu irrefutable (E0005).", "Enum được lưu bằng tag cộng payload lớn nhất; tối ưu niche dùng các mẫu bit không hợp lệ (null, giá trị 0, capacity quá lớn) để bỏ tag, nên <code>Option&lt;&amp;T&gt;<\/code>, <code>Option&lt;Box&lt;T&gt;&gt;<\/code>, <code>Option&lt;String&gt;<\/code> không tốn thêm byte nào.", "Dùng enum để mô hình hóa trạng thái sao cho tổ hợp không hợp lệ không thể biểu diễn."], "exercises": ["Định nghĩa struct <code>PhanSo { tu: i64, mau: i64 }<\/code> với hàm liên kết <code>new<\/code> (chuẩn hóa dấu và rút gọn bằng ước chung lớn nhất, panic nếu mẫu bằng 0), các phương thức <code>cong(&amp;self, khac: &amp;PhanSo) -&gt; PhanSo<\/code>, <code>nhan<\/code>, và <code>gia_tri(&amp;self) -&gt; f64<\/code>.", "Định nghĩa enum <code>Hinh { Tron(f64), ChuNhat(f64, f64), TamGiac(f64, f64, f64) }<\/code> với phương thức <code>dien_tich<\/code> (công thức Heron cho tam giác) và <code>chu_vi<\/code>. Tính tổng diện tích một <code>Vec&lt;Hinh&gt;<\/code>.", "Viết hàm <code>fn phan_loai(c: char) -&gt; &amp;'static str<\/code> dùng một <code>match<\/code> duy nhất với range pattern và <code>|<\/code> để phân loại: nguyên âm tiếng Anh, phụ âm, chữ số, khoảng trắng, ký tự khác.", "Viết hàm <code>fn mo_ta(v: &amp;[i32]) -&gt; String<\/code> dùng slice pattern để nhận biết: rỗng, một phần tử, hai phần tử bằng nhau, bắt đầu bằng 0, và dạng tổng quát in ra phần tử đầu, cuối, số phần tử ở giữa.", "Viết hàm <code>fn doc_cau_hinh(dong: &amp;str) -&gt; Option&lt;(String, u16)&gt;<\/code> phân tích chuỗi dạng <code>\"host:port\"<\/code> bằng <code>let-else<\/code> và <code>split_once<\/code>, trả về <code>None<\/code> nếu thiếu dấu hai chấm hoặc cổng không phải số hợp lệ (gợi ý: <code>port.parse::&lt;u16&gt;().ok()?<\/code>).", "Mô hình hóa đèn giao thông bằng enum <code>Den { Do, Vang, Xanh }<\/code> với phương thức <code>fn ke_tiep(self) -&gt; Den<\/code> và <code>fn thoi_gian(&amp;self) -&gt; u32<\/code>. Mô phỏng 10 chu kỳ và in tổng thời gian.", "Dự đoán rồi kiểm chứng bằng <code>size_of<\/code>: <code>Option&lt;u64&gt;<\/code>, <code>Option&lt;Box&lt;[u8]&gt;&gt;<\/code>, <code>Option&lt;Vec&lt;u8&gt;&gt;<\/code>, <code>Result&lt;(), Box&lt;str&gt;&gt;<\/code>, một enum có biến thể <code>[u8; 100]<\/code> và biến thể <code>u8<\/code>. Giải thích từng kết quả dựa trên niche và tag.", "(Nâng cao) Viết máy trạng thái cho đơn hàng: <code>Moi<\/code>, <code>DaThanhToan { so_tien }<\/code>, <code>DangGiao { ma_van_don }<\/code>, <code>DaGiao<\/code>, <code>DaHuy { ly_do }<\/code>. Viết hàm chuyển trạng thái trả về <code>Result&lt;DonHang, String&gt;<\/code> từ chối các chuyển đổi không hợp lệ (ví dụ hủy đơn đã giao). Thử thêm một biến thể mới và quan sát các chỗ trình biên dịch yêu cầu cập nhật."]}, {"id": "p1c7", "num": 7, "title": "Module, Crate &amp; Package", "intro": "Khi chương trình lớn dần, việc tổ chức mã nguồn trở nên quan trọng không kém việc viết đúng từng hàm. Rust cung cấp một hệ thống module (module system) gồm nhiều tầng: package, crate, module và path, cùng với các quy tắc hiển thị (visibility) cho phép bạn quyết định chính xác phần nào là API công khai và phần nào là chi tiết cài đặt. Chương này giải thích từng khái niệm, cách chia mã nguồn ra nhiều file (<code>mod.rs<\/code> và <code>ten_file.rs<\/code>), cách dùng <code>use<\/code>, <code>pub use<\/code> để thiết kế API gọn gàng, prelude, cách kết hợp thư viện và chương trình trong một package, quản lý dependency theo semver, và giới thiệu features cùng workspace. Mọi ví dụ nhiều file trong chương đều được biên dịch và chạy thật. Phần 3, Chương 2 sẽ đi sâu hơn về Cargo.", "sections": [{"n": "7.1", "t": "Bốn khái niệm: package, crate, module, path", "sub": []}, {"n": "7.2", "t": "Module inline và quy tắc riêng tư", "sub": ["Định nghĩa module", "Struct, enum và quyền riêng tư", "Lỗi truy cập mục riêng tư"]}, {"n": "7.3", "t": "Path: crate, self, super", "sub": []}, {"n": "7.4", "t": "Từ khóa use", "sub": ["Đưa tên vào phạm vi", "use không được kế thừa vào module con"]}, {"n": "7.5", "t": "Các mức hiển thị", "sub": []}, {"n": "7.6", "t": "Chia module ra nhiều file", "sub": ["Quy tắc tìm file", "Ví dụ hoàn chỉnh: package cua-hang", "Ranh giới crate bảo vệ API"]}, {"n": "7.7", "t": "Re-export với pub use và prelude", "sub": ["Tách cấu trúc nội bộ khỏi API công khai", "Prelude"]}, {"n": "7.8", "t": "Library crate và binary crate", "sub": ["Kết hợp trong một package", "Nhiều binary và example"]}, {"n": "7.9", "t": "Dependency và semver", "sub": ["Thêm dependency", "Semantic versioning và cú pháp yêu cầu phiên bản", "Cargo.lock"]}, {"n": "7.10", "t": "Features (giới thiệu)", "sub": []}, {"n": "7.11", "t": "Workspace (giới thiệu)", "sub": []}], "summary": ["Package (có <code>Cargo.toml<\/code>) chứa tối đa một library crate và nhiều binary crate; crate là đơn vị biên dịch; module tổ chức code và quyền riêng tư bên trong crate; path gọi tên các mục.", "Mọi mục mặc định riêng tư: chỉ module định nghĩa và con cháu thấy được. <code>pub struct<\/code> không làm trường công khai; <code>pub enum<\/code> làm mọi biến thể công khai.", "Đường dẫn tuyệt đối bắt đầu bằng <code>crate::<\/code> hoặc tên crate; tương đối dùng <code>self::<\/code>, <code>super::<\/code>.", "<code>use<\/code> tạo lối tắt trong phạm vi module hiện tại và không được kế thừa vào module con; quy ước: <code>use<\/code> tới module cha cho hàm, tới chính mục cho kiểu; trait phải trong phạm vi mới gọi được phương thức.", "Mức hiển thị: mặc định, <code>pub(super)<\/code>, <code>pub(in path)<\/code>, <code>pub(crate)<\/code>, <code>pub<\/code>.", "<code>mod ten;<\/code> tìm <code>ten.rs<\/code> hoặc <code>ten/mod.rs<\/code>; <code>mod<\/code> khai báo module đúng một lần, không phải <code>#include<\/code>.", "<code>pub use<\/code> tái xuất để tách cấu trúc nội bộ khỏi API công khai; prelude gom các tên hay dùng.", "Đặt logic vào <code>lib.rs<\/code>, giữ <code>main.rs<\/code> mỏng; <code>src/bin/<\/code> cho nhiều chương trình.", "Dependency theo semver với yêu cầu caret mặc định (0.x coi MINOR là MAJOR); <code>Cargo.lock<\/code> ghi phiên bản chính xác; <code>cargo add<\/code>, <code>cargo update<\/code>, <code>cargo tree<\/code>.", "Feature cho biên dịch có điều kiện và phải có tính cộng dồn; workspace gom nhiều package dùng chung <code>Cargo.lock<\/code> và <code>target/<\/code>."], "exercises": ["Viết module inline <code>hinh_hoc<\/code> với các module con <code>phang<\/code> (struct <code>HinhTron<\/code>, <code>HinhVuong<\/code>) và <code>khong_gian<\/code> (struct <code>HinhCau<\/code>). Mỗi struct có trường riêng tư và hàm tạo kiểm tra tham số dương. Gọi từ <code>main<\/code> bằng cả đường dẫn tuyệt đối và <code>use<\/code>.", "Chuyển bài 1 thành package thư viện nhiều file theo kiểu <code>ten.rs<\/code>, sau đó đổi một module sang kiểu <code>mod.rs<\/code>. Viết <code>src/main.rs<\/code> dùng thư viện và kiểm tra rằng không truy cập được trường riêng tư.", "Thêm vào <code>cua-hang<\/code> hàm <code>pub(crate) fn lam_tron_nghin(so: u64) -&gt; u64<\/code> trong <code>tien_ich<\/code> và dùng nó trong <code>DonHang::tong<\/code>. Thử gọi hàm này từ <code>main.rs<\/code> và giải thích lỗi nhận được.", "Thiết kế module <code>prelude<\/code> cho thư viện ở bài 2 và viết lại <code>main.rs<\/code> chỉ với một dòng <code>use<\/code>. Thảo luận ưu nhược điểm của glob import.", "Thêm feature <code>xuat_csv<\/code> cho <code>cua-hang<\/code>: khi bật, <code>DonHang<\/code> có thêm phương thức <code>fn csv(&amp;self) -&gt; String<\/code>. Chạy chương trình với và không có feature, rồi dùng <code>cfg!(feature = \"xuat_csv\")<\/code> để in ra feature có đang bật không.", "Cho các yêu cầu phiên bản <code>\"1.4\"<\/code>, <code>\"~0.3.2\"<\/code>, <code>\"0.0.7\"<\/code>, <code>\"=2.0.1\"<\/code>, <code>\"&gt;=1.1, &lt;1.3\"<\/code>, hãy liệt kê phiên bản nào trong danh sách sau được chấp nhận: 0.0.7, 0.0.8, 0.3.5, 0.4.0, 1.1.0, 1.2.9, 1.4.0, 1.9.9, 2.0.0, 2.0.1.", "(Nâng cao) Tạo workspace gồm ba crate: <code>mien<\/code> (struct <code>NguoiDung<\/code> và trait <code>KhoNguoiDung<\/code>), <code>ha_tang<\/code> (cài đặt <code>KhoNguoiDung<\/code> bằng <code>Vec<\/code> trong bộ nhớ, phụ thuộc <code>mien<\/code>), <code>ung_dung<\/code> (binary, phụ thuộc cả hai). Dùng <code>[workspace.dependencies]<\/code> và <code>[workspace.package]<\/code>; chạy <code>cargo tree -p ung_dung<\/code> để xem quan hệ phụ thuộc."]}, {"id": "p1c8", "num": 8, "title": "Collections chuẩn", "intro": "Thư viện chuẩn của Rust cung cấp một bộ cấu trúc dữ liệu tập hợp (collections) được tối ưu kỹ lưỡng, lưu dữ liệu trên heap và có thể co giãn lúc chạy. Chương này đi qua những collection quan trọng nhất: <code>Vec&lt;T&gt;<\/code> (mảng động, collection bạn sẽ dùng nhiều nhất), <code>String<\/code> cùng mô hình UTF-8 (và lý do không thể truy cập chuỗi bằng chỉ số), <code>HashMap&lt;K, V&gt;<\/code> với entry API và hàm băm SipHash, <code>HashSet<\/code>, các phiên bản có thứ tự <code>BTreeMap<\/code>/<code>BTreeSet<\/code>, hàng đợi hai đầu <code>VecDeque<\/code> và hàng đợi ưu tiên <code>BinaryHeap<\/code>. Với mỗi collection, ta xem cách nó được lưu trong bộ nhớ, độ phức tạp của các thao tác và những lỗi thường gặp. Cuối chương có bảng so sánh giúp chọn đúng cấu trúc. Phần 2 của bộ tài liệu sẽ tự cài đặt nhiều cấu trúc trong số này.", "sections": [{"n": "8.1", "t": "Vec — mảng động", "sub": ["Bố cục bộ nhớ và chiến lược tăng trưởng", "Thao tác cơ bản", "Sắp xếp, lọc và các giải thuật trên slice"]}, {"n": "8.2", "t": "String và UTF-8", "sub": ["String và &amp;str", "Toán tử + và format!", "Vì sao không truy cập chuỗi bằng chỉ số"]}, {"n": "8.3", "t": "HashMap", "sub": ["Thao tác cơ bản và entry API", "Thứ tự duyệt và hàm băm SipHash", "Khóa tùy biến"]}, {"n": "8.4", "t": "HashSet, BTreeMap và BTreeSet", "sub": []}, {"n": "8.5", "t": "VecDeque và BinaryHeap", "sub": ["VecDeque: bộ đệm vòng", "BinaryHeap: hàng đợi ưu tiên"]}, {"n": "8.6", "t": "Bảng so sánh và lựa chọn", "sub": ["Độ phức tạp các thao tác", "Khi nào dùng gì"]}], "summary": ["<code>Vec&lt;T&gt;<\/code> gồm (ptr, capacity, len) trên stack và bộ đệm liền nhau trên heap; capacity tăng gấp đôi nên <code>push<\/code> có chi phí khấu hao O(1); dùng <code>with_capacity<\/code> khi biết trước kích thước.", "Truy cập bằng <code>[i]<\/code> panic khi vượt biên, <code>get(i)<\/code> trả <code>Option<\/code>; chỉ số luôn là <code>usize<\/code>. <code>insert<\/code>/<code>remove<\/code> giữa là O(n), <code>swap_remove<\/code> là O(1).", "Các giải thuật <code>sort<\/code>, <code>sort_by_key<\/code>, <code>dedup<\/code>, <code>retain<\/code>, <code>drain<\/code>, <code>binary_search<\/code>, <code>windows<\/code>, <code>chunks<\/code> được định nghĩa trên slice và dùng được cho <code>Vec<\/code>.", "<code>String<\/code> là <code>Vec&lt;u8&gt;<\/code> chứa UTF-8 hợp lệ; <code>len()<\/code> là số byte. Không thể truy cập chuỗi bằng chỉ số số nguyên (E0277) vì UTF-8 biến độ dài, truy cập ký tự là O(n), và \"ký tự\" có nhiều tầng (byte, char, grapheme). Chú ý NFC/NFD khi xử lý tiếng Việt.", "<code>a + &amp;b<\/code> lấy ownership của <code>a<\/code>; <code>format!<\/code> không lấy ownership và dễ đọc hơn.", "<code>HashMap<\/code> cần khóa <code>Eq + Hash<\/code>; entry API (<code>or_insert<\/code>, <code>or_insert_with<\/code>, <code>or_default<\/code>, <code>and_modify<\/code>) xử lý \"chèn hoặc sửa\" với một lần tra cứu. Hàm băm mặc định SipHash-1-3 có khóa ngẫu nhiên chống HashDoS, nên thứ tự duyệt không xác định.", "<code>BTreeMap<\/code>/<code>BTreeSet<\/code> giữ khóa có thứ tự, O(log n), hỗ trợ <code>range<\/code>, <code>first<\/code>, <code>last<\/code>.", "<code>VecDeque<\/code> là bộ đệm vòng cho thao tác O(1) ở hai đầu; <code>BinaryHeap<\/code> là max-heap, dùng <code>Reverse<\/code> cho min-heap.", "Mặc định chọn <code>Vec<\/code> và <code>HashMap<\/code>; chọn cấu trúc khác khi có nhu cầu cụ thể về thứ tự, hai đầu hay ưu tiên."], "exercises": ["Viết hàm <code>fn trung_vi_va_yeu_vi(v: &amp;[i32]) -&gt; (f64, Vec&lt;i32&gt;)<\/code> trả về trung vị và danh sách các giá trị xuất hiện nhiều nhất (yếu vị, có thể nhiều hơn một, sắp tăng dần). Dùng <code>sort<\/code> cho trung vị và <code>HashMap<\/code> cho đếm tần suất.", "Viết hàm chuyển một câu sang \"pig latin\" tiếng Anh: từ bắt đầu bằng phụ âm thì chuyển phụ âm đầu ra cuối và thêm \"ay\" (\"first\" thành \"irst-fay\"); từ bắt đầu bằng nguyên âm thì thêm \"-hay\". Xử lý đúng với chuỗi UTF-8 bất kỳ mà không panic.", "Dùng <code>HashMap&lt;String, Vec&lt;String&gt;&gt;<\/code> viết chương trình quản lý nhân sự theo phòng ban qua các lệnh dạng chuỗi như \"Thêm Lan vào Kỹ thuật\". In danh sách nhân viên của từng phòng theo thứ tự bảng chữ cái, các phòng cũng theo thứ tự (gợi ý: thử cả <code>BTreeMap<\/code>).", "Viết hàm <code>fn chuan_hoa_ten(s: &amp;str) -&gt; String<\/code> viết hoa chữ cái đầu mỗi từ và viết thường phần còn lại, bỏ khoảng trắng thừa: \"  nguyễn   văn AN \" thành \"Nguyễn Văn An\". Kiểm tra với chữ có dấu.", "Cho danh sách các đoạn thời gian (giờ bắt đầu, giờ kết thúc), dùng <code>BTreeMap<\/code> để trả lời nhanh câu hỏi \"có cuộc họp nào bắt đầu trong khoảng [a, b) không?\" và liệt kê chúng.", "Mô phỏng hàng đợi in ấn bằng <code>VecDeque<\/code>: các lệnh \"in X\" (thêm vào cuối), \"gấp X\" (thêm vào đầu), \"xử lý\" (lấy từ đầu). In trạng thái hàng đợi sau mỗi lệnh.", "Dùng <code>BinaryHeap<\/code> để trộn k vector đã sắp xếp thành một vector đã sắp xếp trong O(n log k). Gợi ý: đẩy <code>Reverse((giá_trị, chỉ_số_vector, chỉ_số_phần_tử))<\/code> vào heap.", "(Nâng cao) Đo thực nghiệm (dùng <code>std::time::Instant<\/code>, chế độ <code>--release<\/code>) thời gian chèn 1 triệu số nguyên ngẫu nhiên vào <code>Vec<\/code> (rồi <code>sort<\/code> + <code>dedup<\/code>), <code>HashSet<\/code>, <code>BTreeSet<\/code>; và thời gian tra cứu 1 triệu lần trong mỗi cấu trúc. Giải thích kết quả dựa trên độ phức tạp và tính cục bộ bộ nhớ."]}, {"id": "p1c9", "num": 9, "title": "Xử lý lỗi", "intro": "Lỗi là một phần tất yếu của phần mềm: file không tồn tại, người dùng nhập sai, mạng mất kết nối, dữ liệu hỏng. Rust không có ngoại lệ (exception). Thay vào đó, ngôn ngữ chia lỗi thành hai loại rõ ràng: lỗi không thể phục hồi, xử lý bằng <code>panic!<\/code>, và lỗi có thể phục hồi, biểu diễn bằng kiểu <code>Result&lt;T, E&gt;<\/code>. Vì lỗi nằm ngay trong kiểu trả về, bạn không thể vô tình quên rằng một hàm có thể thất bại, và luồng điều khiển không bao giờ \"nhảy\" một cách vô hình như khi ném ngoại lệ. Chương này trình bày <code>panic!<\/code> và cơ chế unwind, <code>Result<\/code> cùng <code>unwrap<\/code>/<code>expect<\/code>, toán tử <code>?<\/code> và vai trò của trait <code>From<\/code>, các combinator của <code>Option<\/code>/<code>Result<\/code>, cách tự định nghĩa kiểu lỗi chuẩn mực (enum + <code>Display<\/code> + <code>Error<\/code>), <code>Box&lt;dyn Error&gt;<\/code>, hai crate phổ biến <code>thiserror<\/code> và <code>anyhow<\/code>, <code>main<\/code> trả về <code>Result<\/code>, và cuối cùng là nguyên tắc khi nào nên panic.", "sections": [{"n": "9.1", "t": "Hai loại lỗi", "sub": []}, {"n": "9.2", "t": "panic! — lỗi không thể phục hồi", "sub": ["Gọi panic!", "Unwind và abort", "Những nguồn panic ngầm"]}, {"n": "9.3", "t": "Result — lỗi có thể phục hồi", "sub": ["Định nghĩa và xử lý bằng match", "unwrap và expect"]}, {"n": "9.4", "t": "Toán tử ?", "sub": ["Lan truyền lỗi", "? chỉ dùng được trong hàm trả về Result hoặc Option", "? gọi From::from để chuyển đổi lỗi"]}, {"n": "9.5", "t": "Combinator của Option và Result", "sub": []}, {"n": "9.6", "t": "Kiểu lỗi tự định nghĩa", "sub": ["Công thức chuẩn: enum + Display + Error + From", "Hướng dẫn thiết kế kiểu lỗi"]}, {"n": "9.7", "t": "Trait object lỗi: Box dyn Error", "sub": []}, {"n": "9.8", "t": "thiserror — sinh code cho kiểu lỗi tự định nghĩa", "sub": []}, {"n": "9.9", "t": "anyhow — lỗi tiện lợi cho ứng dụng", "sub": ["anyhow::Error và context", "Chọn thiserror hay anyhow"]}, {"n": "9.10", "t": "main trả về Result", "sub": ["Result từ main", "ExitCode và trait Termination"]}, {"n": "9.11", "t": "Khi nào nên panic, khi nào trả về Result", "sub": []}], "summary": ["Rust không có ngoại lệ: <code>panic!<\/code> cho lỗi không thể phục hồi (bug), <code>Result&lt;T, E&gt;<\/code> cho lỗi dự kiến được. Lỗi nằm trong kiểu trả về nên không thể vô tình bỏ qua (<code>#[must_use]<\/code>).", "<code>panic!<\/code> in thông điệp, unwind stack (gọi <code>drop<\/code>) và kết thúc luồng; mã thoát 101; <code>RUST_BACKTRACE=1<\/code> để xem backtrace; <code>panic = \"abort\"<\/code> để bỏ unwind.", "<code>unwrap<\/code>/<code>expect<\/code> lấy giá trị hoặc panic; ưu tiên <code>expect<\/code> với thông điệp mô tả giả định.", "Toán tử <code>?<\/code> trả về sớm khi gặp <code>Err<\/code>/<code>None<\/code> và gọi <code>From::from<\/code> để chuyển kiểu lỗi; chỉ dùng trong hàm trả về <code>Result<\/code>/<code>Option<\/code> tương thích (E0277).", "Combinator (<code>map<\/code>, <code>map_err<\/code>, <code>and_then<\/code>, <code>ok_or<\/code>, <code>unwrap_or_else<\/code>...) biến đổi <code>Option<\/code>/<code>Result<\/code> gọn gàng; <code>collect<\/code> vào <code>Result&lt;Vec&lt;_&gt;, _&gt;<\/code> dừng ở lỗi đầu tiên.", "Kiểu lỗi tự định nghĩa: enum + <code>Display<\/code> + <code>Error<\/code> (với <code>source<\/code>) + <code>From<\/code>; không vừa nhúng lỗi gốc vào <code>Display<\/code> vừa trả về qua <code>source<\/code>.", "<code>Box&lt;dyn Error&gt;<\/code> nhận mọi lỗi, tiện cho ứng dụng nhỏ; thêm <code>+ Send + Sync<\/code> khi dùng với luồng.", "<code>thiserror<\/code> sinh code cho kiểu lỗi (thư viện); <code>anyhow<\/code> gom lỗi kèm context cho ứng dụng; hai crate bổ sung cho nhau.", "<code>main<\/code> có thể trả về <code>Result<\/code> (lỗi in bằng <code>Debug<\/code>, mã thoát 1) hoặc <code>ExitCode<\/code> để kiểm soát mã thoát.", "Panic khi bất biến bị vi phạm hoặc hợp đồng bị phá vỡ; trả <code>Result<\/code> cho mọi thất bại có thể xảy ra trong vận hành; dùng hệ thống kiểu để loại bỏ lỗi từ gốc."], "exercises": ["Viết hàm <code>fn chia(a: i32, b: i32) -&gt; Result&lt;i32, String&gt;<\/code> trả lỗi khi chia cho 0 hoặc khi kết quả tràn (<code>i32::MIN / -1<\/code>). Gọi hàm với nhiều cặp số và xử lý kết quả bằng <code>match<\/code>, rồi viết lại bằng <code>unwrap_or_else<\/code>.", "Viết hàm <code>fn tong_file(duong_dan: &amp;str) -&gt; Result&lt;i64, Box&lt;dyn Error&gt;&gt;<\/code> đọc một file mỗi dòng một số nguyên và trả về tổng; dòng trống được bỏ qua. Thử với file không tồn tại và file có dòng không phải số.", "Viết lại bài 2 với kiểu lỗi tự định nghĩa <code>LoiTongFile<\/code> gồm các biến thể <code>DocFile(io::Error)<\/code> và <code>DongKhongHopLe { so_dong: usize, noi_dung: String, nguon: ParseIntError }<\/code>, cài <code>Display<\/code>, <code>Error<\/code> (có <code>source<\/code>) và <code>From&lt;io::Error&gt;<\/code> bằng tay. In chuỗi nguyên nhân khi lỗi.", "Viết lại bài 3 bằng <code>thiserror<\/code> và so sánh số dòng code. Sau đó viết <code>main<\/code> dùng <code>anyhow::Result&lt;()&gt;<\/code> và <code>.with_context(...)<\/code> để thêm tên file vào thông điệp lỗi.", "Cho <code>let ds = vec![\"3\", \"7\", \"x\", \"10\"];<\/code> hãy: (a) tính tổng, dừng ở lỗi đầu tiên bằng <code>collect::&lt;Result&lt;Vec&lt;i32&gt;, _&gt;&gt;()<\/code>; (b) tính tổng bỏ qua phần tử lỗi bằng <code>filter_map<\/code> và <code>ok()<\/code>; (c) thu thập riêng danh sách lỗi bằng <code>partition<\/code>.", "Tạo newtype <code>Email(String)<\/code> với hàm tạo <code>fn parse(s: &amp;str) -&gt; Result&lt;Email, LoiEmail&gt;<\/code> kiểm tra có đúng một ký tự <code>@<\/code>, phần trước và sau không rỗng, phần sau có dấu chấm. Viết hàm <code>gui_thu(den: &amp;Email)<\/code> và giải thích vì sao nó không cần trả về <code>Result<\/code> cho lỗi định dạng email.", "Viết chương trình dòng lệnh <code>dem_tu &lt;file&gt;<\/code> trả về <code>ExitCode<\/code>: mã 0 khi thành công (in số từ), mã 2 khi thiếu tham số, mã 1 khi không đọc được file. Kiểm tra mã thoát bằng <code>echo $?<\/code>.", "(Nâng cao) Viết hàm <code>fn doc_cau_hinh_nhieu_nguon(cac_file: &amp;[&amp;str]) -&gt; anyhow::Result&lt;HashMap&lt;String, String&gt;&gt;<\/code> đọc lần lượt các file cấu hình dạng <code>khoa = gia_tri<\/code>, file sau ghi đè file trước; file không tồn tại thì bỏ qua (kiểm tra <code>ErrorKind::NotFound<\/code> qua <code>downcast_ref::&lt;io::Error&gt;()<\/code>), còn lỗi cú pháp thì trả lỗi kèm context ghi rõ tên file và số dòng."]}, {"id": "p1c10", "num": 10, "title": "Generics &amp; Traits — Lập trình tổng quát và trừu tượng hóa hành vi", "intro": "Generics (lập trình tổng quát) và trait (đặc điểm hành vi) là hai trụ cột giúp Rust vừa trừu tượng như Java/C# vừa nhanh như C. Generics cho phép viết một hàm hay một kiểu dữ liệu dùng được cho nhiều kiểu cụ thể; trait mô tả \"kiểu này làm được gì\" để compiler kiểm tra tại thời điểm biên dịch. Chương này đi từ cú pháp cơ bản đến cơ chế bên dưới: monomorphization (đơn hình hóa) sinh code riêng cho từng kiểu, trait object với con trỏ béo (fat pointer) và bảng phương thức ảo (vtable), quy tắc dyn compatibility, associated type, supertrait, orphan rule và blanket impl. Hiểu chương này là điều kiện để đọc được tài liệu của hầu hết crate trong hệ sinh thái, vì API Rust hiện đại gần như luôn được diễn đạt bằng trait bound.", "sections": [{"n": "10.1", "t": "Generics: viết code một lần cho nhiều kiểu", "sub": ["Vấn đề trùng lặp code", "Trait bound đầu tiên và lỗi E0369", "Struct, enum và method generic"]}, {"n": "10.2", "t": "Monomorphization — generics hoạt động thế nào bên dưới", "sub": ["Compiler sinh một bản code cho mỗi kiểu cụ thể", "Ưu và nhược điểm"]}, {"n": "10.3", "t": "Định nghĩa và implement trait", "sub": ["Method bắt buộc và default method", "Ba cách viết trait bound", "Trait phải nằm trong scope", "Cú pháp gọi đầy đủ khi trùng tên"]}, {"n": "10.4", "t": "impl Trait", "sub": ["impl Trait ở vị trí tham số", "impl Trait ở vị trí trả về"]}, {"n": "10.5", "t": "Trait object dyn Trait và vtable", "sub": ["Collection không đồng nhất", "Fat pointer và bố cục vtable", "So sánh static dispatch và dynamic dispatch", "Trait upcasting"]}, {"n": "10.6", "t": "Dyn compatibility (trước đây gọi là object safety)", "sub": []}, {"n": "10.7", "t": "Associated type và generic trait", "sub": []}, {"n": "10.8", "t": "Supertrait", "sub": []}, {"n": "10.9", "t": "Orphan rule và coherence", "sub": ["Quy tắc", "Newtype pattern để vượt qua orphan rule"]}, {"n": "10.10", "t": "Blanket impl", "sub": []}, {"n": "10.11", "t": "Các derive phổ biến", "sub": []}], "summary": ["Generics cho phép viết code một lần cho nhiều kiểu; thân hàm generic được kiểm tra ngay tại định nghĩa, nên mọi thao tác trên <code>T<\/code> phải được hứa qua trait bound.", "Rust hiện thực generics bằng monomorphization: mỗi kiểu cụ thể có một bản code riêng, nhanh như code viết tay nhưng làm tăng thời gian biên dịch và kích thước binary; tách phần thân không generic ra hàm <code>inner<\/code> để giảm bloat.", "Trait định nghĩa hành vi chung, hỗ trợ default method, associated type, associated const; phải <code>use<\/code> trait vào scope để gọi method của nó.", "Ba cách viết bound: <code>impl Trait<\/code>, <code>&lt;T: Trait&gt;<\/code>, <code>where<\/code>; <code>where<\/code> mạnh nhất. Dùng <code>&lt;Type as Trait&gt;::method<\/code> khi trùng tên.", "<code>impl Trait<\/code> ở vị trí trả về che kiểu cụ thể nhưng không tốn chi phí lúc chạy; mọi nhánh phải trả cùng một kiểu.", "<code>dyn Trait<\/code> dùng con trỏ béo (dữ liệu + vtable) và dynamic dispatch, cho phép collection không đồng nhất; vtable chứa drop, size, align và con trỏ method.", "Trait chỉ dùng làm <code>dyn<\/code> khi dyn compatible: không method generic, không trả <code>Self<\/code>, không <code>async fn<\/code>...; dùng <code>where Self: Sized<\/code> để loại trừ method vi phạm.", "Associated type khi mỗi kiểu chỉ có một lựa chọn hợp lý; generic trait khi cần nhiều impl.", "Orphan rule bảo đảm coherence; newtype là cách chuẩn để implement trait ngoại cho kiểu ngoại. Blanket impl phủ mọi kiểu thỏa bound và chặn các impl cụ thể chồng lấn."], "exercises": ["Viết hàm generic <code>fn min_max&lt;T: PartialOrd + Copy&gt;(v: &amp;[T]) -&gt; Option&lt;(T, T)&gt;<\/code> trả về cặp nhỏ nhất và lớn nhất, <code>None<\/code> nếu slice rỗng. Sau đó viết lại để không cần <code>Copy<\/code> bằng cách trả về <code>Option&lt;(&amp;T, &amp;T)&gt;<\/code>.", "Định nghĩa trait <code>Describe<\/code> với method bắt buộc <code>fn name(&amp;self) -&gt; String<\/code> và default method <code>fn describe(&amp;self) -&gt; String<\/code>. Implement cho <code>i32<\/code>, <code>String<\/code> và một struct của bạn. Thử implement <code>Describe<\/code> cho <code>Vec&lt;i32&gt;<\/code> rồi giải thích vì sao được phép dù <code>Vec<\/code> không phải kiểu cục bộ.", "Xây dựng hệ thống \"plugin\": trait <code>Plugin { fn name(&amp;self) -&gt; &amp;str; fn run(&amp;mut self, input: &amp;str) -&gt; String; }<\/code>, ba plugin khác nhau, lưu trong <code>Vec&lt;Box&lt;dyn Plugin&gt;&gt;<\/code> và chạy lần lượt theo kiểu pipeline. In <code>size_of<\/code> của <code>Box&lt;dyn Plugin&gt;<\/code> và giải thích con số.", "Cho trait <code>trait Store { fn save&lt;T: std::fmt::Debug&gt;(&amp;self, item: T); }<\/code>. Thử tạo <code>Box&lt;dyn Store&gt;<\/code>, đọc thông báo lỗi E0038, rồi đưa ra hai cách sửa: dùng <code>where Self: Sized<\/code>, hoặc thay tham số generic bằng <code>&amp;dyn Debug<\/code>. So sánh ưu nhược của hai cách.", "Implement <code>Add<\/code>, <code>Sub<\/code>, <code>Mul&lt;f64&gt;<\/code> cho struct <code>Vec2 { x: f64, y: f64 }<\/code> và <code>Add&lt;Vec2&gt; for Point2<\/code>. Giải thích vì sao <code>Output<\/code> là associated type còn <code>Rhs<\/code> là tham số generic.", "Viết blanket impl <code>trait Pretty { fn pretty(&amp;self) -&gt; String; }<\/code> cho mọi <code>T: Debug<\/code>, trả về chuỗi <code>{:#?}<\/code>. Sau đó thử thêm một impl riêng cho <code>String<\/code> và giải thích lỗi E0119 nhận được.", "(Nâng cao) Đo khác biệt giữa static và dynamic dispatch: viết hàm cộng diện tích 10 triệu hình bằng <code>Vec&lt;Circle&gt;<\/code> + generic và bằng <code>Vec&lt;Box&lt;dyn Shape&gt;&gt;<\/code>, chạy với <code>--release<\/code>, đo bằng <code>std::time::Instant<\/code>. Giải thích kết quả dựa trên inline và bố cục bộ nhớ (dữ liệu liền kề vs con trỏ tới heap)."]}, {"id": "p1c11", "num": 11, "title": "Các trait chuẩn quan trọng", "intro": "Thư viện chuẩn của Rust định nghĩa một nhóm trait nhỏ nhưng xuất hiện ở khắp nơi: <code>Display<\/code> quyết định cách <code>println!(\"{}\")<\/code> in một giá trị, <code>From<\/code> là thứ toán tử <code>?<\/code> dùng để chuyển đổi lỗi, <code>Deref<\/code> giải thích vì sao <code>&amp;String<\/code> truyền được vào chỗ cần <code>&amp;str<\/code>, <code>Hash<\/code> + <code>Eq<\/code> là điều kiện để làm khóa <code>HashMap<\/code>, <code>Send<\/code> + <code>Sync<\/code> là nền tảng của \"fearless concurrency\". Thành thạo các trait này đồng nghĩa với việc viết được kiểu dữ liệu \"đúng chất Rust\": dùng được với toán tử, với vòng lặp <code>for<\/code>, với collection, với <code>?<\/code>, với thread. Chương này đi qua từng nhóm trait, giải thích hợp đồng (contract) ngữ nghĩa mà mỗi trait yêu cầu, kèm ví dụ chạy được và các lỗi biên dịch thường gặp. Kiến thức về cú pháp trait, generic và derive đã có ở Chương 10.", "sections": [{"n": "11.1", "t": "Bản đồ các trait chuẩn", "sub": []}, {"n": "11.2", "t": "Display và Debug", "sub": ["Hai mục đích khác nhau", "Những điều cần biết về Formatter"]}, {"n": "11.3", "t": "Chuyển đổi kiểu: From, Into, TryFrom, TryInto, FromStr", "sub": ["Hợp đồng của từng trait"]}, {"n": "11.4", "t": "Mượn tổng quát: AsRef, AsMut, Borrow", "sub": ["AsRef và AsMut", "Borrow và hợp đồng Hash/Eq"]}, {"n": "11.5", "t": "Deref, DerefMut và Drop", "sub": ["Deref và deref coercion", "Drop và RAII"]}, {"n": "11.6", "t": "Default, Clone và Copy", "sub": []}, {"n": "11.7", "t": "So sánh và băm: PartialEq, Eq, PartialOrd, Ord, Hash", "sub": ["Vì sao có hai cấp \"Partial\" và \"toàn phần\"", "Hash phải nhất quán với Eq"]}, {"n": "11.8", "t": "Iterator và IntoIterator", "sub": []}, {"n": "11.9", "t": "Nạp chồng toán tử", "sub": []}, {"n": "11.10", "t": "ToOwned và Cow", "sub": []}, {"n": "11.11", "t": "Các trait marker: Sized, Send, Sync", "sub": ["Sized và ?Sized", "Send và Sync"]}], "summary": ["<code>Debug<\/code> cho lập trình viên (derive được), <code>Display<\/code> cho người dùng (tự viết); implement <code>Display<\/code> là có <code>to_string()<\/code>. Dùng <code>f.pad<\/code> để tôn trọng width/fill.", "Implement <code>From<\/code> chứ không implement <code>Into<\/code>; <code>?<\/code> dùng <code>From<\/code> để chuyển đổi lỗi. <code>TryFrom<\/code> cho chuyển đổi có thể thất bại, an toàn hơn <code>as<\/code>. <code>FromStr<\/code> cho <code>parse()<\/code>.", "<code>AsRef<\/code> cho API linh hoạt, chuyển đổi tham chiếu rẻ; <code>Borrow<\/code> thêm hợp đồng Eq/Hash/Ord giống nhau, là lý do <code>HashMap&lt;String, _&gt;<\/code> tra được bằng <code>&amp;str<\/code>.", "<code>Deref<\/code> kích hoạt deref coercion và auto-deref, chỉ dùng cho smart pointer. <code>Drop<\/code> hiện thực RAII; biến hủy theo thứ tự ngược khai báo, trường struct theo thứ tự khai báo; <code>let _ =<\/code> hủy ngay lập tức.", "<code>Copy<\/code> là sao chép bit ngầm định, yêu cầu mọi trường <code>Copy<\/code> và không có <code>Drop<\/code>; <code>Clone<\/code> là sao chép tường minh. <code>Default<\/code> kết hợp <code>..Default::default()<\/code> thay cho tham số mặc định.", "<code>Eq<\/code> thêm tính phản xạ cho <code>PartialEq<\/code>, <code>Ord<\/code> là thứ tự toàn phần; <code>f64<\/code> chỉ có các phiên bản Partial vì NaN. Bắt buộc <code>a == b<\/code> suy ra <code>hash(a) == hash(b)<\/code>.", "<code>IntoIterator<\/code> là thứ vòng lặp <code>for<\/code> dùng; implement cho <code>C<\/code>, <code>&amp;C<\/code>, <code>&amp;mut C<\/code> để hỗ trợ đủ ba dạng.", "Nạp chồng toán tử qua <code>std::ops<\/code>; <code>Output<\/code> là associated type, vế phải là tham số generic.", "<code>Cow<\/code> tránh cấp phát khi không cần sửa; <code>ToOwned<\/code> tổng quát hóa <code>Clone<\/code> cho cặp mượn/sở hữu.", "<code>Sized<\/code> ngầm định cho mọi tham số kiểu, <code>?Sized<\/code> để nhận DST. <code>Send<\/code>/<code>Sync<\/code> là auto trait mà compiler dùng để ngăn data race."], "exercises": ["Viết struct <code>Money { cents: i64 }<\/code> với <code>Display<\/code> in dạng <code>1.234,56 đ<\/code> (dấu chấm ngăn cách hàng nghìn), <code>Debug<\/code> derive. Hỗ trợ <code>{:&gt;15}<\/code> bằng cách dựng chuỗi rồi gọi <code>f.pad<\/code>.", "Implement <code>FromStr<\/code> cho <code>Money<\/code> để parse các chuỗi như <code>\"1234.56\"<\/code>, <code>\"-0.5\"<\/code>, kèm kiểu lỗi riêng có <code>Display<\/code> và <code>From&lt;ParseIntError&gt;<\/code>. Viết test cho các trường hợp lỗi.", "Viết hàm <code>fn join_paths&lt;I, P&gt;(parts: I) -&gt; PathBuf where I: IntoIterator&lt;Item = P&gt;, P: AsRef&lt;Path&gt;<\/code> và gọi thử với <code>Vec&lt;&amp;str&gt;<\/code>, <code>Vec&lt;String&gt;<\/code>, mảng <code>[PathBuf; 2]<\/code>.", "Viết struct <code>Guard(&amp;'static str)<\/code> in ra khi tạo và khi hủy. Dựng các tình huống: biến trong vòng lặp, giá trị trong <code>Vec<\/code> bị <code>truncate<\/code>, giá trị bị move vào hàm, <code>let _ = Guard(...)<\/code> và <code>let _g = Guard(...)<\/code>. Dự đoán thứ tự in trước khi chạy.", "Viết <code>CaseInsensitive(String)<\/code> với <code>PartialEq<\/code>, <code>Eq<\/code>, <code>Hash<\/code>, <code>PartialOrd<\/code>, <code>Ord<\/code> không phân biệt hoa thường. Dùng nó làm khóa <code>BTreeMap<\/code> và <code>HashMap<\/code>. Giải thích vì sao không nên implement <code>Borrow&lt;str&gt;<\/code> cho kiểu này.", "Implement các toán tử <code>Add<\/code>, <code>Sub<\/code>, <code>Mul<\/code> (nhân ma trận) và <code>Index&lt;(usize, usize)&gt;<\/code> cho <code>Matrix<\/code>; thêm impl cho <code>&amp;Matrix + &amp;Matrix<\/code> để không phải move. So sánh chữ ký hai cách.", "Viết <code>fn escape_html(s: &amp;str) -&gt; Cow&lt;'_, str&gt;<\/code> thay <code>&lt;<\/code>, <code>&gt;<\/code>, <code>&amp;<\/code> bằng thực thể HTML, chỉ cấp phát khi chuỗi chứa ký tự cần thay. Đếm số lần cấp phát khi xử lý 1000 chuỗi trong đó 990 chuỗi \"sạch\".", "(Nâng cao) Viết struct chứa <code>Rc&lt;String&gt;<\/code> và thử gửi sang thread khác để đọc thông báo lỗi; sau đó tìm cách sửa bằng <code>Arc<\/code>. Giải thích tại sao <code>Arc&lt;RefCell&lt;T&gt;&gt;<\/code> vẫn không chia sẻ được giữa các thread (gợi ý: <code>RefCell<\/code> không <code>Sync<\/code>)."]}, {"id": "p1c12", "num": 12, "title": "Closures &amp; Iterators — Lập trình hàm trong Rust", "intro": "Closure (bao đóng) và iterator (bộ lặp) là hai công cụ đem phong cách lập trình hàm vào Rust mà không đánh đổi hiệu năng. Một chuỗi <code>iter().filter(...).map(...).sum()<\/code> đọc như SQL hay LINQ, nhưng sau khi biên dịch ở chế độ release lại chạy nhanh ngang vòng lặp <code>for<\/code> viết tay, đôi khi còn nhanh hơn. Để dùng chúng thành thạo, cần hiểu cơ chế bên dưới: closure thực chất là một struct ẩn danh do compiler sinh ra, ba trait <code>Fn<\/code>, <code>FnMut<\/code>, <code>FnOnce<\/code> mô tả cách closure dùng dữ liệu đã capture, còn iterator là một trait với đúng một method bắt buộc <code>next<\/code>, mọi thứ còn lại được xây dựng bằng generics và monomorphization (Chương 10). Chương này đi từ cú pháp đến cơ chế, qua toàn bộ các adapter và consumer thông dụng, đến cách tự viết iterator và lý do iterator là \"zero-cost\".", "sections": [{"n": "12.1", "t": "Closure: hàm ẩn danh capture môi trường", "sub": ["Cú pháp và suy luận kiểu", "Ba cách capture biến", "Closure thực chất là struct"]}, {"n": "12.2", "t": "Fn, FnMut và FnOnce", "sub": ["Ba trait và quan hệ giữa chúng", "Ví dụ ba trait và con trỏ hàm", "Lỗi thường gặp với Fn traits"]}, {"n": "12.3", "t": "Trả về và lưu trữ closure", "sub": []}, {"n": "12.4", "t": "Iterator trait", "sub": ["Định nghĩa và vòng lặp for", "iter, iter_mut và into_iter", "Iterator là lazy"]}, {"n": "12.5", "t": "Các adapter thông dụng", "sub": []}, {"n": "12.6", "t": "Các consumer", "sub": []}, {"n": "12.7", "t": "Tự viết iterator", "sub": []}, {"n": "12.8", "t": "Vì sao iterator là zero-cost", "sub": ["Từ pipeline đến một vòng lặp", "Đo thực tế"]}], "summary": ["Closure là hàm ẩn danh capture môi trường; kiểu tham số được suy ra một lần và cố định. Compiler chọn capture nhẹ nhất (<code>&amp;<\/code>, <code>&amp;mut<\/code>, giá trị); <code>move<\/code> ép capture theo giá trị. Từ 2021, closure capture theo từng trường.", "Mỗi closure là một struct ẩn danh duy nhất chứa dữ liệu capture, kèm impl của <code>Fn<\/code>/<code>FnMut<\/code>/<code>FnOnce<\/code>; vì vậy closure có kích thước, có lifetime và inline được.", "<code>FnOnce<\/code> (gọi một lần, có thể tiêu thụ dữ liệu) chứa <code>FnMut<\/code> (thay đổi dữ liệu) chứa <code>Fn<\/code> (chỉ đọc). Trait được quyết định bởi thân closure, không phải cách capture. Khi viết API, chọn bound lỏng nhất đủ dùng.", "Trả về closure bằng <code>impl Fn<\/code> (không cấp phát) hoặc <code>Box&lt;dyn Fn&gt;<\/code> (nhiều kiểu); hầu như luôn cần <code>move<\/code>. Con trỏ hàm <code>fn<\/code> là kiểu cụ thể, không capture được.", "<code>Iterator<\/code> chỉ cần <code>next<\/code>; vòng lặp <code>for<\/code> dùng <code>IntoIterator<\/code>. <code>iter()<\/code>, <code>iter_mut()<\/code>, <code>into_iter()<\/code> cho <code>&amp;T<\/code>, <code>&amp;mut T<\/code>, <code>T<\/code>.", "Adapter lazy, xử lý từng phần tử qua toàn bộ pipeline, không tạo collection trung gian; quên consumer sẽ không có gì xảy ra.", "Consumer: <code>collect<\/code> (cần kiểu đích, hỗ trợ <code>Result<\/code>/<code>Option<\/code>), <code>sum<\/code>, <code>fold<\/code>, <code>reduce<\/code>, <code>count<\/code>, <code>any<\/code>/<code>all<\/code>/<code>find<\/code>/<code>position<\/code> (đoản mạch), <code>min_by_key<\/code>, <code>max_by<\/code>, <code>partition<\/code>, <code>unzip<\/code>.", "Tự viết iterator bằng <code>next<\/code>, bổ sung <code>size_hint<\/code>, <code>DoubleEndedIterator<\/code>, <code>ExactSizeIterator<\/code>; hoặc dùng <code>iter::from_fn<\/code>, <code>iter::successors<\/code>.", "Iterator là zero-cost nhờ monomorphization và inline; <code>zip<\/code> và slice iterator còn loại bỏ bounds check. Luôn đo hiệu năng ở <code>--release<\/code>."], "exercises": ["Viết hàm <code>fn apply_n&lt;F: FnMut()&gt;(n: usize, f: F)<\/code> và dùng nó để: (a) in \"hello\" ba lần, (b) tăng một biến đếm bên ngoài. Thử đổi bound thành <code>Fn()<\/code> và giải thích lỗi nhận được.", "Viết <code>fn make_accumulator(start: i64) -&gt; impl FnMut(i64) -&gt; i64<\/code> trả về closure cộng dồn: gọi <code>acc(5)<\/code> rồi <code>acc(10)<\/code> trả về 15 rồi 25 (nếu <code>start<\/code> = 10). Sau đó viết phiên bản trả <code>Box&lt;dyn FnMut(i64) -&gt; i64&gt;<\/code> và lưu ba accumulator khác nhau trong một <code>Vec<\/code>.", "Không dùng vòng lặp <code>for<\/code>/<code>while<\/code>, chỉ dùng iterator: cho <code>text: &amp;str<\/code>, đếm tần suất mỗi từ (không phân biệt hoa thường), rồi in ra 3 từ xuất hiện nhiều nhất. Gợi ý: <code>split_whitespace<\/code>, <code>fold<\/code> vào <code>HashMap<\/code>, <code>sort_by<\/code>.", "Cho <code>Vec&lt;&amp;str&gt;<\/code> gồm các dòng dạng <code>\"tên,tuổi\"<\/code>. Viết hàm trả về <code>Result&lt;Vec&lt;(String, u8)&gt;, String&gt;<\/code> bằng một chuỗi iterator duy nhất kết thúc bằng <code>collect::&lt;Result&lt;_, _&gt;&gt;()<\/code>, báo lỗi kèm số dòng (dùng <code>enumerate<\/code>).", "Tự viết iterator <code>Pri
