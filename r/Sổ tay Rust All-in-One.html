e&gt;<\/code> trả về đoạn các phần tử bằng x, chỉ dùng <code>partition_point<\/code>. Viết test so sánh với cách đếm tuyến tính. <i>Gợi ý:<\/i> hai lần gọi <code>partition_point<\/code> với <code>&lt;<\/code> và <code>&lt;=<\/code>.", "Cho mảng tăng dần các số nguyên khác nhau, tìm chỉ số i nhỏ nhất mà <code>a[i] == i<\/code> (fixed point) trong O(log n). <i>Gợi ý:<\/i> hàm <code>a[i] - i<\/code> không giảm nên vị từ <code>a[i] &lt; i<\/code> đúng trên một tiền tố.", "Viết lại <code>search_rotated<\/code> cho mảng <b>có phần tử trùng<\/b> (ví dụ <code>[2, 2, 2, 3, 1, 2]<\/code>). Phân tích vì sao độ phức tạp xấu nhất trở thành O(n). <i>Gợi ý:<\/i> khi <code>a[lo] == a[mid] == a[hi-1]<\/code> không biết nửa nào đã sắp, chỉ có thể tăng <code>lo<\/code> một bước.", "Bài \"chia mảng thành k đoạn liên tiếp sao cho tổng lớn nhất của các đoạn là nhỏ nhất\" (split array largest sum). Giải bằng <code>first_true<\/code> với hàm kiểm tra tham lam O(n). <i>Gợi ý:<\/i> cấu trúc gần giống bài tải trọng tàu.", "Tìm phần tử nhỏ thứ k trong ma trận n x n mà mỗi hàng và mỗi cột đều tăng dần, trong O(n log(max - min)). <i>Gợi ý:<\/i> tìm nhị phân trên giá trị x, đếm số phần tử &lt;= x bằng cách đi từ góc dưới-trái trong O(n).", "Cài <code>fn sqrt_f64(x: f64) -&gt; f64<\/code> bằng tìm kiếm nhị phân trên số thực và so sánh với <code>f64::sqrt<\/code> cho 1000 giá trị ngẫu nhiên (sai số tương đối &lt; 1e-12). Thử thay vòng lặp cố định bằng điều kiện <code>hi - lo &gt; 1e-15<\/code> với x = 1e10 và giải thích hiện tượng quan sát được.", "Tìm trung vị của hai mảng đã sắp xếp có độ dài m và n trong O(log(min(m, n))). <i>Gợi ý:<\/i> tìm nhị phân trên số phần tử lấy từ mảng ngắn hơn; cẩn thận với <code>usize<\/code> khi tính chỉ số <code>i - 1<\/code>.", "Đo thực nghiệm: so sánh <code>contains<\/code> (tuyến tính), <code>binary_search<\/code> và <code>HashSet::contains<\/code> trên <code>Vec&lt;u32&gt;<\/code> kích thước 8, 64, 1024, 1 000 000. Với kích thước nào thì tuyến tính bắt đầu thua? <i>Gợi ý:<\/i> dùng <code>std::hint::black_box<\/code> để trình biên dịch không tối ưu bỏ phép tìm."]}, {"id": "p2c10", "num": 10, "title": "Cây nhị phân &amp; Cây nhị phân tìm kiếm (BST)", "intro": "Cây (tree) là cấu trúc dữ liệu phân cấp xuất hiện khắp nơi: cây thư mục, cây cú pháp (AST) của trình biên dịch, DOM của trình duyệt, chỉ mục của cơ sở dữ liệu. Trong chương này ta học cây nhị phân (binary tree) và cây nhị phân tìm kiếm (binary search tree, BST): cách biểu diễn trong Rust, bốn kiểu duyệt cây cả đệ quy lẫn lặp, các thao tác chèn/tìm/xóa của BST và những bài toán kinh điển như kiểm tra cân bằng, kiểm tra tính hợp lệ, tổ tiên chung gần nhất. Đặc biệt, Rust buộc ta suy nghĩ rõ ràng về <b>ai sở hữu nút nào<\/b>, nên chương này dành nhiều chỗ cho ba cách biểu diễn <code>Option&lt;Box&lt;Node&gt;&gt;<\/code>, <code>Rc&lt;RefCell&lt;TreeNode&gt;&gt;<\/code> và arena chỉ số, cùng các bẫy của borrow checker và độ sâu đệ quy.", "sections": [{"n": "10.1", "t": "Khái niệm và thuật ngữ", "sub": []}, {"n": "10.2", "t": "Biểu diễn cây trong Rust", "sub": ["Cây là một hệ phân cấp sở hữu", "Ba cách biểu diễn — so sánh nhanh"]}, {"n": "10.3", "t": "Duyệt cây", "sub": ["Bốn thứ tự duyệt", "Duyệt lặp bằng stack tường minh"]}, {"n": "10.4", "t": "Cây nhị phân tìm kiếm (BST)", "sub": ["Tính chất BST", "Chèn: con trỏ tới liên kết", "Tìm kiếm, min và max", "Xóa: ba trường hợp", "Iterator in-order cho BST"]}, {"n": "10.5", "t": "Các thuộc tính và bài toán kinh điển trên cây", "sub": []}, {"n": "10.6", "t": "Độ sâu đệ quy và Drop không đệ quy", "sub": []}, {"n": "10.7", "t": "Kiểu <code>Rc&lt;RefCell&lt;TreeNode&gt;&gt;<\/code> của LeetCode", "sub": []}, {"n": "10.8", "t": "Cây dựa trên arena (Vec + chỉ số)", "sub": []}, {"n": "10.9", "t": "Bảng tổng kết độ phức tạp", "sub": []}], "summary": ["Cây nhị phân thuần là một hệ phân cấp sở hữu, nên <code>Option&lt;Box&lt;Node&gt;&gt;<\/code> là biểu diễn tự nhiên nhất trong Rust; <code>Option&lt;Box&lt;_&gt;&gt;<\/code> chỉ tốn 8 byte nhờ tối ưu niche.", "Bốn kiểu duyệt: pre-order, in-order, post-order (DFS) và level-order (BFS với <code>VecDeque<\/code>). Phiên bản lặp dùng <code>Vec<\/code> làm stack để tránh tràn call stack; <code>as_deref()<\/code> và <code>extend(Option)<\/code> giúp code gọn.", "BST: mọi thao tác O(h). Chèn lặp bằng \"con trỏ tới liên kết\" <code>&amp;mut Link&lt;T&gt;<\/code> và khớp mẫu trực tiếp trên <code>cur<\/code>; biến thể dùng <code>cur.as_mut()<\/code> bị lỗi E0506.", "Xóa có ba trường hợp; <code>Option::take()<\/code> là công cụ then chốt để chuyển quyền sở hữu cây con mà không vi phạm borrow checker.", "Kiểm tra cân bằng và tính hợp lệ trong một lần duyệt O(n); kiểm tra BST phải truyền cận (lo, hi), không chỉ so với con trực tiếp.", "Cây suy biến làm đệ quy sâu n tầng: tràn stack (kể cả trong Drop mặc định!). Cài <code>Drop<\/code> lặp và dùng thuật toán lặp cho cây có thể sâu.", "<code>Rc&lt;RefCell&lt;TreeNode&gt;&gt;<\/code> (LeetCode) linh hoạt nhưng kiểm tra mượn lúc chạy; arena <code>Vec&lt;Node&gt;<\/code> + chỉ số cho hiệu năng tốt và con trỏ cha dễ dàng."], "exercises": ["Viết <code>fn count_leaves(t: &amp;Tree) -&gt; usize<\/code> và <code>fn sum(t: &amp;Tree) -&gt; i64<\/code> cho cây <code>Option&lt;Box&lt;Node&gt;&gt;<\/code>, mỗi hàm cả phiên bản đệ quy và phiên bản lặp.", "Viết <code>fn mirror(t: &amp;mut Tree)<\/code> lật cây tại chỗ (không tạo nút mới) cho kiểu <code>Option&lt;Box&lt;Node&gt;&gt;<\/code>. <i>Gợi ý:<\/i> <code>std::mem::swap(&amp;mut n.left, &amp;mut n.right)<\/code> rồi đệ quy hai con qua <code>as_mut()<\/code>.", "Dựng lại cây nhị phân từ hai dãy pre-order và in-order (các giá trị khác nhau). <i>Gợi ý:<\/i> phần tử đầu của pre-order là gốc; dùng <code>HashMap&lt;i32, usize&gt;<\/code> tra vị trí trong in-order để chia hai nửa, tổng O(n).", "Cài LCA cho cây nhị phân bất kỳ (không phải BST) kiểu <code>Rc&lt;RefCell&lt;TreeNode&gt;&gt;<\/code>. <i>Gợi ý:<\/i> hàm đệ quy trả về <code>Option&lt;Rc&lt;...&gt;&gt;<\/code>; nếu cả hai cây con trả về <code>Some<\/code> thì nút hiện tại là LCA.", "Bổ sung cho <code>Bst&lt;T&gt;<\/code> các phương thức <code>floor(&amp;x)<\/code> (khóa lớn nhất &lt;= x), <code>ceil(&amp;x)<\/code> và <code>range_count(lo, hi)<\/code> chạy trong O(h). Viết test so sánh với <code>BTreeSet::range<\/code>.", "Đường kính (diameter) của cây: số cạnh trên đường đi dài nhất giữa hai nút bất kỳ. Giải trong một lần duyệt post-order O(n). <i>Gợi ý:<\/i> hàm trả về chiều cao và cập nhật một biến <code>best<\/code> truyền vào bằng <code>&amp;mut<\/code>.", "Biến <code>Bst&lt;T&gt;<\/code> thành <code>BstMap&lt;K, V&gt;<\/code> có <code>get<\/code>, <code>get_mut<\/code>, <code>insert<\/code> (trả về giá trị cũ dạng <code>Option&lt;V&gt;<\/code>) và <code>entry<\/code>-like <code>get_or_insert_with<\/code>. <i>Gợi ý:<\/i> <code>get_mut<\/code> có thể viết lặp với con trỏ tới liên kết như <code>insert<\/code>.", "Thêm free list vào <code>ArenaBst<\/code> để hỗ trợ <code>remove<\/code>: ô bị xóa được đưa vào <code>free: Vec&lt;u32&gt;<\/code> và <code>insert<\/code> ưu tiên tái sử dụng. Viết test chèn/xóa ngẫu nhiên 10 000 lần, so sánh nội dung với <code>BTreeSet<\/code>."]}, {"id": "p2c11", "num": 11, "title": "Cây cân bằng &amp; Cấu trúc dữ liệu nâng cao", "intro": "Chương 10 kết thúc bằng một cảnh báo: BST thường suy biến thành danh sách khi dữ liệu đến theo thứ tự. Chương này giải quyết vấn đề đó bằng <b>cây cân bằng<\/b> — AVL (cài đặt đầy đủ với các phép xoay), cây đỏ-đen (tổng quan) và B-Tree (cấu trúc đứng sau <code>BTreeMap<\/code> của Rust). Sau đó ta học bốn cấu trúc chuyên dụng xuất hiện liên tục trong phỏng vấn và lập trình thi đấu: <b>Trie<\/b> cho chuỗi và tiền tố, <b>Segment Tree<\/b> và <b>Fenwick Tree<\/b> cho truy vấn đoạn, <b>Disjoint Set Union<\/b> cho bài toán liên thông. Với mỗi cấu trúc, ta chú ý cách cài đặt phù hợp với mô hình ownership của Rust: truyền quyền sở hữu <code>Box<\/code> qua các phép xoay, cây trong mảng phẳng, chỉ số thay cho con trỏ.", "sections": [{"n": "11.1", "t": "Vì sao cần cây cân bằng", "sub": []}, {"n": "11.2", "t": "Cây AVL", "sub": ["Hệ số cân bằng và bốn trường hợp mất cân bằng", "Cài đặt bằng cách truyền quyền sở hữu", "Quan sát: chèn 1..7 theo thứ tự tăng dần"]}, {"n": "11.3", "t": "Cây đỏ-đen (tổng quan)", "sub": []}, {"n": "11.4", "t": "B-Tree và <code>BTreeMap<\/code>", "sub": ["Ý tưởng", "Vì sao Rust chọn B-Tree", "Các API đáng giá của <code>BTreeMap<\/code>/<code>BTreeSet<\/code>"]}, {"n": "11.5", "t": "Trie (cây tiền tố)", "sub": ["Ý tưởng", "Cài đặt với mảng 26 con"]}, {"n": "11.6", "t": "Segment Tree", "sub": ["Bài toán truy vấn đoạn", "Cài đặt đệ quy", "Lazy propagation (tổng quan)"]}, {"n": "11.7", "t": "Fenwick Tree (Binary Indexed Tree)", "sub": ["Ý tưởng lowbit", "Cài đặt", "Ứng dụng: đếm nghịch thế"]}, {"n": "11.8", "t": "Disjoint Set Union (Union-Find)", "sub": ["Bài toán và biểu diễn", "Cài đặt"]}, {"n": "11.9", "t": "Bảng tổng kết", "sub": []}], "summary": ["Cây cân bằng bảo đảm chiều cao O(log n) trong trường hợp xấu nhất. AVL cân bằng chặt (chênh lệch &lt;= 1) nhờ bốn trường hợp xoay LL, RR, LR, RL; đỏ-đen cân bằng lỏng hơn nhưng cập nhật ít xoay hơn.", "Trong Rust, cài AVL theo phong cách \"nhận <code>Box<\/code>, trả <code>Box<\/code>\": phép xoay trả về gốc mới, người gọi gán lại; <code>take()<\/code> tách cây con, <code>let node = *n<\/code> move nút ra khỏi <code>Box<\/code>.", "<code>BTreeMap<\/code> của Rust là B-Tree với B = 6 (5–11 khóa mỗi nút), thân thiện cache. Dùng <code>range<\/code>, <code>next_back<\/code>, <code>Bound<\/code>, <code>split_off<\/code>, <code>pop_first<\/code> cho floor/ceil, truy vấn khoảng, hàng đợi ưu tiên có xóa.", "Trie: O(L) mỗi thao tác, lý tưởng cho tiền tố và autocomplete; mảng 26 con nhanh nhưng tốn bộ nhớ, <code>HashMap&lt;char, _&gt;<\/code> cho Unicode.", "Segment tree lưu trong mảng phẳng (con 2v, 2v+1), cập nhật và truy vấn đoạn O(log n), lazy propagation cho cập nhật đoạn. Fenwick tree ngắn gọn hơn cho tổng tiền tố; trong Rust lowbit viết <code>i &amp; i.wrapping_neg()<\/code>.", "DSU với nén đường đi và hợp theo hạng đạt O(α(n)); viết <code>find<\/code> lặp để tránh đệ quy sâu.", "Luôn kiểm thử cấu trúc tự cài bằng cách đối chiếu với cài đặt tham chiếu (<code>BTreeSet<\/code>, vét cạn) trên dữ liệu giả ngẫu nhiên."], "exercises": ["Bổ sung vào <code>AvlSet<\/code> các phương thức <code>contains<\/code>, <code>min<\/code>, <code>max<\/code> và một iterator in-order (tham khảo <code>Bst::iter<\/code> ở Chương 10). Viết test so sánh thứ tự duyệt với <code>BTreeSet<\/code>.", "Thêm trường <code>size<\/code> (số nút của cây con) vào nút AVL và cài <code>kth_smallest(k)<\/code> và <code>rank(x)<\/code> (số khóa &lt; x) trong O(log n). <i>Gợi ý:<\/i> cập nhật <code>size<\/code> trong <code>update()<\/code>, phép xoay tự động giữ đúng.", "Dùng <code>BTreeMap&lt;i64, usize&gt;<\/code> (đa tập: giá trị là số lần xuất hiện) để giải bài \"trung vị cửa sổ trượt\" (sliding window median) trong O(n log k). So sánh với kỹ thuật hai heap cho trung vị luồng dữ liệu ở Chương 12: vì sao hai heap khó áp dụng khi phải xóa phần tử rời khỏi cửa sổ?", "Viết <code>Trie<\/code> hỗ trợ Unicode bằng <code>BTreeMap&lt;char, TrieNode&gt;<\/code> và thêm <code>remove(word)<\/code> có dọn các nút không còn dùng. <i>Gợi ý:<\/i> hàm đệ quy trả về <code>bool<\/code> \"nút này có thể xóa\", dùng <code>prefix_count<\/code>.", "Cài segment tree <b>lặp từ dưới lên<\/b> dùng 2n phần tử cho phép toán min, với API generic <code>SegTree&lt;T, F: Fn(T, T) -&gt; T&gt;<\/code> nhận phần tử trung hòa. Đo tốc độ so với bản đệ quy trên 10^6 truy vấn.", "Bài \"đếm số phần tử nhỏ hơn ở bên phải\" (count of smaller numbers after self): với mỗi i, đếm số j &gt; i có a[j] &lt; a[i]. Giải bằng Fenwick tree và nén tọa độ trong O(n log n).", "Sửa <code>Dsu<\/code> để hợp theo <b>kích thước<\/b> (union by size) và thêm <code>size_of(x)<\/code> trả về kích thước tập chứa x. Dùng nó giải bài \"số đảo sau mỗi lần thêm đất\" (number of islands II) trên lưới m x n.", "(Nâng cao) Cài Fenwick tree hai chiều cho ma trận: cập nhật ô <code>(r, c)<\/code> và truy vấn tổng hình chữ nhật trong O(log m * log n). Viết test so sánh với prefix sum 2D vét cạn."]}, {"id": "p2c12", "num": 12, "title": "Heap &amp; Hàng đợi ưu tiên", "intro": "Hàng đợi ưu tiên (priority queue) trả lời liên tục một câu hỏi: \"phần tử quan trọng nhất hiện tại là gì?\" — tác vụ gấp nhất trong bộ lập lịch, đỉnh có khoảng cách nhỏ nhất trong Dijkstra (Chương 14), sự kiện sớm nhất trong mô phỏng, k kết quả tốt nhất trong máy tìm kiếm. Cấu trúc cài đặt kinh điển là <b>binary heap<\/b>: một cây nhị phân hoàn chỉnh nằm gọn trong mảng. Chương này tự cài một min-heap generic để hiểu rõ thao tác sift up/sift down, sau đó làm chủ <code>BinaryHeap<\/code> của thư viện chuẩn — vốn là <b>max-heap<\/b> — với <code>Reverse<\/code>, tuple và <code>Ord<\/code> tự viết, rồi giải các bài kinh điển: top-k, trộn k dãy đã sắp xếp, trung vị của luồng dữ liệu.", "sections": [{"n": "12.1", "t": "Binary heap: cây hoàn chỉnh trong một mảng", "sub": ["Tính chất heap", "Sift up và sift down", "Trace từng bước", "Heapify trong O(n)"]}, {"n": "12.2", "t": "<code>BinaryHeap<\/code> của thư viện chuẩn", "sub": ["Max-heap và các thao tác", "Min-heap với <code>Reverse<\/code>, tuple và <code>Ord<\/code> tự viết", "Chương trình minh họa"]}, {"n": "12.3", "t": "Bài toán kinh điển", "sub": ["Top-k phần tử lớn nhất", "Trộn k dãy đã sắp xếp", "Trung vị của luồng dữ liệu"]}, {"n": "12.4", "t": "So sánh các cách cài hàng đợi ưu tiên", "sub": []}], "summary": ["Binary heap là cây hoàn chỉnh lưu trong mảng: cha <code>(i-1)/2<\/code>, con <code>2i+1<\/code>, <code>2i+2<\/code>. Push = thêm cuối + sift up; pop = <code>swap_remove(0)<\/code> + sift down; đều O(log n). Heapify từ dưới lên tốn O(n).", "<code>BinaryHeap<\/code> của std là <b>max-heap<\/b>. Dùng <code>Reverse<\/code> để có min-heap, tuple để kèm dữ liệu (mọi thành phần đều tham gia so sánh), <code>Ord<\/code> tự viết cho tiêu chí phức tạp.", "Khi tự cài <code>Ord<\/code>: nhất quán với <code>Eq<\/code>, <code>PartialOrd<\/code> ủy quyền cho <code>cmp<\/code>, đảo chiều bằng đổi chỗ <code>self<\/code>/<code>other<\/code> hoặc <code>Reverse<\/code>; <code>#[derive(Ord)]<\/code> so sánh theo thứ tự khai báo trường.", "<code>f64<\/code> không phải <code>Ord<\/code>: bọc bằng newtype dùng <code>total_cmp<\/code> hoặc dùng crate <code>ordered-float<\/code>.", "<code>peek_mut<\/code> sửa đỉnh hiệu quả; <code>iter()<\/code>/<code>into_vec()<\/code> không có thứ tự; không có decrease-key nên dùng xóa lười hoặc <code>BTreeSet<\/code>.", "Bài kinh điển: top-k bằng min-heap kích thước k (O(n log k)); trộn k dãy bằng heap các phần tử đầu (O(N log k)); trung vị luồng dữ liệu bằng hai heap."], "exercises": ["Viết <code>MaxHeap&lt;T&gt;<\/code> bằng cách tái sử dụng <code>MinHeap&lt;Reverse&lt;T&gt;&gt;<\/code> (newtype bọc bên trong), cung cấp <code>push<\/code>, <code>pop<\/code>, <code>peek<\/code> trả về <code>T<\/code>/<code>&amp;T<\/code> thay vì <code>Reverse&lt;T&gt;<\/code>. <i>Gợi ý:<\/i> <code>peek<\/code> có thể trả <code>self.0.peek().map(|r| &amp;r.0)<\/code>.", "Tổng quát hóa <code>MinHeap<\/code> thành <code>Heap&lt;T, F&gt;<\/code> nhận closure so sánh <code>F: Fn(&amp;T, &amp;T) -&gt; bool<\/code> (\"a ưu tiên hơn b\"), để cùng một cấu trúc làm được cả min-heap lẫn max-heap theo khóa bất kỳ.", "Cho n điểm trên mặt phẳng (tọa độ <code>i64<\/code>), tìm k điểm gần gốc tọa độ nhất trong O(n log k). Dùng bình phương khoảng cách (số nguyên) để tránh <code>f64<\/code>. So sánh với <code>select_nth_unstable_by_key<\/code>.", "Bài \"phòng họp\" (meeting rooms II): cho các khoảng <code>[start, end)<\/code>, tìm số phòng tối thiểu. <i>Gợi ý:<\/i> sắp theo start, dùng min-heap chứa thời điểm kết thúc của các phòng đang dùng.", "Bài \"lập lịch CPU\": mỗi tác vụ có thời điểm đến và thời gian chạy; CPU luôn chọn tác vụ đã đến có thời gian chạy ngắn nhất (hòa thì chỉ số nhỏ hơn). In thứ tự thực hiện. <i>Gợi ý:<\/i> heap <code>Reverse((thời gian chạy, chỉ số))<\/code>.", "Mở rộng <code>MedianFinder<\/code> thành \"trung vị cửa sổ trượt\" kích thước k bằng hai heap kết hợp xóa lười (<code>HashMap&lt;i32, usize&gt;<\/code> đếm các phần tử chờ xóa). So sánh độ phức tạp và độ dài code với cách dùng <code>BTreeMap<\/code> ở bài tập 3 Chương 11.", "Cài <b>d-ary heap<\/b> (mỗi nút có d con, cha <code>(i-1)/d<\/code>). Đo thời gian push/pop với d = 2, 4, 8 trên 10^6 phần tử và giải thích kết quả theo số phép so sánh và tính cục bộ cache.", "Tìm \"số xấu\" (ugly number) thứ n — số nguyên dương chỉ có ước nguyên tố 2, 3, 5 — bằng min-heap kết hợp <code>HashSet<\/code> chống trùng. Sau đó cải tiến thành O(n) bằng ba con trỏ (quy hoạch động, Chương 15)."]}, {"id": "p2c13", "num": 13, "title": "Đồ thị cơ bản", "intro": "Đồ thị (graph) là mô hình tổng quát nhất cho các đối tượng có quan hệ với nhau: mạng xã hội, bản đồ đường đi, phụ thuộc giữa các crate trong một workspace Cargo, trạng thái của một trò chơi. Cây ở Chương 10–11 chỉ là một trường hợp riêng của đồ thị. Chương này trình bày cách biểu diễn đồ thị trong Rust, hai phép duyệt nền tảng BFS và DFS (đệ quy lẫn lặp), cùng các ứng dụng trực tiếp: thành phần liên thông, phát hiện chu trình, sắp xếp topo, kiểm tra đồ thị hai phía và xử lý lưới hai chiều như một đồ thị. Các thuật toán trên đồ thị có trọng số (Dijkstra, Bellman-Ford, cây khung nhỏ nhất...) nằm ở Chương 14.", "sections": [{"n": "13.1", "t": "Khái niệm cơ bản", "sub": []}, {"n": "13.2", "t": "Biểu diễn đồ thị", "sub": ["Ba cách biểu diễn", "Lưu ý khi biểu diễn đồ thị trong Rust"]}, {"n": "13.3", "t": "Tìm kiếm theo chiều rộng (BFS)", "sub": ["Ý tưởng", "Trace BFS từ đỉnh 0"]}, {"n": "13.4", "t": "Tìm kiếm theo chiều sâu (DFS)", "sub": ["DFS đệ quy và DFS lặp", "Kết quả trên đồ thị mẫu"]}, {"n": "13.5", "t": "Thành phần liên thông", "sub": []}, {"n": "13.6", "t": "Phát hiện chu trình", "sub": ["Đồ thị vô hướng", "Đồ thị có hướng: ba màu"]}, {"n": "13.7", "t": "Sắp xếp topo", "sub": ["Bài toán", "Thuật toán Kahn", "Sắp xếp topo bằng DFS"]}, {"n": "13.8", "t": "Đồ thị hai phía", "sub": []}, {"n": "13.9", "t": "Lưới hai chiều như một đồ thị", "sub": ["Ô kề và bẫy tràn dưới <code>usize<\/code>", "Flood fill: đếm số đảo", "Đường đi ngắn nhất trong mê cung"]}, {"n": "13.10", "t": "Bảng tổng kết", "sub": []}], "summary": ["Biểu diễn mặc định trong Rust là danh sách kề <code>Vec&lt;Vec&lt;usize&gt;&gt;<\/code> với đỉnh là chỉ số; trạng thái thuật toán nằm trong các <code>Vec<\/code> song song. Ánh xạ nhãn sang chỉ số bằng <code>HashMap<\/code> một lần ở đầu vào.", "BFS dùng <code>VecDeque<\/code>, đánh dấu khi đưa vào hàng đợi, cho đường đi ngắn nhất theo số cạnh; dựng lại đường bằng mảng <code>parent<\/code>.", "DFS đệ quy ngắn gọn nhưng có thể tràn stack trên đồ thị sâu; bản lặp dùng <code>Vec<\/code> làm stack, đánh dấu khi lấy ra và đẩy kề theo thứ tự ngược để giữ cùng thứ tự.", "Chu trình vô hướng: gặp đỉnh đã thăm qua cạnh khác cạnh vừa đi (hoặc dùng DSU). Chu trình có hướng: thuật toán ba màu, gặp đỉnh xám là có cạnh ngược.", "Sắp xếp topo chỉ tồn tại cho DAG: Kahn (bậc vào, lặp, phát hiện chu trình khi xếp thiếu) hoặc đảo ngược post-order của DFS.", "Đồ thị hai phía tương đương tô được 2 màu và không có chu trình lẻ.", "Trên lưới, tính ô kề bằng <code>checked_add_signed<\/code>/<code>wrapping_add_signed<\/code> để tránh tràn dưới <code>usize<\/code>; flood fill và BFS lưới là hai công cụ dùng hằng ngày."], "exercises": ["Viết hàm chuyển đồ thị từ danh sách kề sang dạng CSR (<code>offsets: Vec&lt;usize&gt;<\/code>, <code>targets: Vec&lt;usize&gt;<\/code>) và cài lại BFS trên CSR. So sánh thời gian với <code>Vec&lt;Vec&lt;usize&gt;&gt;<\/code> trên đồ thị ngẫu nhiên 10^6 đỉnh, 5 * 10^6 cạnh.", "Cho danh sách các cặp chuỗi <code>(\"Hà Nội\", \"Hải Phòng\")<\/code> biểu diễn đường nối hai thành phố, viết chương trình ánh xạ tên sang chỉ số và trả lời truy vấn \"số chặng ít nhất từ A tới B\" kèm lộ trình bằng tên.", "Bài \"course schedule II\": cho n môn học và danh sách môn tiên quyết, trả về một thứ tự học hợp lệ, hoặc báo không thể. Sau đó sửa để trả về thứ tự nhỏ nhất theo từ điển bằng <code>BinaryHeap&lt;Reverse&lt;usize&gt;&gt;<\/code>.", "Viết DFS lặp có tính thời điểm vào/ra (<code>tin<\/code>, <code>tout<\/code>) cho mỗi đỉnh như bản đệ quy. Dùng nó để trả lời trong O(1) câu hỏi \"u có phải tổ tiên của v trong cây DFS không?\". <i>Gợi ý:<\/i> stack chứa cặp <code>(đỉnh, chỉ số đỉnh kề tiếp theo cần xét)<\/code>.", "Bài \"rotting oranges\": lưới có cam tươi (1), cam thối (2), ô trống (0); mỗi phút cam thối làm thối các cam kề 4 hướng. Tìm số phút để mọi cam thối hoặc -1. <i>Gợi ý:<\/i> BFS đa nguồn — đưa mọi ô 2 vào hàng đợi từ đầu.", "Đếm số đảo khi lưới kề theo <b>8 hướng<\/b> và tính diện tích đảo lớn nhất. Viết lại <code>neighbors<\/code> nhận mảng hướng làm tham số (generic theo <code>const N: usize<\/code>).", "Kiểm tra đồ thị hai phía, nếu không phải thì in ra một chu trình độ dài lẻ cụ thể. <i>Gợi ý:<\/i> khi gặp cạnh u-v cùng màu, lần ngược <code>parent<\/code> từ u và v tới tổ tiên chung.", "Mê cung có chìa khóa: ô <code>a<\/code>–<code>f<\/code> là chìa, <code>A<\/code>–<code>F<\/code> là cửa cần chìa tương ứng. Tìm số bước ít nhất để nhặt hết chìa. <i>Gợi ý:<\/i> BFS trên trạng thái <code>(r, c, mask)<\/code> với <code>mask<\/code> là bitmask các chìa đã có (thao tác bit ở Chương 16)."]}, {"id": "p2c14", "num": 14, "title": "Đồ thị nâng cao", "intro": "Chương 13 làm việc với đồ thị không trọng số, nơi BFS đủ để tìm đường ngắn nhất. Trong thực tế, cạnh mang trọng số: độ dài đoạn đường, độ trễ mạng, chi phí chuyển đổi. Chương này trình bày các thuật toán đường đi ngắn nhất kinh điển — Dijkstra, Bellman-Ford, Floyd-Warshall, 0-1 BFS — cùng cây khung nhỏ nhất (Kruskal, Prim), thành phần liên thông mạnh (Kosaraju, Tarjan) và tổng quan A*. Phần Rust tập trung vào <code>BinaryHeap<\/code> với <code>Reverse<\/code> (Chương 12), kỹ thuật xóa lười, cách tránh tràn số khi cộng \"vô cực\", viết DFS lặp cho đồ thị lớn và mẹo vượt borrow checker khi đệ quy trên struct. Cuối chương là crate <code>petgraph<\/code> cho mã sản phẩm.", "sections": [{"n": "14.1", "t": "Bài toán đường đi ngắn nhất: chọn thuật toán nào", "sub": []}, {"n": "14.2", "t": "Thuật toán Dijkstra", "sub": ["Ý tưởng", "Cài đặt", "Trace"]}, {"n": "14.3", "t": "Thuật toán Bellman-Ford", "sub": ["Ý tưởng", "Trace"]}, {"n": "14.4", "t": "Thuật toán Floyd-Warshall", "sub": []}, {"n": "14.5", "t": "0-1 BFS", "sub": []}, {"n": "14.6", "t": "Cây khung nhỏ nhất", "sub": ["Bài toán", "Kruskal: sắp xếp cạnh + DSU", "Prim: mở rộng từ một đỉnh"]}, {"n": "14.7", "t": "Thành phần liên thông mạnh", "sub": ["Khái niệm", "Kosaraju (lặp hoàn toàn)", "Tarjan (một lượt DFS)"]}, {"n": "14.8", "t": "A* (tổng quan)", "sub": []}, {"n": "14.9", "t": "Crate petgraph", "sub": []}, {"n": "14.10", "t": "Bảng tổng kết", "sub": []}], "summary": ["Mọi thuật toán đường đi ngắn nhất xây trên phép nới lỏng. Chọn thuật toán theo loại trọng số (0/1, không âm, có âm) và số nguồn (một nguồn hay mọi cặp).", "Dijkstra dùng <code>BinaryHeap&lt;Reverse&lt;(u64, usize)&gt;&gt;<\/code>, xóa lười bằng cách bỏ qua bản ghi có khoảng cách lớn hơn <code>dist[u]<\/code>. Kiểu <code>u64<\/code> chặn trọng số âm; <code>Option<\/code> hoặc <code>saturating_add<\/code> chặn tràn số khi cộng vô cực.", "Bellman-Ford nới lỏng mọi cạnh V - 1 lượt, lượt thứ V phát hiện chu trình âm. Floyd-Warshall là DP O(V^3) với k ở vòng ngoài cùng; luôn kiểm tra INF trước khi cộng.", "0-1 BFS dùng <code>VecDeque<\/code>: cạnh 0 vào đầu, cạnh 1 vào cuối.", "MST: Kruskal (sắp cạnh + DSU) cho danh sách cạnh, Prim (heap) cho danh sách kề; cả hai dựa trên tính chất lát cắt.", "SCC: Kosaraju hai lượt (viết lặp được bằng stack <code>(đỉnh, chỉ số kề)<\/code>), Tarjan một lượt với <code>low-link<\/code>; struct lưu <code>&amp;'a [Vec&lt;usize&gt;]<\/code> (không sở hữu đồ thị) để vừa duyệt danh sách kề vừa đệ quy với <code>&amp;mut self<\/code> mà không bị E0502.", "A* = Dijkstra + heuristic chấp nhận được; giảm mạnh số đỉnh mở rộng khi có một đích cụ thể.", "<code>petgraph<\/code> cung cấp cấu trúc và thuật toán đồ thị sẵn dùng; nhớ <code>StableGraph<\/code> khi cần chỉ số ổn định."], "exercises": ["Sửa <code>dijkstra<\/code> để dừng sớm khi lấy ra đỉnh đích t và trả về đường đi. Đo số lần <code>pop<\/code> so với chạy hết trên một lưới 1000 x 1000.", "Bài \"network delay time\": cho thời gian truyền tín hiệu trên các cạnh có hướng, tính thời gian để tín hiệu từ nút k tới mọi nút (hoặc -1 nếu có nút không tới được). <i>Gợi ý:<\/i> Dijkstra rồi lấy max của <code>dist<\/code>.", "Bài \"chuyến bay rẻ nhất với tối đa K điểm dừng\": tìm chi phí rẻ nhất từ src tới dst dùng tối đa K + 1 chặng. <i>Gợi ý:<\/i> Bellman-Ford chỉ chạy K + 1 lượt, mỗi lượt nới lỏng từ một <b>bản sao<\/b> của <code>dist<\/code> lượt trước (vì sao cần bản sao?).", "Dùng Bellman-Ford tìm và in ra <b>một chu trình âm cụ thể<\/b>. <i>Gợi ý:<\/i> lưu <code>prev<\/code>; nếu lượt thứ V nới lỏng được đỉnh v, đi ngược <code>prev<\/code> từ v đúng V bước để chắc chắn đứng trên chu trình, rồi đi tiếp tới khi lặp lại.", "Viết Floyd-Warshall có dựng lại đường đi bằng ma trận <code>next[i][j]<\/code> và hàm <code>path(i, j) -&gt; Vec&lt;usize&gt;<\/code>. Kiểm tra trên ma trận ví dụ của mục 14.4.", "Cho n điểm trên mặt phẳng, tìm tổng chi phí nhỏ nhất để nối mọi điểm, chi phí giữa hai điểm là khoảng cách Manhattan (bài \"min cost to connect all points\"). So sánh Prim O(n^2) không dùng heap với Kruskal trên n^2/2 cạnh khi n = 2000.", "Bài 2-SAT: cho các mệnh đề dạng <code>(a OR b)<\/code> trên biến Boolean, xác định có phép gán thỏa mãn không. <i>Gợi ý:<\/i> mỗi mệnh đề thành hai cạnh <code>!a -&gt; b<\/code>, <code>!b -&gt; a<\/code>; vô nghiệm khi x và !x cùng một SCC; lấy nghiệm theo thứ tự SCC của Tarjan.", "Viết lại chương trình A* bằng <code>petgraph::algo::astar<\/code> trên một <code>GraphMap&lt;(usize, usize), u32, Undirected&gt;<\/code> dựng từ lưới. So sánh độ dài mã nguồn và thời gian chạy với bản tự viết."]}, {"id": "p2c15", "num": 15, "title": "Quy hoạch động", "intro": "Quy hoạch động (dynamic programming, DP) là kỹ thuật giải bài toán bằng cách chia thành các bài toán con <b>chồng lấp<\/b>, giải mỗi bài toán con đúng một lần và lưu kết quả lại. Nó biến những thuật toán vét cạn có độ phức tạp hàm mũ thành đa thức, và là chủ đề \"khó nhằn\" nhất trong phỏng vấn thuật toán. Chương này xây dựng tư duy DP từ Fibonacci, so sánh hai phong cách top-down và bottom-up, rồi đi qua các bài kinh điển: đổi tiền, cái túi 0/1, dãy con tăng dài nhất O(n log n), xâu con chung dài nhất, khoảng cách chỉnh sửa, DP trên lưới và DP bitmask cho bài toán người du lịch. Với mỗi bài, ta lập bảng DP cụ thể, cài đặt bằng Rust (chú ý <code>usize<\/code> khi truy cập <code>i - 1<\/code>, biểu diễn \"vô cực\" bằng <code>Option<\/code>, cuộn mảng để tiết kiệm bộ nhớ) và cuối cùng tổng kết các dấu hiệu nhận diện một bài DP.", "sections": [{"n": "15.1", "t": "Quy hoạch động là gì", "sub": ["Hai tính chất", "Công thức năm bước"]}, {"n": "15.2", "t": "Top-down và bottom-up", "sub": ["Bốn phiên bản Fibonacci", "So sánh và lưu ý khi viết bằng Rust"]}, {"n": "15.3", "t": "Bài toán đổi tiền", "sub": ["Số đồng xu ít nhất", "Đếm số cách: thứ tự vòng lặp quyết định ý nghĩa"]}, {"n": "15.4", "t": "Bài toán cái túi 0/1", "sub": ["Bảng hai chiều", "Cuộn về một chiều"]}, {"n": "15.5", "t": "Dãy con tăng dài nhất (LIS)", "sub": ["O(n^2)", "O(n log n) bằng tìm kiếm nhị phân"]}, {"n": "15.6", "t": "Xâu con chung dài nhất (LCS)", "sub": []}, {"n": "15.7", "t": "Khoảng cách chỉnh sửa (edit distance)", "sub": []}, {"n": "15.8", "t": "DP trên lưới", "sub": []}, {"n": "15.9", "t": "DP bitmask: bài toán người du lịch", "sub": []}, {"n": "15.10", "t": "Kỹ thuật tối ưu bộ nhớ", "sub": []}, {"n": "15.11", "t": "Nhận diện bài toán DP", "sub": []}], "summary": ["DP áp dụng khi có cấu trúc con tối ưu và bài toán con chồng lấp. Năm bước: trạng thái, công thức chuyển, cơ sở, thứ tự tính, vị trí đáp án.", "Top-down (memo) tự nhiên nhưng đệ quy; bottom-up không đệ quy, dễ tối ưu bộ nhớ. Trong Rust, memo bằng hàm nhận <code>&amp;mut [Option&lt;T&gt;]<\/code>; tránh closure đệ quy; <code>HashMap<\/code> chỉ khi trạng thái thưa.", "Biểu diễn \"không đạt được\" bằng <code>Option<\/code> thay vì <code>INF<\/code> để tránh tràn số; lọc <code>c &lt;= x<\/code> trước khi tính <code>x - c<\/code> để tránh tràn dưới <code>usize<\/code>; dùng bảng kích thước (n + 1) để chỉ số <code>i - 1<\/code> luôn hợp lệ.", "Đổi tiền: thứ tự vòng lặp phân biệt đếm tổ hợp và đếm dãy. Knapsack 0/1 một chiều phải duyệt khối lượng giảm dần; duyệt tăng dần là bài không giới hạn.", "LIS O(n log n) với mảng <code>tails<\/code> và <code>partition_point<\/code>; LCS và edit distance là DP trên hai tiền tố, cuộn hai hàng bằng <code>mem::swap<\/code>; xử lý Unicode bằng <code>Vec&lt;char&gt;<\/code>.", "DP trên lưới và DP bitmask (Held-Karp O(2^n * n^2)) mở rộng cùng tư duy sang trạng thái hai chiều và tập con."], "exercises": ["Bài \"house robber\": cho dãy số tiền ở các nhà xếp hàng, không được cướp hai nhà liền kề; tìm tổng lớn nhất trong O(n) thời gian và O(1) bộ nhớ. Mở rộng cho các nhà xếp thành vòng tròn.", "Viết <code>min_coins_with_trace<\/code> trả về cả danh sách đồng xu cụ thể (không chỉ số lượng). <i>Gợi ý:<\/i> lưu <code>choice[x]<\/code> là đồng xu cuối cùng được dùng để đạt <code>dp[x]<\/code>.", "Bài \"partition equal subset sum\": chia dãy thành hai phần có tổng bằng nhau? Quy về knapsack 0/1 với <code>dp: Vec&lt;bool&gt;<\/code> — hoặc nhanh hơn nhiều với bitset: mỗi phần tử x thực hiện <code>bits |= bits &lt;&lt; x<\/code>. Cài bản bitset bằng <code>Vec&lt;u64&gt;<\/code>.", "Tính số dãy con tăng dài nhất <b>khác nhau<\/b> (đếm số LIS) trong O(n^2). <i>Gợi ý:<\/i> thêm mảng <code>cnt[i]<\/code> song song với <code>dp[i]<\/code>.", "Viết <code>diff(a: &amp;[&amp;str], b: &amp;[&amp;str])<\/code> in ra các dòng bị xóa (<code>-<\/code>), thêm (<code>+<\/code>) và giữ nguyên (khoảng trắng đầu dòng) giữa hai văn bản theo từng dòng, dựa trên bảng LCS.", "Bài \"longest palindromic subsequence\": tìm độ dài dãy con đối xứng dài nhất của một chuỗi. <i>Gợi ý:<\/i> bằng LCS của chuỗi với chuỗi đảo ngược, hoặc DP đoạn <code>dp[l][r]<\/code> duyệt theo độ dài tăng dần.", "Bài \"nhân chuỗi ma trận\" (matrix chain multiplication): cho kích thước n ma trận, tìm cách đặt ngoặc để số phép nhân vô hướng ít nhất. Cài DP đoạn O(n^3) và in ra cách đặt ngoặc.", "Bài \"phân công\" (assignment): n người, n việc, chi phí <code>cost[i][j]<\/code>; mỗi người làm đúng một việc. Giải bằng DP bitmask O(2^n * n) với trạng thái chỉ là <code>mask<\/code> (người thứ <code>popcount(mask)<\/code> đang được phân công). So sánh với Held-Karp."]}, {"id": "p2c16", "num": 16, "title": "Tham lam, Quay lui, Thao tác bit &amp; Toán học", "intro": "Chương cuối của Phần 2 gom bốn nhóm kỹ thuật bổ trợ cho nhau. <b>Tham lam<\/b> (greedy) chọn phương án tốt nhất cục bộ ở mỗi bước và không bao giờ quay lại — nhanh, nhưng chỉ đúng khi bài toán có cấu trúc đặc biệt. <b>Quay lui<\/b> (backtracking) ở thái cực ngược lại: thử mọi khả năng một cách có hệ thống và cắt tỉa sớm các nhánh vô vọng. <b>Thao tác bit<\/b> cung cấp những viên gạch cực nhanh cho cả hai (bitmask trong N-Queens, Sudoku, DP bitmask ở Chương 15). Cuối cùng là bộ công cụ <b>toán học<\/b> mà mọi lập trình viên thuật toán cần: GCD/LCM, sàng nguyên tố, lũy thừa và nghịch đảo mô-đun. Chương kết thúc bằng ba phụ lục cho toàn bộ Phần 2: bảng tổng hợp độ phức tạp, lộ trình luyện tập và các crate hữu ích.", "sections": [{"n": "16.1", "t": "Thuật toán tham lam", "sub": ["Khi nào tham lam đúng", "Chọn hoạt động và gộp khoảng", "Mã Huffman"]}, {"n": "16.2", "t": "Quay lui", "sub": ["Khuôn mẫu: chọn — khám phá — hủy chọn", "N-Queens với bitmask", "Giải Sudoku"]}, {"n": "16.3", "t": "Thao tác bit", "sub": ["Toán tử và phương thức"]}, {"n": "16.4", "t": "Toán học cho lập trình thuật toán", "sub": ["GCD, LCM và Euclid mở rộng", "Sàng Eratosthenes", "Số học mô-đun"]}, {"n": "16.7", "t": "Phụ lục A — Bảng tổng hợp độ phức tạp của Phần 2", "sub": ["Cấu trúc dữ liệu", "Sắp xếp", "Tìm kiếm và xử lý chuỗi", "Đồ thị", "Kỹ thuật và bài toán kinh điển"]}, {"n": "16.8", "t": "Phụ lục B — Lộ trình luyện tập", "sub": ["Các giai đoạn", "Phương pháp luyện tập hiệu quả", "Khung chương trình Rust cho bài luyện tập"]}, {"n": "16.9", "t": "Phụ lục C — Crate hữu ích cho cấu trúc dữ liệu và giải thuật", "sub": []}], "summary": ["Tham lam đúng khi có cấu trúc con tối ưu và tính chất lựa chọn tham lam; chứng minh bằng lập luận hoán đổi, hoặc ít nhất kiểm thử đối chiếu với vét cạn. Chọn hoạt động: sắp theo thời điểm kết thúc; gộp khoảng: sắp theo điểm bắt đầu; Huffman: gộp hai cây nhẹ nhất bằng min-heap.", "Quay lui theo khuôn \"chọn — khám phá — hủy chọn\" với trạng thái truyền bằng <code>&amp;mut<\/code>, chỉ <code>clone<\/code> khi ghi nhận nghiệm; cắt tỉa sớm là chìa khóa hiệu năng (cận trên trong tổ hợp, MRV trong Sudoku).", "Bitmask biến kiểm tra ràng buộc thành vài phép bit O(1): N-Queens với <code>cols<\/code>, <code>d1 &lt;&lt; 1<\/code>, <code>d2 &gt;&gt; 1<\/code>; Sudoku với mask hàng/cột/khối. Mẹo <code>x &amp; (x - 1)<\/code>, <code>x &amp; x.wrapping_neg()<\/code>, duyệt submask <code>(sub - 1) &amp; mask<\/code>.", "Trong Rust: <code>!<\/code> là NOT bit, <code>&amp;<\/code> ưu tiên cao hơn <code>==<\/code>, dịch quá độ rộng là lỗi (dùng <code>checked_shl<\/code>/<code>wrapping_shl<\/code>), <code>&gt;&gt;<\/code> trên số có dấu là dịch số học.", "Toán: Euclid O(log), lcm chia trước nhân sau với <code>checked_mul<\/code>; sàng O(n log log n); nhân mô-đun qua <code>u128<\/code>; lũy thừa nhanh; nghịch đảo bằng Fermat (mod nguyên tố) hoặc Euclid mở rộng; <code>rem_euclid<\/code> cho số dư không âm; bảng giai thừa cho C(n, k) mod p."], "exercises": ["Bài \"jump game II\": mỗi phần tử a[i] là độ dài bước nhảy tối đa từ i; tìm số bước ít nhất tới cuối mảng bằng tham lam O(n). Viết test đối chiếu với BFS trên 1000 mảng ngẫu nhiên nhỏ.", "Bài \"gas station\": có trạm xăng xếp vòng tròn với lượng xăng <code>gas[i]<\/code> và chi phí <code>cost[i]<\/code> để tới trạm kế; tìm trạm xuất phát đi hết một vòng được (hoặc báo không có) trong O(n). Chứng minh tính đúng đắn của lựa chọn tham lam.", "Viết <code>huffman_encode(text: &amp;str) -&gt; (Vec&lt;u8&gt;, bảng mã)<\/code> đóng gói các bit thành byte thật sự và hàm giải nén tương ứng. Đo tỉ lệ nén trên một đoạn văn tiếng Việt (nhớ làm việc trên <code>char<\/code>).", "Sinh mọi hoán vị <b>không trùng lặp<\/b> của một dãy có phần tử lặp (ví dụ <code>[1, 1, 2]<\/code> cho 3 hoán vị). <i>Gợi ý:<\/i> sắp xếp trước, dùng mảng <code>used<\/code>, bỏ qua <code>a[i]<\/code> nếu <code>a[i] == a[i-1]<\/code> và <code>a[i-1]<\/code> chưa được dùng.", "Bài \"word search\": tìm một từ trên lưới chữ cái (đi 4 hướng, mỗi ô dùng một lần) bằng quay lui. Mở rộng tìm nhiều từ cùng lúc bằng Trie (Chương 11). Dùng <code>checked_add_signed<\/code> cho ô kề.", "Bài \"subset sum có cắt tỉa\": cho tập số dương và mục tiêu T, liệt kê mọi tập con có tổng T. Sắp xếp giảm dần và cắt tỉa khi tổng hiện tại cộng tổng phần còn lại nhỏ hơn T. So sánh số nút đã thăm khi có/không cắt tỉa.", "Viết sàng tuyến tính (linear sieve) O(n) đồng thời tính ước nguyên tố nhỏ nhất <code>spf[i]<\/code> cho mọi i &lt;= n, rồi dùng nó phân tích thừa số nguyên tố mỗi số trong O(log n).", "Tính số Fibonacci thứ 10^18 mod 10^9 + 7 bằng lũy thừa ma trận 2 x 2 (<code>[[u64; 2]; 2]<\/code>) với nhân mô-đun qua <code>u128<\/code>. Kiểm tra với kết quả DP O(n) cho n &lt;= 1000."]}]}, {"id": 3, "chapters": [{"id": "p3c1", "num": 1, "title": "Tổng quan lập trình Backend với Rust", "intro": "Phần 1 đã trang bị cho bạn ngôn ngữ Rust, Phần 2 rèn luyện tư duy giải thuật. Phần 3 đưa tất cả vào một bối cảnh rất thực tế: xây dựng dịch vụ backend (web API) chạy trong môi trường production. Chương mở đầu này không đi sâu vào một API cụ thể nào mà vẽ ra \"tấm bản đồ\": vì sao Rust ngày càng được chọn cho backend, hệ sinh thái gồm những tầng nào, các crate quan trọng liên kết với nhau ra sao, và một HTTP request thực sự đi qua những bước nào trong một ứng dụng Axum. Hiểu bức tranh tổng thể này sẽ giúp bạn đọc các chương sau một cách có hệ thống, thay vì chỉ sao chép đoạn mã.", "sections": [{"n": "1.1", "t": "Vì sao chọn Rust cho backend", "sub": ["Hiệu năng ổn định, không có GC", "An toàn bộ nhớ và an toàn luồng tại thời điểm biên dịch", "Hệ thống kiểu mô hình hóa nghiệp vụ", "Đánh đổi cần biết trước"]}, {"n": "1.2", "t": "Bản đồ hệ sinh thái backend", "sub": ["Tầng runtime: Tokio", "Tầng HTTP: hyper và crate http", "Tầng trừu tượng middleware: tower và tower-http", "Web framework", "Truy cập cơ sở dữ liệu", "Các crate xuyên suốt"]}, {"n": "1.3", "t": "Chương trình Axum đầu tiên", "sub": []}, {"n": "1.4", "t": "Mô hình Service của tower — \"mọi thứ là Service\"", "sub": []}, {"n": "1.5", "t": "Vòng đời một request trong Axum", "sub": []}, {"n": "1.6", "t": "Stack và phiên bản dùng trong tài liệu", "sub": []}, {"n": "1.7", "t": "So sánh Axum với Actix-web và các framework khác", "sub": []}, {"n": "1.8", "t": "Lộ trình của Phần 3", "sub": []}], "summary": ["Rust hấp dẫn cho backend nhờ hiệu năng ổn định không GC (độ trễ đuôi thấp), an toàn bộ nhớ và an toàn luồng ở thời điểm biên dịch, cùng hệ thống kiểu mô hình hóa nghiệp vụ tốt; đổi lại là thời gian biên dịch và đường cong học tập.", "Hệ sinh thái chia tầng: tokio (runtime) -&gt; hyper (HTTP) -&gt; tower/tower-http (middleware) -&gt; axum (framework), cùng serde, sqlx, tracing xuyên suốt.", "tower <code>Service<\/code> là hàm bất đồng bộ từ request sang response có <code>poll_ready<\/code>; <code>Layer<\/code> bọc service thành service mới. Router, MethodRouter, handler trong Axum đều là Service.", "<code>axum::serve<\/code> spawn một task Tokio cho mỗi kết nối, hyper phân tích HTTP rồi gọi Router; request đi qua các layer từ ngoài vào trong, được định tuyến bằng matchit, qua các extractor, đến handler, rồi response đi ngược ra.", "Extractor <code>FromRequestParts<\/code> chạy trước, extractor <code>FromRequest<\/code> (tiêu thụ body) chạy cuối; mọi lỗi đều được chuyển thành Response.", "Luôn chú ý phiên bản: axum 0.8 dùng <code>/{id}<\/code>, <code>axum::serve<\/code>, async fn native trong trait extractor."], "exercises": ["Chạy ví dụ ở mục 1.3, thêm route <code>GET /health<\/code> trả về chuỗi <code>\"ok\"<\/code>. Dùng <code>curl -I<\/code> (request HEAD) để kiểm chứng Axum tự phục vụ HEAD cho route GET.", "Trong ví dụ mục 1.3, thêm route <code>/users/me<\/code> và <code>/users/{id}<\/code>. Khai báo <code>/users/{id}<\/code> trước rồi thử <code>GET /users/me<\/code>: handler nào được gọi? Giải thích dựa trên cách matchit ưu tiên route tĩnh.", "Viết một tower <code>Service<\/code> tự định nghĩa đếm số request đã nhận (dùng <code>Arc&lt;AtomicUsize&gt;<\/code>) và trả về con số đó trong body. Gắn nó vào Router bằng <code>route_service<\/code> và gọi thử bằng <code>oneshot<\/code> ba lần.", "Trong ví dụ vòng đời ở mục 1.5, đổi thứ tự hai lệnh <code>.layer(...)<\/code>. Dự đoán thứ tự in ra trước khi chạy, sau đó chạy để kiểm chứng.", "Sửa extractor <code>LogParts<\/code> để trả về lỗi <code>StatusCode::UNAUTHORIZED<\/code> nếu request không có header <code>x-api-key<\/code>. Quan sát những bước nào (3, 4, 5, 6) còn được in ra khi thiếu header, và giải thích vì sao.", "(Tìm hiểu) Đọc mã nguồn hàm <code>handle_connection<\/code> trong <code>axum/src/serve/mod.rs<\/code> (trong thư mục <code>~/.cargo/registry/src/<\/code>). Tìm dòng gọi <code>tokio::spawn<\/code> và dòng xử lý graceful shutdown cho từng kết nối; tóm tắt bằng lời cơ chế này."]}, {"id": "p3c2", "num": 2, "title": "Cargo chuyên sâu", "intro": "Phần 1 (Chương 1 và 7) đã dùng Cargo ở mức cơ bản: <code>cargo new<\/code>, <code>cargo build<\/code>, <code>cargo run<\/code>, khai báo dependency. Khi bước sang backend, dự án nhanh chóng có vài chục đến vài trăm crate phụ thuộc, nhiều binary (server, worker, công cụ migrate), nhiều crate nội bộ trong một workspace, cần build tối ưu cho production, kiểm tra lỗ hổng bảo mật trong CI và biên dịch chéo cho Linux musl hay ARM. Chương này đi sâu vào Cargo với tư cách vừa là trình quản lý gói (package manager) vừa là hệ thống build (build system): mọi mục quan trọng trong <code>Cargo.toml<\/code>, features, profiles, workspace, <code>Cargo.lock<\/code>, build script, file cấu hình <code>.cargo/config.toml<\/code>, biến môi trường và hệ sinh thái công cụ đi kèm. Các lệnh và kết quả trong chương được chạy thật với cargo 1.97.", "sections": [{"n": "2.1", "t": "Cargo làm gì khi bạn gõ <code>cargo build<\/code>", "sub": []}, {"n": "2.2", "t": "Cargo.toml đầy đủ", "sub": ["Bảng <code>[package]<\/code>", "Các loại dependency", "Yêu cầu phiên bản (version requirement)", "Dependency từ git, đường dẫn, đổi tên và patch", "Các target: lib, bin, example, test, bench"]}, {"n": "2.3", "t": "Thực hành: tạo dự án và thêm dependency bằng <code>cargo add<\/code>", "sub": []}, {"n": "2.4", "t": "Features và optional dependency", "sub": ["Khai báo features", "Bật feature của dependency một cách có điều kiện", "Quy tắc vàng: feature phải mang tính cộng (additive)", "Resolver 2 và 3"]}, {"n": "2.5", "t": "Cargo.lock và cây phụ thuộc", "sub": ["Vai trò của Cargo.lock", "Cập nhật có kiểm soát", "<code>cargo tree<\/code> — đọc đồ thị phụ thuộc"]}, {"n": "2.6", "t": "Profiles: điều khiển cách biên dịch", "sub": ["Các profile có sẵn và tùy chọn", "Profile tùy biến và so sánh kích thước", "Ghi đè profile theo từng package"]}, {"n": "2.7", "t": "Workspace", "sub": ["Vì sao cần workspace", "Thực hành tạo workspace", "Lệnh làm việc với workspace"]}, {"n": "2.8", "t": "Build script (build.rs)", "sub": []}, {"n": "2.9", "t": "Cấu hình <code>.cargo/config.toml<\/code>", "sub": []}, {"n": "2.10", "t": "Biến môi trường của Cargo", "sub": []}, {"n": "2.11", "t": "Bảng lệnh Cargo thường dùng", "sub": []}, {"n": "2.12", "t": "Hệ sinh thái công cụ mở rộng", "sub": ["Vòng lặp phát triển: bacon và cargo-watch", "cargo-nextest", "cargo-audit và cargo-deny"]}, {"n": "2.13", "t": "Target triple và biên dịch chéo", "sub": []}, {"n": "2.14", "t": "Mẹo giảm thời gian biên dịch dự án backend", "sub": []}], "summary": ["<code>cargo build<\/code> gồm resolve, fetch, chạy build script, biên dịch song song theo đồ thị và link; <code>cargo check<\/code> bỏ qua sinh mã nên nhanh hơn nhiều.", "Yêu cầu phiên bản mặc định là caret; với crate 0.x, mỗi bản MINOR là breaking. <code>cargo update<\/code> không vượt khỏi yêu cầu trong Cargo.toml.", "Features phải mang tính cộng vì Cargo hợp nhất feature; dùng <code>dep:<\/code> cho optional dependency, <code>crate?/feature<\/code> cho weak feature, <code>cargo tree -e features -i<\/code> để điều tra.", "Resolver 3 (mặc định với edition 2024) chọn phiên bản dependency theo <code>rust-version<\/code>.", "Profiles điều khiển opt-level, debug, lto, codegen-units, panic, strip; có thể tạo profile tùy biến bằng <code>inherits<\/code> và ghi đè theo từng package. Cẩn trọng với <code>panic = \"abort\"<\/code> trên server.", "Workspace chia sẻ Cargo.lock, target, <code>workspace.package<\/code>, <code>workspace.dependencies<\/code>, <code>workspace.lints<\/code>; profile chỉ khai báo ở gốc.", "build.rs giao tiếp qua <code>cargo::...<\/code>; luôn khai báo <code>rerun-if-changed<\/code>.", "<code>.cargo/config.toml<\/code> chứa alias, env, linker, target-dir; mọi khóa có biến <code>CARGO_*<\/code> tương ứng.", "Công cụ quan trọng cho backend: bacon, cargo-nextest, cargo-audit, cargo-deny, cargo-edit, cargo-llvm-cov, cargo-chef."], "exercises": ["Tạo package mới, thêm <code>serde<\/code>, <code>serde_json<\/code>, <code>tokio<\/code> bằng <code>cargo add<\/code>. Dùng <code>cargo tree -d<\/code> và <code>cargo tree -i proc-macro2<\/code> để giải thích vì sao <code>proc-macro2<\/code> xuất hiện dù bạn không khai báo.", "Thêm feature <code>json-log<\/code> bật optional dependency <code>tracing-subscriber<\/code> với feature <code>json<\/code> (dùng <code>dep:<\/code> và <code>tracing-subscriber/json<\/code>). Viết mã in log dạng JSON khi bật feature, dạng text khi tắt. Kiểm chứng bằng <code>--features<\/code> và <code>--no-default-features<\/code>.", "Tạo profile <code>dist<\/code> như mục 2.6.2 cho một server Axum \"hello world\". So sánh kích thước và thời gian build giữa <code>dev<\/code>, <code>release<\/code>, <code>dist<\/code>. Thử thêm <code>opt-level = \"z\"<\/code> và đo lại.", "Dựng workspace gồm <code>crates/domain<\/code> (lib), <code>crates/api<\/code> (bin dùng axum), <code>crates/worker<\/code> (bin). Đưa mọi phiên bản dependency vào <code>[workspace.dependencies]<\/code>, thêm <code>[workspace.lints]<\/code> cấm <code>unsafe_code<\/code>. Kiểm tra <code>cargo build -p worker<\/code> không biên dịch axum.", "Viết build.rs nhúng git commit hash (gọi <code>git rev-parse --short HEAD<\/code> bằng <code>std::process::Command<\/code>) vào biến <code>GIT_HASH<\/code>, rồi tạo endpoint <code>/version<\/code> trả về tên, phiên bản và hash. Khai báo <code>rerun-if-changed<\/code> hợp lý (gợi ý: <code>.git/HEAD<\/code>).", "Viết <code>.cargo/config.toml<\/code> với alias <code>cargo dev<\/code> (chạy server) và <code>cargo ci<\/code> (chạy <code>fmt --check<\/code>, rồi clippy <code>-D warnings<\/code>). Giải thích vì sao alias không thể nối nhiều lệnh và đề xuất cách khắc phục (gợi ý: script, <code>cargo-make<\/code>, <code>just<\/code>).", "(Nâng cao) Thêm vào workspace một file <code>deny.toml<\/code> tối thiểu chỉ cho phép license MIT và Apache-2.0. Đọc tài liệu cargo-deny để mô tả kết quả bạn mong đợi khi một dependency dùng license khác."]}, {"id": "p3c3", "num": 3, "title": "Tokio runtime cho backend", "intro": "Phần 1, Chương 15 đã giải thích async/await từ gốc: trait <code>Future<\/code>, mô hình poll, máy trạng thái, <code>tokio::spawn<\/code>, <code>join!<\/code>, <code>select!<\/code>. Chương này nhìn Tokio dưới góc độ người viết server: runtime được tổ chức bên trong như thế nào, cấu hình ra sao cho phù hợp, khi nào dùng task, <code>JoinSet<\/code>, từng loại channel, <code>Mutex<\/code> nào, giới hạn đồng thời bằng <code>Semaphore<\/code>, xử lý thời gian, đưa công việc nặng ra khỏi runtime, và quan trọng nhất là tắt server một cách êm ái (graceful shutdown). Cuối chương là danh sách các lỗi kinh điển mà gần như ai viết backend Rust cũng từng mắc. Mọi ví dụ đều được chạy thật; kết quả in ra là output thực tế (thời gian có thể dao động vài mili giây).", "sections": [{"n": "3.1", "t": "Bên trong Tokio runtime", "sub": ["Ba thành phần chính", "Bộ lập lịch đa luồng và work-stealing"]}, {"n": "3.2", "t": "<code>#[tokio::main]<\/code> và cấu hình runtime", "sub": ["Macro làm gì", "Tự xây runtime bằng <code>Builder<\/code>", "Chọn <code>multi_thread<\/code> hay <code>current_thread<\/code>"]}, {"n": "3.3", "t": "Task: <code>tokio::spawn<\/code> và <code>JoinHandle<\/code>", "sub": ["Task là gì, vì sao rẻ", "Ví dụ: kết quả, panic, hủy", "<code>JoinSet<\/code>: quản lý một nhóm task"]}, {"n": "3.4", "t": "<code>tokio::select!<\/code>: chờ nhiều sự kiện cùng lúc", "sub": []}, {"n": "3.5", "t": "Channel: giao tiếp giữa các task", "sub": ["<code>mpsc<\/code> có giới hạn và backpressure", "<code>oneshot<\/code> và mô hình actor", "<code>broadcast<\/code> và <code>watch<\/code>"]}, {"n": "3.6", "t": "Trạng thái chia sẻ: Mutex của std hay của Tokio?", "sub": ["Quy tắc chọn lựa", "Lỗi kinh điển: giữ <code>MutexGuard<\/code> qua <code>.await<\/code>"]}, {"n": "3.7", "t": "Semaphore: giới hạn mức đồng thời", "sub": []}, {"n": "3.8", "t": "Thời gian: sleep, timeout, interval", "sub": []}, {"n": "3.9", "t": "Công việc chặn: <code>spawn_blocking<\/code>", "sub": []}, {"n": "3.10", "t": "Graceful shutdown", "sub": ["Vì sao cần", "Bắt tín hiệu, <code>CancellationToken<\/code> và <code>TaskTracker<\/code>"]}, {"n": "3.11", "t": "Lỗi hay gặp và cách khắc phục", "sub": []}], "summary": ["Tokio gồm scheduler (đa luồng, work-stealing, LIFO slot, ngân sách hợp tác), I/O driver (mio/epoll), timer driver và blocking pool. Đa nhiệm là hợp tác: task chỉ nhường worker ở <code>.await<\/code>.", "<code>#[tokio::main]<\/code> tạo runtime đa luồng và <code>block_on<\/code> future của <code>main<\/code> trên thread main; dùng <code>Builder<\/code> để đặt tên thread, số worker, giới hạn blocking pool.", "<code>tokio::spawn<\/code> yêu cầu <code>Send + 'static<\/code>; drop <code>JoinHandle<\/code> không hủy task; panic được cô lập thành <code>JoinError<\/code>; <code>JoinSet<\/code> quản lý nhóm task và hủy tất cả khi drop.", "<code>select!<\/code> chạy nhánh hoàn thành đầu tiên và drop các nhánh khác; chú ý <code>biased;<\/code>, pattern vế trái, cancel safety.", "Bốn loại channel: <code>mpsc<\/code> (hàng đợi, backpressure với kênh bounded), <code>oneshot<\/code> (trả lời một lần, mô hình actor), <code>broadcast<\/code> (mọi receiver nhận mọi tin, có <code>Lagged<\/code>), <code>watch<\/code> (chỉ giá trị mới nhất).", "Mặc định dùng <code>std::sync::Mutex<\/code> cho vùng khóa ngắn không có <code>.await<\/code>; chỉ dùng <code>tokio::sync::Mutex<\/code> khi phải giữ khóa qua <code>.await<\/code>.", "<code>Semaphore<\/code> giới hạn đồng thời; <code>timeout<\/code>, <code>timeout_at<\/code>, <code>interval<\/code> với <code>MissedTickBehavior<\/code> điều khiển thời gian.", "Công việc chặn hoặc nặng CPU phải ra <code>spawn_blocking<\/code> (hoặc rayon), nếu không sẽ làm treo các task khác.", "Graceful shutdown: bắt <code>SIGINT<\/code>/<code>SIGTERM<\/code>, phát tín hiệu bằng <code>CancellationToken<\/code>, chờ task bằng <code>TaskTracker<\/code> kèm timeout."], "exercises": ["Viết chương trình dùng <code>Builder<\/code> tạo runtime 2 worker với tên thread <code>job-N<\/code>. Spawn 20 task, mỗi task <code>sleep<\/code> ngẫu nhiên 10–50ms rồi in tên thread. Quan sát sự phân bổ; sau đó đặt <code>TOKIO_WORKER_THREADS=1<\/code> (bỏ <code>worker_threads<\/code> trong code) và so sánh.", "Dùng <code>JoinSet<\/code> để \"gọi\" 10 URL giả lập (sleep ngẫu nhiên), mỗi lời gọi có <code>timeout<\/code> 200ms. In ra số lời gọi thành công, thất bại do timeout, và tổng thời gian. Đảm bảo tổng thời gian không vượt quá 200ms nhiều.", "Viết một actor <code>RateLimiter<\/code> giữ <code>HashMap&lt;String, (u32, Instant)&gt;<\/code> đếm số request theo IP trong cửa sổ 1 giây; handle có phương thức <code>async fn check(&amp;self, ip: &amp;str) -&gt; bool<\/code>. Thử với 10 task cùng gọi.", "Sửa ví dụ <code>mpsc<\/code> ở mục 3.5.1: producer dùng <code>try_send<\/code> thay cho <code>send().await<\/code> và in \"từ chối (503)\" khi kênh đầy. Đếm số email bị từ chối.", "Viết hệ thống \"hot reload\" cấu hình: một task đọc file <code>config.json<\/code> mỗi 2 giây (dùng <code>tokio::fs<\/code>), nếu nội dung thay đổi thì gửi qua <code>watch<\/code>. Ba worker in ra giá trị <code>max_conn<\/code> mới mỗi khi cấu hình đổi.", "Tái hiện lỗi giữ <code>std::sync::MutexGuard<\/code> qua <code>.await<\/code> trong một hàm <code>async<\/code> được gọi bởi <code>tokio::spawn<\/code>. Đọc kỹ thông báo lỗi, rồi sửa bằng hai cách: thu hẹp phạm vi, và chuyển sang <code>tokio::sync::Mutex<\/code>. Thảo luận ưu nhược điểm.", "Mở rộng ví dụ graceful shutdown: thêm một task \"nhận job\" đọc từ <code>mpsc<\/code>; khi nhận tín hiệu dừng, task này phải xử lý nốt các job còn trong kênh (gọi <code>rx.close()<\/code> rồi <code>recv()<\/code> đến khi <code>None<\/code>) trước khi thoát. Đặt timeout tổng 3 giây.", "(Nâng cao) Đo ảnh hưởng của việc chặn runtime: tạo runtime đa luồng 2 worker, spawn 4 task gọi <code>std::thread::sleep(500ms)<\/code> và một task heartbeat mỗi 50ms. Ghi lại độ trễ thực tế của heartbeat. Sau đó chuyển 4 task sang <code>spawn_blocking<\/code> và so sánh."]}, {"id": "p3c4", "num": 4, "title": "Axum căn bản", "intro": "Chương 1 đã cho thấy bức tranh tổng thể: Axum là một lớp mỏng trên hyper và tower, nơi mọi thứ là <code>Service<\/code>. Chương này đi vào những viên gạch cơ bản mà bạn dùng hằng ngày: định tuyến (<code>Router<\/code>) với cú pháp đường dẫn mới của Axum 0.8, handler, các extractor có sẵn và cơ chế bên trong khiến chúng hoạt động, lý do extractor đọc body bắt buộc phải đứng cuối, các kiểu response, khởi động server với <code>axum::serve<\/code> và tắt server êm ái. Cuối chương, ta ghép tất cả thành một API CRUD hoàn chỉnh lưu dữ liệu trong bộ nhớ. Mọi ví dụ đều được chạy thật trên axum 0.8.9; output curl là kết quả thực tế (đã bỏ header <code>date<\/code>).", "sections": [{"n": "4.1", "t": "Router và định tuyến", "sub": ["Khai báo route và method routing", "Cú pháp đường dẫn của Axum 0.8", "Hành vi mặc định khi không khớp"]}, {"n": "4.2", "t": "Handler", "sub": ["Điều kiện để một hàm là handler", "Bên trong trait <code>Handler<\/code>: extractor được giải quyết thế nào"]}, {"n": "4.3", "t": "Extractor có sẵn", "sub": ["Bảng tổng hợp", "Ví dụ tổng hợp các extractor", "Path và Query", "Json: ba loại lỗi khác nhau", "Form, header, body thô và Request"]}, {"n": "4.4", "t": "Thứ tự extractor: vì sao extractor đọc body phải đứng cuối", "sub": ["Lý do kỹ thuật", "Thông báo lỗi và <code>#[debug_handler]<\/code>"]}, {"n": "4.5", "t": "Response", "sub": ["Trait <code>IntoResponse<\/code> và các kiểu có sẵn", "Ví dụ các kiểu response"]}, {"n": "4.6", "t": "Khởi động server với <code>axum::serve<\/code>", "sub": ["TcpListener và các tùy chọn", "Graceful shutdown"]}, {"n": "4.7", "t": "Ví dụ hoàn chỉnh: API CRUD lưu trong bộ nhớ", "sub": []}, {"n": "4.8", "t": "Lỗi thường gặp", "sub": []}], "summary": ["<code>Router::route(path, method_router)<\/code> ánh xạ đường dẫn và method tới handler; cú pháp 0.8 là <code>{param}<\/code> và <code>{*wildcard}<\/code>; route tĩnh được ưu tiên hơn route tham số; route trùng gây panic ngay khi khởi tạo.", "Không khớp đường dẫn trả 404 (fallback), sai method trả 405 kèm header <code>allow<\/code>; <code>get<\/code> tự phục vụ <code>HEAD<\/code>.", "Handler là hàm async nhận tối đa 16 extractor và trả về <code>IntoResponse<\/code>. Trait <code>Handler<\/code> được implement bằng macro: tách request thành <code>Parts<\/code> và body, chạy tuần tự các <code>FromRequestParts<\/code>, ghép lại rồi chạy <code>FromRequest<\/code> cho tham số cuối; extractor thất bại trả rejection ngay.", "Body là luồng chỉ đọc một lần, nên chỉ tham số cuối được tiêu thụ body và mỗi handler có tối đa một extractor body. <code>#[debug_handler]<\/code> cho thông báo lỗi dễ hiểu.", "<code>Json&lt;T&gt;<\/code> phân biệt 415, 400, 422, 413; dùng <code>Result&lt;Json&lt;T&gt;, JsonRejection&gt;<\/code> để tự xử lý. <code>Option&lt;T&gt;<\/code> trong 0.8 dựa trên <code>OptionalFromRequestParts<\/code>/<code>OptionalFromRequest<\/code>.", "Response: chuỗi, byte, <code>Json<\/code>, <code>Html<\/code>, <code>StatusCode<\/code>, <code>Redirect<\/code>, <code>NoContent<\/code>, tuple <code>(StatusCode, headers..., body)<\/code>, <code>Result<\/code>, <code>Response<\/code> tự dựng.", "<code>axum::serve(listener, app)<\/code> chạy server; <code>.with_graceful_shutdown(signal)<\/code> chờ request đang xử lý; <code>into_make_service_with_connect_info<\/code> cho địa chỉ client; bind <code>0.0.0.0<\/code> khi chạy trong container."], "exercises": ["Viết router cho một blog với các route: <code>GET /posts<\/code>, <code>POST /posts<\/code>, <code>GET /posts/{slug}<\/code>, <code>GET /posts/{slug}/comments<\/code>, <code>GET /tags/{*tags}<\/code> (handler trả về danh sách tag tách theo <code>/<\/code>). Kiểm tra bằng curl, kể cả trường hợp 405 và 404.", "Viết handler <code>GET /search<\/code> nhận query <code>q<\/code> (bắt buộc), <code>page<\/code> (mặc định 1), <code>sort<\/code> (chỉ nhận <code>asc<\/code> hoặc <code>desc<\/code>, dùng enum với <code>#[serde(rename_all = \"lowercase\")]<\/code>). Quan sát thông báo lỗi khi <code>sort=abc<\/code> và khi thiếu <code>q<\/code>.", "Cố ý đặt <code>String<\/code> (body) trước <code>HeaderMap<\/code> trong một handler. Ghi lại lỗi biên dịch, rồi thêm <code>#[axum::debug_handler]<\/code> và so sánh thông báo. Sửa lỗi.", "Viết handler <code>POST /echo-json<\/code> dùng <code>Result&lt;Json&lt;serde_json::Value&gt;, JsonRejection&gt;<\/code> trả về JSON <code>{\"error\": \"...\", \"status\": 4xx}<\/code> khi lỗi thay vì text. Thử với bốn trường hợp: thiếu content-type, JSON sai cú pháp, body rỗng, JSON hợp lệ.", "Viết handler <code>GET /download/{name}<\/code> trả về file văn bản sinh động (nội dung tùy ý) với header <code>Content-Type: text/plain<\/code> và <code>Content-Disposition: attachment; filename=\"{name}.txt\"<\/code>. Trả 400 nếu <code>name<\/code> chứa ký tự ngoài <code>[a-z0-9-]<\/code>.", "Mở rộng API CRUD ở mục 4.7: thêm trường <code>created_at<\/code> (dùng <code>chrono::Utc::now()<\/code>), thêm tham số <code>sort=created_at|title<\/code> cho endpoint liệt kê, và endpoint <code>DELETE /todos?done=true<\/code> xóa mọi todo đã hoàn thành, trả về số lượng đã xóa.", "Thêm graceful shutdown cho API CRUD. Viết script gửi 20 request song song tới một endpoint chậm (thêm <code>sleep<\/code> 1 giây), rồi gửi <code>SIGTERM<\/code> giữa chừng. Xác nhận mọi request đã nhận được response trước khi server thoát.", "(Nâng cao) Đọc mã nguồn <code>axum/src/handler/mod.rs<\/code> và <code>axum-core/src/extract/mod.rs<\/code> trong <code>~/.cargo/registry/src/<\/code>. Giải thích vai trò của tham số kiểu <code>M<\/code> trong <code>FromRequest&lt;S, M&gt;<\/code> và vì sao không có nó thì không thể dùng <code>Path&lt;T&gt;<\/code> làm tham số cuối cùng của handler."]}, {"id": "p3c5", "num": 5, "title": "Axum nâng cao", "intro": "Chương 4 đã đủ để viết những API đơn giản. Ứng dụng thật cần nhiều hơn: chia sẻ connection pool và cấu hình giữa các handler, tổ chức hàng chục route thành module, tự viết extractor xác thực, chèn middleware ghi log, đo thời gian, kiểm tra quyền, nén response, giới hạn kích thước body, đặt timeout, gắn request id, và hỗ trợ WebSocket, Server-Sent Events, file tĩnh, upload. Chương này đi qua từng chủ đề, nhưng điểm nhấn là <b>mô hình tower<\/b> bên dưới: hiểu <code>Layer<\/code> và <code>Service<\/code>, hiểu vì sao thứ tự <code>.layer()<\/code> quan trọng (với sơ đồ \"củ hành\"), bạn sẽ tự tin ghép bất kỳ middleware nào của hệ sinh thái. Toàn bộ ví dụ được chạy thật với axum 0.8.9, tower 0.5.3 và tower-http 0.7.1.", "sections": [{"n": "5.1", "t": "State: chia sẻ dữ liệu giữa các handler", "sub": ["<code>Router&lt;S&gt;<\/code> và <code>with_state<\/code>", "State được clone cho mỗi request", "Substate với <code>FromRef<\/code>", "Ví dụ: state, substate, Extension và tổ chức router", "State hay Extension?"]}, {"n": "5.2", "t": "Tổ chức router lớn", "sub": []}, {"n": "5.3", "t": "Tự viết extractor", "sub": ["<code>FromRequestParts<\/code>: xác thực bằng API key", "<code>OptionalFromRequestParts<\/code>: extractor tùy chọn kiểu 0.8", "<code>FromRequest<\/code>: nhận JSON hoặc form", "Derive extractor từ struct"]}, {"n": "5.4", "t": "Middleware trong Axum", "sub": ["Bốn cách viết middleware bằng hàm", "Ví dụ đầy đủ", "Truyền dữ liệu từ middleware xuống handler", "<code>layer<\/code> hay <code>route_layer<\/code>?"]}, {"n": "5.5", "t": "Tower bên dưới: Layer, Service và thứ tự layer", "sub": ["Tự viết một middleware tower", "Thứ tự layer: mô hình củ hành", "Lỗi từ middleware tower và <code>HandleErrorLayer<\/code>"]}, {"n": "5.6", "t": "tower-http: bộ middleware HTTP dựng sẵn", "sub": ["Bảng các layer quan trọng", "Ví dụ ghép các layer theo thứ tự khuyến nghị"]}, {"n": "5.7", "t": "WebSocket", "sub": []}, {"n": "5.8", "t": "Server-Sent Events (SSE)", "sub": []}, {"n": "5.9", "t": "File tĩnh và upload multipart", "sub": []}, {"n": "5.10", "t": "Lỗi thường gặp", "sub": []}], "summary": ["<code>Router&lt;S&gt;<\/code> là router \"còn thiếu state S\"; <code>with_state<\/code> biến nó thành <code>Router&lt;()&gt;<\/code> để serve. State được clone cho mỗi request nên phải rẻ khi clone (<code>Arc<\/code>, pool). <code>FromRef<\/code> cho phép handler và extractor chỉ lấy substate cần thiết.", "<code>State<\/code> kiểm tra lúc biên dịch, dành cho phụ thuộc ứng dụng; <code>Extension<\/code> kiểm tra lúc chạy, dành cho dữ liệu theo request do middleware tạo.", "<code>nest<\/code>, <code>merge<\/code>, <code>nest_service<\/code>, <code>fallback<\/code>, <code>method_not_allowed_fallback<\/code> tổ chức router lớn; <code>layer<\/code> chỉ áp cho route thêm trước nó.", "Extractor tự viết implement <code>FromRequestParts<\/code> (phần đầu) hoặc <code>FromRequest<\/code> (body) bằng async fn native; <code>OptionalFromRequestParts<\/code> hỗ trợ <code>Option&lt;T&gt;<\/code>; <code>RequestExt::extract<\/code> gọi lại extractor có sẵn; <code>#[derive(FromRequestParts)]<\/code> gom nhiều extractor.", "Middleware bằng hàm: <code>from_fn<\/code>, <code>from_fn_with_state<\/code>, <code>map_request<\/code>, <code>map_response<\/code>; xác thực nên dùng <code>route_layer<\/code>.", "tower <code>Layer<\/code> bọc <code>Service<\/code>; <code>poll_ready<\/code> lan truyền backpressure; mẫu <code>mem::replace<\/code> trong <code>call<\/code>. Với <code>Router::layer<\/code>, lớp thêm sau nằm ngoài; với <code>ServiceBuilder<\/code>, lớp thêm trước nằm ngoài. <code>HandleErrorLayer<\/code> chuyển lỗi của middleware tower thành response.", "tower-http cung cấp trace, CORS, nén, timeout, body limit, request id, security header, file tĩnh. CORS do trình duyệt thực thi, không phải hàng rào bảo mật của server.", "WebSocket: <code>WebSocketUpgrade<\/code> + <code>on_upgrade<\/code>, <code>Message::Text(Utf8Bytes)<\/code>, <code>split<\/code> để đọc/ghi song song. SSE: <code>Sse<\/code> với stream <code>Event<\/code>, <code>KeepAlive<\/code>. <code>ServeDir<\/code> phục vụ file tĩnh an toàn; <code>Multipart<\/code> đọc upload, nhớ nới <code>DefaultBodyLimit<\/code>."], "exercises": ["Xây <code>AppState<\/code> gồm <code>config: Arc&lt;Config&gt;<\/code>, <code>http: reqwest::Client<\/code> và <code>counter: Arc&lt;AtomicU64&gt;<\/code>, derive <code>FromRef<\/code>. Viết ba handler, mỗi handler chỉ lấy đúng substate nó cần. Cố ý bỏ <code>FromRef<\/code> và đọc thông báo lỗi.", "Tách ứng dụng thành ba module <code>users<\/code>, <code>tasks<\/code>, <code>health<\/code>, mỗi module có <code>pub fn routes() -&gt; Router&lt;AppState&gt;<\/code>. Ghép bằng <code>nest(\"/api/v1/users\", ...)<\/code> và <code>merge<\/code>. Thêm <code>fallback<\/code> trả JSON <code>{\"error\":\"not_found\",\"path\":...}<\/code>.", "Viết extractor <code>Pagination { page: u32, per_page: u32 }<\/code> implement <code>FromRequestParts<\/code>, đọc từ query, mặc định <code>page=1<\/code>, <code>per_page=20<\/code>, trả 400 dạng JSON nếu <code>per_page &gt; 100<\/code>. Dùng nó trong một handler liệt kê.", "Viết middleware <code>from_fn<\/code> ghi log một dòng cho mỗi request gồm method, path, status, thời gian (ms) và giá trị header <code>x-request-id<\/code>. Gắn cùng <code>SetRequestIdLayer<\/code> sao cho log luôn có request id. Giải thích thứ tự layer bạn chọn bằng sơ đồ củ hành.", "Tự viết một tower <code>Layer<\/code> tên <code>RequireHeaderLayer<\/code> nhận tên header bắt buộc; thiếu header thì trả 400 mà không gọi service bên trong. Gắn bằng <code>route_layer<\/code> và kiểm tra rằng đường dẫn không tồn tại vẫn trả 404.", "Cấu hình <code>CorsLayer<\/code> cho hai origin <code>https://app.example.com<\/code> và <code>http://localhost:5173<\/code>, cho phép credentials, các method GET/POST/PUT/DELETE. Dùng curl gửi preflight từ từng origin và từ một origin lạ, so sánh header trả về.", "Viết chat room WebSocket đơn giản: mọi tin nhắn từ một client được phát tới tất cả client đang kết nối (dùng <code>broadcast<\/code> channel trong <code>State<\/code>, <code>socket.split()<\/code> và hai task đọc/ghi). Thử với hai client.", "(Nâng cao) Viết endpoint upload ảnh nhận multipart, đọc field <code>file<\/code> theo từng chunk bằng <code>field.chunk()<\/code>, ghi ra thư mục tạm bằng <code>tokio::fs<\/code>, từ chối nếu <code>content_type<\/code> không phải <code>image/png<\/code> hoặc <code>image/jpeg<\/code>, hoặc kích thước vượt 5 MB (đếm byte trong lúc đọc). Phục vụ lại ảnh đã upload qua <code>ServeDir<\/code>."]}, {"id": "p3c6", "num": 6, "title": "Serde &amp; JSON chuyên sâu", "intro": "Gần như mọi byte đi vào và đi ra một web API đều phải chuyển đổi giữa dạng văn bản (JSON) và kiểu dữ liệu của chương trình. Trong Rust, công việc này thuộc về <b>serde<\/b> — viết tắt của <i>serialize/deserialize<\/i> — một trong những thư viện được tải nhiều nhất hệ sinh thái. Các chương trước đã dùng <code>#[derive(Serialize, Deserialize)]<\/code> như một câu thần chú; chương này mở chiếc hộp đó ra: serde hoạt động theo kiến trúc nào, các thuộc tính <code>#[serde(...)]<\/code> điều khiển định dạng ra sao, bốn cách biểu diễn enum, khi nào dùng <code>serde_json::Value<\/code>, cách viết (de)serialize tùy biến, xử lý ngày giờ, UUID, <code>null<\/code>, thiết kế DTO cho request/response, và kỹ thuật <code>Option&lt;Option&lt;T&gt;&gt;<\/code> cho PATCH. Tất cả ví dụ chạy thật với serde 1.0.229 và serde_json 1.0.154; output là kết quả thực tế.", "sections": [{"n": "6.1", "t": "Serde hoạt động như thế nào", "sub": ["Kiến trúc hai nửa", "Deserialize hướng theo kiểu đích"]}, {"n": "6.2", "t": "Các thao tác cơ bản với serde_json", "sub": []}, {"n": "6.3", "t": "Thuộc tính <code>#[serde(...)]<\/code>", "sub": ["Bảng thuộc tính hay dùng", "Ví dụ tổng hợp"]}, {"n": "6.4", "t": "Biểu diễn enum", "sub": []}, {"n": "6.5", "t": "<code>serde_json::Value<\/code> và macro <code>json!<\/code>", "sub": []}, {"n": "6.6", "t": "(De)serialize tùy biến", "sub": []}, {"n": "6.7", "t": "Ngày giờ với chrono và UUID", "sub": []}, {"n": "6.8", "t": "<code>Option<\/code>, <code>null<\/code> và trường vắng mặt", "sub": []}, {"n": "6.9", "t": "DTO và PATCH trong một API thật", "sub": ["Vì sao tách DTO khỏi domain model", "Ví dụ đầy đủ"]}, {"n": "6.10", "t": "Hiệu năng và mẹo thực tế", "sub": []}, {"n": "6.11", "t": "Lỗi thường gặp", "sub": []}], "summary": ["Serde tách kiểu dữ liệu (<code>Serialize<\/code>/<code>Deserialize<\/code>) khỏi định dạng (<code>Serializer<\/code>/<code>Deserializer<\/code>) qua một data model chung; derive sinh mã tĩnh, không reflection; deserialize được dẫn dắt bởi kiểu đích.", "serde_json: <code>to_string<\/code>, <code>from_str<\/code>, <code>from_slice<\/code>, <code>to_value<\/code>/<code>from_value<\/code>; lỗi có dòng, cột, phân loại (<code>Syntax<\/code>/<code>Data<\/code>); <code>Map<\/code> mặc định sắp xếp khóa; NaN thành <code>null<\/code>; cẩn thận số nguyên lớn với JavaScript.", "Thuộc tính quan trọng: <code>rename_all<\/code>, <code>rename<\/code>, <code>alias<\/code>, <code>default<\/code>, <code>skip<\/code>, <code>skip_serializing_if<\/code>, <code>flatten<\/code>, <code>deny_unknown_fields<\/code> (không dùng cùng <code>flatten<\/code>), <code>transparent<\/code>, <code>with<\/code>, <code>try_from<\/code>/<code>into<\/code>.", "Bốn cách biểu diễn enum: externally (mặc định), internally (<code>tag<\/code>, phổ biến nhất cho API), adjacently (<code>tag<\/code> + <code>content<\/code>), untagged (linh hoạt nhưng lỗi mơ hồ); <code>#[serde(other)]<\/code> cho tương thích về sau.", "<code>Value<\/code> và <code>json!<\/code> cho JSON động; không dùng thay struct cho dữ liệu có cấu trúc.", "Tùy biến bằng <code>with<\/code> (module), <code>serialize_with<\/code>, Visitor, <code>try_from<\/code> (parse, don't validate), hoặc <code>impl Serialize<\/code> thủ công.", "Thời gian: <code>DateTime&lt;Utc&gt;<\/code> dạng RFC 3339; <code>NaiveDate<\/code> cho ngày thuần; <code>ts_seconds<\/code> cho Unix timestamp. UUID mặc định là chuỗi có gạch.", "<code>Option&lt;T&gt;<\/code> không phân biệt vắng mặt và <code>null<\/code>; <code>Option&lt;Option&lt;T&gt;&gt;<\/code> + <code>default<\/code> + <code>deserialize_with<\/code> cho ba trạng thái của PATCH. Tách DTO khỏi domain model để bảo vệ dữ liệu và ổn định hợp đồng API."], "exercises": ["Định nghĩa struct <code>Order<\/code> với các trường <code>order_id: u64<\/code>, <code>customer_email: String<\/code>, <code>items: Vec&lt;Item&gt;<\/code>, <code>note: Option&lt;String&gt;<\/code>. Serialize ra JSON <code>camelCase<\/code>, bỏ <code>note<\/code> khi <code>None<\/code>, bỏ <code>items<\/code> khi rỗng. Viết test kiểm tra JSON đầu ra bằng <code>assert_eq!<\/code> với <code>serde_json::json!<\/code>.", "Thiết kế enum <code>PaymentEvent<\/code> biểu diễn internally tagged với <code>tag = \"event\"<\/code> gồm <code>Authorized { amount: i64 }<\/code>, <code>Captured { amount: i64, at: DateTime&lt;Utc&gt; }<\/code>, <code>Refunded { reason: String }<\/code> và một variant <code>#[serde(other)] Unknown<\/code>. Viết hàm xử lý webhook nhận chuỗi JSON và in mô tả sự kiện; thử với một sự kiện lạ.", "Viết module <code>percent<\/code> dùng với <code>#[serde(with = \"percent\")]<\/code> để lưu <code>f32<\/code> dạng tỉ lệ (0.125) nhưng trao đổi dưới dạng chuỗi phần trăm (<code>\"12.5%\"<\/code>). Kiểm tra cả chiều đọc lẫn ghi, trả lỗi rõ ràng khi chuỗi không kết thúc bằng <code>%<\/code>.", "Viết newtype <code>PhoneVn(String)<\/code> với <code>#[serde(try_from = \"String\", into = \"String\")]<\/code>, chỉ chấp nhận số bắt đầu bằng <code>0<\/code> hoặc <code>+84<\/code>, có 10 chữ số sau khi chuẩn hóa, lưu ở dạng <code>+84xxxxxxxxx<\/code>. Dùng nó trong một DTO đăng ký.", "Cho JSON từ một API bên thứ ba mà trường <code>price<\/code> lúc là số (<code>12000<\/code>), lúc là chuỗi (<code>\"12000\"<\/code>), lúc là <code>null<\/code>. Viết kiểu <code>Price<\/code> deserialize được cả ba trường hợp (gợi ý: Visitor với <code>visit_u64<\/code>, <code>visit_str<\/code>, <code>visit_unit<\/code>/<code>visit_none<\/code>, hoặc enum untagged).", "Mở rộng ví dụ mục 6.9: thêm trường <code>website: Option&lt;String&gt;<\/code> có thể xóa bằng PATCH <code>null<\/code>, và từ chối <code>{\"displayName\": null}<\/code> bằng status 422 (dùng <code>Option&lt;Option&lt;String&gt;&gt;<\/code> cho <code>display_name<\/code>).", "Viết hàm <code>fn redact(v: &amp;mut serde_json::Value, keys: &amp;[&amp;str])<\/code> duyệt đệ quy một <code>Value<\/code> bất kỳ và thay giá trị của mọi khóa nằm trong <code>keys<\/code> (ví dụ <code>password<\/code>, <code>token<\/code>) bằng chuỗi <code>\"***\"<\/code>. Dùng nó để làm sạch payload trước khi ghi log.", "(Nâng cao) Đo thời gian parse một mảng 100 000 phần tử <code>{\"id\":..,\"name\":..,\"score\":..}<\/code> theo ba cách: vào <code>Vec&lt;Struct&gt;<\/code>, vào <code>serde_json::Value<\/code>, và vào <code>Vec&lt;Struct&lt;'a&gt;&gt;<\/code> mượn <code>&amp;'a str<\/code> (với <code>#[serde(borrow)]<\/code>). Dùng build <code>--release<\/code> và giải thích kết quả."]}, {"id": "p3c7", "num": 7, "title": "Xử lý lỗi &amp; Validation trong API", "intro": "Một API tốt không chỉ trả kết quả đúng khi mọi thứ suôn sẻ, mà còn phải <b>thất bại một cách tử tế<\/b>: status code chính xác, thông báo giúp client sửa request, định dạng thống nhất để frontend xử lý một lần cho mọi endpoint, và tuyệt đối không để lộ câu SQL, đường dẫn file hay stack trace ra ngoài. Đồng thời, phía server phải ghi lại đủ chi tiết để điều tra sự cố. Chương này xây dựng hệ thống xử lý lỗi hoàn chỉnh cho một ứng dụng Axum: kiểu <code>AppError<\/code> dựa trên thiserror, định dạng JSON theo chuẩn RFC 9457 (Problem Details), ánh xạ lỗi của SQLx (không tìm thấy bản ghi, vi phạm ràng buộc unique), dùng anyhow cho lỗi nội bộ, tùy biến rejection của Axum, và validation dữ liệu đầu vào bằng crate validator với extractor <code>ValidatedJson<\/code>. Phần 1, Chương 9 đã trình bày nền tảng <code>Result<\/code>, toán tử <code>?<\/code>, thiserror và anyhow; ở đây ta áp dụng chúng vào bối cảnh web. Mọi ví dụ chạy thật với thiserror 2.0, anyhow 1.0, validator 0.21, sqlx 0.9 và axum 0.8.9.", "sections": [{"n": "7.1", "t": "Nguyên tắc xử lý lỗi trong web API", "sub": ["Hai họ lỗi: client và server", "Mục tiêu thiết kế"]}, {"n": "7.2", "t": "Ôn nhanh thiserror và anyhow", "sub": []}, {"n": "7.3", "t": "Định dạng lỗi thống nhất: RFC 9457 Problem Details", "sub": []}, {"n": "7.4", "t": "Thiết kế <code>AppError<\/code>", "sub": []}, {"n": "7.5", "t": "Ánh xạ lỗi từ SQLx, rejection và validator", "sub": ["Lỗi của SQLx", "Rejection và lỗi validation"]}, {"n": "7.6", "t": "anyhow cho lỗi nội bộ: ghi đủ, nói ít", "sub": []}, {"n": "7.7", "t": "Tùy biến rejection: <code>AppJson<\/code>, <code>AppPath<\/code> và <code>ValidatedJson<\/code>", "sub": []}, {"n": "7.8", "t": "Validation với crate validator", "sub": ["Các luật có sẵn", "Ví dụ đầy đủ", "Ba lớp phòng thủ cho dữ liệu đầu vào"]}, {"n": "7.9", "t": "Ghép lại: API hoàn chỉnh", "sub": []}, {"n": "7.10", "t": "Một số vấn đề nâng cao", "sub": []}, {"n": "7.11", "t": "Lỗi thường gặp", "sub": []}], "summary": ["Phân biệt lỗi client (4xx: thông báo cụ thể, log mức thấp) và lỗi server (5xx: thông báo chung, log <code>error<\/code> đầy đủ); không bao giờ lộ chi tiết nội bộ.", "thiserror cho kiểu lỗi có cấu trúc (<code>AppError<\/code>), anyhow cho lỗi nội bộ có ngữ cảnh; <code>{:#}<\/code> in cả chuỗi nguyên nhân.", "Dùng RFC 9457 Problem Details (<code>type<\/code>, <code>title<\/code>, <code>status<\/code>, <code>detail<\/code>, <code>instance<\/code> + trường mở rộng như <code>errors<\/code>) với <code>Content-Type: application/problem+json<\/code> cho mọi lỗi.", "<code>AppError<\/code> có variant theo ngữ nghĩa HTTP, <code>status()<\/code> tập trung ánh xạ, <code>into_response<\/code> là nơi duy nhất định dạng và log.", "<code>From&lt;sqlx::Error&gt;<\/code>: <code>RowNotFound<\/code> thành 404, <code>UniqueViolation<\/code> (23505) thành 409 dựa vào <code>constraint()<\/code>, <code>ForeignKeyViolation<\/code> (23503), <code>CheckViolation<\/code> (23514), <code>PoolTimedOut<\/code> thành 503, còn lại 500.", "Extractor bọc <code>AppJson<\/code>/<code>AppPath<\/code> (derive với <code>via<\/code> và <code>rejection<\/code>) đưa rejection của Axum về <code>AppError<\/code>; <code>ValidatedJson&lt;T&gt;<\/code> parse rồi validate.", "validator: luật khai báo (<code>length<\/code>, <code>range<\/code>, <code>email<\/code>, <code>url<\/code>, <code>must_match<\/code>, <code>custom<\/code>, <code>nested<\/code>, <code>schema<\/code>), thu thập mọi lỗi cùng lúc; không trả <code>params.value<\/code> ra ngoài. Validation nhiều lớp: kiểu/serde, validator, ràng buộc database."], "exercises": ["Thêm variant <code>Unauthorized<\/code> và <code>Forbidden<\/code> vào <code>AppError<\/code>. Với <code>Unauthorized<\/code>, response phải có header <code>WWW-Authenticate: Bearer<\/code>. Viết handler thử nghiệm và kiểm tra bằng <code>curl -i<\/code>.", "Thêm variant <code>TooManyRequests { retry_after_secs: u64 }<\/code> trả 429 kèm header <code>Retry-After<\/code>. Kết hợp với một <code>Semaphore<\/code> (Chương 3) để từ chối request khi có quá 2 request đồng thời tới một endpoint chậm.", "Viết unit test cho <code>impl From&lt;sqlx::Error&gt; for AppError<\/code> bao phủ các trường hợp: <code>RowNotFound<\/code>, <code>PoolTimedOut<\/code>, unique violation với constraint <code>users_email_key<\/code>, unique violation với constraint khác, foreign key violation (dùng <code>FakePgError<\/code> với mã 23503).", "Mở rộng <code>From&lt;JsonRejection&gt;<\/code>: với <code>JsonDataError<\/code>, trả 422 và đưa lỗi vào <code>errors<\/code> với <code>field<\/code> lấy từ đường dẫn trong thông báo của serde (phần trước dấu <code>:<\/code>), <code>code = \"invalid_type\"<\/code>.", "Định nghĩa DTO <code>CreateProduct<\/code> với <code>name<\/code> (1–100 ký tự), <code>price<\/code> (lớn hơn 0), <code>currency<\/code> (chỉ <code>VND<\/code> hoặc <code>USD<\/code>, dùng <code>custom<\/code>), <code>tags<\/code> (tối đa 10, mỗi tag 1–20 ký tự, dùng <code>nested<\/code> với newtype hoặc <code>custom<\/code> duyệt <code>Vec<\/code>), <code>discount_percent: Option&lt;u8&gt;<\/code> (0–90). Viết endpoint dùng <code>ValidatedJson<\/code> và thử với dữ liệu sai ở mọi trường.", "Viết middleware <code>map_response<\/code> chuyển mọi response 4xx/5xx <b>không<\/b> có <code>content-type: application/problem+json<\/code> (ví dụ 413 từ <code>RequestBodyLimitLayer<\/code>, 408 từ <code>TimeoutLayer<\/code>) thành Problem Details, giữ nguyên status.", "Thêm trường <code>instance<\/code> vào <code>ProblemDetails<\/code> chứa request id: viết middleware gắn <code>RequestId<\/code> vào extensions của response hoặc dùng <code>task_local!<\/code> của Tokio để <code>into_response<\/code> đọc được. So sánh ưu nhược điểm của hai cách.", "(Nâng cao) Tách <code>AppError<\/code> thành hai tầng: <code>DomainError<\/code> (thiserror, không biết gì về HTTP: <code>EmailTaken<\/code>, <code>UserNotFound<\/code>, <code>InvalidTransition<\/code>) ở tầng service, và <code>AppError<\/code> ở tầng HTTP với <code>impl From&lt;DomainError&gt; for AppError<\/code>. Thảo luận vì sao cách tách này giúp tầng domain độc lập với Axum (liên hệ Chương 9)."]}, {"id": "p3c8", "num": 8, "title": "SQLx và PostgreSQL", "intro": "Hầu hết backend đều xoay quanh một cơ sở dữ liệu quan hệ, và với Rust, cặp đôi phổ biến nhất hiện nay là PostgreSQL cùng SQLx. SQLx không phải ORM: bạn viết SQL thật, còn SQLx lo phần kết nối bất đồng bộ, connection pool, ánh xạ kiểu và đặc biệt là khả năng <b>kiểm tra câu SQL ngay lúc biên dịch<\/b> bằng cách hỏi trực tiếp database. Chương này đi từ connection pool, migrations, các hàm truy vấn runtime, macro kiểm tra lúc biên dịch và chế độ offline, đến transaction, truy vấn động, phân trang, xử lý lỗi và các vấn đề hiệu năng như index, EXPLAIN và N+1. Tất cả ví dụ dùng sqlx 0.9 và PostgreSQL 16, đã được chạy thật.", "sections": [{"n": "8.1", "t": "Vì sao chọn SQLx", "sub": ["SQLx so với Diesel và SeaORM", "Khai báo phụ thuộc", "Chuẩn bị PostgreSQL"]}, {"n": "8.2", "t": "Connection pool: PgPool và PgPoolOptions", "sub": ["Vì sao cần pool", "Tạo pool với PgPoolOptions", "Các tham số quan trọng", "Chọn kích thước pool"]}, {"n": "8.3", "t": "Migrations", "sub": ["Cài và dùng sqlx-cli", "Nội dung migration mẫu", "Nhúng migration vào binary với sqlx::migrate!"]}, {"n": "8.4", "t": "Truy vấn lúc runtime: query, query_as, query_scalar", "sub": ["Ba hàm truy vấn và tham số bind", "Các phương thức thực thi", "FromRow và ví dụ đầy đủ", "SqlSafeStr: hàng rào chống SQL injection của sqlx 0.9"]}, {"n": "8.5", "t": "Macro kiểm tra lúc biên dịch", "sub": ["Cơ chế hoạt động", "query!, query_as! và query_scalar!", "Ghi đè suy luận NULL và kiểu", "Chế độ offline: cargo sqlx prepare, thư mục .sqlx và SQLX_OFFLINE", "Khi nào dùng macro, khi nào dùng hàm"]}, {"n": "8.6", "t": "Ánh xạ kiểu PostgreSQL và Rust", "sub": ["Bảng ánh xạ", "NULL và Option", "Enum, JSONB và mảng"]}, {"n": "8.7", "t": "Transaction", "sub": ["begin, commit và rollback tự động", "Isolation level và khóa dòng"]}, {"n": "8.8", "t": "Truy vấn động với QueryBuilder", "sub": ["Bộ lọc tùy chọn", "Bulk insert với push_values"]}, {"n": "8.9", "t": "Phân trang: offset và keyset", "sub": ["So sánh hai cách"]}, {"n": "8.10", "t": "Xử lý lỗi database", "sub": []}, {"n": "8.11", "t": "Hiệu năng: index, EXPLAIN, N+1 và streaming", "sub": ["Đọc kế hoạch thực thi với EXPLAIN", "Vấn đề N+1", "Streaming kết quả lớn"]}], "summary": ["SQLx cho phép viết SQL thật với async, connection pool và kiểm tra kiểu; nó không phải ORM.", "<code>PgPool<\/code> tạo một lần, clone rẻ, đặt trong <code>AppState<\/code>. Kích thước pool nên nhỏ (5–20 mỗi instance), tổng các instance nhỏ hơn giới hạn của server; <code>acquire_timeout<\/code> ngắn để fail fast với 503.", "Migration là file SQL có phiên bản trong Git; <code>sqlx migrate add -r/run/revert/info<\/code> quản lý, <code>sqlx::migrate!<\/code> nhúng vào binary. Không sửa migration đã áp dụng.", "<code>query<\/code>, <code>query_as<\/code> (với <code>FromRow<\/code>), <code>query_scalar<\/code> là API runtime; <code>bind<\/code> với <code>$n<\/code> chống SQL injection. Từ sqlx 0.9, SQL động phải đi qua <code>QueryBuilder<\/code> hoặc được bọc <code>AssertSqlS
