name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Chuẩn bị thư mục _site
        run: |
          mkdir -p _site
          cp index.html _site/
          # Mỗi sổ tay nằm trong một thư mục riêng (r = Rust, g = Go, mq = RabbitMQ, k = Kafka)
          for d in r g mq k; do
            [ -d "$d" ] && cp -r "$d" "_site/$d"
          done
          touch _site/.nojekyll
          echo "Nội dung _site:"
          find _site -maxdepth 2 -type f | sort

      - name: Kiểm tra link nội bộ trong index.html
        run: |
          python3 - <<'EOF'
          import re, sys, urllib.parse, pathlib
          html = pathlib.Path("_site/index.html").read_text(encoding="utf-8")
          missing = []
          for href in re.findall(r'href="([^"#]+)"', html):
              if href.startswith(("http://", "https://", "mailto:")):
                  continue
              path = pathlib.Path("_site") / urllib.parse.unquote(href)
              if not path.exists():
                  missing.append(href)
          if missing:
              print("Thiếu file được liên kết:", *missing, sep="\n  ")
              sys.exit(1)
          print("Tất cả link nội bộ đều tồn tại.")
          EOF

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
