late</code> tự escape chống XSS; <code>c.Stream</code> + <code>c.SSEvent</code> cho Server-Sent Events.", "Thống nhất envelope <code>{success, data, meta, error, request_id}</code> cho toàn bộ API."], "exercises": ["Viết endpoint <code>GET /api/v1/tasks/export</code> trả CSV (dùng <code>encoding/csv</code> ghi vào <code>bytes.Buffer</code>, rồi <code>c.Data</code>) với tên file tải về <code>tasks-YYYY-MM-DD.csv</code>.", "Dùng <code>c.Negotiate</code> để <code>GET /api/v1/stats</code> trả JSON, XML hoặc YAML theo header <code>Accept</code>. Thử bằng <code>curl -H \"Accept: application/xml\"</code>.", "Viết SSE <code>GET /api/v1/clock</code> gửi giờ hiện tại mỗi giây và dừng khi client ngắt kết nối. Kiểm tra bằng <code>curl -N</code>.", "Hoàn thiện gói <code>response</code>: thêm <code>BadRequest</code>, <code>NotFound</code>, <code>Unauthorized</code>, <code>Forbidden</code>, <code>Conflict</code>, <code>Internal</code> với mã lỗi mặc định."]}, {"n": 7, "title": "Middleware trong Gin", "sections": ["7.1. c.Next() và c.Abort()", "7.2. Middleware có sẵn", "7.3. Viết middleware thực tế", "7.4. Truyền dữ liệu giữa middleware và handler", "7.5. Thứ tự middleware hợp lý"], "summary": ["Middleware là <code>gin.HandlerFunc</code>; <code>c.Next()</code> chạy phần còn lại của chuỗi rồi quay lại; <code>c.Abort*()</code> chặn các handler phía sau.", "Code sau <code>c.Next()</code> dùng để log, đo thời gian, thu metrics — nhưng không đặt header được nữa.", "Middleware thực tế: request ID, logger slog, CORS, rate limit, auth, phân quyền.", "Dùng <code>c.Set</code>/<code>c.Get</code> để truyền dữ liệu (user, request ID) xuống handler; gói hằng số key vào một package.", "Thứ tự quan trọng: RequestID → Logger → Recovery → CORS → RateLimit → Auth → Role."], "exercises": ["Viết middleware <code>ResponseTime</code> thêm header <code>X-Response-Time</code> đúng cách: bọc <code>gin.ResponseWriter</code> bằng struct riêng, ghi header trong <code>WriteHeader</code> (gợi ý: embed <code>gin.ResponseWriter</code> và override <code>WriteHeader</code>, <code>Write</code>).", "Viết middleware <code>MaxBodySize(n int64)</code> dùng <code>http.MaxBytesReader</code> cho mọi request.", "Viết middleware <code>RequireJSON</code> trả <code>415 Unsupported Media Type</code> nếu request <code>POST/PUT/PATCH</code> không có <code>Content-Type: application/json</code>.", "Sửa <code>IPRateLimiter</code> để giới hạn theo <strong>user ID</strong> (nếu đã đăng nhập) thay vì IP. Middleware này phải đặt ở vị trí nào trong chuỗi?", "Dùng <code>gin.LoggerWithConfig</code> với <code>SkipPaths: []string{\"/healthz\"}</code> để không log health check."]}, {"n": 8, "title": "Kiến trúc dự án Backend", "sections": ["8.1. Vấn đề của \"mọi thứ trong handler\"", "8.2. Kiến trúc ba tầng", "8.3. Cấu trúc thư mục", "8.4. Interface đặt ở phía người dùng", "8.5. Dependency Injection thủ công", "8.6. Ví dụ hoàn chỉnh trong một file", "8.7. Quản lý cấu hình"], "summary": ["Ba tầng: handler (HTTP) → service (nghiệp vụ) → repository (dữ liệu); phụ thuộc chỉ đi một chiều.", "Tách DTO, input service và model để API, nghiệp vụ và DB thay đổi độc lập; không lộ field nhạy cảm.", "<code>cmd/</code> cho binary, <code>internal/</code> cho code riêng (được compiler bảo vệ), <code>migrations/</code> cho schema.", "Interface nhỏ, đặt ở phía sử dụng; \"accept interfaces, return structs\".", "Dependency injection thủ công trong <code>main</code> (composition root), tránh biến toàn cục.", "Cấu hình qua biến môi trường, kiểm tra ngay khi khởi động (fail fast), gom lỗi bằng <code>errors.Join</code>."], "exercises": ["Tái cấu trúc bài tập \"notes API\" ở chương 2 thành ba tầng trong các package <code>internal/handler</code>, <code>internal/service</code>, <code>internal/repository</code>.", "Thêm quy tắc nghiệp vụ \"mỗi người dùng tối đa 100 note\" vào tầng service. Viết test cho service bằng repository giả.", "Viết một binary thứ hai <code>cmd/importer/main.go</code> đọc file CSV và gọi cùng <code>NoteService</code> để nhập dữ liệu — không sửa dòng nào ở tầng service.", "Dùng thư viện <code>caarlos0/env</code> để đọc <code>Config</code> bằng tag <code>env:\"DATABASE_URL,required\"</code> và so sánh với cách tự viết."]}, {"n": 9, "title": "Làm việc với Database (PostgreSQL)", "sections": ["9.1. Chạy PostgreSQL bằng Docker", "9.2. Các lựa chọn truy cập database trong Go", "9.3. database/sql với driver pgx", "9.4. GORM — ORM phổ biến nhất của Go", "9.5. Migration có version", "9.6. sqlc: SQL thuần nhưng type-safe"], "summary": ["<code>*sql.DB</code> là pool kết nối dùng chung; cấu hình <code>MaxOpenConns</code>, <code>MaxIdleConns</code>, <code>ConnMaxLifetime</code>.", "Luôn dùng placeholder (<code>$1</code>) để chống SQL injection; luôn dùng hàm có <code>Context</code>; luôn <code>rows.Close()</code> và kiểm tra <code>rows.Err()</code>.", "Transaction: <code>BeginTx</code> + <code>defer tx.Rollback()</code> + <code>Commit()</code>; GORM: <code>db.Transaction(func(tx) error)</code>.", "GORM: quy ước tên bảng/cột, soft delete với <code>DeletedAt</code>, <code>TranslateError</code> để nhận <code>ErrDuplicatedKey</code>; cẩn thận zero value khi <code>Updates</code>.", "Tránh N+1 bằng <code>Preload</code>/<code>Joins</code>; cân nhắc cursor pagination cho dữ liệu lớn.", "Production dùng migration có version (<code>golang-migrate</code>), không dựa vào <code>AutoMigrate</code>."], "exercises": ["Viết lại ví dụ chuyển tiền bằng GORM <code>db.Transaction</code>, dùng <code>clause.Locking{Strength: \"UPDATE\"}</code> để khoá hai dòng tài khoản trước khi cập nhật. Vì sao nên khoá theo thứ tự id tăng dần?", "Thêm bảng <code>projects</code> (một project có nhiều task). Viết migration up/down, model GORM và truy vấn \"danh sách project kèm số task chưa xong\" bằng một câu SQL <code>GROUP BY</code>.", "Bật <code>logger.Info</code>, viết một đoạn code cố tình gây N+1 với 10 user, đếm số câu SQL; sau đó sửa bằng <code>Preload</code> và đếm lại.", "Cài đặt API <code>GET /api/v1/tasks?cursor=...&amp;size=20</code> dùng cursor pagination, trả về <code>next_cursor</code> trong <code>meta</code>.", "Tìm hiểu <code>EXPLAIN ANALYZE</code> của PostgreSQL: chạy với truy vấn <code>WHERE user_id = ? ORDER BY created_at DESC LIMIT 20</code> trước và sau khi tạo index <code>(user_id, created_at DESC)</code>."]}, {"n": 10, "title": "Xác thực & Phân quyền", "sections": ["10.1. Lưu mật khẩu: băm bằng bcrypt", "10.2. Session hay Token?", "10.3. Cấu trúc JWT", "10.4. Phát hành và kiểm tra JWT với golang-jwt/jwt/v5", "10.5. Access token + Refresh token", "10.6. Đăng nhập an toàn", "10.7. Middleware xác thực và lấy user hiện tại", "10.8. Phân quyền", "10.9. Đăng xuất và thu hồi token", "10.10. Cookie HttpOnly hay header Authorization?", "10.11. Checklist bảo mật xác thực"], "summary": ["Authentication (401) ≠ authorization (403/404).", "bcrypt: băm chậm có salt, lưu một chuỗi 60 ký tự; giới hạn 72 byte.", "JWT = header.payload.signature; payload ai cũng đọc được; chữ ký chống sửa đổi.", "<code>golang-jwt/jwt/v5</code>: <code>NewWithClaims</code> + <code>SignedString</code>; <code>ParseWithClaims</code> + <code>WithValidMethods</code>, <code>WithIssuer</code>, <code>WithExpirationRequired</code>.", "Access token ngắn + refresh token dài; phân biệt bằng claim <code>typ</code>.", "RBAC bằng middleware <code>RequireRole</code>; chống IDOR bằng cách luôn lọc theo <code>user_id</code>.", "Thu hồi token: TTL ngắn, lưu/rotate refresh token, blacklist bằng Redis, token version."], "exercises": ["Thêm endpoint <code>POST /api/v1/me/password</code> đổi mật khẩu: yêu cầu mật khẩu cũ, băm mật khẩu mới, và vô hiệu mọi refresh token cũ bằng cột <code>token_version</code>.", "Cài đặt refresh token rotation: lưu bảng <code>refresh_tokens(jti, user_id, expires_at, revoked_at)</code>; mỗi lần refresh thu hồi token cũ, cấp token mới; nếu một token đã thu hồi bị dùng lại, thu hồi toàn bộ token của user đó.", "Chuyển từ HS256 sang EdDSA: sinh cặp khoá bằng <code>crypto/ed25519</code>, ký bằng private key, kiểm tra bằng public key. Cập nhật <code>WithValidMethods</code>.", "Viết middleware <code>RequirePermission(\"task:delete\")</code> với bảng ánh xạ vai trò → quyền đọc từ cấu hình.", "Viết test chứng minh user A không đọc/sửa/xoá được task của user B (kỳ vọng <code>404</code>)."]}, {"n": 11, "title": "Xử lý lỗi tập trung & Logging", "sections": ["11.1. Lỗi đi qua các tầng như thế nào?", "11.2. Kiểu lỗi nghiệp vụ apperr.Error", "11.3. Middleware xử lý lỗi tập trung", "11.4. Logging có cấu trúc với log/slog", "11.5. Panic và recovery"], "summary": ["Repository chuyển lỗi DB → lỗi chung; service chuyển → <code>apperr.Error</code> có Kind/Code/Message; handler chỉ <code>c.Error(err)</code>.", "Một middleware <code>ErrorHandler</code> duy nhất ánh xạ lỗi → status + envelope; log chi tiết lỗi 5xx, che chi tiết với client.", "<code>errors.AsType[T]</code> (Go 1.26+) gọn hơn <code>errors.As</code>.", "<code>log/slog</code>: log có cấu trúc, JSON cho production, <code>With</code> để gắn ngữ cảnh, <code>LogValuer</code>/<code>ReplaceAttr</code> để che dữ liệu nhạy cảm.", "Gắn logger có <code>request_id</code> vào context để mọi tầng log cùng mã truy vết.", "Recovery bắt panic trong handler; goroutine tự tạo phải tự <code>recover</code>."], "exercises": ["Thêm <code>KindTooManyRequests</code> (429) và <code>KindUnavailable</code> (503) vào <code>apperr</code>, cập nhật <code>HTTPStatus</code> và viết test bảng cho hàm ánh xạ.", "Viết <code>ReplaceAttr</code> che mọi thuộc tính có khoá chứa <code>password</code>, <code>token</code>, <code>secret</code> (không phân biệt hoa thường).", "Thêm endpoint quản trị <code>PUT /internal/log-level</code> đổi mức log lúc chạy bằng <code>slog.LevelVar</code> (nhớ bảo vệ endpoint).", "Viết helper <code>safeGo(log *slog.Logger, fn func())</code> chạy <code>fn</code> trong goroutine có <code>recover</code> và log stack trace bằng <code>runtime/debug.Stack()</code>."]}, {"n": 12, "title": "Context, Timeout & Graceful Shutdown", "sections": ["12.1. context.Context trong một request", "12.2. Timeout middleware", "12.3. Công việc nền sau khi trả response", "12.4. Graceful shutdown cho Gin"], "summary": ["Truyền <code>c.Request.Context()</code> (không phải <code>c</code>) xuống service/repository; context là tham số đầu tiên.", "Timeout middleware: <code>context.WithTimeout</code> + <code>c.Request.WithContext</code>; chỉ hiệu quả khi mọi tầng tôn trọng context.", "Việc nền sau response: <code>context.WithoutCancel</code>, sao chép dữ liệu, có <code>recover</code>; việc quan trọng thì dùng hàng đợi bền vững.", "Graceful shutdown: <code>http.Server{Handler: r}</code> + <code>signal.NotifyContext</code> + <code>srv.Shutdown(ctx)</code>; đóng tài nguyên theo thứ tự từ ngoài vào trong.", "<code>errgroup</code> để chạy và dừng đồng bộ nhiều thành phần."], "exercises": ["Thêm timeout riêng cho từng nhóm route: API thường 5 giây, API xuất báo cáo 60 giây.", "Viết client gọi một API bên ngoài với <code>http.NewRequestWithContext</code> và timeout 2 giây; giả lập API chậm bằng <code>httptest.NewServer</code> để kiểm chứng.", "Cài đặt bước 1 của quy trình tắt: biến <code>atomic.Bool</code> \"shuttingDown\", <code>/readyz</code> trả 503 khi biến bật; bật nó ngay khi nhận SIGTERM rồi chờ 5 giây trước khi <code>Shutdown</code>.", "Dùng <code>errgroup</code> chạy song song server API (:8080) và server metrics (:9090); bảo đảm Ctrl+C tắt êm cả hai."]}, {"n": 13, "title": "Kiểm thử API", "sections": ["13.1. Kim tự tháp kiểm thử", "13.2. Nhắc lại công cụ testing của Go", "13.3. Test handler với httptest và service giả", "13.4. Test middleware riêng lẻ", "13.5. Test tầng service với repository trong bộ nhớ", "13.6. Mock sinh tự động và testify", "13.7. Integration test với PostgreSQL thật", "13.8. Coverage, race detector và benchmark", "13.9. Kiểm thử thủ công và tự động hoá API"], "summary": ["Nhiều unit test nhanh (service, handler, middleware) + ít integration test (repository với DB thật) + rất ít E2E.", "Handler test: dựng router thật với <code>gin.TestMode</code>, service giả qua interface, <code>httptest.NewRecorder</code>; kiểm tra status và mã lỗi.", "Service test: repository trong bộ nhớ, tiêm thời gian (<code>now func() time.Time</code>) để test tất định.", "Integration test với testcontainers và build tag <code>integration</code>.", "<code>-cover</code>, <code>-race</code>, <code>-bench</code> với <code>b.Loop()</code>; coverage là chỉ số tham khảo, không phải mục tiêu."], "exercises": ["Viết test cho <code>AuthHandler</code>: đăng ký thành công (201), email trùng (409), mật khẩu ngắn (422), đăng nhập sai (401). Dùng fake <code>AuthService</code>.", "Viết test cho <code>TaskService.Update</code> bao phủ: đổi title, xoá hạn chót (<code>ClearDueAt</code>), task không tồn tại, chuyển <code>done → doing</code> (được phép).", "Viết test cho middleware <code>CORS</code>: origin được phép nhận header <code>Access-Control-Allow-Origin</code>, origin lạ thì không; preflight <code>OPTIONS</code> trả 204.", "Viết integration test cho <code>taskGorm.Update</code> bảo đảm user B không cập nhật được task của user A (<code>ErrNotFound</code>).", "Chạy <code>go test -race ./...</code> và cố ý tạo một data race (ví dụ bỏ <code>mu.Lock()</code> trong <code>RateLimiter.allow</code>) để xem báo cáo của race detector."]}, {"n": 14, "title": "Hiệu năng & Bảo mật", "sections": ["14.1. Đo trước, tối ưu sau", "14.2. Cache với Redis", "14.3. Rate limit phân tán với Redis", "14.4. Nén response với gzip", "14.5. Profiling với pprof", "14.6. Load test", "14.7. Mẹo hiệu năng riêng cho Go &amp; Gin", "14.8. Bảo mật API theo OWASP"], "summary": ["Đo trước khi tối ưu: index và N+1 thường quan trọng hơn mọi tối ưu code.", "Cache-aside với Redis: đọc cache → miss thì đọc DB và ghi cache có TTL → xoá cache khi cập nhật; dùng <code>singleflight</code> chống cache stampede.", "Rate limit phân tán bằng Redis (<code>INCR</code> + <code>EXPIRE</code> trong pipeline); cân nhắc \"fail open\" khi Redis lỗi.", "gzip cho JSON lớn; pprof cho CPU/heap/goroutine; load test với hey/k6, theo dõi p95/p99.", "Bảo mật theo OWASP API Top 10: chống IDOR, mass assignment, SQL injection; security headers; HTTPS; quản lý secret; <code>govulncheck</code>."], "exercises": ["Thêm cache cho <code>GET /api/v1/me</code> với key <code>user:&lt;id&gt;</code>, TTL 10 phút, xoá cache khi user đổi tên. Đo độ trễ trước/sau bằng <code>hey</code>.", "Cài đặt sliding window log rate limiter bằng Redis sorted set (<code>ZADD</code>, <code>ZREMRANGEBYSCORE</code>, <code>ZCARD</code>) và so sánh với fixed window ở ranh giới khung thời gian.", "Bật pprof, chạy load test 1 phút và tìm 3 hàm tốn CPU nhất trong flame graph.", "Viết test cho middleware <code>SecurityHeaders</code> kiểm tra đủ các header; thêm HSTS chỉ khi request là HTTPS.", "Chạy <code>govulncheck ./...</code> cho dự án mẫu và giải thích kết quả."]}, {"n": 15, "title": "Tài liệu API & Tính năng nâng cao", "sections": ["15.1. Tài liệu API với Swagger / OpenAPI", "15.2. WebSocket: giao tiếp hai chiều thời gian thực", "15.3. Công việc nền (background jobs)", "15.4. Tác vụ định kỳ (cron)", "15.5. Lưu file lên object storage (S3)", "15.6. REST hay gRPC?"], "summary": ["Tài liệu API: OpenAPI; code-first với swaggo (<code>swag init</code>, <code>gin-swagger</code>) hoặc spec-first với oapi-codegen.", "WebSocket với <code>gorilla/websocket</code>: <code>Upgrader</code>, vòng đọc mỗi kết nối, hub phát tin; nhớ <code>CheckOrigin</code>, xác thực, ping/pong.", "Công việc nền: worker pool với channel cho việc nhẹ; hàng đợi bền vững (asynq, River, broker) cho việc quan trọng; outbox pattern.", "Cron: ticker hoặc <code>robfig/cron</code>; cẩn thận chạy trùng khi nhiều instance.", "File: presigned URL để client upload thẳng lên S3.", "REST cho bên ngoài, gRPC cho nội bộ giữa các service."], "exercises": ["Thêm chú thích swaggo cho mọi handler của dự án mẫu, sinh tài liệu và mở Swagger UI. Thử gọi API có xác thực ngay trên giao diện.", "Mở rộng ví dụ WebSocket: thêm ping/pong mỗi 30 giây, <code>SetReadDeadline</code>, và mỗi client có goroutine ghi riêng đọc từ channel đệm 16 tin.", "Dùng worker pool để gửi \"email chào mừng\" (giả lập bằng <code>time.Sleep</code> + log) sau khi đăng ký; bảo đảm graceful shutdown chờ hết job.", "Viết job dọn dẹp chạy mỗi giờ, xoá hẳn (hard delete) task đã soft delete quá 30 ngày; dùng PostgreSQL advisory lock (<code>pg_try_advisory_lock</code>) để chỉ một instance chạy.", "Cài MinIO bằng Docker, viết endpoint cấp presigned URL và upload thử bằng <code>curl -X PUT --upload-file</code>."]}, {"n": 16, "title": "Đóng gói & Triển khai", "sections": ["16.1. Build binary cho production", "16.2. Docker multi-stage", "16.3. Docker Compose cho môi trường đầy đủ", "16.4. Makefile — gom các lệnh hay dùng", "16.5. Health check: liveness và readiness", "16.6. Metrics với Prometheus", "16.7. CI với GitHub Actions", "16.8. Các phương án triển khai", "16.9. Triển khai không gián đoạn và migration"], "summary": ["Build: <code>CGO_ENABLED=0</code>, <code>-trimpath</code>, <code>-ldflags=\"-s -w\"</code>, biên dịch chéo bằng <code>GOOS/GOARCH</code>.", "Docker multi-stage: build bằng <code>golang</code>, chạy bằng distroless nonroot (~2 MB + binary); không đưa secret vào image.", "Docker Compose: db (healthcheck) → migrate → api.", "<code>/healthz</code> (liveness, không kiểm tra DB) và <code>/readyz</code> (readiness, có kiểm tra DB).", "Prometheus: counter + histogram theo <code>c.FullPath()</code>; quan sát đủ logs, metrics, traces.", "CI: vet, lint, test với Postgres thật, govulncheck, build &amp; push image.", "Triển khai: VPS + systemd + Nginx, PaaS hoặc Kubernetes; rolling update + migration tương thích ngược."], "exercises": ["Thêm endpoint <code>GET /version</code> trả về version (gán bằng <code>-ldflags -X</code>) và commit lấy từ <code>debug.ReadBuildInfo()</code>.", "Viết <code>.dockerignore</code>, build image dự án mẫu và so sánh kích thước khi dùng <code>alpine</code> và <code>distroless</code> làm image runtime.", "Thêm middleware <code>Metrics</code> vào dự án mẫu, chạy Prometheus + Grafana bằng Docker Compose và dựng dashboard RPS, tỉ lệ lỗi, p95 theo route.", "Viết workflow GitHub Actions cho dự án của bạn; cố ý làm hỏng một test để thấy pull request bị chặn.", "Viết manifest Kubernetes <code>Service</code> và <code>Ingress</code> cho Deployment ở trên; thử rolling update bằng <code>kubectl set image</code> trong khi chạy <code>hey</code> và xác nhận không có request lỗi."]}, {"n": 17, "title": "Dự án hoàn chỉnh: Task Manager REST API", "sections": ["17.1. Tổng quan", "17.2. Cấu trúc thư mục", "17.3. Chạy dự án", "17.4. go.mod", "17.5. Cấu hình", "17.6. Model", "17.7. Lỗi nghiệp vụ", "17.8. JWT", "17.9. Repository", "17.10. Service", "17.11. Response envelope", "17.12. Middleware", "17.13. Handler", "17.14. Database", "17.15. Điểm vào: cmd/api/main.go", "17.16. Chạy thử đầu–cuối", "17.17. Hướng mở rộng"], "summary": ["Dự án mẫu áp dụng kiến trúc ba tầng với interface ở phía sử dụng và dependency injection thủ công trong <code>main</code>.", "Lỗi đi theo một đường duy nhất: repository → <code>apperr</code> ở service → <code>c.Error</code> ở handler → <code>ErrorHandler</code> middleware → envelope JSON.", "Bảo mật được xử lý ở nhiều lớp: validation, DTO, lọc theo <code>user_id</code>, whitelist cột sắp xếp, escape <code>LIKE</code>, bcrypt, JWT chặt chẽ, CHECK constraint ở DB.", "Vận hành: request ID, slog, health/readiness, timeout của <code>http.Server</code>, graceful shutdown, Docker multi-stage, migration có version."], "exercises": ["Thêm trường <code>tags</code> cho task (many-to-many) cùng bộ lọc <code>?tag=go&amp;tag=gin</code>; viết migration <code>000002</code>.", "Cài đặt nhóm route admin: <code>GET /api/v1/admin/users</code> (phân trang) và <code>PATCH /api/v1/admin/users/:id/role</code>. Viết test bảo đảm user thường nhận <code>403</code>.", "Thêm endpoint <code>POST /api/v1/auth/logout</code> thu hồi refresh token (bảng <code>refresh_tokens</code> hoặc Redis).", "Viết integration test cho <code>taskGorm</code> bằng testcontainers (chương 13) và chạy trong GitHub Actions (chương 16).", "Thêm middleware Prometheus và dựng dashboard Grafana cho dự án; đặt cảnh báo khi tỉ lệ lỗi 5xx &gt; 1% trong 5 phút.", "Triển khai dự án lên một VPS hoặc dịch vụ PaaS với HTTPS, và chia sẻ link API cho bạn bè thử nghiệm."]}]}];

let state = {};
function load() { if (!PERSIST) return; try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; } }
function save() { if (!PERSIST) return; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
load();

const ids = (p, c) => [...c.sections.map((_, i) => `${p.id}-c${c.n}-s${i}`), ...c.exercises.map((_, i) => `${p.id}-c${c.n}-e${i}`)];
const count = list => ({ done: list.filter(id => state[id]).length, total: list.length });
const partIds = p => p.chapters.flatMap(c => ids(p, c));
const allIds = () => DATA.flatMap(partIds);
const pct = ({ done, total }) => total ? Math.round(done * 100 / total) : 0;
const setBar = (el, c) => { el.querySelector('i').style.width = pct(c) + '%'; el.classList.toggle('full', c.total > 0 && c.done === c.total); };
const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

function updateOverall() {
  const c = count(allIds());
  setBar(document.getElementById('ovBar'), c);
  document.getElementById('ovTxt').textContent = `${c.done}/${c.total}`;
}

let filter = { q: '', hideDone: false };

function highlight(html, q) {
  if (!q) return html;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return html.split(/(<[^>]+>)/).map(seg => seg.startsWith('<') ? seg : seg.replace(re, '<mark>$1</mark>')).join('');
}
const plain = h => h.replace(/<[^>]+>/g, '').toLowerCase();

function renderPart(p) {
  const app = document.getElementById('app');
  const idx = DATA.indexOf(p) + 1;
  const firstOpen = p.chapters.find(c => { const k = count(ids(p, c)); return k.done < k.total; });
  app.innerHTML = `
  <div class="part-head">
    <div><div class="eyebrow">Phần ${idx} / 3 · ${p.chapters.length} chương</div>
    <h1 class="view-title">${esc(p.name)}</h1></div>
    <div class="part-stats"><div class="bar" id="pBar"><i></i></div><span id="pTxt"></span></div>
    <div class="toolbar">
      <label for="q" style="position:absolute;left:-9999px">Tìm trong phần này</label>
      <input type="search" id="q" placeholder="Tìm: slice, context, JWT, Dijkstra…" value="${esc(filter.q)}">
      <button class="btn" id="hideDone" aria-pressed="${filter.hideDone}">Ẩn mục đã xong</button>
      <button class="btn" id="openAll">Mở tất cả</button>
      <button class="btn" id="closeAll">Thu gọn</button>
    </div>
  </div>
  <div class="layout">
    <aside class="toc" aria-label="Danh sách chương">${p.chapters.map(c => `
      <a href="#${p.id}" data-jump="${p.id}-c${c.n}" id="toc-${p.id}-c${c.n}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="f"></span></a>`).join('')}
    </aside>
    <div class="chapters ${filter.hideDone ? 'hide-done' : ''}" id="chs"></div>
  </div>`;
  const chs = document.getElementById('chs');
  const q = filter.q.trim().toLowerCase();
  let shown = 0;
  p.chapters.forEach(c => {
    const hay = plain([c.title, ...c.sections, ...c.summary, ...c.exercises].join(' '));
    if (q && !hay.includes(q)) return;
    shown++;
    const open = q ? true : (c === firstOpen);
    const sec = c.sections.map((s, i) => item(`${p.id}-c${c.n}-s${i}`, s, false, q)).join('');
    const ex = c.exercises.map((s, i) => item(`${p.id}-c${c.n}-e${i}`, s, i + 1, q)).join('');
    const d = document.createElement('details');
    d.className = 'ch'; d.id = `${p.id}-c${c.n}`; d.open = open;
    d.innerHTML = `
      <summary><span class="chnum">Chương ${c.n}</span><span class="chtitle">${highlight(esc(c.title), q)}</span>
        <span class="chmeta"><span class="bar"><i></i></span><span class="frac"></span><span class="chev" aria-hidden="true">›</span></span></summary>
      <div class="chbody">
        <div class="col"><h3>Kiến thức cốt lõi</h3><ul class="know">${c.summary.map(s => `<li>${highlight(s, q)}</li>`).join('')}</ul></div>
        <div class="col">
          <h3><span>Cần nắm</span><button class="linkbtn" data-all="${p.id}-c${c.n}">Đánh dấu cả chương</button></h3>
          <ul class="checks">${sec}</ul>
          <h3 class="sp"><span>Bài tập thực hành</span></h3>
          <ul class="checks">${ex}</ul>
        </div>
      </div>`;
    chs.appendChild(d);
  });
  if (!shown) chs.innerHTML = `<div class="empty">Không có chương nào chứa “${esc(filter.q)}”. Thử từ khoá khác, ví dụ <code>goroutine</code> hoặc <code>middleware</code>.</div>`;
  refreshPart(p);

  document.getElementById('q').addEventListener('input', e => {
    filter.q = e.target.value; const pos = e.target.selectionStart;
    renderPart(p); const inp = document.getElementById('q'); inp.focus(); inp.setSelectionRange(pos, pos);
  });
  document.getElementById('hideDone').onclick = () => { filter.hideDone = !filter.hideDone; renderPart(p); };
  document.getElementById('openAll').onclick = () => chs.querySelectorAll('details').forEach(d => d.open = true);
  document.getElementById('closeAll').onclick = () => chs.querySelectorAll('details').forEach(d => d.open = false);
  app.querySelectorAll('[data-jump]').forEach(a => a.onclick = e => {
    e.preventDefault(); const t = document.getElementById(a.dataset.jump);
    if (t) { t.open = true; t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  chs.addEventListener('change', e => {
    if (e.target.matches('input[type=checkbox]')) {
      const id = e.target.dataset.id;
      if (e.target.checked) state[id] = 1; else delete state[id];
      e.target.closest('li').classList.toggle('is-done', e.target.checked);
      save(); refreshPart(p);
    }
  });
  chs.addEventListener('click', e => {
    const b = e.target.closest('[data-all]'); if (!b) return;
    e.preventDefault();
    const c = p.chapters.find(x => `${p.id}-c${x.n}` === b.dataset.all);
    const list = ids(p, c); const allDone = list.every(id => state[id]);
    list.forEach(id => { if (allDone) delete state[id]; else state[id] = 1; });
    save(); renderPart(p); const t = document.getElementById(b.dataset.all); if (t) t.open = true;
  });
}

function item(id, html, exNo, q) {
  const on = !!state[id];
  return `<li class="${on ? 'is-done' : ''}"><label><input type="checkbox" id="cb-${id}" data-id="${id}" ${on ? 'checked' : ''}><span>${exNo ? `<span class="ex-tag">BT${exNo}</span>` : ''}${highlight(html, q)}</span></label></li>`;
}

function refreshPart(p) {
  const c = count(partIds(p));
  setBar(document.getElementById('pBar'), c);
  document.getElementById('pTxt').textContent = `${c.done}/${c.total} mục · ${pct(c)}%`;
  p.chapters.forEach(ch => {
    const k = count(ids(p, ch)); const complete = k.done === k.total;
    const d = document.getElementById(`${p.id}-c${ch.n}`);
    if (d) { setBar(d.querySelector('.chmeta .bar'), k); d.querySelector('.frac').textContent = `${k.done}/${k.total}`; d.classList.toggle('complete', complete); }
    const t = document.getElementById(`toc-${p.id}-c${ch.n}`);
    if (t) { t.querySelector('.f').textContent = complete ? '✓' : `${k.done}/${k.total}`; t.classList.toggle('complete', complete); }
    const b = d && d.querySelector('[data-all]'); if (b) b.textContent = complete ? 'Bỏ đánh dấu chương' : 'Đánh dấu cả chương';
  });
  updateOverall();
}

function renderRoadmap() {
  const app = document.getElementById('app');
  const partCards = DATA.map((p, i) => { const c = count(partIds(p)); return `
    <a class="psum" href="#${p.id}"><span class="k">Phần ${i + 1}</span><span class="nm">${esc(p.name)}</span>
      <div class="bar ${c.done === c.total ? 'full' : ''}"><i style="width:${pct(c)}%"></i></div>
      <span class="num">${c.done}/${c.total} mục · ${p.chapters.length} chương</span></a>`; }).join('');
  const weeks = WEEKS.map((w, i) => {
    const p = DATA.find(x => x.id === w.p);
    const list = w.ch.flatMap(n => ids(p, p.chapters.find(c => c.n === n)));
    const c = count(list); const done = c.done === c.total;
    const rng = w.ch.length > 1 ? `${w.ch[0]}–${w.ch[w.ch.length - 1]}` : w.ch[0];
    return `<li class="${done ? 'wdone' : ''}"><span class="wk">Tuần ${i + 1}</span>
      <div><div class="wk-t">${esc(w.t)}</div><div class="wk-d">Phần ${w.p.slice(1)}, chương ${rng} · ${esc(w.d)}</div></div>
      <div class="wk-p"><div class="bar ${done ? 'full' : ''}"><i style="width:${pct(c)}%"></i></div><span>${done ? 'Xong' : pct(c) + '%'}</span></div></li>`;
  }).join('');
  app.innerHTML = `
    <div class="eyebrow">Sổ tay học · 3 phần · ${DATA.reduce((a, p) => a + p.chapters.length, 0)} chương</div>
    <h1 class="view-title">Từ cú pháp Go đến REST API với Gin</h1>
    <p class="lede">Mỗi chương có phần kiến thức cốt lõi rút từ mục “Tóm tắt chương” của tài liệu, danh sách mục cần nắm theo đúng số mục trong file Word và bài tập cuối chương. Đánh dấu khi bạn đã hiểu và tự viết lại được code của mục đó.</p>
    <div class="parts-sum">${partCards}</div>
    <h2 class="sec">Lộ trình 12 tuần</h2>
    <ol class="weeks">${weeks}</ol>
    <h2 class="sec">Sao lưu tiến độ</h2>
    <div class="backup">
      <div class="card"><p>${PERSIST ? 'Tiến độ được lưu trong trình duyệt này. Sao chép mã dưới đây để chuyển sang máy khác.' : 'Bản file này không tự lưu. Trước khi đóng trang, sao chép mã tiến độ và dán lại ở lần mở sau.'}</p>
        <textarea id="exportBox" readonly aria-label="Mã tiến độ"></textarea>
        <div class="row"><button class="btn" id="copyBtn">Sao chép mã</button><span class="status" id="copySt"></span></div></div>
      <div class="card"><p>Dán mã tiến độ đã sao chép rồi bấm Khôi phục. Tiến độ hiện tại sẽ được thay thế.</p>
        <textarea id="importBox" aria-label="Dán mã tiến độ"></textarea>
        <div class="row"><button class="btn" id="importBtn">Khôi phục</button><button class="btn" id="resetBtn">Xoá toàn bộ tiến độ</button><span class="status" id="impSt"></span></div></div>
    </div>`;
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(Object.keys(state)))));
  const box = document.getElementById('exportBox'); box.value = code;
  document.getElementById('copyBtn').onclick = () => {
    const st = document.getElementById('copySt');
    const fallback = () => { box.focus(); box.select(); st.textContent = 'Đã chọn mã, nhấn Ctrl+C để sao chép.'; };
    try { navigator.clipboard.writeText(code).then(() => st.textContent = 'Đã sao chép.', fallback); } catch (e) { fallback(); }
  };
  document.getElementById('importBtn').onclick = () => {
    const st = document.getElementById('impSt'); st.classList.remove('err');
    try {
      const arr = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('importBox').value.trim()))));
      if (!Array.isArray(arr)) throw 0;
      const valid = new Set(allIds()); state = {}; arr.forEach(id => { if (valid.has(id)) state[id] = 1; });
      save(); updateOverall(); renderRoadmap(); document.getElementById('impSt').textContent = `Đã khôi phục ${Object.keys(state).length} mục.`;
    } catch (e) { st.classList.add('err'); st.textContent = 'Mã không hợp lệ. Hãy dán đúng toàn bộ mã đã sao chép.'; }
  };
  let armed = false;
  document.getElementById('resetBtn').onclick = e => {
    const st = document.getElementById('impSt');
    if (!armed) { armed = true; e.target.textContent = 'Bấm lần nữa để xoá'; st.classList.add('err'); st.textContent = 'Thao tác này không hoàn tác được.'; return; }
    state = {}; save(); updateOverall(); renderRoadmap(); document.getElementById('impSt').textContent = 'Đã xoá tiến độ.';
  };
  updateOverall();
}

function route() {
  const v = (location.hash || '#lo-trinh').slice(1);
  const p = DATA.find(x => x.id === v);
  document.querySelectorAll('nav.tabs a').forEach(a => a.toggleAttribute('aria-current', false));
  const tab = document.querySelector(`nav.tabs a[data-v="${p ? v : 'lo-trinh'}"]`);
  if (tab) tab.setAttribute('aria-current', 'page');
  if (p) { filter.q = ''; renderPart(p); } else renderRoadmap();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>

</body>
</html>
