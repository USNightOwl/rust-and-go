<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ tay học Go & Gin</title>
<style>body{margin:0}[hidden]{display:none!important}.home-link{display:inline-flex;align-items:center;gap:4px;font:600 13px/1 system-ui,sans-serif;color:inherit;opacity:.7;text-decoration:none;padding:6px 10px;border:1px solid currentColor;border-radius:999px;white-space:nowrap;align-self:center}.home-link:hover{opacity:1}
</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sổ tay học — header dính với tiến độ tổng, mỗi Phần là mục lục chương bên trái + thẻ chương (kiến thức | checklist) bên phải */
:root {
  --bg: #F3F7F9; --surface: #FFFFFF; --sunk: #E9F0F3; --ink: #13222A; --muted: #56676F;
  --line: #D5E0E5; --accent: #00728F; --gopher: #00ADD8; --done: #23845A; --done-soft: #DDF1E6;
  --code-bg: #E4EEF2; --code-ink: #0B5A70; --warn: #B4531A;
  --f-display: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D161B; --surface: #142128; --sunk: #0F1B21; --ink: #E2EBEE; --muted: #93A5AD;
  --line: #24373F; --accent: #4CC9EA; --gopher: #2FB9DE; --done: #5BC68D; --done-soft: #173A2A;
  --code-bg: #1B2E37; --code-ink: #8FDDF2; --warn: #F0A06A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D161B; --surface: #142128; --sunk: #0F1B21; --ink: #E2EBEE; --muted: #93A5AD;
  --line: #24373F; --accent: #4CC9EA; --gopher: #2FB9DE; --done: #5BC68D; --done-soft: #173A2A;
  --code-bg: #1B2E37; --code-ink: #8FDDF2; --warn: #F0A06A; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
code { font: 0.86em var(--f-mono); background: var(--code-bg); color: var(--code-ink); padding: 0.08em 0.35em; border-radius: 4px; overflow-wrap: anywhere }
button, input, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0 }
.brand b { font: 800 1.2rem/1 var(--f-display); letter-spacing: -0.01em }
.brand b span { color: var(--gopher) }
.brand small { font: 400 0.75rem var(--f-mono); color: var(--muted); white-space: nowrap }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap }
nav.tabs a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.9rem; padding: 6px 12px; border-radius: 999px; border: 1px solid transparent }
nav.tabs a:hover { color: var(--ink); border-color: var(--line) }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--surface) }
.overall { display: flex; align-items: center; gap: 10px; font: 600 0.8rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; flex: 1 }
.bar i { display: block; height: 100%; width: 0; background: var(--gopher); border-radius: 99px; transition: width .3s }
.bar.full i { background: var(--done) }
.overall .bar { width: 120px; flex: none }

main { padding-block: 28px 64px }
h1.view-title { font: 800 clamp(1.6rem, 3.6vw, 2.4rem)/1.15 var(--f-display); letter-spacing: -0.02em; margin: 0 0 6px; text-wrap: balance }
.eyebrow { font: 600 0.72rem var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent) }
.lede { color: var(--muted); max-width: 68ch; margin: 0 0 22px }

/* part view */
.part-head { display: grid; gap: 14px; margin-bottom: 22px }
.part-stats { display: flex; align-items: center; gap: 14px; font: 600 0.85rem var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted) }
.part-stats .bar { height: 8px; max-width: 420px }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.toolbar input[type=search] { flex: 1 1 220px; min-width: 0; max-width: 360px; padding: 8px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500 }
.btn:hover { border-color: var(--accent); color: var(--accent) }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface) }

.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; align-items: start }
aside.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 100px); overflow: auto; padding-right: 4px }
aside.toc a { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 6px; align-items: baseline; padding: 5px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 0.86rem; line-height: 1.35 }
aside.toc a:hover { background: var(--sunk) }
aside.toc .n { font: 600 0.75rem var(--f-mono); color: var(--muted) }
aside.toc .f { font: 0.72rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
aside.toc a.complete .f { color: var(--done); font-weight: 600 }
aside.toc a.complete .t { color: var(--muted) }

.chapters { display: grid; gap: 14px; min-width: 0 }
details.ch { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); scroll-margin-top: 90px }
details.ch.complete { border-color: color-mix(in srgb, var(--done) 45%, var(--line)) }
details.ch > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 14px 18px }
details.ch > summary::-webkit-details-marker { display: none }
.chnum { font: 700 0.78rem var(--f-mono); color: var(--accent); white-space: nowrap }
.chtitle { font: 700 1.05rem/1.3 var(--f-display); text-wrap: balance }
.chmeta { display: flex; align-items: center; gap: 10px; font: 600 0.78rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.chmeta .bar { width: 70px; flex: none }
.ch.complete .chmeta { color: var(--done) }
.chev { transition: transform .2s; color: var(--muted) }
details[open] .chev { transform: rotate(90deg) }
.chbody { border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.col { padding: 16px 18px; min-width: 0 }
.col + .col { border-left: 1px solid var(--line); background: var(--sunk); border-radius: 0 0 var(--r) 0 }
.col h3 { font: 600 0.72rem var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; gap: 8px }
.col h3 + * { margin-top: 0 }
.col h3.sp { margin-top: 18px }
ul.know { margin: 0; padding-left: 1.1em; display: grid; gap: 7px }
ul.know li::marker { color: var(--gopher) }
.checks { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none }
.checks label { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 0.92rem; line-height: 1.45 }
.checks label:hover { background: var(--surface) }
.checks input { width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--done) }
.checks input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent) }
.ex-tag { font: 600 0.68rem var(--f-mono); color: var(--warn); margin-right: 4px }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); font: 600 0.72rem var(--f-mono); letter-spacing: 0; text-transform: none }
.linkbtn:hover { text-decoration: underline }
mark { background: color-mix(in srgb, var(--gopher) 30%, transparent); color: inherit; border-radius: 2px }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r) }
.hide-done .checks li.is-done { display: none }

/* roadmap */
.parts-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 30px }
.psum { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; text-decoration: none; color: inherit }
.psum:hover { border-color: var(--accent) }
.psum .k { font: 600 0.72rem var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent) }
.psum .nm { font: 700 1.05rem/1.3 var(--f-display) }
.psum .num { font: 600 0.82rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
h2.sec { font: 700 1.25rem var(--f-display); margin: 0 0 12px }
ol.weeks { list-style: none; margin: 0 0 32px; padding: 0; display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden }
ol.weeks li { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) 160px; gap: 16px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line) }
ol.weeks li:first-child { border-top: 0 }
.wk { font: 700 0.82rem var(--f-mono); color: var(--accent) }
.wk-t { font-weight: 600 }
.wk-d { font-size: 0.86rem; color: var(--muted) }
.wk-p { display: flex; align-items: center; gap: 8px; font: 600 0.75rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
li.wdone .wk-p { color: var(--done) }
.backup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; align-content: start }
.card p { margin: 0; color: var(--muted); font-size: 0.9rem }
.card textarea { width: 100%; min-height: 70px; resize: vertical; padding: 8px; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; font: 0.75rem var(--f-mono) }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.status { font-size: 0.85rem; color: var(--done); min-height: 1.3em }
.status.err { color: var(--warn) }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr) }
  aside.toc { display: none }
  .chbody { grid-template-columns: minmax(0, 1fr) }
  .col + .col { border-left: 0; border-top: 1px solid var(--line); border-radius: 0 0 var(--r) var(--r) }
  .parts-sum, .backup { grid-template-columns: minmax(0, 1fr) }
  ol.weeks li { grid-template-columns: minmax(0, 1fr); gap: 6px }
  .overall .bar { width: 70px }
}
@media (max-width: 480px) {
  details.ch > summary { grid-template-columns: minmax(0, 1fr) auto; }
  .chnum { grid-column: 1 / -1 }
  .chmeta .bar { display: none }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

</head>

<script>
const PERSIST = true;
const DATA = [{"id": "p1", "name": "Golang Nền Tảng", "short": "Go nền tảng", "chapters": [{"n": 1, "title": "Giới thiệu Go và cài đặt môi trường", "sections": ["1.1. Go là gì?", "1.2. Cài đặt Go", "1.3. Chương trình Go đầu tiên", "1.4. Bộ công cụ dòng lệnh go", "1.5. Cấu trúc một chương trình Go"], "summary": ["Go là ngôn ngữ biên dịch, kiểu tĩnh, có GC, nổi bật về sự đơn giản, tốc độ và concurrency; rất mạnh cho backend và hạ tầng cloud.", "Cài Go từ <code>go.dev/dl</code>; dự án hiện đại dùng <strong>Go Modules</strong> (<code>go mod init</code>), không cần đặt trong <code>GOPATH</code>.", "Chương trình thực thi bắt đầu từ <code>func main()</code> trong <code>package main</code>.", "Tên viết hoa chữ đầu được export; import hoặc biến cục bộ không dùng là lỗi biên dịch.", "Lệnh <code>go</code> bao gồm mọi công cụ: <code>run</code>, <code>build</code>, <code>test</code>, <code>fmt</code>, <code>vet</code>, <code>mod</code>, <code>get</code>, <code>install</code>, <code>doc</code>."], "exercises": ["Cài Go, chạy <code>go version</code> và <code>go env</code>, ghi lại giá trị <code>GOPATH</code>, <code>GOOS</code>, <code>GOARCH</code> trên máy bạn.", "Viết chương trình in ra tên, tuổi và thành phố của bạn trên ba dòng. Build ra file thực thi và chạy nó.", "Thử import package <code>os</code> mà không dùng; đọc thông báo lỗi của trình biên dịch. Sửa bằng cách dùng <code>os.Getenv(\"HOME\")</code>.", "Cross-compile chương trình ở bài 2 cho Windows và Linux ARM64; so sánh kích thước các file.", "Dùng <code>go doc strings.Fields</code> để đọc tài liệu, sau đó viết chương trình đếm số từ trong một câu."]}, {"n": 2, "title": "Biến, hằng số và kiểu dữ liệu cơ bản", "sections": ["2.1. Khai báo biến", "2.2. Hằng số và iota", "2.3. Các kiểu dữ liệu cơ bản", "2.4. Chuyển đổi kiểu", "2.5. Phạm vi biến và shadowing"], "summary": ["Khai báo: <code>var x T</code>, <code>var x = v</code>, <code>x := v</code> (chỉ trong hàm). Mọi biến đều có zero value.", "<code>const</code> + <code>iota</code> để tạo enum; hằng không kiểu có độ chính xác cao và linh hoạt.", "Dùng <code>int</code>, <code>float64</code>, <code>string</code>, <code>bool</code> cho đa số trường hợp; <code>byte</code> = <code>uint8</code>, <code>rune</code> = <code>int32</code>.", "Không có chuyển kiểu ngầm định; dùng <code>T(v)</code> cho số, <code>strconv</code> cho chuỗi ↔ số.", "<code>type A B</code> tạo kiểu mới; <code>type A = B</code> tạo bí danh. Cẩn thận shadowing khi dùng <code>:=</code>."], "exercises": ["Khai báo các biến thuộc mọi kiểu cơ bản mà không gán giá trị, in ra bằng <code>%v</code> và <code>%T</code> để xem zero value và kiểu.", "Dùng <code>iota</code> tạo enum <code>Role</code> (Guest, User, Admin) bắt đầu từ 1, viết phương thức <code>String()</code>.", "Viết chương trình đọc chuỗi <code>\"42\"</code>, <code>\"3.5\"</code>, <code>\"abc\"</code> và chuyển sang số bằng <code>strconv</code>, in lỗi nếu có.", "Tạo hai kiểu <code>VND</code> và <code>USD</code> dựa trên <code>int64</code>, viết hàm <code>ToVND(u USD, rate int64) VND</code>. Thử truyền nhầm kiểu để thấy lỗi biên dịch.", "Viết đoạn code tái hiện lỗi shadowing <code>err</code> trong khối <code>if</code>, sau đó sửa lại cho đúng."]}, {"n": 3, "title": "Toán tử và cấu trúc điều khiển", "sections": ["3.1. Các toán tử", "3.2. Câu lệnh if", "3.3. Câu lệnh switch", "3.4. Vòng lặp for"], "summary": ["Toán tử quen thuộc; thêm <code>&amp;^</code> (xoá bit). <code>i++</code> là câu lệnh, không có <code>++i</code> và không có <code>?:</code>.", "<code>if</code> có thể kèm câu lệnh khởi tạo: <code>if v, err := f(); err != nil {...}</code>.", "<code>switch</code> không cần <code>break</code>, hỗ trợ nhiều giá trị mỗi case, dạng không biểu thức và <code>fallthrough</code>.", "<code>for</code> là vòng lặp duy nhất: 3 thành phần, kiểu while, vô hạn, <code>range</code> (slice, chuỗi, map, channel, số nguyên, hàm iterator).", "Dùng nhãn để <code>break</code>/<code>continue</code> vòng ngoài. Từ Go 1.22, mỗi lần lặp có biến riêng."], "exercises": ["In bảng cửu chương từ 2 đến 9 bằng hai vòng <code>for</code> lồng nhau.", "Viết chương trình FizzBuzz từ 1 đến 30 bằng <code>switch</code> không biểu thức.", "Kiểm tra một số có phải số nguyên tố không; in các số nguyên tố nhỏ hơn 100.", "Dùng các toán tử bit để đếm số bit 1 của một số nguyên (gợi ý: <code>n &amp; (n-1)</code> xoá bit 1 thấp nhất).", "Duyệt chuỗi <code>\"Xin chào Việt Nam\"</code> bằng <code>range</code>, đếm số nguyên âm (kể cả nguyên âm có dấu như <code>à</code>, <code>ệ</code>)."]}, {"n": 4, "title": "Hàm (Function)", "sections": ["4.1. Khai báo hàm", "4.2. Trả về nhiều giá trị", "4.3. Tham số biến thiên (variadic)", "4.4. Hàm là giá trị và closure", "4.5. Đệ quy", "4.6. defer", "4.7. panic và recover", "4.8. Hàm init", "4.9. Mẫu Functional Options"], "summary": ["Hàm có thể trả về nhiều giá trị; quy ước <code>(kết quả, error)</code> với <code>error</code> đứng cuối.", "Variadic <code>...T</code> nhận 0..n đối số; rải slice bằng <code>s...</code>.", "Hàm là giá trị; closure bắt biến bên ngoài — nền tảng của middleware.", "<code>defer</code> chạy LIFO trước khi hàm trả về, đối số được tính ngay; dùng để giải phóng tài nguyên.", "<code>panic</code>/<code>recover</code> cho lỗi bất thường; lỗi thông thường dùng <code>error</code>.", "<code>init()</code> chạy trước <code>main()</code>; functional options thay cho tham số mặc định."], "exercises": ["Viết hàm <code>parseKV(s string) (key, value string, ok bool)</code> tách chuỗi dạng <code>\"name=An\"</code>.", "Viết hàm <code>memoize(f func(int) int) func(int) int</code> trả về phiên bản có cache của <code>f</code>.", "Viết hàm <code>timeIt(name string) func()</code> dùng như <code>defer timeIt(\"xử lý\")()</code> để in thời gian chạy của hàm.", "Viết hàm <code>mustPositive(n int) int</code> panic nếu <code>n &lt;= 0</code>, rồi viết hàm bọc dùng <code>recover</code> để chuyển panic thành <code>error</code>.", "Áp dụng functional options cho kiểu <code>Client</code> với các tuỳ chọn <code>WithRetry(n)</code>, <code>WithBaseURL(u)</code>, <code>WithHeader(k, v)</code>."]}, {"n": 5, "title": "Array, Slice và Map", "sections": ["5.1. Array — mảng có độ dài cố định", "5.2. Slice — \"cửa sổ\" linh hoạt trên mảng", "5.3. Map — bảng băm khoá/giá trị"], "summary": ["Array có độ dài cố định, là giá trị (sao chép khi gán). Slice = (ptr, len, cap) trỏ vào mảng nền.", "Luôn <code>s = append(s, ...)</code>; cấp sẵn cap bằng <code>make([]T, 0, n)</code> khi biết trước kích thước.", "Slice con chia sẻ mảng nền: dùng <code>copy</code>, <code>slices.Clone</code> hoặc <code>s[a:b:c]</code> để tránh ghi đè ngoài ý muốn.", "Package <code>slices</code>, <code>maps</code> (Go 1.21+) cung cấp Sort, Contains, Index, Clone, Equal, Keys...", "Map: dùng comma-ok, không ghi vào nil map, thứ tự duyệt ngẫu nhiên, không an toàn đồng thời."], "exercises": ["Viết hàm <code>reverse[T any](s []T)</code> đảo ngược slice tại chỗ (không cấp phát mới).", "Viết hàm <code>chunk(s []int, size int) [][]int</code> chia slice thành các phần có kích thước <code>size</code>.", "Viết hàm loại bỏ phần tử trùng trong <code>[]string</code> nhưng <strong>giữ thứ tự xuất hiện đầu tiên</strong> (dùng map làm set).", "Đếm tần suất từ trong một đoạn văn bản (không phân biệt hoa thường) và in top 3 từ xuất hiện nhiều nhất.", "Tái hiện lỗi \"slice con ghi đè slice gốc\" khi <code>append</code>, sau đó sửa bằng full slice expression.", "Nhóm danh sách sinh viên <code>[]Student{Name, Class}</code> thành <code>map[string][]string</code> theo lớp, in ra theo thứ tự tên lớp."]}, {"n": 6, "title": "Chuỗi, rune và Unicode", "sections": ["6.1. Chuỗi trong Go là gì?", "6.2. Chuỗi bất biến và cách \"sửa\" chuỗi", "6.3. Package strings", "6.4. Nối chuỗi hiệu quả với strings.Builder", "6.5. Package unicode: kiểm tra loại ký tự", "6.6. Định dạng với fmt"], "summary": ["<code>string</code> là dãy byte UTF-8 bất biến; <code>len</code> đếm byte, <code>utf8.RuneCountInString</code> đếm ký tự.", "<code>s[i]</code> là byte; <code>range s</code> cho rune; dùng <code>[]rune(s)</code> để thao tác theo ký tự (có dấu).", "Package <code>strings</code> có đủ hàm tìm, tách, ghép, thay thế; <code>strings.Cut</code> rất tiện để parse.", "Nối chuỗi trong vòng lặp bằng <code>strings.Builder</code>, không dùng <code>+=</code>.", "Nắm các verb <code>fmt</code>: <code>%v %+v %#v %T %d %s %q %.2f %w</code>."], "exercises": ["Viết hàm <code>reverseString(s string) string</code> đảo ngược chuỗi tiếng Việt có dấu đúng theo ký tự.", "Viết hàm <code>isPalindrome(s string) bool</code> bỏ qua khoảng trắng, dấu câu và không phân biệt hoa thường.", "Viết hàm <code>slugify(\"Lập trình Go cơ bản!\")</code> → <code>\"lap-trinh-go-co-ban\"</code> (gợi ý: bảng ánh xạ ký tự có dấu → không dấu, <code>strings.Map</code>).", "Viết hàm đếm số từ, số câu và từ dài nhất trong một đoạn văn.", "Viết hàm <code>maskEmail(\"nguyenvanan@gmail.com\")</code> → <code>\"ng<strong>*</strong>****@gmail.com\"</code>."]}, {"n": 7, "title": "Con trỏ (Pointer)", "sections": ["7.1. Khái niệm cơ bản", "7.2. Go luôn truyền theo giá trị", "7.3. Khi nào dùng con trỏ?", "7.4. Con trỏ nil và trường tuỳ chọn", "7.5. Stack, heap và escape analysis"], "summary": ["<code>&amp;x</code> lấy địa chỉ, <code>*p</code> truy cập giá trị; zero value của con trỏ là <code>nil</code>; <code>new(T)</code> cấp phát và trả về <code>*T</code>.", "Go luôn truyền theo giá trị; truyền con trỏ khi cần sửa hoặc tránh sao chép struct lớn.", "Không có phép toán con trỏ; trả về con trỏ tới biến cục bộ là an toàn nhờ escape analysis.", "Kiểm tra nil trước khi dereference; dùng <code>*T</code> cho trường tuỳ chọn khi cần phân biệt \"không có\" với zero value."], "exercises": ["Viết hàm <code>swap(a, b *int)</code> hoán đổi giá trị hai biến.", "Viết hàm <code>increaseAll(nums []int)</code> và <code>increaseAllPtr(nums *[]int)</code> — hàm nào cần con trỏ để <code>append</code> có tác dụng với người gọi? Giải thích.", "Thiết kế struct <code>PatchProduct</code> với các trường tuỳ chọn <code>Name *string</code>, <code>Price *int64</code>, <code>Active *bool</code> và hàm áp dụng bản vá lên <code>Product</code>.", "Chạy <code>go build -gcflags='-m'</code> với vài hàm trả về con trỏ/giá trị, giải thích kết quả."]}, {"n": 8, "title": "Struct và Method", "sections": ["8.1. Khai báo và khởi tạo struct", "8.2. Method — phương thức", "8.3. Embedding — nhúng struct (composition)", "8.4. Struct tags", "8.5. Method set và việc sao chép struct"], "summary": ["Struct gom trường dữ liệu; khởi tạo bằng literal có tên trường; dùng hàm <code>NewXxx</code> để kiểm tra và khởi tạo.", "Method = hàm có receiver; value receiver chỉ đọc bản sao, pointer receiver sửa được bản gốc.", "Embedding thăng cấp trường và method — composition thay cho inheritance.", "Struct tag (<code>json</code>, <code>db</code>, <code>binding</code>...) cung cấp metadata cho thư viện.", "Method set của <code>T</code> chỉ gồm method receiver <code>T</code>; của <code>*T</code> gồm cả hai. Không sao chép struct chứa mutex."], "exercises": ["Tạo struct <code>Book{Title, Author, Year, Price}</code> với hàm <code>NewBook</code> kiểm tra dữ liệu và method <code>String()</code>.", "Tạo kiểu <code>Cart</code> gồm danh sách <code>Item{Name, Price, Qty}</code> với method <code>Add</code>, <code>Remove</code>, <code>Total</code>, <code>Count</code>.", "Dùng embedding để tạo <code>Admin</code> nhúng <code>User</code>, thêm trường <code>Permissions []string</code> và method <code>Can(p string) bool</code>.", "Viết struct <code>BankAccount</code> an toàn đồng thời với <code>Deposit</code>, <code>Withdraw</code> (trả lỗi khi không đủ tiền), <code>Balance</code>.", "Thêm JSON tag cho struct <code>Product</code> sao cho: trường <code>ID</code> xuất ra là <code>\"id\"</code>, <code>CostPrice</code> không bao giờ xuất ra, <code>Description</code> bị bỏ khi rỗng. In thử kết quả <code>json.Marshal</code>."]}, {"n": 9, "title": "Interface", "sections": ["9.1. Khai báo và thoả mãn interface ngầm định", "9.2. Interface nhỏ là interface tốt", "9.3. Interface rỗng: any", "9.4. Bên trong một interface: cặp (kiểu, giá trị)", "9.5. Thiết kế với interface trong backend", "9.6. Sắp xếp với sort.Interface và slices.SortFunc"], "summary": ["Interface là tập method; kiểu thoả mãn <strong>ngầm định</strong> khi có đủ method.", "Ưu tiên interface nhỏ (<code>io.Reader</code>, <code>io.Writer</code>, <code>fmt.Stringer</code>, <code>error</code>), ghép bằng embedding.", "<code>any</code> nhận mọi kiểu; lấy lại kiểu cụ thể bằng type assertion (dùng comma-ok) hoặc type switch.", "Interface = (kiểu, giá trị); con trỏ nil bọc trong interface <strong>khác nil</strong> — luôn <code>return nil</code> tường minh.", "\"Accept interfaces, return structs\"; khai báo interface ở phía sử dụng để dễ thay thế và test."], "exercises": ["Định nghĩa interface <code>Notifier</code> với <code>Send(to, msg string) error</code>; cài đặt <code>EmailNotifier</code>, <code>SMSNotifier</code> và hàm <code>NotifyAll(ns []Notifier, ...)</code>.", "Viết kiểu <code>countingWriter</code> bọc <code>io.Writer</code>, đếm tổng số byte đã ghi.", "Viết hàm <code>sumAny(values []any) (float64, error)</code> cộng các số kiểu <code>int</code>, <code>float64</code>, <code>string</code> (parse được), trả lỗi với kiểu khác.", "Tái hiện bẫy \"nil interface\" với một interface tự định nghĩa và giải thích vì sao.", "Viết <code>ProductRepository</code> interface và hai cài đặt: bằng map trong bộ nhớ và bằng slice; viết <code>ProductService</code> dùng được cả hai."]}, {"n": 10, "title": "Xử lý lỗi (Error Handling)", "sections": ["10.1. Interface error", "10.2. Sentinel error, bọc lỗi với %w, errors.Is và errors.As", "10.3. Gộp nhiều lỗi với errors.Join", "10.4. Thiết kế lỗi cho ứng dụng backend"], "summary": ["Lỗi là giá trị kiểu <code>error</code>; trả về ở vị trí cuối và kiểm tra ngay bằng <code>if err != nil</code>.", "Tạo lỗi bằng <code>errors.New</code>, <code>fmt.Errorf</code>; bọc lỗi với <code>%w</code> để giữ lỗi gốc kèm ngữ cảnh.", "<code>errors.Is</code> so sánh giá trị (sentinel), <code>errors.As</code>/<code>errors.AsType</code> tìm theo kiểu, <code>errors.Join</code> gộp nhiều lỗi.", "Kiểu lỗi tuỳ chỉnh cài <code>Error()</code> và <code>Unwrap()</code>; dùng để ánh xạ lỗi sang HTTP status.", "Xử lý mỗi lỗi một lần; không lộ chi tiết nội bộ cho client."], "exercises": ["Viết hàm <code>readConfig(path string) (map[string]string, error)</code> đọc file dạng <code>key=value</code>, bọc lỗi kèm số dòng bị sai.", "Tạo sentinel <code>ErrInsufficientFunds</code> và hàm <code>Withdraw</code>; ở <code>main</code> dùng <code>errors.Is</code> để in thông báo thân thiện.", "Tạo kiểu <code>NotFoundError{Resource string; ID any}</code> và dùng <code>errors.As</code> để lấy thông tin ra.", "Viết hàm validate một struct <code>Order</code> trả về tất cả lỗi bằng <code>errors.Join</code>.", "Mở rộng <code>AppError</code> với mã <code>UNAUTHORIZED</code> và <code>FORBIDDEN</code>, cập nhật hàm <code>HTTPStatus</code> và viết test bảng cho nó."]}, {"n": 11, "title": "Generics (Lập trình tổng quát)", "sections": ["11.1. Hàm generic và tham số kiểu", "11.2. Ràng buộc kiểu (constraints)", "11.3. Kiểu dữ liệu generic", "11.4. Generic methods (Go 1.27)", "11.5. Khi nào dùng generics?"], "summary": ["Hàm/kiểu generic khai báo tham số kiểu trong <code>[...]</code>; kiểu thường được <strong>suy luận</strong> khi gọi.", "Ràng buộc là interface: <code>any</code>, <code>comparable</code>, <code>cmp.Ordered</code> hoặc tập kiểu với <code>|</code> và <code>~</code>.", "Kiểu generic như <code>Stack[T]</code>, <code>Page[T]</code> giúp tái sử dụng cấu trúc dữ liệu an toàn kiểu.", "Go 1.27 cho phép method có tham số kiểu riêng (generic methods).", "Dùng generics khi thuật toán độc lập với kiểu; dùng interface khi cần hành vi."], "exercises": ["Viết <code>Keys[K comparable, V any](m map[K]V) []K</code> và <code>GroupBy[T any, K comparable](xs []T, key func(T) K) map[K][]T</code>.", "Viết <code>Set[T comparable]</code> với <code>Add</code>, <code>Has</code>, <code>Remove</code>, <code>Len</code>, <code>Union</code>, <code>Intersect</code>.", "Viết <code>Queue[T]</code> dùng slice với <code>Enqueue</code>, <code>Dequeue</code>, <code>Peek</code>, <code>IsEmpty</code>.", "Viết <code>Result[T]</code> gồm <code>Value T</code> và <code>Err error</code> cùng hàm <code>Try[T](f func() (T, error)) Result[T]</code>.", "Viết <code>Clamp[T cmp.Ordered](v, lo, hi T) T</code> và thử với <code>int</code>, <code>float64</code>, <code>string</code>."]}, {"n": 12, "title": "Package, Module và tổ chức mã nguồn", "sections": ["12.1. Package", "12.2. Go Modules", "12.3. Tổ chức thư mục dự án backend"], "summary": ["Một thư mục = một package; tên viết hoa được export; không cho phép import vòng.", "<code>internal/</code> giới hạn ai được import; import trống <code>_</code> chỉ để chạy <code>init()</code>.", "Module định nghĩa bởi <code>go.mod</code>; <code>go.sum</code> đảm bảo toàn vẹn; luôn commit cả hai.", "Lệnh chính: <code>go mod init</code>, <code>go get pkg@ver</code>, <code>go mod tidy</code>; từ v2 major version nằm trong đường dẫn.", "Bố cục phổ biến cho backend: <code>cmd/</code>, <code>internal/{handler,service,repository,model,...}</code>."], "exercises": ["Tạo module <code>example.com/calc</code> với package <code>calc/mathx</code> chứa hàm <code>Add</code>, <code>Sub</code> (export) và <code>checkOverflow</code> (không export). Gọi từ <code>main</code>.", "Tạo thư mục <code>internal/secret</code> và thử import nó từ một module khác để thấy lỗi.", "Thêm thư viện <code>github.com/google/uuid</code> vào dự án, dùng nó, rồi chạy <code>go mod tidy</code> và xem thay đổi trong <code>go.mod</code>, <code>go.sum</code>.", "Dùng <code>go work</code> để phát triển đồng thời một ứng dụng và một thư viện local.", "Phác thảo cấu trúc thư mục cho một API quản lý thư viện sách (sách, độc giả, mượn/trả)."]}, {"n": 13, "title": "Concurrency (1): Goroutine và Channel", "sections": ["13.1. Concurrency và Parallelism", "13.2. Goroutine", "13.3. Channel", "13.4. select — chờ nhiều channel", "13.5. Deadlock và goroutine leak"], "summary": ["Goroutine là hàm chạy đồng thời, cực nhẹ, do runtime lập lịch theo mô hình G-M-P.", "Đồng bộ bằng <code>sync.WaitGroup</code> (Go 1.25+: <code>wg.Go</code>), không dùng <code>time.Sleep</code>.", "Channel truyền dữ liệu giữa goroutine; unbuffered = điểm hẹn, buffered = hàng đợi.", "Chỉ bên gửi đóng channel; <code>range ch</code> đọc đến khi đóng; dùng channel có hướng trong tham số.", "<code>select</code> chờ nhiều channel, kết hợp <code>time.After</code> cho timeout và <code>default</code> cho thao tác không chặn.", "Cảnh giác deadlock và goroutine leak: mỗi goroutine phải có điểm kết thúc rõ ràng."], "exercises": ["Viết chương trình tính tổng 1..10 000 000 bằng 4 goroutine, mỗi goroutine một đoạn, gộp kết quả qua channel.", "Viết pipeline 3 tầng: sinh số → lọc số nguyên tố → định dạng chuỗi; in 10 số nguyên tố đầu tiên.", "Viết hàm <code>firstResponse(urls []string) string</code> mô phỏng gọi nhiều server (dùng <code>time.Sleep</code> ngẫu nhiên) và trả về kết quả nhanh nhất, timeout 1 giây.", "Cố ý tạo deadlock bằng 2 goroutine chờ nhau qua 2 channel; đọc thông báo lỗi rồi sửa.", "Giải thích vì sao đọc từ channel đã đóng không panic nhưng gửi vào thì panic."]}, {"n": 14, "title": "Concurrency (2): sync, context và các mẫu đồng thời", "sections": ["14.1. Data race và race detector", "14.2. sync.Mutex và sync.RWMutex", "14.3. sync.Once, atomic và sync.Pool", "14.4. Package context", "14.5. Các mẫu đồng thời thực chiến", "14.6. Mutex hay Channel?"], "summary": ["Data race là lỗi nghiêm trọng; luôn chạy <code>go test -race</code> trong CI.", "<code>Mutex</code>/<code>RWMutex</code> bảo vệ dữ liệu chung; <code>Once</code>/<code>OnceValue</code> khởi tạo một lần; <code>atomic</code> cho bộ đếm; <code>Pool</code> tái sử dụng buffer.", "<code>context</code> mang tín hiệu huỷ, deadline và giá trị theo request; là tham số đầu tiên; luôn <code>defer cancel()</code>.", "Mẫu thực chiến: worker pool, semaphore, errgroup, fan-out/fan-in, graceful shutdown.", "Chọn channel để chuyển giao dữ liệu/sự kiện, mutex để bảo vệ trạng thái."], "exercises": ["Viết bộ đếm lượt truy cập theo URL an toàn đồng thời bằng <code>sync.Mutex</code>; viết lại bằng <code>sync.Map</code> và so sánh.", "Viết worker pool tải \"trang web\" giả lập (sleep ngẫu nhiên) với tối đa 4 worker, timeout tổng 2 giây bằng <code>context</code>.", "Viết hàm <code>retry(ctx, attempts int, f func() error) error</code> dừng ngay khi context bị huỷ.", "Chạy chương trình data race ở đầu chương với <code>-race</code> và đọc báo cáo; sửa bằng <code>atomic.Int64</code>.", "Viết chương trình chạy 3 \"dịch vụ\" song song bằng errgroup, trong đó một dịch vụ trả lỗi; xác nhận các dịch vụ còn lại bị huỷ."]}, {"n": 15, "title": "Testing, Benchmark và công cụ chất lượng code", "sections": ["15.1. Unit test cơ bản", "15.2. Table-driven test và subtest", "15.3. Các tiện ích của testing.T", "15.4. Test với interface giả (mock/fake)", "15.5. Coverage — độ bao phủ", "15.6. Benchmark", "15.7. Fuzz testing", "15.8. Example test — tài liệu chạy được", "15.9. Bộ công cụ chất lượng code", "15.10. Profiling với pprof"], "summary": ["Test nằm trong file <code>_test.go</code>, hàm <code>TestXxx(t *testing.T)</code>; chạy bằng <code>go test ./...</code>.", "Phong cách chuẩn: table-driven test + <code>t.Run</code> subtest; dùng <code>t.Helper</code>, <code>t.Cleanup</code>, <code>t.TempDir</code>.", "Thay phụ thuộc thật bằng fake/mock qua interface.", "Benchmark với <code>for b.Loop()</code> (Go 1.24+) và <code>-benchmem</code>; fuzzing với <code>f.Fuzz</code>; example test làm tài liệu.", "Luôn chạy <code>gofmt</code>, <code>go vet</code>, <code>golangci-lint</code>, <code>go test -race</code>, <code>govulncheck</code> trong CI; dùng <code>pprof</code> để tối ưu."], "exercises": ["Viết table-driven test cho hàm <code>slugify</code> ở Chương 6 với ít nhất 8 trường hợp (có dấu, ký tự đặc biệt, khoảng trắng thừa).", "Viết test cho <code>UserService.Rename</code> ở Chương 9 bằng repo giả, kiểm tra cả trường hợp không tìm thấy.", "Viết benchmark so sánh <code>append</code> không cấp sẵn với <code>make([]int, 0, n)</code> cho n = 100 000.", "Viết fuzz test cho hàm parse <code>key=value</code> và tìm một đầu vào làm hàm sai.", "Cài <code>golangci-lint</code>, chạy trên một dự án nhỏ của bạn và sửa hết cảnh báo."]}, {"n": 16, "title": "Thư viện chuẩn thường dùng", "sections": ["16.1. Làm việc với file: os, io, bufio", "16.2. encoding/json", "16.3. time — thời gian", "16.4. log/slog — structured logging", "16.5. flag và biến môi trường", "16.6. Số ngẫu nhiên, regexp và uuid", "16.7. Iterator: range over function (Go 1.23)"], "summary": ["<code>os</code>, <code>io</code>, <code>bufio</code>, <code>path/filepath</code> cho file; đọc dòng bằng <code>bufio.Scanner</code>; luôn <code>Close</code> và kiểm tra lỗi.", "<code>encoding/json</code> + struct tag (<code>omitempty</code>, <code>-</code>, <code>string</code>, <code>omitzero</code>); <code>Decoder.DisallowUnknownFields</code> để kiểm tra chặt; Go 1.27 có <code>json/v2</code>.", "<code>time</code>: định dạng theo mốc <code>2006-01-02 15:04:05</code>; lưu UTC; dùng <code>time.Duration</code>.", "<code>log/slog</code> cho logging có cấu trúc; <code>flag</code> và biến môi trường cho cấu hình.", "<code>math/rand/v2</code> cho ngẫu nhiên thường, <code>crypto/rand</code> cho bảo mật; <code>uuid</code> (Go 1.27) sinh UUID v4/v7.", "Iterator <code>iter.Seq</code>/<code>iter.Seq2</code> cho phép <code>for range</code> trên hàm; dùng cùng <code>slices</code>, <code>maps</code>, <code>strings</code>."], "exercises": ["Viết chương trình đọc file CSV đơn giản (không dùng <code>encoding/csv</code>), tính tổng một cột số và ghi kết quả ra file mới.", "Viết hàm chuyển <code>[]User</code> thành JSON đẹp, sau đó đọc lại và kiểm tra hai dữ liệu bằng nhau.", "Viết hàm <code>humanizeDuration(d time.Duration) string</code> trả về \"2 giờ 5 phút\", \"45 giây\"...", "Cấu hình <code>slog</code> ghi JSON ra file, cấp độ lấy từ biến môi trường <code>LOG_LEVEL</code>.", "Viết iterator <code>Chunk[T](s []T, n int) iter.Seq[[]T]</code> và iterator đọc từng dòng từ <code>io.Reader</code>."]}, {"n": 17, "title": "Go chuyên sâu: bộ nhớ, idiom, cạm bẫy và các phiên bản mới", "sections": ["17.1. Bộ nhớ và Garbage Collector", "17.2. Idiom: viết Go \"chuẩn vị\"", "17.3. Cạm bẫy thường gặp", "17.4. Reflection và code generation (giới thiệu)", "17.5. Các phiên bản Go gần đây"], "summary": ["GC của Go độ trễ thấp; giảm cấp phát để giảm áp lực GC; dùng <code>GOMEMLIMIT</code> trong container.", "Idiom: return sớm, zero value hữu ích, interface nhỏ, tên ngắn không lặp, context đầu – error cuối.", "Thuộc bảng cạm bẫy: nil map, nil interface, shadowing, slice chia sẻ, goroutine leak, data race.", "Reflection dùng cho thư viện; code ứng dụng ưu tiên interface/generics và code generation.", "Nắm mốc tính năng 1.18 → 1.27 để đọc hiểu mọi codebase."], "exercises": ["Viết benchmark cho một hàm định dạng hoá đơn dùng <code>fmt.Sprintf</code>, sau đó tối ưu bằng <code>strings.Builder</code> + <code>strconv</code> và so sánh <code>allocs/op</code>.", "Chọn 5 cạm bẫy trong bảng, viết chương trình tái hiện mỗi lỗi và bản sửa tương ứng.", "Viết hàm đọc struct tag <code>env</code> và <code>default</code> bằng reflection để nạp cấu hình từ biến môi trường vào struct <code>Config</code>.", "Lấy một đoạn code Go cũ (trước 1.21) trên GitHub, chạy <code>go fix</code> với Go mới nhất và ghi lại các thay đổi."]}]}, {"id": "p2", "name": "Cấu trúc dữ liệu & Giải thuật với Go", "short": "CTDL & Giải thuật", "chapters": [{"n": 1, "title": "Tư duy giải thuật & độ phức tạp", "sections": ["1.1. Giải thuật là gì?", "1.2. Độ phức tạp thời gian và ký hiệu Big-O", "1.3. Các lớp độ phức tạp phổ biến", "1.4. Phân tích độ phức tạp code Go thực tế", "1.5. Độ phức tạp không gian", "1.6. Phân tích khấu hao (amortized) qua ví dụ append", "1.7. Đo hiệu năng thực tế bằng benchmark", "1.8. Quy trình giải một bài toán thuật toán", "1.9. Ví dụ: ba lời giải cho bài \"Two Sum\""], "summary": ["Giải thuật là dãy bước hữu hạn biến đầu vào thành đầu ra; cấu trúc dữ liệu là cách tổ chức dữ liệu để thao tác hiệu quả.", "Big-O mô tả tốc độ tăng trưởng khi n lớn: bỏ hằng số, giữ số hạng lớn nhất; vòng lồng nhau thì nhân, khối nối tiếp thì cộng.", "Nắm thuộc bảng các lớp độ phức tạp và bảng \"ràng buộc n → độ phức tạp chấp nhận được\".", "<code>append</code> có chi phí khấu hao <code>O(1)</code>; cấp phát trước bằng <code>make(..., 0, n)</code> khi biết kích thước.", "Đo thực tế bằng <code>go test -bench=. -benchmem</code> với vòng lặp <code>for b.Loop()</code> (Go 1.24+).", "Luôn bắt đầu từ lời giải vét cạn, sau đó tối ưu bằng cấu trúc dữ liệu/kỹ thuật phù hợp."], "exercises": ["Xác định Big-O của đoạn code: vòng <code>for i := 1; i &lt; n; i *= 3</code> lồng trong vòng <code>for j := 0; j &lt; n; j++</code>. (Gợi ý: <code>O(n log n)</code>.)", "Viết hàm <code>hasDuplicate</code> dùng map với độ phức tạp <code>O(n)</code>. So sánh hai phiên bản bằng benchmark với n = 10.000.", "Viết chương trình in số lần cấp phát lại khi <code>append</code> 1 triệu phần tử, so sánh với khi dùng <code>make([]int, 0, 1_000_000)</code>.", "Cho n ≤ 2·10⁵, bài toán yêu cầu đếm số cặp (i, j) có <code>a[i] + a[j] = k</code>. Độ phức tạp nào chấp nhận được? Thiết kế lời giải. (Gợi ý: map đếm tần suất, <code>O(n)</code>.)", "Giải thích vì sao <code>O(log₂ n)</code> và <code>O(log₁₀ n)</code> là như nhau trong ký hiệu Big-O."]}, {"n": 2, "title": "Mảng, slice và các kỹ thuật cơ bản", "sections": ["2.1. Ôn nhanh: array, slice và chi phí thao tác", "2.2. Kỹ thuật hai con trỏ (Two Pointers)", "2.3. Cửa sổ trượt (Sliding Window)", "2.4. Mảng cộng dồn (Prefix Sum)", "2.5. Mảng hiệu (Difference Array)", "2.6. Thuật toán Kadane: đoạn con có tổng lớn nhất", "2.7. Làm việc với ma trận", "2.8. Xoay mảng (Rotate Array)"], "summary": ["Slice là header (ptr, len, cap); cắt slice là <code>O(1)</code> nhưng dùng chung mảng nền — cẩn thận khi <code>append</code>.", "Package <code>slices</code> (Go 1.21+) cung cấp <code>Insert</code>, <code>Delete</code>, <code>Index</code>, <code>Contains</code>, <code>Reverse</code>, <code>Max</code>, <code>Min</code>, <code>Clone</code>, <code>Sort</code>...; hãy nhớ chi phí <code>O(n)</code> của chúng.", "Hai con trỏ (hai đầu hoặc nhanh–chậm) biến nhiều bài <code>O(n²)</code> thành <code>O(n)</code>.", "Cửa sổ trượt dành cho bài \"đoạn con liên tiếp\"; mỗi phần tử vào/ra cửa sổ tối đa một lần.", "Prefix sum trả lời truy vấn tổng đoạn trong <code>O(1)</code>; kết hợp map để đếm đoạn có tổng bằng k.", "Difference array xử lý nhiều cập nhật đoạn trong <code>O(1)</code> mỗi thao tác.", "Kadane tìm đoạn con tổng lớn nhất trong <code>O(n)</code>; khởi tạo bằng phần tử đầu tiên."], "exercises": ["Viết hàm <code>merge(a, b []int) []int</code> trộn hai slice đã sắp xếp thành một slice đã sắp xếp bằng hai con trỏ.", "Cho mảng số dương, đếm số đoạn con liên tiếp có tổng <strong>nhỏ hơn</strong> <code>k</code>. (Gợi ý: cửa sổ trượt, mỗi <code>r</code> cộng thêm <code>r - l + 1</code> đoạn.)", "\"Product of Array Except Self\": trả về mảng <code>out[i]</code> = tích mọi phần tử trừ <code>a[i]</code>, không dùng phép chia, <code>O(n)</code>. (Gợi ý: tích tiền tố × tích hậu tố.)", "Tìm đoạn con có tổng lớn nhất trên <strong>mảng vòng</strong> (circular). (Gợi ý: max(Kadane, tổng − đoạn con có tổng nhỏ nhất).)", "Viết hàm xoay ma trận <code>R×C</code> (không vuông) 90° và trả về ma trận mới <code>C×R</code>.", "Cho danh sách khoảng thời gian online <code>[start, end]</code> của người dùng trong ngày (theo phút), dùng difference array để tìm phút có nhiều người online nhất."]}, {"n": 3, "title": "Xử lý chuỗi", "sections": ["3.1. Chuỗi trong Go: byte, rune và UTF-8", "3.2. Nối chuỗi hiệu quả với strings.Builder", "3.3. Palindrome (chuỗi đối xứng)", "3.4. Anagram và đếm tần suất ký tự", "3.5. Chuỗi con dài nhất không có ký tự lặp", "3.6. So khớp mẫu (Pattern Matching)"], "summary": ["Chuỗi Go là dãy byte UTF-8 bất biến: <code>len</code> đếm byte, <code>range</code> duyệt rune; ký tự tiếng Việt chiếm nhiều byte.", "Dùng <code>strings.Builder</code> (kèm <code>Grow</code>) hoặc <code>strings.Join</code> thay cho <code>+=</code> trong vòng lặp.", "Palindrome: hai con trỏ; chuỗi con đối xứng dài nhất: mở rộng từ tâm <code>O(n²)</code>.", "Anagram/tần suất: <code>[26]int</code> cho a–z, <code>map[rune]int</code> cho Unicode.", "Chuỗi con không lặp dài nhất: cửa sổ trượt + vị trí xuất hiện gần nhất.", "KMP dùng prefix function để so khớp <code>O(n + m)</code>; Rabin–Karp dùng rolling hash."], "exercises": ["Viết hàm <code>reverseWords(\"  go   là   ngôn ngữ \")</code> trả về <code>\"ngữ ngôn là go\"</code> (gợi ý: <code>strings.Fields</code> + đảo slice).", "Kiểm tra chuỗi <code>s2</code> có chứa một hoán vị của <code>s1</code> hay không (gợi ý: cửa sổ trượt độ dài <code>len(s1)</code> + so sánh hai mảng <code>[26]int</code>).", "Dùng prefix function, tìm chu kỳ ngắn nhất của chuỗi (ví dụ \"abcabcabc\" có chu kỳ \"abc\"). Gợi ý: <code>n - pi[n-1]</code>.", "Tìm tiền tố chung dài nhất (longest common prefix) của một danh sách chuỗi.", "Viết hàm chuẩn hóa slug URL từ tiêu đề tiếng Việt: \"Học Go Cơ Bản!\" → \"hoc-go-co-ban\" (gợi ý: bảng ánh xạ ký tự có dấu → không dấu, <code>strings.Builder</code>).", "Dùng Rabin–Karp tìm chuỗi con độ dài k xuất hiện ít nhất hai lần trong một chuỗi."]}, {"n": 4, "title": "Đệ quy và Quay lui (Backtracking)", "sections": ["4.1. Tư duy đệ quy", "4.2. Ghi nhớ kết quả (Memoization)", "4.3. Khuôn mẫu Quay lui (Backtracking)", "4.4. Liệt kê tập con (Subsets)", "4.5. Hoán vị (Permutations)", "4.6. Tổ hợp và Combination Sum", "4.7. Sinh dãy ngoặc hợp lệ", "4.8. Bài toán N quân hậu (N-Queens)", "4.9. Giải Sudoku"], "summary": ["Hàm đệ quy cần base case và bước đệ quy làm bài toán nhỏ dần; mỗi lời gọi tốn một frame trên call stack.", "Go không có tối ưu đệ quy đuôi; với độ sâu lớn hãy chuyển sang vòng lặp hoặc stack tường minh.", "Memoization lưu kết quả bài toán con, biến độ phức tạp hàm mũ thành đa thức.", "Backtracking: chọn → đệ quy → bỏ chọn; cắt tỉa sớm các nhánh không hợp lệ.", "Luôn lưu <code>slices.Clone(path)</code> vào kết quả, không lưu <code>path</code> trực tiếp."], "exercises": ["Liệt kê tập con khi mảng có phần tử trùng (<code>[1,2,2]</code>) mà không sinh tập trùng. Gợi ý: sắp xếp, bỏ qua <code>nums[i] == nums[i-1]</code> khi <code>i &gt; start</code>.", "Liệt kê hoán vị không trùng của <code>[1,1,2]</code>.", "\"Word Search\": kiểm tra một từ có thể được tạo từ các ô kề nhau trên lưới ký tự (mỗi ô dùng một lần).", "Liệt kê mọi cách phân tích số n thành tổng các số nguyên dương không giảm (ví dụ 4 = 1+1+1+1 = 1+1+2 = 1+3 = 2+2 = 4).", "Cải tiến bộ giải Sudoku: luôn chọn ô trống có <strong>ít ứng viên nhất</strong> trước (heuristic MRV) và đo số lần gọi đệ quy trước/sau.", "Viết hàm sinh mọi địa chỉ IP hợp lệ từ chuỗi số <code>\"25525511135\"</code>."]}, {"n": 5, "title": "Thuật toán sắp xếp", "sections": ["5.1. Các khái niệm cần biết", "5.2. Ba thuật toán O(n²) cơ bản", "5.3. Merge sort (sắp xếp trộn)", "5.4. Quick sort (sắp xếp nhanh)", "5.5. Heap sort", "5.6. Sắp xếp không dựa trên so sánh", "5.7. Sắp xếp với thư viện chuẩn Go", "5.8. Bảng so sánh các thuật toán sắp xếp"], "summary": ["Ba thuật toán <code>O(n²)</code> (bubble, selection, insertion) dễ cài; insertion sort rất tốt cho mảng nhỏ hoặc gần như đã sắp xếp.", "Merge sort: chia để trị, luôn <code>O(n log n)</code>, ổn định, cần <code>O(n)</code> bộ nhớ.", "Quick sort: nhanh nhất trung bình, tại chỗ; chọn chốt ngẫu nhiên/3-way để tránh <code>O(n²)</code>.", "Heap sort: <code>O(n log n)</code> đảm bảo, tại chỗ, không ổn định.", "Counting/radix/bucket sort vượt giới hạn <code>n log n</code> nhờ khai thác cấu trúc khóa.", "Thực tế dùng <code>slices.Sort</code>, <code>slices.SortFunc</code> + <code>cmp.Compare</code>/<code>cmp.Or</code>, <code>slices.SortStableFunc</code>."], "exercises": ["Cài đặt merge sort <strong>từ dưới lên</strong> (bottom-up, không đệ quy) với độ rộng 1, 2, 4, 8...", "Đếm số lần đổi chỗ của bubble sort trên một mảng — chứng minh nó bằng số <strong>nghịch thế</strong> (cặp <code>i &lt; j</code> mà <code>a[i] &gt; a[j]</code>).", "Sắp xếp danh sách đơn hàng theo: trạng thái (<code>pending</code> trước <code>done</code>), rồi tổng tiền giảm dần, rồi thời gian tạo tăng dần.", "Viết <code>sortColors</code> sắp xếp mảng chỉ gồm 0, 1, 2 trong một lượt duyệt (gợi ý: phân hoạch ba đường).", "Cài đặt quick sort dùng \"trung vị của ba\" (median-of-three) làm chốt và đo số lần so sánh trên mảng đã sắp xếp 10.000 phần tử so với chốt là phần tử cuối.", "Viết benchmark so sánh <code>insertionSort</code>, <code>mergeSort</code>, <code>quickSortHoare</code> và <code>slices.Sort</code> với n = 10, 1.000, 100.000."]}, {"n": 6, "title": "Thuật toán tìm kiếm", "sections": ["6.1. Tìm kiếm tuyến tính", "6.2. Tìm kiếm nhị phân (Binary Search)", "6.3. Cận dưới, cận trên và các biến thể", "6.4. Tìm kiếm với thư viện chuẩn", "6.5. Tìm kiếm trên mảng đã sắp xếp bị xoay", "6.6. Tìm kiếm nhị phân trên đáp án", "6.7. Tìm đỉnh và tìm kiếm tam phân", "6.8. Tìm kiếm trên ma trận"], "summary": ["Tìm tuyến tính <code>O(n)</code> dùng cho dữ liệu nhỏ/chưa sắp xếp; binary search <code>O(log n)</code> cho dữ liệu đã sắp xếp.", "Viết binary search theo khuôn \"vị trí đầu tiên mà điều kiện đơn điệu đúng\" với khoảng nửa mở <code>[lo, hi)</code> giúp giảm lỗi.", "Lower bound/upper bound giải quyết các bài vị trí đầu, cuối, đếm, vị trí chèn.", "<code>slices.BinarySearch</code>, <code>slices.BinarySearchFunc</code>, <code>sort.Search</code> là các hàm có sẵn nên dùng.", "Binary search trên đáp án: tìm giá trị tối ưu khi có hàm kiểm tra đơn điệu."], "exercises": ["Cho mảng sắp xếp và số x, tìm k phần tử gần x nhất (gợi ý: lower bound rồi mở rộng hai con trỏ).", "Tìm giá trị nhỏ nhất trong mảng sắp xếp bị xoay (không có phần tử trùng).", "\"Split Array Largest Sum\": chia mảng thành m đoạn liên tiếp sao cho tổng lớn nhất của các đoạn là nhỏ nhất (binary search trên đáp án).", "Tìm căn bậc ba nguyên của số <code>int64</code> mà không dùng <code>math.Cbrt</code>.", "Cho log truy cập đã sắp xếp theo thời gian (Unix timestamp), đếm số request trong khoảng <code>[t1, t2]</code> với nhiều truy vấn — dùng <code>sort.Search</code>.", "Tìm median của hai mảng đã sắp xếp trong <code>O(log(min(n, m)))</code> (bài khó)."]}, {"n": 7, "title": "Danh sách liên kết (Linked List)", "sections": ["7.1. So sánh slice và danh sách liên kết", "7.2. Danh sách liên kết đơn generic", "7.3. Danh sách liên kết đôi và container/list", "7.4. Các bài toán kinh điển trên danh sách liên kết", "7.5. Ứng dụng: LRU Cache"], "summary": ["Danh sách liên kết: chèn/xóa <code>O(1)</code> tại nút đã biết, truy cập theo chỉ số <code>O(n)</code>, kém thân thiện cache so với slice.", "Dùng con trỏ <code>tail</code> để thêm cuối <code>O(1)</code>; dùng dummy node hoặc con trỏ tới con trỏ để đơn giản hóa thao tác ở đầu.", "<code>container/list</code> là danh sách đôi có sẵn (phần tử <code>any</code>).", "Kỹ thuật cần thuộc: đảo ngược, fast/slow (giữa danh sách, Floyd), trộn hai danh sách, hai con trỏ cách nhau n bước.", "LRU cache = map + danh sách đôi, <code>Get</code>/<code>Put</code> <code>O(1)</code>."], "exercises": ["Kiểm tra danh sách liên kết có đối xứng (palindrome) không với bộ nhớ <code>O(1)</code> (gợi ý: tìm giữa, đảo nửa sau, so sánh).", "Đảo ngược từng nhóm k nút (<code>1→2→3→4→5</code>, k=2 → <code>2→1→4→3→5</code>).", "Tìm nút giao nhau của hai danh sách liên kết đơn (gợi ý: hai con trỏ, khi hết thì nhảy sang đầu danh sách kia).", "Sắp xếp danh sách liên kết trong <code>O(n log n)</code> bằng merge sort (dùng <code>middle</code> + <code>mergeSorted</code>).", "Viết danh sách liên kết đôi generic <code>DList[T]</code> có <code>PushFront</code>, <code>PushBack</code>, <code>Remove(*Node)</code>, <code>MoveToFront(*Node)</code> và dùng nó cài lại LRU cache không cần ép kiểu.", "Cộng hai số lớn được biểu diễn bằng danh sách liên kết các chữ số (chữ số hàng đơn vị ở đầu)."]}, {"n": 8, "title": "Stack, Queue và Deque", "sections": ["8.1. Stack", "8.2. Queue và Ring Buffer", "8.3. Deque (hàng đợi hai đầu)", "8.4. Stack đơn điệu (Monotonic Stack)", "8.5. Deque đơn điệu: giá trị lớn nhất trong cửa sổ trượt"], "summary": ["Stack (LIFO) cài bằng slice: <code>append</code> + cắt phần tử cuối; nhớ gán zero value khi pop nếu T chứa con trỏ.", "Queue (FIFO) nên dùng ring buffer để tránh rò rỉ bộ nhớ và sao chép; queue bằng hai stack có pop <code>O(1)</code> khấu hao.", "Channel có buffer là queue an toàn đồng thời — dùng cho giao tiếp giữa goroutine, không dùng cho thuật toán đơn luồng.", "Shunting-yard chuyển biểu thức trung tố sang hậu tố; biểu thức hậu tố tính bằng một stack.", "Stack đơn điệu giải các bài \"phần tử lớn/nhỏ hơn gần nhất\" trong <code>O(n)</code>; deque đơn điệu giải max/min cửa sổ trượt trong <code>O(n)</code>."], "exercises": ["Cài đặt <code>MinStack</code> hỗ trợ <code>Push</code>, <code>Pop</code>, <code>Top</code>, <code>GetMin</code> đều <code>O(1)</code> (gợi ý: stack phụ lưu min hiện tại).", "Đơn giản hóa đường dẫn Unix: <code>\"/a/./b/../../c/\"</code> → <code>\"/c\"</code> bằng stack.", "Mở rộng <code>evalRPN</code>/Shunting-yard để hỗ trợ toán tử lũy thừa <code>^</code> (kết hợp phải) và số âm.", "Tìm hình chữ nhật toàn số 1 lớn nhất trong ma trận nhị phân (gợi ý: mỗi hàng là một histogram).", "Viết ring buffer kích thước cố định lưu 1000 dòng log gần nhất, ghi đè dòng cũ nhất khi đầy.", "\"Sum of Subarray Minimums\": tính tổng min của mọi đoạn con liên tiếp bằng stack đơn điệu."]}, {"n": 9, "title": "Bảng băm (Hash Table)", "sections": ["9.1. Ý tưởng cốt lõi", "9.2. Xử lý va chạm", "9.3. Tự cài đặt bảng băm generic (separate chaining)", "9.4. map của Go hoạt động thế nào?", "9.5. Set: tập hợp bằng map", "9.6. Các bài toán kinh điển dùng bảng băm"], "summary": ["Bảng băm: hàm băm → chỉ số bucket; thêm/tìm/xóa trung bình <code>O(1)</code>, xấu nhất <code>O(n)</code> khi va chạm nhiều.", "Va chạm xử lý bằng separate chaining hoặc open addressing; khi hệ số tải cao thì rehash (khấu hao <code>O(1)</code>).", "<code>maphash.Comparable</code> (Go 1.24) băm được mọi kiểu comparable — dùng khi tự cài cấu trúc băm generic.", "Map của Go dùng Swiss Table từ Go 1.24; thứ tự duyệt ngẫu nhiên, không an toàn đồng thời, không tự thu nhỏ.", "Set = <code>map[T]struct{}</code>; dùng <code>slices.Sorted(maps.Keys(m))</code> khi cần thứ tự xác định."], "exercises": ["\"Isomorphic Strings\": kiểm tra hai chuỗi có thể ánh xạ ký tự một-một sang nhau (<code>\"egg\"</code>/<code>\"add\"</code> → đúng).", "Tìm tất cả cặp chỉ số <code>(i, j)</code> có <code>nums[i] + nums[j] == target</code> (có phần tử trùng) trong <code>O(n)</code>.", "Cài đặt bảng băm open addressing generic có thao tác <code>Delete</code> dùng tombstone và tự rehash khi hệ số tải &gt; 0,7.", "\"Contains Duplicate II\": kiểm tra có hai chỉ số <code>i ≠ j</code> mà <code>a[i] == a[j]</code> và <code>|i − j| ≤ k</code> (gợi ý: set kích thước k trượt theo cửa sổ).", "Viết hàm thống kê top 10 IP truy cập nhiều nhất từ file log Nginx (mỗi dòng bắt đầu bằng IP).", "Viết benchmark so sánh <code>map[int]bool</code>, <code>map[int]struct{}</code> và <code>[]bool</code> khi lưu tập số nguyên trong <code>[0, 10⁶)</code>."]}, {"n": 10, "title": "Cây (Tree) — Phần 1: Cây nhị phân và cây nhị phân tìm kiếm", "sections": ["10.1. Thuật ngữ cơ bản", "10.2. Cây nhị phân và các cách duyệt", "10.3. Các bài toán kinh điển trên cây nhị phân", "10.4. Cây nhị phân tìm kiếm (Binary Search Tree — BST)"], "summary": ["Cây nhị phân có bốn cách duyệt: pre-order, in-order, post-order (DFS) và level-order (BFS bằng queue).", "Có thể viết duyệt cây bằng đệ quy, stack tường minh, hoặc cung cấp dưới dạng iterator <code>iter.Seq</code> (Go 1.23).", "Phần lớn bài toán trên cây giải bằng tư duy post-order: kết hợp kết quả hai cây con.", "BST: trái &lt; nút &lt; phải; in-order cho dãy tăng; tìm/thêm/xóa <code>O(h)</code>.", "BST có thể suy biến thành <code>O(n)</code> với dữ liệu có thứ tự — cần cây tự cân bằng."], "exercises": ["Tính tổng lớn nhất trên một đường đi bất kỳ của cây nhị phân (giá trị có thể âm).", "Tuần tự hóa (serialize) cây nhị phân thành chuỗi và khôi phục lại (deserialize).", "Dựng lại cây từ hai dãy pre-order và in-order.", "In các nút nhìn thấy từ bên phải cây (right side view) bằng level-order.", "Tìm phần tử nhỏ thứ k trong BST bằng iterator <code>InOrder</code> và dừng sớm.", "Chuyển một slice đã sắp xếp thành BST cân bằng (chọn phần tử giữa làm gốc, đệ quy hai nửa)."]}, {"n": 11, "title": "Cây — Phần 2: Cây cân bằng, Trie, Segment Tree, Fenwick Tree", "sections": ["11.1. Cây AVL", "11.2. Red-Black Tree, B-Tree và B+Tree", "11.3. Trie (cây tiền tố)", "11.4. Segment Tree (cây phân đoạn)", "11.5. Fenwick Tree (Binary Indexed Tree)"], "summary": ["AVL giữ hệ số cân bằng trong {−1, 0, 1} bằng bốn kiểu xoay (LL, RR, LR, RL), đảm bảo chiều cao <code>O(log n)</code>.", "Red-Black Tree ít xoay hơn khi ghi; B-Tree/B+Tree tối ưu cho đĩa và là nền tảng index trong CSDL.", "Trie tìm/thêm theo độ dài từ <code>O(L)</code>, mạnh cho tìm kiếm tiền tố, autocomplete, định tuyến.", "Segment tree: cập nhật và truy vấn đoạn <code>O(log n)</code> với mọi phép kết hợp; Fenwick tree ngắn gọn hơn cho tổng tiền tố."], "exercises": ["Bổ sung thao tác <code>Delete</code> cho cây AVL (xóa như BST rồi gọi <code>rebalance</code> trên đường đi ngược lên).", "Thêm vào AVL phương thức <code>Rank(k)</code> trả về số khóa nhỏ hơn k trong <code>O(log n)</code> (gợi ý: lưu kích thước cây con ở mỗi nút).", "Dùng Trie giải bài \"Word Search II\": tìm mọi từ trong từ điển xuất hiện trên lưới ký tự.", "Cài đặt router đơn giản dựa trên trie cho các đường dẫn như <code>/users/:id/posts</code> (mỗi nút là một đoạn path, hỗ trợ tham số <code>:id</code>).", "Đếm số nghịch thế của mảng bằng Fenwick tree (nén giá trị về <code>[0, n)</code> trước).", "Dùng segment tree trả lời truy vấn \"giá cao nhất của cổ phiếu trong khoảng ngày [l, r]\" khi giá được cập nhật liên tục."]}, {"n": 12, "title": "Heap và Hàng đợi ưu tiên (Priority Queue)", "sections": ["12.1. Binary heap được lưu trong mảng", "12.2. Cài đặt heap generic", "12.3. Dùng container/heap của thư viện chuẩn", "12.4. Bài toán Top-K", "12.5. Trộn k danh sách đã sắp xếp", "12.6. Trung vị của luồng dữ liệu (Median of a Stream)"], "summary": ["Binary heap là cây hoàn chỉnh lưu trong slice: con <code>2i+1</code>, <code>2i+2</code>, cha <code>(i−1)/2</code>; push/pop <code>O(log n)</code>, peek <code>O(1)</code>.", "Heapify dựng heap trong <code>O(n)</code>.", "<code>container/heap</code> làm việc với kiểu cài <code>heap.Interface</code>; luôn gọi <code>heap.Push/Pop/Fix/Init</code>, không gọi trực tiếp phương thức.", "Top-K: min-heap kích thước k, <code>O(n log k)</code>; trộn k danh sách: <code>O(N log k)</code>; trung vị luồng: hai heap."], "exercises": ["Viết hàm <code>kSmallestPairs(a, b []int, k int)</code> trả về k cặp <code>(a[i], b[j])</code> có tổng nhỏ nhất (a, b đã sắp xếp).", "\"Task Scheduler\": cho danh sách tác vụ và thời gian nghỉ n giữa hai tác vụ giống nhau, tính thời gian tối thiểu để hoàn thành (gợi ý: max-heap theo tần suất).", "Cài đặt hàng đợi job có ưu tiên cho backend: job có <code>Priority</code> và <code>CreatedAt</code>; ưu tiên cao trước, cùng ưu tiên thì job cũ trước (FIFO).", "Tìm k điểm gần gốc tọa độ nhất trong danh sách n điểm.", "Viết <code>TopKStream</code> nhận lần lượt các từ khóa tìm kiếm và trả về 10 từ khóa phổ biến nhất bất kỳ lúc nào (map đếm + heap).", "Sắp xếp một mảng \"gần như đã sắp xếp\" (mỗi phần tử lệch tối đa k vị trí) trong <code>O(n log k)</code>."]}, {"n": 13, "title": "Đồ thị (Graph)", "sections": ["13.1. Thuật ngữ và cách biểu diễn", "13.2. Duyệt theo chiều rộng (BFS)", "13.3. Duyệt theo chiều sâu (DFS)", "13.4. Phát hiện chu trình", "13.5. Sắp xếp topo (Topological Sort)", "13.6. Đồ thị hai phía (Bipartite)", "13.7. Duyệt trên lưới (Grid)", "13.8. Đường đi ngắn nhất: thuật toán Dijkstra", "13.9. Bellman–Ford: cạnh âm và chu trình âm", "13.10. Floyd–Warshall: mọi cặp đỉnh", "13.11. Union-Find (Disjoint Set Union — DSU)", "13.12. Cây khung nhỏ nhất (Minimum Spanning Tree)", "13.13. Chọn thuật toán đồ thị nào?"], "summary": ["Danh sách kề <code>[][]int</code> là cách biểu diễn mặc định; ma trận kề cho đồ thị dày, V nhỏ.", "BFS (queue) cho đường đi ngắn nhất không trọng số; DFS (đệ quy/stack) cho liên thông, chu trình, topo.", "Đánh dấu đã thăm khi đưa vào queue; dùng stack tường minh khi đồ thị có thể rất sâu.", "Kahn phát hiện chu trình và cho thứ tự topo; DFS ba màu tìm phụ thuộc vòng trong đồ thị có hướng.", "Dijkstra (trọng số không âm), Bellman–Ford (cạnh âm, phát hiện chu trình âm), Floyd–Warshall (mọi cặp).", "Union-Find với nén đường đi + hợp theo kích thước gần như <code>O(1)</code>; Kruskal/Prim cho MST."], "exercises": ["\"Clone Graph\": sao chép sâu một đồ thị vô hướng cho bởi nút đầu tiên (dùng map từ nút cũ sang nút mới).", "\"Word Ladder\": số bước ít nhất biến từ <code>hit</code> thành <code>cog</code>, mỗi bước đổi 1 ký tự và từ trung gian phải nằm trong từ điển (BFS).", "\"Network Delay Time\": tín hiệu phát từ nút k, thời gian để mọi nút nhận được là bao lâu (Dijkstra, lấy max).", "Cho danh sách migration và quan hệ \"phải chạy sau\", in ra thứ tự chạy hoặc báo lỗi nếu có phụ thuộc vòng (Kahn).", "\"Accounts Merge\": gộp các tài khoản có chung ít nhất một email (Union-Find).", "Tìm đường đi ngắn nhất trên lưới có ô \"băng\" (đi qua tốn 0) và ô \"đất\" (tốn 1) bằng BFS 0-1.", "Tìm \"cầu\" (bridge) trong mạng: cạnh mà xóa đi làm đồ thị mất liên thông (thuật toán Tarjan với <code>low-link</code>)."]}, {"n": 14, "title": "Quy hoạch động (Dynamic Programming)", "sections": ["14.1. Quy trình 5 bước giải bài DP", "14.2. Leo cầu thang: ba cách viết", "14.3. Đổi tiền (Coin Change)", "14.4. Dãy con tăng dài nhất (LIS)", "14.5. Dãy con chung dài nhất (LCS)", "14.6. Khoảng cách chỉnh sửa (Edit Distance / Levenshtein)", "14.7. Bài toán cái túi (Knapsack)", "14.8. DP trên lưới", "14.9. DP trên tập con (Bitmask DP)", "14.10. Nhận dạng các dạng DP thường gặp"], "summary": ["DP = bài toán con chồng lấp + cấu trúc con tối ưu; giải theo 5 bước: trạng thái, công thức, cơ sở, thứ tự, đáp án.", "Top-down (memo) dễ viết; bottom-up (bảng) nhanh, không tốn stack, dễ giảm bộ nhớ.", "Các bài nền tảng: leo thang, đổi tiền, LIS (<code>O(n log n)</code> với binary search), LCS, edit distance, knapsack, DP lưới, bitmask DP.", "Truy vết lời giải bằng mảng <code>prev</code>/<code>choice</code> hoặc đi ngược trên bảng."], "exercises": ["\"House Robber\": chọn các nhà không kề nhau để tổng tiền lớn nhất; mở rộng cho dãy nhà xếp vòng tròn.", "\"Decode Ways\": đếm số cách giải mã chuỗi số thành chữ cái (A=1, ..., Z=26).", "\"Word Break\": kiểm tra chuỗi có tách được thành các từ trong từ điển không; in ra một cách tách.", "\"Partition Equal Subset Sum\": chia mảng thành hai tập có tổng bằng nhau (knapsack 0/1 với giá trị bool).", "Viết hàm gợi ý sửa lỗi: cho từ người dùng gõ và danh sách từ khóa, trả về 3 từ có edit distance nhỏ nhất.", "\"Longest Palindromic Subsequence\": dãy con đối xứng dài nhất (gợi ý: LCS của chuỗi và chuỗi đảo ngược, hoặc DP khoảng)."]}, {"n": 15, "title": "Tham lam (Greedy) và Chia để trị (Divide & Conquer)", "sections": ["15.1. Khi nào thuật toán tham lam đúng?", "15.2. Lập lịch hoạt động (Activity Selection)", "15.3. Các bài toán trên khoảng (Intervals)", "15.4. Trò chơi nhảy (Jump Game)", "15.5. Mã Huffman: nén dữ liệu bằng tham lam", "15.6. Chia để trị và định lý thợ", "15.7. Quick Select: phần tử nhỏ thứ k trong O(n)", "15.8. Lũy thừa nhanh và đếm nghịch thế"], "summary": ["Tham lam đúng khi có tính chất lựa chọn tham lam + cấu trúc con tối ưu; chứng minh bằng lập luận trao đổi hoặc kiểm thử đối chiếu với vét cạn.", "Lập lịch: chọn hoạt động kết thúc sớm nhất; bài khoảng: sắp xếp + quét, hoặc sweep line với sự kiện +1/−1.", "Huffman: gộp hai nút tần suất nhỏ nhất bằng min-heap; phá hòa để kết quả tất định.", "Chia để trị: <code>T(n) = a·T(n/b) + f(n)</code>, giải nhanh bằng định lý thợ; các bài con độc lập nên dễ song song hóa.", "Quick select tìm phần tử thứ k trong <code>O(n)</code> trung bình; lũy thừa nhanh <code>O(log n)</code>; đếm nghịch thế bằng merge sort."], "exercises": ["\"Gas Station\": tìm trạm xuất phát để đi hết một vòng (tham lam <code>O(n)</code>).", "\"Non-overlapping Intervals\": số khoảng ít nhất cần xóa để các khoảng còn lại không chồng lấn.", "Cài đặt bộ giải mã Huffman: từ chuỗi bit và bảng mã, khôi phục văn bản gốc.", "Fractional knapsack (được lấy một phần món đồ): chứng minh tham lam theo tỉ lệ giá trị/khối lượng là tối ưu, rồi cài đặt.", "Dùng quick select viết hàm tính p50, p95, p99 cho một slice độ trễ request.", "Tính số Fibonacci thứ n (mod 10⁹+7) trong <code>O(log n)</code> bằng lũy thừa ma trận 2×2."]}, {"n": 16, "title": "Xử lý bit và Toán học cho lập trình viên", "sections": ["16.1. Toán tử bit trong Go", "16.2. Các mẹo bit kinh điển", "16.3. Package math/bits", "16.4. Ước chung lớn nhất, bội chung nhỏ nhất", "16.5. Số nguyên tố", "16.6. Số học mô-đun", "16.7. Tràn số, số thực và số nguyên lớn"], "summary": ["Go có các toán tử bit <code>&amp; | ^ &amp;^ &lt;&lt; &gt;&gt;</code> và <code>^x</code> (NOT); số có dấu dùng bù hai.", "Mẹo cần nhớ: <code>x&amp;(x-1)</code> (xóa bit thấp nhất, kiểm tra lũy thừa 2), <code>x&amp;-x</code> (bit thấp nhất), XOR triệt tiêu cặp, bitmask liệt kê tập con.", "Cờ quyền bằng <code>1 &lt;&lt; iota</code> gọn gàng, kiểm tra bằng một phép AND.", "<code>math/bits</code> dùng lệnh CPU chuyên dụng; <code>bits.Add64/Mul64</code> phát hiện tràn.", "Euclid cho gcd <code>O(log n)</code>; sàng Eratosthenes cho mọi số nguyên tố ≤ n; lũy thừa nhanh + Fermat cho nghịch đảo mô-đun và tổ hợp mod p.", "Tràn số nguyên không báo lỗi; không dùng float cho tiền; <code>math/big</code> cho số lớn."], "exercises": ["Đếm số bit 1 của mọi số từ 0 đến n trong <code>O(n)</code> (gợi ý: <code>bits[i] = bits[i&gt;&gt;1] + i&amp;1</code>).", "Mọi phần tử xuất hiện 3 lần trừ một phần tử xuất hiện 1 lần — tìm nó với bộ nhớ <code>O(1)</code> (gợi ý: đếm từng bit modulo 3).", "Viết hàm kiểm tra một địa chỉ IPv4 có thuộc dải CIDR (ví dụ <code>10.0.0.0/8</code>) không bằng phép AND với mặt nạ mạng.", "Sàng phân đoạn (segmented sieve): liệt kê số nguyên tố trong đoạn <code>[L, R]</code> với R ≤ 10¹², R − L ≤ 10⁶.", "Tính <code>C(n, k) mod p</code> với n ≤ 10⁶ cho 10⁵ truy vấn; so sánh thời gian với cách tính trực tiếp.", "Viết hàm cộng tiền an toàn <code>AddMoney(a, b int64) (int64, error)</code> phát hiện tràn số."]}, {"n": 17, "title": "Giải thuật song song với goroutine", "sections": ["17.1. Đồng thời, song song và định luật Amdahl", "17.2. Tổng song song: chia khối (chunking)", "17.3. Merge sort song song", "17.4. Worker pool cho tác vụ CPU", "17.5. Giới hạn số tác vụ đồng thời và giữ thứ tự kết quả", "17.6. Data race: phát hiện và sửa", "17.7. Đo hiệu năng song song", "17.8. Khi nào song song KHÔNG giúp ích?"], "summary": ["Song song chỉ có lợi khi phần việc đủ lớn; định luật Amdahl giới hạn mức tăng tốc.", "Mẫu chia khối: mỗi goroutine ghi kết quả vào ô riêng rồi gộp — không cần khóa.", "Chia để trị song song cần ngưỡng kích thước và giới hạn độ sâu.", "Worker pool: số worker cố định, producer đóng channel jobs, \"closer\" đóng channel results sau <code>wg.Wait()</code>.", "Giới hạn đồng thời bằng semaphore channel hoặc <code>errgroup.SetLimit</code>; giữ thứ tự bằng cách ghi theo chỉ số.", "Data race: phát hiện bằng <code>-race</code>, sửa bằng atomic, mutex, hoặc không chia sẻ dữ liệu.", "Luôn đo bằng benchmark; cẩn thận memory-bound, tranh chấp khóa, false sharing."], "exercises": ["Viết <code>parallelMax(a []int, workers int) int</code> và kiểm chứng kết quả bằng <code>slices.Max</code>.", "Song song hóa quick sort với ngưỡng và giới hạn độ sâu; so sánh với merge sort song song bằng benchmark.", "Viết hàm đếm tần suất từ trong 100 file văn bản bằng worker pool; mỗi worker dùng map riêng rồi gộp ở cuối (tránh mutex).", "Viết bộ đếm thống kê request theo endpoint chia 16 shard (mỗi shard một mutex) và so sánh hiệu năng với một mutex duy nhất khi có 64 goroutine cùng ghi.", "Dùng <code>errgroup</code> gọi song song 3 \"service\" giả lập (<code>time.Sleep</code>), một service trả lỗi — kiểm tra các service khác bị hủy qua <code>ctx.Done()</code>.", "Chạy <code>go test -race</code> cho một chương trình có data race ẩn trong map và sửa lỗi."]}, {"n": 18, "title": "Giải thuật trong hệ thống backend thực tế", "sections": ["18.1. Rate limiting: Token Bucket", "18.2. Consistent Hashing", "18.3. Cache LRU có TTL, an toàn đồng thời", "18.4. Cache LFU trong O(1)", "18.5. Bloom Filter: \"chắc chắn không có\" hoặc \"có thể có\"", "18.6. Phân trang: OFFSET và Cursor (Keyset Pagination)", "18.7. Retry với Exponential Backoff và Jitter", "18.8. Sinh ID phân tán: Snowflake và UUIDv7", "18.9. Skip List: cấu trúc nằm sau Sorted Set của Redis", "18.10. Tổng kết: giải thuật nào nằm sau công cụ backend nào?"], "summary": ["Token bucket cho phép burst nhưng giữ tốc độ trung bình; sliding window chính xác hơn nhưng tốn bộ nhớ; limiter trong bộ nhớ chỉ đúng với một instance.", "Consistent hashing + node ảo: thêm/bớt server chỉ di chuyển khoảng 1/N key (so với gần hết với <code>hash % N</code>).", "Cache production: LRU/LFU + TTL + mutex; cẩn thận cache stampede (singleflight).", "Bloom filter: tiết kiệm bộ nhớ, không có âm tính giả; tính m, k từ n và p.", "Cursor pagination dùng khóa duy nhất <code>(created_at, id)</code> + index — nhanh và ổn định hơn OFFSET.", "Retry: exponential backoff + jitter, chỉ với thao tác idempotent.", "ID phân tán: Snowflake (64 bit) hoặc UUIDv7 (package <code>uuid</code> chuẩn từ Go 1.27).", "Skip list: <code>O(log n)</code> kỳ vọng, đơn giản, mạnh cho truy vấn khoảng — nền tảng ZSET của Redis.", "Thiết kế hàm nhận <code>now</code>/<code>sleep</code>/<code>rand</code> từ bên ngoài giúp kiểm thử tất định."], "exercises": ["Viết rate limiter theo từng client: <code>map[string]*TokenBucket</code> bảo vệ bằng mutex, kèm goroutine dọn các bucket không hoạt động quá 10 phút.", "Cài đặt <strong>sliding window counter</strong> (nội suy giữa cửa sổ hiện tại và cửa sổ trước) và so sánh độ chính xác với sliding window log.", "Mở rộng <code>Ring</code> để hỗ trợ <code>Remove(node)</code> và <strong>trọng số</strong> (server mạnh có nhiều node ảo hơn).", "Dùng <code>singleflight</code> (hoặc tự cài bằng map + <code>sync.WaitGroup</code>) để gộp các lời gọi trùng key khi cache miss.", "Viết hàm <code>Retry</code> nhận <code>context.Context</code> và chờ bằng <code>select</code> giữa <code>time.After(wait)</code> và <code>ctx.Done()</code>.", "Thêm thao tác <code>Delete</code> cho skip list và phương thức <code>Rank(key)</code> (thứ hạng của khóa).", "Đo tỉ lệ dương tính giả của Bloom filter khi thêm gấp đôi số phần tử thiết kế (n = 2.000 với bộ lọc thiết kế cho 1.000)."]}]}, {"id": "p3", "name": "Lập trình Backend với Go & Gin", "short": "Backend với Gin", "chapters": [{"n": 1, "title": "Tổng quan Backend & HTTP", "sections": ["1.1. Backend là gì?", "1.2. Giao thức HTTP", "1.3. HTTP là stateless", "1.4. REST và cách thiết kế API", "1.5. JSON — ngôn ngữ chung của API", "1.6. Hệ sinh thái backend của Go", "1.7. Công cụ cần chuẩn bị"], "summary": ["Backend nhận HTTP request, xử lý nghiệp vụ, làm việc với database và trả về dữ liệu (thường là JSON).", "Request gồm request line, header, body; response gồm status line, header, body.", "Method thể hiện hành động (<code>GET</code>, <code>POST</code>, <code>PUT</code>, <code>PATCH</code>, <code>DELETE</code>); status code thể hiện kết quả (2xx thành công, 4xx lỗi client, 5xx lỗi server).", "HTTP là stateless: mỗi request phải tự mang thông tin xác thực; nhờ vậy dễ scale ngang.", "REST: URL là danh từ chỉ tài nguyên, method là động từ; lọc/phân trang qua query; có version <code>/api/v1</code>.", "Gin là framework phổ biến nhất của Go, nhanh, có binding/validation sẵn và vẫn tương thích <code>net/http</code>."], "exercises": ["Viết ra request và response HTTP (dạng văn bản như trong chương) cho thao tác \"đổi mật khẩu của người dùng hiện tại\". Gợi ý: <code>PATCH /api/v1/me/password</code>, trả <code>204</code>.", "Thiết kế bảng endpoint REST cho một blog: bài viết, bình luận của bài viết, thẻ (tag). Ghi rõ method, URL, status code thành công.", "Với mỗi tình huống, chọn status code phù hợp: email đã tồn tại khi đăng ký; token hết hạn; user thường gọi API xoá user khác; gửi JSON sai cú pháp; database mất kết nối. Gợi ý: <code>409</code>, <code>401</code>, <code>403</code>, <code>400</code>, <code>503</code>/<code>500</code>.", "Dùng <code>curl -v https://httpbin.org/get</code> và chỉ ra request line, các header gửi đi, status line và header nhận về.", "Giải thích vì sao <code>PUT</code> là idempotent còn <code>POST</code> thì không, và điều đó ảnh hưởng thế nào đến việc client tự động retry."]}, {"n": 2, "title": "Lập trình HTTP với net/http thuần", "sections": ["2.1. Server đầu tiên", "2.2. Handler, HandlerFunc và ServeMux", "2.3. Router kiểu mới từ Go 1.22", "2.4. Đọc và ghi JSON đúng cách", "2.5. Middleware trong net/http", "2.6. http.Server: timeout và graceful shutdown", "2.7. Kiểm thử handler với httptest", "2.8. Khi nào net/http là đủ, khi nào cần Gin?"], "summary": ["Mọi thứ trong <code>net/http</code> là <code>http.Handler</code> (có <code>ServeHTTP</code>); <code>http.HandlerFunc</code> biến hàm thường thành handler.", "Go 1.22+: pattern <code>\"GET /tasks/{id}\"</code>, <code>{path...}</code>, <code>{$}</code>, đọc tham số bằng <code>r.PathValue</code>; tự trả 405 khi sai method.", "Đọc JSON an toàn: <code>MaxBytesReader</code>, <code>DisallowUnknownFields</code>, xử lý từng loại lỗi; ghi JSON: set <code>Content-Type</code> trước <code>WriteHeader</code>.", "Middleware có dạng <code>func(http.Handler) http.Handler</code>, hoạt động như củ hành.", "Production: dùng <code>http.Server</code> với timeout, <code>signal.NotifyContext</code> + <code>srv.Shutdown</code> để tắt êm.", "<code>httptest.NewRecorder</code> / <code>NewServer</code> giúp test handler mà không cần chạy server thật."], "exercises": ["Viết API in-memory quản lý ghi chú (<code>notes</code>) với <code>net/http</code> thuần: đủ 5 thao tác CRUD, lưu trong <code>map[int]Note</code> có bảo vệ bằng <code>sync.RWMutex</code>.", "Mở rộng <code>readJSON</code> để báo lỗi khi một field có kiểu sai (gợi ý: <code>*json.UnmarshalTypeError</code>, in ra tên field và kiểu mong muốn), ví dụ gửi <code>{\"title\": 123}</code>.", "Viết middleware <code>Timing</code> ghi lại thời gian xử lý mỗi request vào header <code>X-Response-Time</code> (gợi ý: phải set header <strong>trước</strong> khi handler ghi body — hãy nghĩ cách bọc <code>ResponseWriter</code>).", "Viết middleware <code>StatusRecorder</code> bọc <code>http.ResponseWriter</code> để ghi nhận status code mà handler trả về, rồi log <code>method path status</code>.", "Chạy server ví dụ graceful shutdown, gọi <code>curl localhost:8080/slow</code> rồi bấm Ctrl+C ở server ngay lập tức. Quan sát: request có được trả \"xong\" không? Đổi timeout shutdown xuống 1 giây và quan sát lại."]}, {"n": 3, "title": "Bắt đầu với Gin", "sections": ["3.1. Khởi tạo project", "3.2. Hello Gin", "3.3. gin.Default() và gin.New()", "3.4. Chế độ chạy (mode)", "3.5. Đối tượng trung tâm: *gin.Context", "3.6. Vòng đời một request trong Gin", "3.7. Hot reload với air", "3.8. Cấu trúc tối thiểu cho project nhỏ"], "summary": ["<code>go mod init</code> → <code>go get github.com/gin-gonic/gin@v1.12.0</code> → viết <code>main.go</code> → <code>go run .</code>.", "<code>gin.Default()</code> = <code>gin.New()</code> + Logger + Recovery; production nên dùng <code>gin.New()</code> và tự chọn middleware.", "Chuyển <code>GIN_MODE=release</code> khi deploy; dùng <code>gin.TestMode</code> trong test.", "<code>*gin.Context</code> chứa mọi thứ về request/response; không dùng nó trong goroutine khác — dùng <code>c.Copy()</code>.", "Dùng air để hot reload khi phát triển."], "exercises": ["Tạo project <code>hello-gin</code>, thêm endpoint <code>GET /time</code> trả về giờ hiện tại ở UTC và ở <code>Asia/Ho_Chi_Minh</code> dạng JSON.", "Chạy server với <code>GIN_MODE=release</code> và so sánh log khởi động với chế độ debug.", "Đổi <code>gin.Default()</code> thành <code>gin.New()</code>, thêm <code>gin.Recovery()</code> và viết một route cố ý <code>panic</code>. Gọi thử và quan sát status code. Sau đó bỏ <code>gin.Recovery()</code> và gọi lại — điều gì xảy ra với kết nối?", "In ra danh sách route bằng <code>r.Routes()</code> (mỗi phần tử có <code>Method</code>, <code>Path</code>, <code>Handler</code>)."]}, {"n": 4, "title": "Routing trong Gin", "sections": ["4.1. Khai báo route theo method", "4.2. Tham số path: <code>:param</code> và <code>*wildcard</code>", "4.3. Query string", "4.4. Nhóm route và version hoá API", "4.5. 404, 405 và route mặc định", "4.6. Redirect", "4.7. Phục vụ file tĩnh", "4.8. IP client, trusted proxies", "4.9. Liệt kê route"], "summary": ["Khai báo route bằng <code>r.GET/POST/PUT/PATCH/DELETE</code>, <code>r.Any</code>, <code>r.Match</code>, <code>r.Handle</code>; mỗi route có thể có nhiều handler.", "<code>:param</code> cho một đoạn path, <code>*wildcard</code> cho phần còn lại (có <code>/</code> đầu); route tĩnh được ưu tiên hơn route tham số.", "Query: <code>Query</code>, <code>DefaultQuery</code>, <code>GetQuery</code>, <code>QueryArray</code>, <code>QueryMap</code>.", "<code>r.Group(prefix, mws...)</code> để nhóm route, version hoá <code>/api/v1</code>, áp middleware theo nhóm.", "<code>NoRoute</code>/<code>NoMethod</code> (cần <code>HandleMethodNotAllowed = true</code>) để trả lỗi JSON thống nhất.", "Luôn cấu hình <code>SetTrustedProxies</code> nếu dùng <code>ClientIP()</code> cho việc quan trọng."], "exercises": ["Xây bộ route cho blog: <code>/api/v1/posts</code> (CRUD), <code>/api/v1/posts/:id/comments</code> (list, create), <code>/api/v1/tags/:slug/posts</code>. Dùng group lồng nhau.", "Viết route <code>GET /api/v1/search</code> nhận <code>q</code>, <code>page</code> (mặc định 1), <code>size</code> (mặc định 20, tối đa 100) và nhiều <code>tag</code>. Trả lại JSON phản ánh tham số đã chuẩn hoá.", "Thêm <code>NoRoute</code> trả JSON và bật <code>HandleMethodNotAllowed</code>. Dùng <code>curl -X DELETE</code> vào một route chỉ có GET để kiểm tra kết quả <code>405</code>.", "Nhúng một thư mục <code>public/</code> chứa <code>index.html</code> vào binary bằng <code>embed</code> và phục vụ tại <code>/</code>.", "Viết route <code>GET /ip</code> và thử gửi header <code>X-Forwarded-For: 8.8.8.8</code> từ <code>curl</code> với hai cấu hình: mặc định và <code>SetTrustedProxies(nil)</code>. Giải thích kết quả."]}, {"n": 5, "title": "Binding & Validation", "sections": ["5.1. ShouldBind* hay Bind*?", "5.2. Các nguồn dữ liệu và tag tương ứng", "5.3. Bộ tag validation hay dùng", "5.4. Ví dụ đầy đủ: validation + thông báo lỗi tiếng Việt", "5.5. Validation ở mức struct", "5.6. Đọc body nhiều lần", "5.7. Upload file"], "summary": ["Dùng <code>ShouldBind*</code> để tự kiểm soát response lỗi; tránh <code>Bind*</code>.", "Tag nguồn: <code>json</code>, <code>form</code> (query/form), <code>uri</code>, <code>header</code>; tag kiểm tra: <code>binding:\"...\"</code>.", "<code>required</code> không phân biệt \"không gửi\" với zero value — dùng con trỏ khi <code>0</code>/<code>false</code> hợp lệ.", "<code>RegisterTagNameFunc</code> để báo lỗi theo tên JSON; <code>RegisterValidation</code> cho rule tuỳ biến; <code>RegisterStructValidation</code> cho rule nhiều field.", "Chuyển <code>validator.ValidationErrors</code> thành danh sách lỗi theo field bằng tiếng Việt; xử lý riêng lỗi kiểu JSON.", "Upload an toàn: giới hạn kích thước, tự nhận diện kiểu bằng <code>http.DetectContentType</code>, tự sinh tên file."], "exercises": ["Viết <code>RegisterRequest</code> với <code>email</code> (bắt buộc, email), <code>password</code> (8–72 ký tự), <code>password_confirm</code> (bằng <code>password</code>), <code>phone</code> (tuỳ chọn, chuẩn E.164), <code>accept_terms</code> (<code>*bool</code>, bắt buộc phải là <code>true</code>). Viết bản dịch lỗi tiếng Việt cho mọi tag dùng tới.", "Viết validator tuỳ biến <code>vnphone</code> kiểm tra số điện thoại Việt Nam dạng <code>0xxxxxxxxx</code> (10 số, đầu <code>03</code>, <code>05</code>, <code>07</code>, <code>08</code>, <code>09</code>).", "Viết struct query cho API tìm kiếm sản phẩm: <code>q</code>, <code>min_price</code>, <code>max_price</code> (<code>max_price &gt;= min_price</code> — dùng struct-level validation), <code>category</code> (nhiều giá trị), <code>page</code>, <code>size</code> có mặc định.", "Mở rộng API upload: chỉ nhận ảnh, sau khi lưu trả về kích thước ảnh (rộng × cao) bằng package <code>image</code> (gợi ý: <code>image.DecodeConfig</code>, nhớ import <code>_ \"image/png\"</code>, <code>_ \"image/jpeg\"</code>).", "Thử gửi file 20 MB vào endpoint upload và quan sát lỗi. Ghi lại thông báo lỗi Go trả về từ <code>MaxBytesReader</code>."]}, {"n": 6, "title": "Response: trả dữ liệu cho client", "sections": ["6.1. Các biến thể JSON", "6.2. Các định dạng khác", "6.3. Trả file", "6.4. Render HTML với template", "6.5. Server-Sent Events (SSE)", "6.6. Thiết kế response thống nhất (envelope)"], "summary": ["<code>c.JSON</code> là mặc định; <code>PureJSON</code> không escape HTML; <code>IndentedJSON</code> cho debug; <code>SecureJSON</code>/<code>AsciiJSON</code> cho nhu cầu đặc biệt.", "Trả struct có tag <code>json</code> thay vì <code>gin.H</code>; không bao giờ trả model DB trực tiếp (lộ mật khẩu băm, field nội bộ).", "<code>c.File</code>, <code>c.FileAttachment</code>, <code>c.DataFromReader</code> để trả file; <code>c.Status(204)</code> khi không có body.", "<code>c.HTML</code> + <code>html/temp
